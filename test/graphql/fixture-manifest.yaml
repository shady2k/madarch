kinds:
  demo.repository:
    source: graph
    title: name
    fields:
    - name: name
      type: text
      producers:
      - agent
    - name: url
      type: text
      nullable: true
      producers:
      - agent
    - name: default_branch
      type: text
      nullable: true
      producers:
      - agent
    - name: archived
      type: boolean
      nullable: true
      producers:
      - agent
    - name: created_at
      type: timestamp
      nullable: true
      producers:
      - agent
    - name: facets
      type: json
      nullable: true
      producers:
      - agent
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        additionalProperties:
          type: string
    - name: size
      type: bigint
      nullable: true
      producers:
      - agent
    key:
    - name
  demo.file:
    source: graph
    title: path
    fields:
    - name: path
      type: text
      producers:
      - agent
    - name: lines
      type: integer
      nullable: true
      producers:
      - agent
    - name: bytes
      type: bigint
      nullable: true
      producers:
      - agent
    - name: language
      type: text
      nullable: true
      producers:
      - agent
    - name: binary
      type: boolean
      nullable: true
      producers:
      - agent
    - name: last_change
      type: timestamp
      nullable: true
      producers:
      - agent
    - name: facets
      type: json
      nullable: true
      producers:
      - agent
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        additionalProperties:
          type: string
    key:
    - path
    key-edges:
    - role: repository
      edge: demo.file-repository
      side: from
  demo.commit:
    source: graph
    title: hash
    fields:
    - name: hash
      type: text
      producers:
      - agent
    - name: subject
      type: text
      nullable: true
      producers:
      - agent
    - name: committed_at
      type: timestamp
      nullable: true
      producers:
      - agent
    - name: changed_lines
      type: bigint
      nullable: true
      producers:
      - agent
    key:
    - hash
  demo.author:
    source: graph
    title: name
    fields:
    - name: name
      type: text
      producers:
      - agent
    - name: email
      type: text
      nullable: true
      producers:
      - agent
    - name: commits
      type: integer
      nullable: true
      producers:
      - agent
    key:
    - name
edges:
- name: demo.contains
  from:
  - demo.repository
  to:
  - demo.file
  labels:
    en:
      out: contains
      in: contained in
    ru:
      out: содержит
      in: содержится в
  fields:
  - name: position
    type: integer
    nullable: true
    producers:
    - agent
  cardinality:
    from:
      min: 0
      max: null
    to:
      min: 0
      max: null
- name: demo.touched
  from:
  - demo.commit
  to:
  - demo.file
  repeats: true
  discriminator: path
  labels:
    en:
      out: touched
      in: changed by
    ru:
      out: затронул
      in: изменён коммитами
  fields:
  - name: change
    type: text
    nullable: true
    producers:
    - agent
  - name: added
    type: bigint
    nullable: true
    producers:
    - agent
  - name: removed
    type: bigint
    nullable: true
    producers:
    - agent
  - name: changed_at
    type: timestamp
    nullable: true
    producers:
    - agent
  - name: weight
    type: integer
    nullable: true
    producers:
    - agent
  - name: binary
    type: boolean
    nullable: true
    producers:
    - agent
  - name: meta
    type: json
    nullable: true
    producers:
    - agent
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties:
        type: string
  cardinality:
    from:
      min: 0
      max: null
    to:
      min: 0
      max: null
- name: demo.authored
  from:
  - demo.author
  to:
  - demo.commit
  labels:
    en:
      out: authored
      in: authored by
    ru:
      out: автор
      in: автор
  cardinality:
    from:
      min: 0
      max: null
    to:
      min: 0
      max: null
- name: mentions
  from: [any]
  to: [any]
  repeats: true
  discriminator: place
  labels:
    en:
      out: mentions
      in: mentioned by
    ru:
      out: упоминает
      in: упомянут в
  cardinality:
    from:
      min: 0
      max: null
    to:
      min: 0
      max: null
- name: demo.file-repository
  from:
  - demo.file
  to:
  - demo.repository
  cardinality:
    from:
      min: 1
      max: 1
    to:
      min: 0
      max: null
  labels:
    en:
      out: belongs to
      in: files
    ru:
      out: принадлежит
      in: файлы
  on-parent-delete: restrict
