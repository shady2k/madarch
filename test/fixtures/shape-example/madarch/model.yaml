version: 1

categories:
  - id: personal
  - id: payment-card

elements:
  - id: shop
    kind: domain
    name: Shop
  - id: checkout-web
    kind: service
    name: Checkout web
    parent: shop
    evidence:
      - file: services/checkout/README.md
  - id: checkout-cart
    kind: module
    parent: checkout-web
    evidence:
      - file: services/checkout/src/cart/index.ts
        line: 1
  - id: payments
    kind: domain
  - id: payments-api
    kind: service
    parent: payments

interfaces:
  - id: payments-charge
    provider: payments-api
    contract: http::POST::/api/charges

relations:
  - id: checkout-uses-payments
    from: checkout-web
    to: payments
  - id: checkout-charges-card
    refines: checkout-uses-payments
    from: checkout-cart
    to: payments-api
    interface: payments-charge
    binding:
      env: PAYMENTS_URL
    transfers:
      - direction: forward
        confidentiality: confidential
        categories: [payment-card, personal]
      - direction: reverse
        confidentiality: internal
        categories: []
