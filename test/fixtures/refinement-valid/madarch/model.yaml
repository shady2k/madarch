version: 1

elements:
  - id: checkout-web
    kind: service
    name: Checkout web
  - id: checkout-cart
    kind: module
    name: Checkout cart
    parent: checkout-web
  - id: payments
    kind: domain
    name: Payments
  - id: payments-api
    kind: service
    name: Payments API
    parent: payments

relations:
  - id: checkout-uses-payments
    from: checkout-web
    to: payments
  - id: checkout-charges-card
    refines: checkout-uses-payments
    from: checkout-cart
    to: payments-api
