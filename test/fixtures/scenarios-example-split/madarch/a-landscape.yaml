version: 1

elements:
  - id: customer
    kind: person
    name: Customer
  - id: checkout-api
    kind: service
    name: Checkout
  - id: orders-api
    kind: service
    name: Orders
  - id: event-bus
    kind: broker
    name: Event bus

interfaces:
  - id: topic-order-placed
    provider: event-bus
    contract: topic::order-placed

relations:
  - id: checkout-places-order
    name: places the order
    from: checkout-api
    to: orders-api
  - id: orders-publishes-placed
    name: publishes order-placed
    from: orders-api
    to: event-bus
    interface: topic-order-placed
    action: send
  - id: checkout-shows-error
    name: shows the payment error
    from: checkout-api
    to: customer
