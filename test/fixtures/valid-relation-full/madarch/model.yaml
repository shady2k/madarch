version: 1

categories:
  - id: personal
  - id: payment-card

elements:
  - id: checkout-web
    kind: service
    name: Checkout web
  - id: checkout-cart
    kind: module
    name: Checkout cart
    parent: checkout-web
  - id: payments
    kind: domain
    name: Payments
  - id: payments-api
    kind: service
    name: Payments API
    parent: payments

interfaces:
  - id: payments-charge
    provider: payments-api
    contract: http::POST::/api/charges

relations:
  - id: checkout-uses-payments
    from: checkout-web
    to: payments
  - id: checkout-charges-card
    refines: checkout-uses-payments
    from: checkout-cart
    to: payments-api
    interface: payments-charge
    binding:
      env: PAYMENTS_URL
    transfers:
      - direction: forward
        confidentiality: confidential
        categories: [payment-card, personal]
      - direction: reverse
        confidentiality: internal
        categories: []
