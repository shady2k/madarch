<style>
:root{color-scheme:light dark;--bg:#fafafa;--panel:#fff;--fg:#242933;--muted:#5b6471;--line:#d8dde5;--link:#1658ad;--note:#fff2ce} :root[data-theme=dark]{color-scheme:dark;--bg:#181c23;--panel:#222833;--fg:#edf2fa;--muted:#b7c1d0;--line:#495366;--link:#a7cdff;--note:#39301d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}header,main{max-width:1054px;margin:auto;padding:20px 28px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line)}main{padding-top:24px}h1{font-size:30px;margin:10px 0}h2{font-size:23px;margin:26px 0 12px}h3{font-size:19px;margin:10px 0}p{margin:10px 0}a{color:var(--link)}select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px}.card,.notice{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:14px 0}.notice{background:var(--note)}.muted{color:var(--muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.spacer{flex:1}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace;background:var(--bg);padding:14px;border:1px solid var(--line);border-radius:6px}code{font:14px ui-monospace,monospace;overflow-wrap:anywhere}li{margin:10px 0}a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--link);outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header,main{padding:16px 20px}.card,.notice{padding:14px}h1{font-size:26px}}
</style></head><body>
<header><strong>madarch</strong><span data-en="Training product" data-ru="Учебный продукт"></span><span class="spacer"></span><label><span data-en="Language" data-ru="Язык"></span> <select id="language"><option value=en>English</option><option value=ru>Русский</option></select></label><label><span data-en="Theme" data-ru="Тема"></span> <select id="theme"><option value=light data-en="Light" data-ru="Светлая"></option><option value=dark data-en="Dark" data-ru="Тёмная"></option></select></label></header>
<main>
<div class=notice data-en="Proposal mockup only. No command/request runs here and no walkthrough has been performed. Examples come from the held training template; generate its timeline snapshot before execution. This is not screenshot acceptance evidence." data-ru="Только макет предложения. Здесь не выполняются команды или запросы; прохождение не проводилось. Примеры взяты из шаблона учебного репозитория; перед выполнением нужно создать его снимок. Это не доказательство визуальной приёмки."></div>
<nav class=row><a href="#administrator" data-en="Administrator guide" data-ru="Руководство администратора"></a><a href="#user" data-en="User guide" data-ru="Руководство пользователя"></a></nav>
<section id=administrator><h1 data-en="Administrator guide" data-ru="Руководство администратора"></h1><p data-en="Run the product locally. Check the prerequisites before following the steps. Deployment evidence and missing procedures are shown separately." data-ru="Запустите продукт локально. Перед шагами проверьте требования к среде. Доказательства развёртывания и отсутствующие процедуры показаны отдельно."></p>
<div class=row><span class=badge data-en="Not walked" data-ru="Не пройдено"></span><span class=badge data-en="Pinned training snapshot" data-ru="Зафиксированный учебный снимок"></span></div>
<div class=card><h2 data-en="Before you start" data-ru="Перед началом"></h2><ul><li data-en="Repository root; Go 1.22, Node 20, Docker Compose and psql." data-ru="Корень репозитория; Go 1.22, Node 20, Docker Compose и psql."></li><li data-en="An isolated environment with containers, local test settings and available ports. No production credentials." data-ru="Изолированная среда с контейнерами, локальными тестовыми настройками и свободными портами. Без рабочих секретов."></li></ul><a href="#grounds"><code>README.md · Run it</code></a></div>
<div class=card><h2 data-en="Start the local environment" data-ru="Запуск локальной среды"></h2><p class=muted data-en="Working directory: repository root. Development environment only. All steps below are not walked in this proposal." data-ru="Рабочая папка: корень репозитория. Только среда разработки. Все шаги ниже в этом предложении не пройдены."></p><ol>
<li><strong data-en="Copy local settings" data-ru="Скопируйте локальные настройки"></strong><pre>cp .env.example .env</pre><p data-en="Expected: a local settings file exists. Inspect development defaults; do not reuse them as production secrets." data-ru="Ожидается: создан локальный файл настроек. Проверьте значения для разработки; не используйте их как рабочие секреты."></p></li>
<li><strong data-en="Start the real services" data-ru="Запустите настоящие сервисы"></strong><pre>make up</pre><p data-en="Expected: four services, Postgres and Kafka start through the repository's Compose configuration. A fake HTTP response cannot prove this step." data-ru="Ожидается: четыре сервиса, Postgres и Kafka запускаются через Compose репозитория. Поддельный HTTP-ответ не доказывает этот шаг."></p></li>
<li><strong data-en="Load isolated sample data" data-ru="Загрузите изолированные примерные данные"></strong><pre>make seed</pre><p data-en="Expected: demo customer and promotion records are loaded. Actual exit and observed state must be recorded by the acceptance operator." data-ru="Ожидается: загружены примерный покупатель и промокоды. Фактический код завершения и состояние записывает оператор приёмки."></p></li></ol><a href="#grounds" data-en="Source grounds and expected results" data-ru="Основания команд и ожидаемых результатов"></a></div>
<div class=notice><h2 data-en="Known limits and failures" data-ru="Известные ограничения и ошибки"></h2><p data-en="Port 5432 may already be allocated. Kubernetes evidence supplies an orders Deployment/Service, but external image, secret, database, broker and cluster setup remain prerequisites or gaps. No backup or recovery procedure is evidenced." data-ru="Порт 5432 может быть занят. Для Kubernetes есть Deployment/Service orders, но внешний образ, секрет, база, брокер и настройка кластера остаются требованиями или пробелами. Процедура резервного копирования или восстановления не подтверждена."></p><p data-en="Health, metrics and logs link to their actual endpoints/configuration. Missing container capability is an infrastructure blocker, not a successful walk." data-ru="Проверки здоровья, метрики и журналы ведут к реальным адресам и настройкам. Отсутствие возможности запуска контейнеров блокирует инфраструктуру, а не означает успешное прохождение."></p></div>
</section>
<section id=user><h1 data-en="User guide" data-ru="Руководство пользователя"></h1><div class=notice data-en="Frontend and design are not connected. These procedures use the API. Role names describe goals; permissions below must follow actual route middleware." data-ru="Фронтенд и дизайн не подключены. Эти процедуры используют API. Роли описывают цели; права должны соответствовать реальным проверкам маршрутов."></div>
<div class=row><a href="#shopper" data-en="Shopper" data-ru="Покупатель"></a><a href="#support" data-en="Support" data-ru="Поддержка"></a><a href="#finance" data-en="Finance" data-ru="Финансы"></a></div>
<div class=card id=shopper><h2 data-en="Shopper: place an order (UC-1)" data-ru="Покупатель: оформить заказ (UC-1)"></h2><span class=badge data-en="Not walked" data-ru="Не пройдено"></span><p data-en="Prerequisite: the administrator setup has passed; the held training token command supplies local test identity. Order placement is not the same as paid checkout." data-ru="Требование: настройка по руководству администратора пройдена; команда токена учебного репозитория создаёт локальную тестовую личность. Оформление заказа не равно оплате через checkout."></p><pre>curl -s -X POST http://localhost:8080/orders -H "Authorization: Bearer $(make -s token)" -H 'Content-Type: application/json' -d '{"items":[{"sku":"A-1","quantity":2,"priceCents":1000}]}'</pre><p data-en="Expected: an order with its lines, calculated amounts and pending_payment state, verified against the actual handler. Repeated request behavior needs the same evidenced request identifier. A copied command alone is not proof of execution." data-ru="Ожидается: заказ со строками, рассчитанными суммами и состоянием pending_payment, проверенный по реальному обработчику. Повтор запроса требует того же подтверждённого идентификатора. Скопированная команда не доказывает выполнение."></p><a href="#grounds" data-en="Source: README, UC-1 and order handler" data-ru="Источник: README, UC-1 и обработчик заказа"></a></div>
<div class=card id=support><h2 data-en="Support: supported procedures" data-ru="Поддержка: доступные процедуры"></h2><p data-en="Look up, cancel, ship and refund through the implemented routes, showing their actual input, authorization and failure responses. Shipping requires the support role; do not infer the same check for every route." data-ru="Просматривайте, отменяйте, отправляйте и возвращайте через реализованные маршруты с их настоящими полями, правами и ошибками. Отправка требует роли support; не переносите эту проверку на все маршруты."></p></div>
<div class=card id=finance><h2 data-en="Finance: export and gaps" data-ru="Финансы: экспорт и пробелы"></h2><p data-en="The export route is registered outside the authentication group. Show that exception and the supported report inputs; do not invent finance authorization or a reconciliation endpoint." data-ru="Маршрут экспорта зарегистрирован вне группы аутентификации. Покажите это исключение и поддерживаемые параметры отчёта; не выдумывайте права финансовой роли или адрес сверки."></p></div>
</section>
<section class=card><h2 data-en="Walkthrough evidence" data-ru="Доказательства прохождения"></h2><p data-en="Each step links to a separate operator receipt: guide/procedure/step identity, pinned context, input and command digests, isolated environment, working directory, actual status and observed result. Missing, failed, forged or stale receipts never show walked." data-ru="Каждый шаг ведёт к отдельной записи оператора: идентификаторы руководства, процедуры и шага, контекст, хеши входов и команды, изолированная среда, папка, фактический статус и результат. Отсутствующие, ошибочные, поддельные и устаревшие записи не дают статуса «пройдено»."></p><div class=row><span class=badge data-en="Passed (state example)" data-ru="Успех (пример состояния)"></span><span class=badge data-en="Failed (state example)" data-ru="Ошибка (пример состояния)"></span><span class=badge data-en="Not walked (current proposal)" data-ru="Не пройдено (это предложение)"></span></div></section>
<section id=grounds><h2 data-en="Pinned grounds preview" data-ru="Предпросмотр зафиксированных оснований"></h2><p data-en="Mockup links land here, not on a simulated source server. The implementation must resolve exact repository/revision/spans for commands, handlers, deployment and expected results. Nothing here claims a real execution receipt." data-ru="Ссылки макета ведут сюда, а не к имитации сервера кода. Реализация должна открывать точные репозиторий, ревизию и строки команд, обработчиков, развёртывания и результатов. Ничто здесь не означает реальную запись выполнения."></p></section>
</main><script>
const language=document.getElementById('language');function translate(){const lang=language.value;document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(node=>node.textContent=node.dataset[lang]);}language.addEventListener('change',translate);document.getElementById('theme').addEventListener('change',event=>document.documentElement.dataset.theme=event.target.value);translate();
</script></body></html>
