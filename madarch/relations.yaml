# The interfaces the parts offer and the relations between them. The
# server's HTTP API is one interface per route capability; the two data
# contracts (the intended model's file format and the compiled model) are
# what every other part reads. Relations are named from what the initiator
# uses the other part for; evidence names the import line for a dependency
# found in imports, and the call and handler sides for a run-time
# interaction.
