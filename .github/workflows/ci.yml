name: CI

# Keep protected refs isolated; branch updates supersede older work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# The product's checks, once per push of any branch; a pull request from this
# repository shows its branch's push run, so it is not run twice. Changes limited
# to documents, tracker data or local hook tooling cannot touch the product and
# are ignored here; see .shady2k/integration.md, "CI". Of .shady2k only the files
# madarch never executes are ignored: the wiki runs .shady2k/checks/* (src/product-wiki/
# checking.ts) and CI runs run-scratch-check.mjs and check-test-shards.mjs, so a
# change to those runs the suite (a setup update once merged unrun and broke a test).
# Workflow changes are not
# ignored: CI validates changes to its own actions and runner images. The
# product-documents check is separate and runs on every push (documents.yml).
# Unfinished work skips a run with [skip ci] in the pushed commit's message.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
      - '.shady2k/trackers/**'
      - '.shady2k/supervisors/**'
      - '.shady2k/tracker-sync.*'
      - '.shady2k/tracker.mjs'
      - '.shady2k/connect.sh'
      - '.shady2k/adapter*.mjs'
      - '.shady2k/push*.mjs'
      - '.shady2k/hooks.test.mjs'
      - '.shady2k/documents*'
      - '.shady2k/document-policy.json'
      - '.shady2k/config.json'
      - '.shady2k/integration.md'
      - '.githooks/**'
      - '*.md'

jobs:
  test-shard:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The PostgreSQL server madarch installs lives in the runner's home, not in the
      # checkout: `<madarch home>/tools/postgresql/<version>/`. It is cached by the
      # version and by the hash of the file that pins it, so a run downloads it once
      # per pinned release and reads the marker on every later run (madarch-8bdc.2.5).
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      # The plugin sandbox (decision 0035, item 9; docs/system/plugin-sandbox.md): the host bounds a plugin's whole
      # process tree in a cgroup of its own under one delegated to madarch, and opens the plugin's namespaces as
      # this user. The runner's session cgroup is neither delegated nor ours to move a process out of, so the shard
      # runs inside a leaf of a subtree root hands to the runner (`scripts/plugin-sandbox-cgroup.sh`), and the
      # plugin's sandbox cases fail rather than skip when the machine cannot confine a plugin. Ubuntu 24.04
      # restricts unprivileged user namespaces with AppArmor; bubblewrap needs them as an ordinary user.
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      # What the run may leave behind (madarch-1xq): the home and the temporary
      # folder as they stand before the suite, compared with how they stand after
      # it. A suite that writes into either one fails here instead of filling the
      # disk, whatever the tests themselves assert.
      - name: Note the home and the temporary folder before the run
        run: node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/before-run.txt"
      # Refresh the timings locally with:
      # bun run test --timings=.github/workflows/test-timings.json --update-timings
      # Seed with historical durations for balancing; Bun's shard update writes
      # this shard's measured file list to the artifact copy. `bun run test` is
      # scripts/run-tests.ts: it leaves out every file test/slow-files.json names
      # and forwards --shard and the timing flags to Bun unchanged.
      - name: Run shard and record its file list
        # Inside the delegated cgroup the step above made: the host moves the plugin's tree into a child of it, which
        # the kernel allows only from inside the subtree. The wrapper also asks for the sandbox cases, so a runner
        # that lost the delegation fails them instead of reporting a green it did not earn.
        run: |
          shard_files="$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
          cp .github/workflows/test-timings.json "$shard_files"
          scripts/plugin-sandbox-cgroup.sh bun run test --shard=${{ matrix.shard }}/5 \
            --timings="$shard_files" --update-timings
      - name: The run left the home and the temporary folder as it found them
        if: always()
        run: |
          node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/after-run.txt"
          node .shady2k/run-scratch-check.mjs compare "$RUNNER_TEMP/before-run.txt" "$RUNNER_TEMP/after-run.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-files-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # The listed slow files are blocking on every CI run: the shards leave them
  # out, so these steps are their only required coverage. Each step fails when
  # the run selected no file or reported fewer passing cases than the file has;
  # a green job that cannot show the file ran is not coverage.
  partition-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Run the full confined partition bootstrap fixture
        id: bootstrap
        run: scripts/plugin-sandbox-cgroup.sh bun run test --slow --only test/git-partition-bootstrap.test.ts
      - name: Run the complete H3 real reconciliation fixture and prove its case ran
        id: h3
        run: |
          expect_cases() {
            local log=$1 path=$2 least=$3 pass fail files headers
            pass=$(awk '$2 == "pass" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            fail=$(awk '$2 == "fail" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            files=$(awk '/^Ran [0-9]+ tests? across [0-9]+ files?\./ { n=$5 } END { print n + 0 }' "$log")
            headers=$(grep -Fxc "$path:" "$log" || true)
            if [ "$files" -ne 1 ] || [ "$headers" -ne 1 ]; then
              echo "::error file=$path,line=1::$path expected exact header once and exactly one file; files=$files headers=$headers" >&2
              return 1
            fi
            if [ "$pass" -lt "$least" ] || [ "$fail" -ne 0 ]; then
              echo "::error file=$path,line=1::$path ran $pass passing cases and $fail failures; expected at least $least passes and zero failures" >&2
              return 1
            fi
          }
          log="$RUNNER_TEMP/h3-real-reconciliation.log"
          set +e
          scripts/plugin-sandbox-cgroup.sh bun run test --slow --only test/h3-real-reconciliation.test.ts 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          expect_cases "$log" test/h3-real-reconciliation.test.ts 1
          checked=$?
          set -e
          [ "$status" -eq 0 ] || exit "$status"
          exit "$checked"
      - name: Run the complete disk support ownership fixture and prove its three cases ran
        id: disk
        run: |
          expect_cases() {
            local log=$1 path=$2 least=$3 pass fail files headers
            pass=$(awk '$2 == "pass" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            fail=$(awk '$2 == "fail" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            files=$(awk '/^Ran [0-9]+ tests? across [0-9]+ files?\./ { n=$5 } END { print n + 0 }' "$log")
            headers=$(grep -Fxc "$path:" "$log" || true)
            if [ "$files" -ne 1 ] || [ "$headers" -ne 1 ]; then
              echo "::error file=$path,line=1::$path expected exact header once and exactly one file; files=$files headers=$headers" >&2
              return 1
            fi
            if [ "$pass" -lt "$least" ] || [ "$fail" -ne 0 ]; then
              echo "::error file=$path,line=1::$path ran $pass passing cases and $fail failures; expected at least $least passes and zero failures" >&2
              return 1
            fi
          }
          log="$RUNNER_TEMP/disk-support-ownership.log"
          set +e
          scripts/plugin-sandbox-cgroup.sh bun run test --slow --only test/disk-support-ownership.test.ts 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          expect_cases "$log" test/disk-support-ownership.test.ts 3
          checked=$?
          set -e
          [ "$status" -eq 0 ] || exit "$status"
          exit "$checked"
      - name: Run the complete agent fill graph MCP fixture and prove its four cases ran
        id: mcp
        run: |
          expect_cases() {
            local log=$1 path=$2 least=$3 pass fail files headers
            pass=$(awk '$2 == "pass" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            fail=$(awk '$2 == "fail" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            files=$(awk '/^Ran [0-9]+ tests? across [0-9]+ files?\./ { n=$5 } END { print n + 0 }' "$log")
            headers=$(grep -Fxc "$path:" "$log" || true)
            if [ "$files" -ne 1 ] || [ "$headers" -ne 1 ]; then
              echo "::error file=$path,line=1::$path expected exact header once and exactly one file; files=$files headers=$headers" >&2
              return 1
            fi
            if [ "$pass" -lt "$least" ] || [ "$fail" -ne 0 ]; then
              echo "::error file=$path,line=1::$path ran $pass passing cases and $fail failures; expected at least $least passes and zero failures" >&2
              return 1
            fi
          }
          log="$RUNNER_TEMP/agent-fill-graph-mcp.log"
          set +e
          scripts/plugin-sandbox-cgroup.sh bun run test --slow --only test/agent-fill-graph-mcp.test.ts 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          expect_cases "$log" test/agent-fill-graph-mcp.test.ts 4
          checked=$?
          set -e
          [ "$status" -eq 0 ] || exit "$status"
          exit "$checked"
      - name: Require all partition-bootstrap fixtures to succeed
        if: always()
        run: |
          if [[ "${{ steps.bootstrap.outcome }}" != success || "${{ steps.h3.outcome }}" != success || "${{ steps.disk.outcome }}" != success || "${{ steps.mcp.outcome }}" != success ]]; then
            echo "required step outcomes: bootstrap=${{ steps.bootstrap.outcome }}, h3=${{ steps.h3.outcome }}, disk=${{ steps.disk.outcome }}, mcp=${{ steps.mcp.outcome }}" >&2
            exit 1
          fi

  # The twelve files test/slow-files.json records as green-slow, measured over 30
  # seconds alone on a runner in runs 45758277151, 45809866011 and 45910624124, run here one
  # job each. The shards leave out every file the list names (the shard step here
  # and scripts/run-tests.ts), so this required matrix is the blocking coverage of
  # these twelve. Four fixtures of the list run in partition-bootstrap, not in
  # `checks`: git-partition-bootstrap, h3-real-reconciliation,
  # disk-support-ownership and agent-fill-graph-mcp. Every other green-slow entry
  # runs only in the nightly slow-tests.yml, as do main's own entries in the list.
  # A job fails when its run selected no file, did not name it once as the run's
  # own header, reported fewer passing cases than the file holds, or reported a
  # failure: a green job that cannot show the file ran is not coverage.
  slow-files:
    name: slow file ${{ matrix.file }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: test/catalogue-kind-relations.test.ts, cases: 1 }
          - { file: test/agent-fill-e2e.test.ts, cases: 2 }
          - { file: test/db-schema-path.test.ts, cases: 5 }
          - { file: test/api-role-first-page.test.ts, cases: 1 }
          - { file: test/owner-fill-path.test.ts, cases: 1 }
          - { file: test/ordinary-plugin-partition.test.ts, cases: 16 }
          - { file: test/plugin-agent-edge-order.test.ts, cases: 1 }
          - { file: test/imports-path.test.ts, cases: 5 }
          - { file: test/roles-two-and-two.test.ts, cases: 1 }
          - { file: test/status-work.test.ts, cases: 3 }
          - { file: test/source-follows-fill.test.ts, cases: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Run the complete file and prove its cases ran
        run: |
          expect_cases() {
            local log=$1 path=$2 least=$3 pass fail files headers
            pass=$(awk '$2 == "pass" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            fail=$(awk '$2 == "fail" && $1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }' "$log")
            files=$(awk '/^Ran [0-9]+ tests? across [0-9]+ files?\./ { n=$5 } END { print n + 0 }' "$log")
            headers=$(grep -Fxc "$path:" "$log" || true)
            if [ "$files" -ne 1 ] || [ "$headers" -ne 1 ]; then
              echo "::error file=$path,line=1::$path expected exact header once and exactly one file; files=$files headers=$headers" >&2
              return 1
            fi
            if [ "$pass" -lt "$least" ] || [ "$fail" -ne 0 ]; then
              echo "::error file=$path,line=1::$path ran $pass passing cases and $fail failures; expected at least $least passes and zero failures" >&2
              return 1
            fi
          }
          path='${{ matrix.file }}'
          log="$RUNNER_TEMP/slow-file.log"
          set +e
          scripts/plugin-sandbox-cgroup.sh bun run test --slow --only "$path" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          expect_cases "$log" "$path" '${{ matrix.cases }}'
          checked=$?
          set -e
          [ "$status" -eq 0 ] || exit "$status"
          exit "$checked"

  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: madarch_test
          POSTGRES_USER: madarch_test
          POSTGRES_PASSWORD: madarch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarch_test -d madarch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # The branch's whole history: the architecture check compares the list of
      # accepted violations with the one the merge base holds (decision 0033,
      # item 4), and a shallow clone has no merge base to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The PostgreSQL server madarch installs lives in the runner's home, not in the
      # checkout: `<madarch home>/tools/postgresql/<version>/`. It is cached by the
      # version and by the hash of the file that pins it, so a run downloads it once
      # per pinned release and reads the marker on every later run (madarch-8bdc.2.5).
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      # The plugin sandbox (decision 0035, item 9; docs/system/plugin-sandbox.md): the host bounds a plugin's whole
      # process tree in a cgroup of its own under one delegated to madarch, and opens the plugin's namespaces as
      # this user. The runner's session cgroup is neither delegated nor ours to move a process out of, so the shard
      # runs inside a leaf of a subtree root hands to the runner (`scripts/plugin-sandbox-cgroup.sh`), and the
      # plugin's sandbox cases fail rather than skip when the machine cannot confine a plugin. Ubuntu 24.04
      # restricts unprivileged user namespaces with AppArmor; bubblewrap needs them as an ordinary user.
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Note the home and the temporary folder before the checks
        run: node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/before-run.txt"
      # The product's type check and its architecture check (decision 0033, item 4):
      # one writer for the graph, one storage layer, one entry point per fill, and no
      # code unreachable from the declared entry points, each held against
      # .architecture/violations.json.
      - run: bun run check
      # The list only shrinks: an entry a commit adds fails here unless that commit
      # carries the owner's decision, which is how a rule changes.
      - name: The list of architectural violations only shrinks
        run: bun run check:architecture-base
      # The wiki app has its own package and lockfile, so its checks run beside
      # the product's: a broken app fails CI.
      - run: bun install --frozen-lockfile && bun run check && bun test && bun run build
        working-directory: wiki/app
      - name: The checks left the home and the temporary folder as they found them
        if: always()
        run: |
          node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/after-run.txt"
          node .shady2k/run-scratch-check.mjs compare "$RUNNER_TEMP/before-run.txt" "$RUNNER_TEMP/after-run.txt"

  # Repair feedback only: this job is deliberately absent from test.needs.
  quarantine:
    name: quarantine
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Run only quarantined cases and summarize each result
        env:
          MADARCH_QUARANTINE: "1"
          MADARCH_QUARANTINE_REPORT: ${{ runner.temp }}/quarantine-results.json
        run: scripts/plugin-sandbox-cgroup.sh bun run test:quarantine
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quarantine-results
          path: ${{ runner.temp }}/quarantine-results.json
          if-no-files-found: error

  # Keep the stable "test" status required by branch protection. always() makes
  # this run after a failed, skipped, or cancelled dependency; none can go green.
  # partition-bootstrap and slow-files must succeed too: the slow-list growth
  # check is not coverage.
  test:
    if: always()
    needs: [test-shard, checks, partition-bootstrap, slow-files]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Measure growth files alone against the merge base
        if: needs.test-shard.result == 'success'
        run: bun scripts/check-slow-tests.ts --growth
      - uses: actions/download-artifact@v8
        with:
          pattern: test-files-*
          path: ${{ runner.temp }}/shard-files
          merge-multiple: true
      - name: Verify every blocking test file ran exactly once
        run: node .shady2k/check-test-shards.mjs "$RUNNER_TEMP/shard-files" 5 --exclude test/slow-files.json
      # Confirm a shard outlier alone before requiring a slow-list entry.
      # Both measurements must exceed 30 seconds to report a speed finding.
      - name: No test over 30 s hides outside the slow list
        run: bun scripts/check-slow-tests.ts --measured "$RUNNER_TEMP/shard-files"
      - name: Require every shard and CI check to pass
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BOOTSTRAP_RESULT: ${{ needs.partition-bootstrap.result }}
          SLOW_FILES_RESULT: ${{ needs.slow-files.result }}
        run: |
          if [[ "$SHARDS_RESULT" != success || "$CHECKS_RESULT" != success || "$BOOTSTRAP_RESULT" != success || "$SLOW_FILES_RESULT" != success ]]; then
            echo "test-shard result: $SHARDS_RESULT; checks result: $CHECKS_RESULT; partition-bootstrap result: $BOOTSTRAP_RESULT; slow-files result: $SLOW_FILES_RESULT" >&2
            exit 1
          fi
