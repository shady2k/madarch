name: CI

# Keep protected refs isolated; branch updates supersede older work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# The product's checks, once per push of any branch; a pull request from this
# repository shows its branch's push run, so it is not run twice. Changes limited
# to documents, tracker data or local hook tooling cannot touch the product and
# are ignored here; see .shady2k/integration.md, "CI". Workflow changes are not
# ignored: CI validates changes to its own actions and runner images. The
# product-documents check is separate and runs on every push (documents.yml).
# Unfinished work skips a run with [skip ci] in the pushed commit's message.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
      - '.shady2k/**'
      - '.githooks/**'
      - '*.md'

jobs:
  test-shard:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # What the run may leave behind (madarch-1xq): the home and the temporary
      # folder as they stand before the suite, compared with how they stand after
      # it. A suite that writes into either one fails here instead of filling the
      # disk, whatever the tests themselves assert.
      - name: Note the home and the temporary folder before the run
        run: node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/before-run.txt"
      # Refresh the full-suite timings locally with:
      # bun test test/ --timings=.github/workflows/test-timings.json --update-timings
      # Seed with historical durations for balancing; Bun's shard update writes
      # this shard's measured file list to the artifact copy.
      - name: Run shard and record its file list
        run: |
          shard_files="$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
          cp .github/workflows/test-timings.json "$shard_files"
          bun test test/ --shard=${{ matrix.shard }}/5 \
            --timings="$shard_files" --update-timings
      - name: The run left the home and the temporary folder as it found them
        if: always()
        run: |
          node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/after-run.txt"
          node .shady2k/run-scratch-check.mjs compare "$RUNNER_TEMP/before-run.txt" "$RUNNER_TEMP/after-run.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-files-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: madarch_test
          POSTGRES_USER: madarch_test
          POSTGRES_PASSWORD: madarch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarch_test -d madarch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Note the home and the temporary folder before the checks
        run: node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/before-run.txt"
      - run: bun run check
      - run: bun test test/postgres-query-database.test.ts
        env:
          MADARCH_TEST_POSTGRES_URL: postgres://madarch_test:madarch_test@127.0.0.1:5432/madarch_test
      - run: bun run views:check
      # The product repository's contract cases (decision 0021): every example and every refusal.
      - run: bun run contract:check
      # The wiki app has its own package and lockfile, so its checks run beside
      # the product's: a broken app fails CI.
      - run: bun install --frozen-lockfile && bun run check && bun test && bun run build
        working-directory: wiki/app
      - name: The checks left the home and the temporary folder as they found them
        if: always()
        run: |
          node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/after-run.txt"
          node .shady2k/run-scratch-check.mjs compare "$RUNNER_TEMP/before-run.txt" "$RUNNER_TEMP/after-run.txt"

  # Keep the stable "test" status required by branch protection. always() makes
  # this run after a failed, skipped, or cancelled dependency; none can go green.
  test:
    if: always()
    needs: [test-shard, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: test-files-*
          path: ${{ runner.temp }}/shard-files
          merge-multiple: true
      - name: Verify every root test file ran exactly once
        run: node .shady2k/check-test-shards.mjs "$RUNNER_TEMP/shard-files" 5
      - name: Require every shard and CI check to pass
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$SHARDS_RESULT" != success || "$CHECKS_RESULT" != success ]]; then
            echo "test-shard result: $SHARDS_RESULT; checks result: $CHECKS_RESULT" >&2
            exit 1
          fi
