name: CI

# The product's checks, once per push of any branch; a pull request from this
# repository shows its branch's push run, so it is not run twice. A change that
# touches only documents, the tracker or the workflow's own tooling cannot
# touch the product and runs nothing; that tooling is checked by the local hooks
# (see .shady2k/integration.md, "CI"). The product-documents check is separate
# and runs on every push (documents.yml). Unfinished work skips a run with
# [skip ci] in the pushed commit's message.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
      - '.shady2k/**'
      - '.githooks/**'
      - '.github/workflows/**'
      - '*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: madarch_test
          POSTGRES_USER: madarch_test
          POSTGRES_PASSWORD: madarch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarch_test -d madarch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The root's tests only (`bun run test` = `bun test test/`): the wiki
      # app has its own package and lockfile, discovered only after its own
      # install step below — the root job must not run its tests before that.
      - run: bun run test
      - run: bun test test/postgres-query-database.test.ts
        env:
          MADARCH_TEST_POSTGRES_URL: postgres://madarch_test:madarch_test@127.0.0.1:5432/madarch_test
      - run: bun run views:check
      # The product repository's contract cases (decision 0021): every example and every refusal.
      - run: bun run contract:check
      # The wiki app has its own package and lockfile, so its checks run beside
      # the product's: a broken app fails CI.
      - run: bun install --frozen-lockfile && bun run check && bun test && bun run build
        working-directory: wiki/app
