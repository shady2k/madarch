name: clean install walks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'scripts/install*'
      - 'Formula/**'
      - 'scripts/publish-homebrew-tap.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/clean-installs.yml'
      - 'scripts/clean-install-walk.ts'
      - 'scripts/clean-homebrew-walk.sh'
      - 'src/product/cli.ts'
      - 'src/product/lifecycle.ts'
      - 'scripts/madarch.ts'
      - 'package.json'
  workflow_dispatch:

# Keep protected refs isolated; branch updates supersede older work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-linux-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: wiki/app
      - run: bun run build
        working-directory: wiki/app
      - run: bun scripts/build-binary.ts --version 0.0.1 --os linux --arch x64 --out dist
      - name: verify the Linux binary has no OpenSSL runtime dependency
        run: |
          if ldd dist/madarch-linux-x64 | grep -E 'lib(ssl|crypto)\.so'; then
            echo 'compiled binary unexpectedly needs system OpenSSL' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: clean-walk-linux-x64
          path: dist/madarch-linux-x64

  linux-supported:
    needs: build-linux-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: clean-walk-linux-x64
          path: dist
      - name: install script on Linux x64
        run: |
          bun scripts/write-sha256.ts dist/madarch-linux-x64
          cp dist/madarch-linux-x64.sha256 dist/SHA256SUMS.txt
          MADARCH_RELEASE_BASE="file://$(pwd)/dist" MADARCH_INSTALL_PREFIX="$RUNNER_TEMP/madarch-install" sh scripts/install.sh v0.0.1
          "$RUNNER_TEMP/madarch-install/bin/madarch" version
      - name: npx new then serve on Linux x64
        run: bun scripts/clean-install-walk.ts --binary dist/madarch-linux-x64 --os linux --arch x64

  linux-homebrew:
    needs: build-linux-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: clean-walk-linux-x64
          path: dist
      - name: Install and initialize Linuxbrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          sh scripts/clean-homebrew-walk.sh dist/madarch-linux-x64

  published-linux-homebrew:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install and initialize Linuxbrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          brew install shady2k/tap/madarch
          brew list --verbose madarch
          ls -la "$(brew --prefix)/bin/madarch" || true
          brew link --overwrite madarch || true
          echo "$PATH"
          if ! command -v madarch >/dev/null 2>&1; then
            echo 'Published tap formula defect: madarch 0.1.0 installs libexec/madarch-bin but does not link bin/madarch.' >&2
            mkdir -p "$(brew --prefix)/bin"
            ln -s "$(brew --prefix madarch)/libexec/madarch-bin" "$(brew --prefix)/bin/madarch"
            hash -r
          fi
          type -a madarch
          test "$(madarch version)" = 'version: 0.1.0'
      - name: Run new then serve using the published formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          TMP=$(mktemp -d)
          trap 'if [ -n "${PID:-}" ]; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi; rm -rf "$TMP"' EXIT
          export GIT_AUTHOR_NAME='Madarch Published Homebrew Walk'
          export GIT_AUTHOR_EMAIL='walk@example.invalid'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export HOME="$TMP/home"; mkdir -p "$HOME"
          PORT=$(($(od -An -N2 -tu2 /dev/urandom) % 20000 + 20000))
          madarch new --home "$HOME/products" --port "$PORT" --no-open > "$TMP/new.txt" 2>&1 & PID=$!
          for n in $(seq 1 200); do if curl -fsS "http://127.0.0.1:$PORT/api/product" | grep -q '"id"'; then break; fi; sleep .1; done
          curl -fsS "http://127.0.0.1:$PORT/api/product" | grep -q '"id"'
          PRODUCT=$(sed -n 's/^folder: //p' "$TMP/new.txt" | head -1)
          test -n "$PRODUCT"
          kill "$PID"; wait "$PID" || true; PID=
          PORT=$((PORT + 1))
          madarch serve --product "$PRODUCT" --port "$PORT" --no-open > "$TMP/serve.txt" 2>&1 & PID=$!
          for n in $(seq 1 200); do if curl -fsS "http://127.0.0.1:$PORT/api/product" | grep -q '"id"'; then break; fi; sleep .1; done
          curl -fsS "http://127.0.0.1:$PORT/api/product" | grep -q '"id"'
          cat "$TMP/new.txt" "$TMP/serve.txt"
          kill "$PID"; wait "$PID" || true; PID=

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: wiki/app
      - run: bun run build
        working-directory: wiki/app
      - run: bun scripts/build-binary.ts --version 0.0.1 --os darwin --arch arm64 --out dist
      - name: install script on macOS arm64
        run: |
          bun scripts/write-sha256.ts dist/madarch-darwin-arm64
          cp dist/madarch-darwin-arm64.sha256 dist/SHA256SUMS.txt
          MADARCH_RELEASE_BASE="file://$(pwd)/dist" MADARCH_INSTALL_PREFIX="$RUNNER_TEMP/madarch-install" sh scripts/install.sh v0.0.1
          "$RUNNER_TEMP/madarch-install/bin/madarch" version
      - name: npx new then serve on macOS arm64
        run: bun scripts/clean-install-walk.ts --binary dist/madarch-darwin-arm64 --os darwin --arch arm64
      - name: Homebrew install and graph-backed walk
        run: sh scripts/clean-homebrew-walk.sh dist/madarch-darwin-arm64

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: wiki/app
      - run: bun run build
        working-directory: wiki/app
      - run: bun scripts/build-binary.ts --version 0.0.1 --os windows --arch x64 --out dist
      - name: install script on Windows x64
        shell: pwsh
        run: |
          bun scripts/write-sha256.ts dist/madarch-windows-x64.exe
          Copy-Item dist/madarch-windows-x64.exe.sha256 dist/SHA256SUMS.txt
          $env:MADARCH_RELEASE_BASE = 'file:///' + (Resolve-Path dist).Path.Replace('\', '/')
          $env:MADARCH_INSTALL_PREFIX = Join-Path $env:RUNNER_TEMP 'madarch-install'
          & ./scripts/install.ps1 v0.0.1
          & (Join-Path $env:MADARCH_INSTALL_PREFIX 'madarch.exe') version
      - name: npx new then serve on Windows x64
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: Madarch Clean Walk
          GIT_AUTHOR_EMAIL: walk@example.invalid
          GIT_COMMITTER_NAME: Madarch Clean Walk
          GIT_COMMITTER_EMAIL: walk@example.invalid
        run: bun scripts/clean-install-walk.ts --binary dist/madarch-windows-x64.exe --os windows --arch x64
