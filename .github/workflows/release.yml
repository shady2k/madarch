name: release

# Tag pushes publish release assets and update the Homebrew tap. Branch clean-install
# walks live in clean-installs.yml and never publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binary:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            os: linux
            arch: x64
          - runs-on: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runs-on: macos-14
            os: darwin
            arch: arm64
          - runs-on: macos-13
            os: darwin
            arch: x64
          - runs-on: windows-latest
            os: windows
            arch: x64
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: install
        run: bun install --frozen-lockfile
      - name: check
        run: bun run check
      - name: test
        run: bun test test/clean-install.test.ts test/product-upgrade.test.ts test/product-draft.test.ts
      - name: install wiki app dependencies
        run: bun install --frozen-lockfile
        working-directory: wiki/app
      - name: build the wiki app
        run: bun run build
        working-directory: wiki/app
      - name: build the binary
        run: bun scripts/build-binary.ts --version "${VERSION#v}" --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out dist
        if: runner.os != 'Windows'
      - name: build the Windows binary
        run: bun scripts/build-binary.ts --version "$($env:VERSION.Substring(1))" --os windows --arch x64 --out dist
        if: runner.os == 'Windows'
      - name: prove the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: Madarch CI
          GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
          GIT_COMMITTER_NAME: Madarch CI
          GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
        run: |
          $binary = Resolve-Path ./dist/madarch-windows-x64.exe
          $home = Join-Path $env:RUNNER_TEMP 'madarch-smoke'
          $port = 18127
          $proc = Start-Process -FilePath $binary -ArgumentList @('new', 'clean-install-product', '--home', (Join-Path $home 'products'), '--port', "$port", '--no-open') -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'madarch-out.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'madarch-err.txt')
          try {
            $served = $false
            for ($i = 0; $i -lt 200; $i++) {
              if ($proc.HasExited) { throw "madarch new exited $($proc.ExitCode): $(Get-Content (Join-Path $env:RUNNER_TEMP 'madarch-err.txt') -Raw)" }
              try { $answer = Invoke-RestMethod "http://127.0.0.1:$port/api/product"; if ($answer.id) { $served = $true; break } } catch {}
              Start-Sleep -Milliseconds 100
            }
            if (-not $served) { throw 'madarch new did not serve a graph-backed product' }
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
      - name: prove the binary
        if: runner.os != 'Windows'
        env:
          BINARY: ./dist/madarch-${{ matrix.os }}-${{ matrix.arch }}
          GIT_AUTHOR_NAME: Madarch CI
          GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
          GIT_COMMITTER_NAME: Madarch CI
          GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
        run: |
          set -e
          tmp=$(mktemp -d)
          "$BINARY" version
          "$BINARY" list --home "$tmp/home"
          port=$((10000 + RANDOM % 20000))
          "$BINARY" new clean-install-product --home "$tmp/home" --port "$port" --no-open &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          for n in $(seq 1 200); do
            if curl -fsS "http://127.0.0.1:$port/api/product" | grep -q '"id"'; then exit 0; fi
            sleep .1
          done
          echo 'madarch new did not serve a graph-backed product' >&2
          exit 1
      - name: checksum
        env:
          BINARY: dist/madarch-${{ matrix.os == 'windows' && 'windows' || matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
        run: bun scripts/write-sha256.ts "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: madarch-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: binary
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: gather the binaries and their sums
        run: |
          set -e
          mkdir release
          cp artifacts/madarch-*/* release/
          cat release/*.sha256 > release/SHA256SUMS.txt
          rm release/*.sha256
          chmod 0755 release/madarch-linux-x64 release/madarch-linux-arm64 release/madarch-darwin-arm64 release/madarch-darwin-x64
      - name: the npm packages
        run: |
          set -e
          bun install --frozen-lockfile
          bun scripts/build-npm-package.ts --version "${VERSION#v}" --wrapper --packages-dir npm
          for pair in "linux x64" "linux arm64" "darwin arm64" "darwin x64" "win32 x64"; do
            set -- $pair
            artifact_os=$1
            [ "$artifact_os" != win32 ] || artifact_os=windows
            suffix=
            [ "$artifact_os" != windows ] || suffix=.exe
            bun scripts/build-npm-package.ts --version "${VERSION#v}" --os "$1" --arch "$2" --packages-dir npm --binary "release/madarch-$artifact_os-$2$suffix"
          done
          ( cd npm/madarch && npm pack --silent --pack-destination ../.. )
          for dir in npm/@madarch-*; do ( cd "$dir" && npm pack --silent --pack-destination ../.. ); done
      - name: the install scripts
        run: cp scripts/install.sh scripts/install.ps1 release/
      - name: the formula of the sums
        run: bun scripts/build-formula.ts --version "${VERSION#v}" --sums-file release/SHA256SUMS.txt --out tap && cp tap/Formula/madarch.rb release/madarch.rb
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" release/* --title "$VERSION" --generate-notes
      - name: Require HOMEBREW_TAP_TOKEN
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo 'HOMEBREW_TAP_TOKEN is required to update shady2k/homebrew-tap' >&2; exit 1; }
      - name: push the formula to the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sh scripts/publish-homebrew-tap.sh release/madarch.rb "${VERSION#v}"
