name: release

# The release build (madarch-lfhu, decision 0021 item (e)): a tag push of
# `vX.Y.Z` builds one madarch binary per platform (linux and macOS, amd64
# and arm64), smoke-runs each, checks the wikis, prepares the release assets,
# and creates a GitHub release. Windows x64 is built and packaged too.
# and creates a GitHub release. A PR or branch push that edits this workflow
# validates the same read-only build and package preparation; its tag-gated
# publish job is skipped. This change does not alter release or
# registry-publishing policy.

# Keep protected refs isolated; branch updates supersede older work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  binary:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            os: linux
            arch: x64
          - runs-on: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runs-on: macos-15
            os: darwin
            arch: arm64
          - runs-on: macos-15-intel
            os: darwin
            arch: x64
          - runs-on: windows-latest
            os: windows
            arch: x64
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Install the product's platform-independent runtime dependencies.
      - name: install
        run: bun install --frozen-lockfile
      - name: check
        run: bun run check
      # Re-enable this on every target after madarch-lfhu.7 and its platform fixes.
      # Product CI runs the suite on Ubuntu x64 for workflow changes; the release
      # matrix still builds and smoke-tests every target.
      - name: test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: MADARCH_SKIP_PERF=1 bun test test/
      # The wiki app is embedded into the binary: its build must be done
      # first, then its files ride with the build script's staging.
      - name: build the wiki app
        run: |
          cd wiki/app
          bun install --frozen-lockfile
          bun run build
      - name: build the binary
        if: runner.os != 'Windows'
        run: bun scripts/build-binary.ts --version "${VERSION#v}" --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out dist
      - name: build the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun scripts/build-binary.ts --version $env:VERSION.Substring(1) --os windows --arch x64 --out dist
      - name: prove the binary (version, list, new, serve)
        if: runner.os != 'Windows'
        env:
          BINARY: ./dist/madarch-${{ matrix.os }}-${{ matrix.arch }}
          GIT_AUTHOR_NAME: Madarch CI
          GIT_AUTHOR_EMAIL: madarch-ci@example.invalid
          GIT_COMMITTER_NAME: Madarch CI
          GIT_COMMITTER_EMAIL: madarch-ci@example.invalid
        run: |
          tmp=$(mktemp -d)
          "$BINARY" version
          "$BINARY" list --home "$tmp/home"
          # a real product: the draft is created and its wiki is served on a port of this run's own
          port=$((10000 + RANDOM % 20000))
          "$BINARY" new --home "$tmp/home" --port $port --no-open &
          pid=$!
          sleep 12
          curl -fsS "http://127.0.0.1:$port/" >/dev/null
          curl -fsS "http://127.0.0.1:$port/api/product" | grep '"id"'
          kill $pid 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -rf "$tmp"
      - name: prove the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: Madarch CI
          GIT_AUTHOR_EMAIL: madarch-ci@example.invalid
          GIT_COMMITTER_NAME: Madarch CI
          GIT_COMMITTER_EMAIL: madarch-ci@example.invalid
        run: |
          $binary = Resolve-Path ./dist/madarch-windows-x64.exe
          $smokeHome = Join-Path $env:RUNNER_TEMP 'madarch-smoke'
          $port = 18127
          $proc = Start-Process -FilePath $binary -ArgumentList @('new', '--home', (Join-Path $smokeHome 'products'), '--port', "$port", '--no-open') -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'madarch-out.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'madarch-err.txt')
          try {
            $served = $false
            for ($i = 0; $i -lt 200; $i++) {
              if ($proc.HasExited) { throw "madarch new exited $($proc.ExitCode): $(Get-Content (Join-Path $env:RUNNER_TEMP 'madarch-err.txt') -Raw)" }
              try { $answer = Invoke-RestMethod "http://127.0.0.1:$port/api/product"; if ($answer.id) { $served = $true; break } } catch {}
              Start-Sleep -Milliseconds 100
            }
            if (-not $served) { throw 'madarch new did not serve a graph-backed product' }
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
      - name: checksum
        shell: bash
        env:
          BINARY: dist/madarch-${{ matrix.os == 'windows' && 'windows' || matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
        run: bun scripts/write-sha256.ts "$BINARY"
      - uses: actions/upload-artifact@v7
        with:
          name: madarch-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*


  package:
    needs: binary
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: gather the binaries and their sums
        run: |
          set -e
          mkdir release
          cp artifacts/madarch-*/* release/
          cd release
          cat madarch-*.sha256 > SHA256SUMS.txt
          rm madarch-*.sha256
          chmod 0755 madarch-linux-x64 madarch-linux-arm64 madarch-darwin-arm64 madarch-darwin-x64
      - name: the npm packages
        run: |
          set -e
          bun install --frozen-lockfile
          bun scripts/build-npm-package.ts --version "${VERSION#v}" --wrapper --packages-dir npm
          for pair in "linux x64" "linux arm64" "darwin arm64" "darwin x64" "win32 x64"; do
            set -- $pair
            artifact_os=$1
            [ "$artifact_os" != win32 ] || artifact_os=windows
            suffix=
            [ "$artifact_os" != windows ] || suffix=.exe
            bun scripts/build-npm-package.ts --version "${VERSION#v}" --os "$1" --arch "$2" --packages-dir npm --binary "release/madarch-$artifact_os-$2$suffix"
          done
          ( cd npm/madarch && npm pack --silent --pack-destination ../.. )
          for dir in npm/@madarch-*; do ( cd "$dir" && npm pack --silent --pack-destination ../.. ); done
      - name: the install scripts
        run: cp scripts/install.sh scripts/install.ps1 release/
      - name: the formula of the sums
        run: bun scripts/build-formula.ts --version "${VERSION#v}" --sums-file release/SHA256SUMS.txt --out tap && cp tap/Formula/madarch.rb release/madarch.rb
      - uses: actions/upload-artifact@v7
        with:
          name: madarch-release-assets
          path: release/

  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: madarch-release-assets
          path: release
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" release/* --title "$VERSION" --generate-notes
      - name: require the Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo 'HOMEBREW_TAP_TOKEN is required to update shady2k/homebrew-tap' >&2; exit 1; }
      - name: push the formula to the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sh scripts/publish-homebrew-tap.sh release/madarch.rb "${VERSION#v}"
