name: Slow tests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Every run has its own group: no next nightly or manual run cancels evidence,
# and GitHub cannot replace an older pending run in a shared group either.
concurrency:
  group: slow-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  slow-tests:
    name: slow tests
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Cache the installed PostgreSQL server
        uses: actions/cache@v5
        with:
          path: ~/madarch/tools/postgresql
          key: postgres-18.6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/postgres-builds.ts') }}
      - name: Delegate a cgroup to the plugin sandbox, and allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo mkdir -p /sys/fs/cgroup/madarch-test
          echo '+memory +cpu +pids' | sudo tee /sys/fs/cgroup/madarch-test/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/madarch-test
      - name: Note the home and the temporary folder before the run
        run: node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/before-run.txt"
      - name: Run the slow files
        id: slow
        run: |
          set -o pipefail
          scripts/plugin-sandbox-cgroup.sh bun run test:slow --timings="$RUNNER_TEMP/slow.json" --update-timings 2>&1 | tee "$RUNNER_TEMP/slow.log"
      - name: Summarize the slow files, including failed runs
        if: always()
        env:
          SLOW_OUTCOME: ${{ steps.slow.outcome }}
        run: bun scripts/summarize-slow-tests.ts "$RUNNER_TEMP/slow.json" "$RUNNER_TEMP/slow.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slow-test-results
          path: |
            ${{ runner.temp }}/slow.json
            ${{ runner.temp }}/slow.log
          if-no-files-found: warn
      - name: The run left the home and the temporary folder as it found them
        if: always()
        run: |
          node .shady2k/run-scratch-check.mjs snapshot "$RUNNER_TEMP/after-run.txt"
          node .shady2k/run-scratch-check.mjs compare "$RUNNER_TEMP/before-run.txt" "$RUNNER_TEMP/after-run.txt"
