# Every `bun test` run of this package gets its own scratch home and temporary
# folder, created before any test file loads and removed when the run ends
# (madarch-1xq): see test/run-scratch.ts. Bun reads this file only from the
# folder the run starts in, so the isolation covers `bun test`, `bun run test`
# and CI's `bun test test/` — runs started from inside `test/` do not get it.
[test]
preload = ["./test/run-scratch.ts", "./test/deadline.ts", "./test/plugin-sandbox-guard.ts"]
# A test that names no bound of its own has a sixty-second hang guard instead of
# Bun's five (madarch-tzte.36, madarch-x9a7.5): at least three times the worst
# single case measured on the box (11.2 s), so a machine slower than GitHub's
# runners does not stop a healthy case. It is set by `setDefaultTimeout` in
# test/deadline.ts, not by `timeout = 60000` here: Bun 1.4.2 ignores that key, as
# a number or as "60s" (measured: a test that sleeps 7 s still fails at 5 003 ms
# with it set), while the preload's call takes effect; `scripts/run-tests.ts`
# also passes `--timeout=60000` to `bun test` when the caller names no timeout
# flag, so a run that holds several files is covered either way. The guard is no
# licence for a slow test: the 30-second single-file rule (test/slow-files.json)
# and the suite budget stay, and a test that names its own bound keeps it.
