# Every `bun test` run of this package gets its own scratch home and temporary
# folder, created before any test file loads and removed when the run ends
# (madarch-1xq): see test/run-scratch.ts. Bun reads this file only from the
# folder the run starts in, so the isolation covers `bun test`, `bun run test`
# and CI's `bun test test/` — runs started from inside `test/` do not get it.
[test]
preload = ["./test/run-scratch.ts", "./test/deadline.ts"]
# Every test has ten seconds instead of Bun's five (madarch-tzte.36): several
# take 5.0-6.0 s on GitHub's runners, and each one that times out costs a shard
# rerun. The bound is `setDefaultTimeout` in test/deadline.ts, not
# `timeout = 10000` here: Bun 1.4.2 ignores that key, as a number or as "10s"
# (measured: a test that sleeps 7 s still fails at 5 003 ms with it set), while
# the preload's call takes effect. A test that sets its own bound keeps it. The
# slow tests themselves are madarch-cznn, which brings the bound back down.
