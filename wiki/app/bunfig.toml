# Every `bun test` run of this app gets its own scratch home and temporary
# folder, created before any test file loads and removed when the run ends
# (madarch-1xq): the mechanism is the engine's own preload, shared rather than
# copied, so the app and the engine are isolated the same way.
[test]
preload = ["./test/run-scratch.ts", "./test/deadline.ts", "./test/browser-modules.ts"]
# A sixty-second hang guard for a test that names no bound of its own, instead of
# Bun's five, and the engine's own default so both suites agree (madarch-tzte.36,
# madarch-x9a7.5): it is the preload beside the scratch one, not
# `timeout = 60000` here, which Bun 1.4.2 ignores. It is no licence for a slow
# test — the 30-second single-file rule and the suite budget stay — and a test
# that names its own bound keeps it.
