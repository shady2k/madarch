contract: 1
overview:
  audience:
    document: docs/vision.md
    section: Audience
stages:
  - id: idea
    labels:
      en: Idea
      ru: Идея
    name: Idea
  - id: requirements
    labels:
      en: Requirements
      ru: Требования
    name: Requirements
  - id: design
    labels:
      en: Design
      ru: Проектирование
    sections:
      - architecture
    expected:
      - architecture views
    name: Design
  - id: build
    labels:
      en: Build
      ru: Разработка
    sections:
      - repositories
    expected:
      - task
    name: Build
  - id: verify
    labels:
      en: Verify
      ru: Проверка
    expected:
      - acceptance record
    name: Verify
  - id: release
    labels:
      en: Release
      ru: Выпуск
    expected:
      - release record
    name: Release
  - id: operate
    labels:
      en: Operate
      ru: Эксплуатация
    expected:
      - incident record
    name: Operate
kinds:
  - name: Product vision
    labels:
      en: Product vision
      ru: Видение продукта
    prefix: V
    folder: docs/vision.md
    stage: idea
    hint: write why the product is worth building, for one reader to hold
  - name: Roadmap
    labels:
      en: Roadmap
      ru: Дорожная карта
    prefix: RM
    folder: docs/roadmap.md
    stage: idea
    hint: lay out the milestones the idea walks in order
  - name: Milestone
    labels:
      en: Milestone
      ru: Веха
    prefix: M
    folder: docs/milestones
    stage: idea
    hint: write the next milestone's outcomes and what is out
  - name: Sources
    labels:
      en: Sources
      ru: Источники
    prefix: S
    folder: docs/sources
    stage: idea
    hint: have the first conversation with a customer, write it down
  - name: Hypotheses
    labels:
      en: Hypotheses
      ru: Гипотезы
    prefix: H
    folder: docs/hypotheses
    stage: idea
    hint: turn a source into one checkable sentence
    links:
      - field: Grew from
        targets:
          - Product vision
          - Sources
        backlink: Grew into
    statuses:
      - open
      - confirmed
      - refuted
      - unclear
  - name: Prototypes
    labels:
      en: Prototypes
      ru: Прототипы
    prefix: P
    folder: docs/prototypes
    stage: idea
    hint: build the smallest thing that tests the belief
    links:
      - field: Tests
        targets:
          - Hypotheses
        backlink: Tested by
  - name: Results
    labels:
      en: Results
      ru: Результаты
    prefix: R
    folder: docs/results
    stage: idea
    hint: measure what happened and say what it proves
    links:
      - field: Of
        targets:
          - Prototypes
        backlink: Measured
  - name: Open questions
    labels:
      en: Open questions
      ru: Открытые вопросы
    prefix: Q
    folder: docs/questions
    stage: idea
    hint: write what is not known and who can answer it
    questions:
      identityPrefix: Q
      titleSeparator: —
      promptSection: Question
      answerSection: Answer
      answererField: Who can answer
      concernsField: Concerns
      notApplicablePrefix: "Not applicable:"
    links:
      - field: Concerns
        targets:
          - Product vision
          - Use cases
        backlink: Concerned by
  - name: User stories
    labels:
      en: User stories
      ru: Пользовательские истории
    prefix: US
    folder: docs/stories
    stage: requirements
    hint: write what one user does with the product in their own words
    links:
      - field: Grew from
        targets:
          - Hypotheses
          - Sources
        backlink: Grew into
  - name: Use cases
    labels:
      en: Use cases
      ru: Сценарии использования
    prefix: UC
    folder: docs/use-cases
    stage: requirements
    hint: walk one story's steps from start to finish
    links:
      - field: Serves
        targets:
          - User stories
        backlink: Served by
        required: true
  - name: Product requirements
    labels:
      en: Product requirements
      ru: Требования к продукту
    prefix: FR
    folder: docs/requirements
    stage: requirements
    hint: write what the product does, one requirement at a time
    links:
      - field: Serves
        targets:
          - Use cases
          - User stories
  - name: Decisions
    labels:
      en: Decisions
      ru: Решения
    prefix: D
    folder: docs/decisions
    stage: design
    hint: record the choice between the options on the table
    statuses:
      - accepted
      - superseded
      - deferred
  - name: Design specs
    labels:
      en: Design specs
      ru: Спецификации проектирования
    prefix: SP
    folder: docs/specs
    stage: design
    hint: write the design's behaviour before code
  - name: Architecture
    labels:
      en: Architecture
      ru: Архитектура
    prefix: A
    folder: docs/system/architecture.md
    stage: design
    hint: keep the architecture document beside the system's views
  - name: Capabilities
    labels:
      en: Capabilities
      ru: Возможности
    prefix: C
    folder: docs/system/capabilities
    stage: design
    hint: name each behaviour's requirement and scenario
  - name: Change records
    labels:
      en: Change records
      ru: Записи изменений
    prefix: CH
    folder: docs/changes
    stage: design
    hint: propose every behaviour change beside its capability
  - name: Explorations
    labels:
      en: Explorations
      ru: Исследования
    prefix: E
    folder: docs/explorations
    stage: design
    hint: keep what a look around taught, when holding it is asked for
  - name: Practices
    labels:
      en: Practices
      ru: Практики
    prefix: PRA
    folder: docs/practices
    stage: operate
    hint: write the rule a session learned, so the next one reads it
    statuses:
      - active
      - retired
