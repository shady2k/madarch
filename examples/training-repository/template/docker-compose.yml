services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
# @@ since containers

  orders:
    build: ./services/orders
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://training:training@postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://training:training@postgres:5432/payments?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-deferred}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  promotions:
    build: ./services/promotions
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://training:training@postgres:5432/promotions?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  checkout:
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    ports:
      - "8083:8083"
    environment:
      ORDERS_URL: http://orders:8080
      PROMOTIONS_URL: http://promotions:8082
      PAYMENTS_ADDR: payments:50051
    depends_on:
      - orders
      - payments
      - promotions
# @@ end
