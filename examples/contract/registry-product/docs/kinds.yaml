contract: 1
stages:
  - id: idea
    labels:
      en: Idea
      ru: Идея
  - id: requirements
    labels:
      en: Requirements
      ru: Требования
  - id: design
    labels:
      en: Design
      ru: Проектирование
  - id: build
    labels:
      en: Build
      ru: Разработка
  - id: verify
    labels:
      en: Verify
      ru: Проверка
  - id: release
    labels:
      en: Release
      ru: Выпуск
  - id: operate
    labels:
      en: Operate
      ru: Эксплуатация
kinds:
  - name: observation
    labels:
      en: Observation
      ru: Наблюдение
    prefix: OBS
    folder: docs/observations
    stage: idea
    hint: capture an observation for later use
    statuses:
      - draft
      - heard
  - name: proposal
    labels:
      en: Proposal
      ru: Предложение
    prefix: PRP
    folder: docs/proposals
    stage: idea
    hint: turn an observation into one checkable sentence
    statuses:
      - draft
      - confirmed
      - refuted
      - unclear
    links:
      - field: Derived from
        targets:
          - observation
        backlink: Derived into
        cardinality: one
        required: true
  - name: work item
    labels:
      en: Work item
      ru: Рабочий элемент
    prefix: WI
    folder: docs/work-items
    stage: requirements
    hint: describe one person's interaction with the system
    statuses:
      - draft
      - ready
    links:
      - field: Derived from
        targets:
          - observation
          - proposal
        backlink: Derived into
        cardinality: many
        required: false
      - field: Relates to
        targets:
          - scenario
        backlink: Related from
        cardinality: one
        required: true
  - name: scenario
    labels:
      en: Scenario
      ru: Сценарий
    prefix: SCN
    folder: docs/scenarios
    stage: design
    hint: walk one work item through the product
    statuses:
      - draft
      - ready
    links:
      - field: Relates to
        targets:
          - work item
        backlink: Related from
        cardinality: many
        required: false
  - name: capability
    labels:
      en: Capability
      ru: Способность
    prefix: CAP
    folder: docs/capabilities
    stage: requirements
    hint: describe one system capability
    statuses:
      - draft
      - ready
    links:
      - field: Relates to
        targets:
          - scenario
          - work item
        backlink: Related from
        cardinality: many
        required: false
  - name: choice
    labels:
      en: Choice
      ru: Выбор
    prefix: CH
    folder: docs/choices
    stage: design
    hint: record the choice between the options on the table
    statuses:
      - proposed
      - accepted
      - superseded
  - name: asset
    labels:
      en: Asset
      ru: Объект
    prefix: AST
    folder: docs/assets
    stage: operate
    hint: reference an asset maintained by an external system
    # The reserved fact storage form (the 0021 amendment): the record's truth
    # stays with the system it was imported from, read-only in the wiki.
    storage: fact
    evidence:
      source: Origin
      ref: Revision
      record: Entry

# The reserved goals section (the 0021 amendment, 2026-10-12): the shape's
# place, one level per perspective; this engine version keeps the section as
# data and names it as reserved-but-unimplemented when it renders.
goals:
  - name: grounded
    perspective: business
    rules:
      - every scenario links a work item
      - every capability serves a scenario or a work item
  - name: true-to-the-systems
    perspective: ops
    rules:
      - every imported fact names its origin system and record
