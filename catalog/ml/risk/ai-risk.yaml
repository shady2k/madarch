id: nist-ai-rmf.risk
purpose: quality
audience: [security-engineer, product-lead, analyst]
definition: An AI risk is a way an AI system may harm people or the organisation, with its likelihood and its effect.
sources:
- https://www.nist.gov/itl/ai-risk-management-framework
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - threatens
  in:
  - threatens
template-policy: none
labels:
  en:
    one: AI risk
    many: AI risks
  ru:
    one: Риск ИИ
    many: Риски ИИ
description:
  en: An AI risk describes a possible harm from an AI system — a wrong recommendation, discrimination, a privacy breach, a loss of control — and weighs how likely it is and how bad it would be. Risks are tracked until a measure reduces them or someone accepts them.
  ru: Риск ИИ описывает возможный вред от системы ИИ — неверную рекомендацию, дискриминацию, утечку личных данных, потерю контроля — и оценивает, насколько он вероятен и насколько тяжёл. Риски ведут, пока мера не уменьшит их или кто-то сознательно их не примет.
