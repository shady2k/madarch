id: cyclonedx.ml-model
purpose: structure
audience: [developer, architect, product-lead]
definition: A model is a trained artefact that turns an input into a prediction or a generated result, built from data and code.
sources:
- https://cyclonedx.org/docs/1.6/json/
- https://spdx.github.io/spdx-spec/v3.0.1/model/AI/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - generates
  in:
  - generates
template-policy: none
labels:
  en:
    one: ML model
    many: ML models
  ru:
    one: Модель ML
    many: Модели ML
description:
  en: 'A model is the result of training: a set of learned parameters that turns an input into a prediction, a classification or generated text. It is kept with the data and the code that produced it, so the same result can be rebuilt and checked.'
  ru: 'Модель — результат обучения: набор выученных параметров, который превращает входные данные в предсказание, классификацию или сгенерированный текст. Её хранят вместе с данными и кодом, которые её создали, чтобы результат можно было повторить и проверить.'
