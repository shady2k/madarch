id: practice.evaluation-result
purpose: quality
audience: [developer, tester, product-lead]
definition: An evaluation result is what one evaluation measured, next to the threshold it was compared with.
sources:
- https://www.tensorflow.org/tfx/ml_metadata/api_docs/python/mlmd
- https://mlflow.org/docs/latest/index.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Model evaluation result
    many: Model evaluation results
  ru:
    one: Результат оценки модели
    many: Результаты оценки модели
description:
  en: An evaluation result records the numbers one evaluation produced — accuracy, error rate or another measure — and the threshold the model had to meet. It says whether the model passed and by how much.
  ru: 'Результат оценки модели фиксирует числа, которые дала одна оценка: точность, долю ошибок или другую меру, — и порог, который модель должна была пройти. По нему видно, прошла ли модель и с каким запасом.'
derives-from:
- evaluation-run
- product-profile
