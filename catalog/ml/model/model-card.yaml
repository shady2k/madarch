id: practice.model-card
purpose: understand
audience: [product, analyst, developer, product-lead]
definition: A model card documents a model's purpose, its limits and its evaluation, for the people who use it.
sources:
- https://www.nist.gov/itl/ai-risk-management-framework
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - documents
  in:
  - documents
template-policy: none
labels:
  en:
    one: Model card
    many: Model cards
  ru:
    one: Карточка модели
    many: Карточки модели
description:
  en: A model card states what a model is for, how it was trained, on which data, how it was evaluated and where it fails or should not be used. It is written for the people who choose or rely on the model.
  ru: Карточка модели говорит, для чего модель нужна, как её обучали и на каких данных, как её оценивали и где она ошибается или где её нельзя применять. Она написана для тех, кто выбирает модель или полагается на неё.
