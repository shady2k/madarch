id: practice.training-dataset
purpose: structure
audience: [developer, architect, product-lead]
definition: A training dataset is the data a model was trained on, with its source and its licence.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Training dataset
    many: Training datasets
  ru:
    one: Обучающий набор
    many: Обучающие наборы
description:
  en: A training dataset is the collection of examples a model learned from, with where the data came from, how it was prepared and under which licence it may be used. What the data contains decides what the model can learn and which biases it inherits.
  ru: Обучающий набор — совокупность примеров, на которых училась модель, вместе с происхождением данных, способом их подготовки и лицензией, по которой их можно использовать. От того, что в нём есть, зависит, чему модель научится и какие предубеждения унаследует.
derives-from:
- dataset
- license
- product-profile
