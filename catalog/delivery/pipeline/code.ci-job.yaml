id: otel.cicd-task
purpose: operations
audience: [developer, platform-devops, operations]
definition: A CI job is one job of a continuous integration workflow and the steps it runs.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/cicd/
acquisition:
- extractor operations
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
details:
- workingDirectory
- steps
- uses
fields:
- name: workflow
  type: text
  reference: code.ci-workflow
  producers:
  - operations
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  producers:
  - operations
- name: working_directory
  type: text
  nullable: true
  producers:
  - operations
- name: steps
  type: json
  nullable: true
  producers:
  - operations
- name: uses
  type: json
  nullable: true
  producers:
  - operations
key:
- workflow
- name
derives-from:
- code.ci-workflow
labels:
  en:
    one: CI job
    many: CI jobs
  ru:
    one: Задача CI
    many: Задачи CI
description:
  en: 'A CI job is one unit of work in continuous integration: check out the code, run a set of commands and report success or failure. Jobs are usually grouped in a workflow, and each may run on its own machine.'
  ru: 'Задача CI — одна единица работы в непрерывной интеграции: получить код, выполнить набор команд и сообщить об успехе или отказе. Задачи обычно входят в процесс, и каждая может выполняться на своей машине.'
