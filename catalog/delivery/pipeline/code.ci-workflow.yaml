id: otel.cicd-pipeline
purpose: operations
audience: [developer, platform-devops, operations]
definition: A CI workflow is a continuous integration process file and the triggers it runs on.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/cicd/
acquisition:
- extractor operations
relation-constraints:
  out:
  - hasPart
  in:
  - defines
template-policy: page
source: graph
details:
- name
- on
fields:
- name: repository
  type: text
  reference: code.repository
  producers:
  - operations
- name: path
  type: path
  labels:
    en: Path
    ru: Путь
  producers:
  - operations
- name: name
  type: text
  nullable: true
  producers:
  - operations
- name: on
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:code.ci-workflow-on:v1
  nullable: true
  producers:
  - operations
key:
- repository
- path
derives-from:
- code.file
labels:
  en:
    one: CI workflow
    many: CI workflows
  ru:
    one: Процесс CI
    many: Процессы CI
description:
  en: 'A CI workflow declares what runs when a change arrives: which jobs, in what order, on which events such as a push or a pull request. It is defined in a file in the repository, so the checks live with the code.'
  ru: 'Процесс CI объявляет, что запускается при появлении изменения: какие задачи, в каком порядке и на какие события — push или запрос на слияние. Он задан файлом в репозитории, поэтому проверки живут вместе с кодом.'
