id: otel.cicd-worker
purpose: operations
audience: [developer, platform-devops, operations]
definition: A runner is the machine or the agent that a pipeline job runs on.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/cicd/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasHost
  in:
  - hasHost
template-policy: none
labels:
  en:
    one: Runner
    many: Runners
  ru:
    one: Исполнитель
    many: Исполнители
description:
  en: 'A runner is the worker that executes pipeline jobs: a hosted machine, a container or a server in the organisation''s own network. Its capabilities and its access decide what a job can do.'
  ru: 'Исполнитель — работник, который выполняет задачи конвейера: размещённая машина, контейнер или сервер в собственной сети организации. Его возможности и доступ решают, что может сделать задача.'
