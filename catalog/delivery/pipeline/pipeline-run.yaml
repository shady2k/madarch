id: otel.cicd-pipeline-run
purpose: history
audience: [developer, platform-devops, operations]
definition: A pipeline run is one execution of a pipeline on one revision, with its result and its duration.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/cicd/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasTest
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Pipeline run
    many: Pipeline runs
  ru:
    one: Запуск конвейера
    many: Запуски конвейера
description:
  en: 'A pipeline run records one pass of a pipeline over one revision: when it started, how long each stage took, what it produced and whether it succeeded. Failed runs show where a change stopped.'
  ru: 'Запуск конвейера фиксирует один проход конвейера по одной ревизии: когда он начался, сколько занял каждый этап, что получилось и удачно ли всё прошло. Неудачные запуски показывают, где остановилось изменение.'
