id: opengitops.application
purpose: operations
audience: [developer, platform-devops, operations]
definition: A GitOps application is a deployed application whose desired state is kept in Git and reconciled into the cluster.
sources:
- https://opengitops.dev/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - generates
  in:
  - generates
template-policy: none
labels:
  en:
    one: GitOps application
    many: GitOps applications
  ru:
    one: Приложение GitOps
    many: Приложения GitOps
description:
  en: A GitOps application is one workload that a GitOps agent keeps in line with a declaration stored in Git. The declaration is the truth, and the agent applies it whenever it or the cluster changes.
  ru: Приложение GitOps — одна нагрузка, которую агент GitOps держит в соответствии с объявлением, хранимым в Git. Объявление — источник истины, и агент применяет его всякий раз, когда меняется оно или кластер.
