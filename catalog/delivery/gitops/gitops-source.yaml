id: opengitops.source
purpose: operations
audience: [developer, platform-devops, operations]
definition: A GitOps source is the repository, path and revision that a GitOps agent reads the desired state from.
sources:
- https://opengitops.dev/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: GitOps source
    many: GitOps sources
  ru:
    one: Источник GitOps
    many: Источники GitOps
description:
  en: 'A GitOps source names where the desired state lives: which repository, which folder in it and which branch, tag or commit. Changing the source changes what the agent will apply.'
  ru: 'Источник GitOps называет, где лежит желаемое состояние: какой репозиторий, какая папка в нём и какая ветка, тег или коммит. Смена источника меняет то, что применит агент.'
