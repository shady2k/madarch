id: slsa.builder-identity
purpose: operations
audience: [developer, platform-devops, operations]
definition: A builder is the identity a build platform used to run one build.
sources:
- https://slsa.dev/spec/v1.0/provenance
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Builder
    many: Builders
  ru:
    one: Сборщик
    many: Сборщики
description:
  en: A builder is the account, the worker or the image the build platform used to execute a build, such as a service account or a builder image version. Recording it shows which rights and which tools the build had.
  ru: 'Сборщик — учётная запись, работник или образ, которыми платформа сборки выполняла сборку: служебная учётная запись или версия образа сборщика. Его запись показывает, какие права и какие инструменты были у сборки.'
derives-from:
- build-platform
