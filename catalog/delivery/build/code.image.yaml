id: practice.container-image
purpose: operations
audience: [developer, platform-devops, operations]
definition: A container image is a packaged file system and start command that a deployment runs, named by its repository and tag.
sources:
- https://github.com/opencontainers/image-spec
acquisition:
- extractor operations
relation-constraints:
  out:
  - generates
  - code.builds
  in:
  - generates
  - partOf
  - code.runs
template-policy: page
source: graph
fields:
- name: registry
  type: text
  nullable: true
  producers:
  - operations
- name: repository
  type: text
  nullable: true
  producers:
  - operations
- name: tag
  type: text
  nullable: true
  producers:
  - operations
- name: digest
  type: text
  nullable: true
  producers:
  - operations
key:
- repository
- tag
derives-from:
- code.dockerfile
labels:
  en:
    one: Image
    many: Images
  ru:
    one: Образ
    many: Образы
description:
  en: A container image bundles a program with the files and libraries it needs, so it runs the same wherever a container runtime starts it. Its repository and tag name it, and its digest identifies the exact build.
  ru: Образ контейнера упаковывает программу с нужными ей файлами и библиотеками, поэтому она одинаково работает везде, где её запускает среда контейнеров. Его называют репозиторий и тег, а точную сборку указывает дайджест.
