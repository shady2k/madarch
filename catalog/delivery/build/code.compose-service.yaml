id: practice.compose-service
purpose: operations
audience: [developer, platform-devops, operations]
definition: A compose service is one service declared in a compose file, with its ports and its dependencies.
sources:
- https://docs.docker.com/compose/
acquisition:
- extractor operations
relation-constraints:
  out:
  - dependsOn
  in:
  - partOf
template-policy: page
source: graph
labels:
  en:
    one: Compose service
    many: Compose services
  ru:
    one: Сервис compose
    many: Сервисы compose
description:
  en: 'A compose service is one container definition inside a compose file: its image, its command, its ports, its volumes and the other services it depends on. One file can describe a whole set of services that run together on a machine.'
  ru: 'Сервис compose — одно описание контейнера в файле compose: его образ, команда, порты, тома и другие сервисы, от которых он зависит. Один файл может описать целый набор сервисов, работающих вместе на машине.'
