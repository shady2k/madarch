id: slsa.subject
purpose: operations
audience: [developer, platform-devops, operations]
definition: A build artifact is what a build produced, named by its digest so it can be verified.
sources:
- https://slsa.dev/spec/v1.0/provenance
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out: []
  in:
  - hasOutput
  - generates
template-policy: none
labels:
  en:
    one: Build artifact
    many: Build artifacts
  ru:
    one: Артефакт сборки
    many: Артефакты сборки
description:
  en: 'A build artifact is a file or a package a build produced and that someone can use or deploy: an image, an archive, a binary. Its digest identifies its exact content, so a later step can prove it is the same one.'
  ru: 'Артефакт сборки — файл или пакет, который создала сборка и который можно использовать или развернуть: образ, архив, двоичный файл. Его дайджест указывает точное содержимое, чтобы позднее можно было доказать, что это тот же самый артефакт.'
