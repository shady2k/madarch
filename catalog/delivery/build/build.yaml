id: slsa.build
purpose: history
audience: [developer, platform-devops, operations]
definition: A build is one run that turns a revision into artifacts, with the definition it followed and the dependencies it resolved.
sources:
- https://slsa.dev/spec/v1.0/provenance
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasOutput
  - usesTool
  - generates
  in: []
template-policy: none
labels:
  en:
    one: Build
    many: Builds
  ru:
    one: Сборка
    many: Сборки
description:
  en: A build takes one revision of the code, the definition of how to assemble it and the dependencies it resolved, and produces artifacts. Its record says what went in and what came out, so the result can be repeated and checked.
  ru: Сборка берёт одну ревизию кода, описание того, как его собрать, и разрешённые зависимости, а на выходе даёт артефакты. В её записи сказано, что вошло и что вышло, чтобы результат можно было повторить и проверить.
derives-from:
- code.commit
- pipeline-run
