id: practice.dockerfile
purpose: operations
audience: [developer, platform-devops, operations]
definition: A Dockerfile is a recipe that builds a container image.
sources:
- https://github.com/opencontainers/image-spec
acquisition:
- extractor operations
relation-constraints:
  out:
  - generates
  - partOf
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: base_image
  type: text
  nullable: true
  producers:
  - operations
- name: stages
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:code.dockerfile-stages:v1
  nullable: true
  producers:
  - operations
- name: exposed_ports
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:port-list:v1
  nullable: true
  producers:
  - operations
key: []
derives-from:
- code.file
labels:
  en:
    one: Dockerfile
    many: Dockerfiles
  ru:
    one: Dockerfile
    many: Dockerfile
description:
  en: 'A Dockerfile lists, step by step, how to build a container image: the base image, the files to copy, the commands to run and the command that starts the program. Building it again from the same inputs gives the same image.'
  ru: 'Dockerfile перечисляет шаг за шагом, как собрать образ контейнера: базовый образ, копируемые файлы, выполняемые команды и команду запуска программы. Повторная сборка из тех же входных данных даёт тот же образ.'

key-edges:
- role: code.dockerfile-file
  edge: code.dockerfile-file
  side: from
applicability:
  dependencies: []
  markers:
  - '**/Dockerfile'
  - '**/Dockerfile.*'
  profile: deployment
