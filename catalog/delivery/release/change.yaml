id: otel.vcs-change
purpose: history
audience: [developer, platform-devops, operations]
definition: A change is a proposed or merged alteration to the product, from its first commit until it runs in production.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
- https://dora.dev/guides/dora-metrics/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Change
    many: Changes
  ru:
    one: Изменение
    many: Изменения
description:
  en: 'A change follows one alteration through delivery: the commits that make it, the review it gets, the build and the deployments that carry it to users. It is the unit that answers what happened to the product and why.'
  ru: 'Изменение прослеживает одну правку через всю доставку: коммиты, из которых оно состоит, его просмотр, сборку и развёртывания, которые доносят его до пользователей. Это единица, по которой видно, что и почему произошло с продуктом.'
