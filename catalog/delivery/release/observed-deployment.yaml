id: practice.observed-deployment
purpose: operations
audience: [developer, platform-devops, operations]
definition: An observed deployment is what actually runs in one environment, as the platform reports it.
sources:
- https://kubernetes.io/docs/concepts/architecture/controller/
acquisition:
- live-system
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Observed deployment
    many: Observed deployments
  ru:
    one: Наблюдаемое развёртывание
    many: Наблюдаемые развёртывания
description:
  en: 'An observed deployment records the state the platform reports: which version is running, how many copies, on which nodes and in what health. Comparing it with the desired state shows whether the deployment took effect.'
  ru: 'Наблюдаемое развёртывание записывает состояние, которое сообщает платформа: какая версия работает, сколько копий, на каких узлах и в каком состоянии. Сравнение с желаемым показывает, подействовало ли развёртывание.'
