id: helm.release
purpose: operations
audience: [developer, platform-devops, operations]
definition: A Helm release is a named, deployed instance of a Helm chart in one cluster and namespace.
sources:
- https://helm.sh/docs/topics/charts/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - generates
  in:
  - generates
template-policy: none
labels:
  en:
    one: Helm release
    many: Helm releases
  ru:
    one: Выпуск Helm
    many: Выпуски Helm
description:
  en: 'A Helm release records one installation of a chart: the chart version, the values used, the objects created and the revision history of the installation. Upgrading or rolling back changes the release, not the chart.'
  ru: 'Выпуск Helm записывает одну установку чарта: его версию, использованные значения, созданные объекты и историю изменений установки. Обновление или откат меняют выпуск, а не сам чарт.'
