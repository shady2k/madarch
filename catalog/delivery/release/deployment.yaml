id: practice.deployment
purpose: operations
audience: [developer, platform-devops, operations]
definition: A deployment places one version of a product into one environment so that people or other systems can use it.
sources:
- https://dora.dev/guides/dora-metrics/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Deployment
    many: Deployments
  ru:
    one: Развёртывание
    many: Развёртывания
description:
  en: A deployment is the act of installing and starting one version of the product in one environment, such as staging or production. Its record says which version went where and when, and whether the deployment succeeded or was rolled back.
  ru: Развёртывание — установка и запуск одной версии продукта в одной среде, например на стенде или в промышленной среде. В записи о развёртывании указано, какая версия, куда и когда попала и прошло ли всё удачно или пришлось откатиться.
derives-from:
- deployment-environment
- release
