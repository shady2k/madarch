id: practice.release
purpose: operations
audience: [developer, platform-devops, operations]
definition: A release is a version of the product made available to its users, with the changes it carries.
sources:
- https://helm.sh/docs/topics/charts/
- https://dora.dev/guides/dora-metrics/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  - hasDistributionArtifact
  in:
  - contains
template-policy: none
labels:
  en:
    one: Release
    many: Releases
  ru:
    one: Выпуск
    many: Выпуски
description:
  en: A release is one version of the product handed to its users, marked by a number and carrying a stated set of changes. It may reach everyone at once or gradually, and its notes say what is new.
  ru: Выпуск — одна версия продукта, переданная пользователям, отмеченная номером и несущая определённый набор изменений. Он может дойти до всех сразу или постепенно, а его заметки говорят, что нового.
