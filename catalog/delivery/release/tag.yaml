id: practice.tag
purpose: history
audience: [developer, platform-devops, operations]
definition: A tag is a name fixed to one revision, which a release or a build may be taken from.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - generates
  in:
  - generates
template-policy: none
labels:
  en:
    one: Tag
    many: Tags
  ru:
    one: Тег
    many: Теги
description:
  en: A tag is a label on one commit, such as v1.4.0, that does not move as new commits arrive. A build or a release may be taken from it, but the tag itself is only a name for a point in history.
  ru: Тег — метка на одном коммите, например v1.4.0, которая не сдвигается с новыми коммитами. От неё могут взять сборку или выпуск, но сам тег — лишь имя для точки в истории.
