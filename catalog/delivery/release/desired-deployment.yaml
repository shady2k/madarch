id: practice.desired-deployment
purpose: operations
audience: [developer, platform-devops, operations]
definition: A desired deployment is the state a deployment asks an environment to hold, as its manifests and its GitOps source state it.
sources:
- https://kubernetes.io/docs/concepts/architecture/controller/
- https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Desired deployment
    many: Desired deployments
  ru:
    one: Желаемое развёртывание
    many: Желаемые развёртывания
description:
  en: 'A desired deployment records what one deployment asked for: which version, which configuration and which resources, as its manifests and its GitOps source declare. Comparing it with what is observed shows whether the request was fulfilled.'
  ru: 'Желаемое развёртывание записывает, чего потребовало развёртывание: какую версию, настройки и ресурсы, как объявляют его манифесты и источник GitOps. Сравнение с наблюдаемым состоянием показывает, выполнено ли требование.'
