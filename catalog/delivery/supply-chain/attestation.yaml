id: in-toto.attestation
purpose: quality
audience: [developer, platform-devops, operations]
definition: An attestation is a signed statement about an artifact, such as its provenance or a scan result, in an in-toto envelope.
sources:
- https://github.com/in-toto/attestation/blob/main/spec/README.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Attestation
    many: Attestations
  ru:
    one: Аттестация
    many: Аттестации
description:
  en: 'An attestation wraps a statement about an artifact in a signature that a verifier can check: who made the claim, about which artifact and what it says. It lets another party trust the artifact without trusting the person who handed it over.'
  ru: 'Аттестация оборачивает утверждение об артефакте в подпись, которую может проверить проверяющий: кто сделал заявление, о каком артефакте и что именно сказано. Она позволяет другой стороне доверять артефакту, не доверяя тому, кто его передал.'
