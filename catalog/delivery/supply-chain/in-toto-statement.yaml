id: in-toto.statement
purpose: quality
audience: [developer, platform-devops, operations]
definition: 'An in-toto statement is the body of an attestation: its subject, its predicate type and its predicate.'
sources:
- https://github.com/in-toto/attestation/blob/main/spec/README.md
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: in-toto statement
    many: in-toto statements
  ru:
    one: Утверждение in-toto
    many: Утверждения in-toto
description:
  en: An in-toto statement names the artifacts it is about (the subject), the kind of claim it makes (the predicate type) and the claim itself (the predicate). The signature around it makes the whole attestation verifiable.
  ru: Утверждение in-toto называет артефакты, о которых речь (предмет), род заявления (тип предиката) и само заявление (предикат). Подпись вокруг делает всю аттестацию проверяемой.
derives-from:
- build-artifact
