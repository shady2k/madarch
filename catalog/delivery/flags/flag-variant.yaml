id: openfeature.variant
purpose: operations
audience: [developer, platform-devops, operations]
definition: A flag variant is one value a feature flag can take, chosen by its rules.
sources:
- https://openfeature.dev/specification/glossary
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Flag variant
    many: Flag variants
  ru:
    one: Вариант флага
    many: Варианты флага
description:
  en: A flag variant is one of the possible answers of a feature flag, such as on, off or a version name, with optional data that goes with it. The rules decide which variant a caller gets.
  ru: 'Вариант флага — один из возможных ответов флага функции: включён, выключен или имя версии, — с необязательными данными при нём. Правила решают, какой вариант получит вызывающий.'
derives-from:
- feature-flag
