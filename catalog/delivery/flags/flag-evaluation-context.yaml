id: openfeature.evaluation-context
purpose: operations
audience: [developer, platform-devops, operations]
definition: A flag evaluation context is the set of facts about a caller that a feature flag's rules are judged against.
sources:
- https://openfeature.dev/specification/glossary
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Flag evaluation context
    many: Flag evaluation contexts
  ru:
    one: Контекст оценки флага
    many: Контексты оценки флага
description:
  en: 'A flag evaluation context carries what the rules of a feature flag need to know about the caller: a user or account identifier, a country, a plan, a device, a percentage bucket. The same flag can serve different variants to different contexts.'
  ru: 'Контекст оценки флага несёт то, что правилам флага нужно знать о вызывающем: идентификатор пользователя или учётной записи, страну, тариф, устройство, номер процентной группы. Один флаг может давать разные варианты разным контекстам.'
derives-from:
- feature-flag
