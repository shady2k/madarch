id: openfeature.provider
purpose: operations
audience: [developer, platform-devops, operations]
definition: A flag provider is the component that supplies flag definitions and answers evaluations.
sources:
- https://openfeature.dev/specification/glossary
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - defines
  in:
  - defines
template-policy: none
labels:
  en:
    one: Flag provider
    many: Flag providers
  ru:
    one: Поставщик флагов
    many: Поставщики флагов
description:
  en: A flag provider stores the definitions of feature flags and their rules, and answers each request with the variant to serve. It may be a hosted service or a library inside the product, and its answers must be quick and available.
  ru: Поставщик флагов хранит определения флагов функций и их правила и на каждый запрос отвечает, какой вариант выдать. Это может быть внешняя служба или библиотека внутри продукта, и его ответы должны быть быстрыми и доступными.
