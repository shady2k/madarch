id: openfeature.flag-set
purpose: operations
audience: [developer, platform-devops, operations]
definition: A flag set is the collection of feature flags one provider serves for one context.
sources:
- https://openfeature.dev/specification/glossary
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Flag set
    many: Flag sets
  ru:
    one: Набор флагов
    many: Наборы флагов
description:
  en: A flag set gathers the feature flags that apply to one product, one environment or one sales plan, and gives the provider's answers as a whole. It is what a caller usually loads at once.
  ru: Набор флагов собирает флаги функций, относящиеся к одному продукту, одной среде или одному тарифу, и даёт ответы поставщика целиком. Обычно вызывающий загружает его за один раз.
