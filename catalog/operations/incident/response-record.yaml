id: practice.response-record
purpose: history
audience: [operations, platform-devops]
definition: A response record notes what was done during an incident, by whom and when, kept as it happens.
sources:
- https://sre.google/workbook/incident-response/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Response record
    many: Response records
  ru:
    one: Запись о реагировании
    many: Записи о реагировании
description:
  en: 'A response record captures the actions taken while an incident is running: who checked what, which change was tried, what the result was. Written during the event, it becomes the raw material of the timeline and the postmortem.'
  ru: 'Запись о реагировании фиксирует действия во время инцидента: кто что проверил, какое изменение попробовали, что получилось. Сделанная по ходу, она становится основой хронологии и разбора.'
derives-from:
- incident
- person
