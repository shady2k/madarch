id: sre.incident
purpose: operations
audience: [operations, platform-devops]
definition: An incident is an unplanned event or condition that degrades or threatens a service and needs a coordinated response.
sources:
- https://sre.google/workbook/postmortem-culture/
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  - hasPart
  in:
  - affects
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: What the incident was, in one line, such as Checkout stopped answering; it is the incident's key.
- name: started_at
  type: timestamp
  nullable: true
  binding:
    agent: When the incident began.
- name: detected_at
  type: timestamp
  nullable: true
  binding:
    agent: When the product or its people noticed it.
- name: acknowledged_at
  type: timestamp
  nullable: true
  binding:
    agent: When someone took it up.
- name: mitigated_at
  type: timestamp
  nullable: true
  binding:
    agent: When the service was restored.
- name: resolved_at
  type: timestamp
  nullable: true
  binding:
    agent: When the incident was closed.
- name: severity
  type: text
  nullable: true
  binding:
    agent: How bad it was, in the words the product grades its incidents by.
- name: summary
  type: text
  nullable: true
  binding:
    agent: What happened and why, in two or three sentences, from the documents and the changes the graph holds.
key:
- name
labels:
  en:
    one: Incident
    many: Incidents
  ru:
    one: Инцидент
    many: Инциденты
description:
  en: An incident is an unplanned interruption of a service, a drop in its quality, or an event that may cause one. It is tracked from detection to resolution, and a later review records what happened, what helped and what should change.
  ru: Инцидент — незапланированный перерыв в работе сервиса, падение его качества или событие, которое может к этому привести. Его ведут с момента обнаружения до устранения, а позже разбор записывает, что произошло, что помогло и что стоит изменить.
derives-from:
- code.service
