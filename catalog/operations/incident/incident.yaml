id: sre.incident
purpose: operations
audience: [operations, platform-devops]
definition: An incident is an unplanned event or condition that degrades or threatens a service and needs a coordinated response.
sources:
- https://sre.google/workbook/postmortem-culture/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Incident
    many: Incidents
  ru:
    one: Инцидент
    many: Инциденты
description:
  en: An incident is an unplanned interruption of a service, a drop in its quality, or an event that may cause one. It is tracked from detection to resolution, and a later review records what happened, what helped and what should change.
  ru: Инцидент — незапланированный перерыв в работе сервиса, падение его качества или событие, которое может к этому привести. Его ведут с момента обнаружения до устранения, а позже разбор записывает, что произошло, что помогло и что стоит изменить.
