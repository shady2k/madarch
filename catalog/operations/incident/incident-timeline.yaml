id: practice.incident-timeline
purpose: history
audience: [operations, platform-devops]
definition: 'An incident timeline is the ordered times of an incident: detection, acknowledgement, mitigation and resolution.'
sources:
- https://sre.google/workbook/postmortem-culture/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Incident timeline
    many: Incident timelines
  ru:
    one: Хронология инцидента
    many: Хронологии инцидента
description:
  en: 'An incident timeline puts the moments of an incident in order: when it began, when it was noticed, when someone responded, when it was mitigated and when it ended. The gaps between them show where the response was slow.'
  ru: 'Хронология инцидента выстраивает его моменты по порядку: когда начался, когда заметили, когда кто-то отреагировал, когда смягчили и когда закончился. Промежутки между ними показывают, где ответ был медленным.'
