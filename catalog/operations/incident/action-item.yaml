id: sre.action-item
purpose: quality
audience: [operations, platform-devops]
definition: An action item is a piece of work a postmortem asks for, with its owner and how it is tracked.
sources:
- https://sre.google/workbook/postmortem-culture/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Action item
    many: Action items
  ru:
    one: Действие по разбору
    many: Действия по разбору
description:
  en: 'An action item is one change a review of an incident or a near miss asks for: fix the cause, add a check, change a rule. It has an owner and a date, and its completion is tracked like any other work.'
  ru: 'Действие по разбору — одно изменение, которое требует разбор инцидента или его предотвращения: устранить причину, добавить проверку, изменить правило. У него есть владелец и срок, а выполнение ведут как любую другую работу.'
derives-from:
- postmortem
