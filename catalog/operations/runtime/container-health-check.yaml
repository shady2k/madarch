labels:
  en:
    one: Container health check
    many: Container health checks
  ru:
    one: Проверка здоровья контейнера
    many: Проверки здоровья контейнеров
description:
  en: 'A container health check is what a platform runs to learn whether a container works: a command inside it, or a request to an address it serves. The platform repeats it every interval, waits the timeout and acts on the result — restarting the container, holding traffic back or letting it in.'
  ru: 'Проверка здоровья контейнера — то, что платформа запускает, чтобы узнать, работает ли контейнер: команда внутри него или запрос по адресу, который он обслуживает. Платформа повторяет её с заданным интервалом, ждёт таймаут и решает по результату: перезапустить контейнер, не пускать к нему трафик или пустить.'
