description:
  en: A health endpoint answers a simple request with whether the service can serve traffic, and often which dependencies it has reached. A load balancer or a cluster uses it to decide whether to send work.
  ru: Проверка здоровья отвечает на простой запрос тем, может ли сервис обслуживать трафик, и часто — какие зависимости он видит. По ней балансировщик или кластер решает, направлять ли ему работу.
