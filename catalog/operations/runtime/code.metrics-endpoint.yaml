description:
  en: A metrics endpoint exposes the service's current metric values in a form a collector can read, usually on an internal port. It is scraped at intervals, so each reading is a point in the service's history.
  ru: Выдача метрик открывает текущие значения метрик сервиса в виде, который может прочитать сборщик, обычно на внутреннем порту. Её опрашивают через промежутки, поэтому каждое чтение — точка в истории сервиса.

