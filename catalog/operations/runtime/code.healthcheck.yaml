id: practice.compose-healthcheck
purpose: operations
audience: [developer, operations, platform-devops]
definition: A health check is a configured command and timing that a container platform uses to test a service.
sources:
- https://docs.docker.com/compose/
acquisition:
- extractor operations
relation-constraints:
  out:
  - monitors
  in:
  - monitors
template-policy: page
source: graph
details:
- service
- test
- interval
- timeout
- retries
- disable
- startPeriod
- startInterval
labels:
  en:
    one: Healthcheck
    many: Healthchecks
  ru:
    one: Проверка состояния
    many: Проверки состояния
description:
  en: 'A compose health check tells the platform how to test one container: the command, how often, how long to wait and how many failures count. A container that fails becomes unhealthy and may be replaced.'
  ru: 'Проверка состояния compose говорит платформе, как проверять один контейнер: команду, как часто, сколько ждать и сколько отказов считать. Контейнер, не прошедший проверку, становится нездоровым, и его могут заменить.'
