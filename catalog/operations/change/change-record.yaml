id: practice.change-record
purpose: history
audience: [operations, platform-devops]
definition: A change record says what was changed in an environment, when, by whom and with what result.
sources:
- https://dora.dev/guides/dora-metrics/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Change record
    many: Change records
  ru:
    one: Запись об изменении
    many: Записи об изменениях
description:
  en: 'A change record documents one alteration made to a running environment: the request behind it, the steps, the person who did it and whether it worked. It gives later readers a trail when something starts behaving differently.'
  ru: 'Запись об изменении документирует одну правку работающей среды: заявку за ней, шаги, того, кто её сделал, и удалась ли она. Она даёт след, когда что-то начинает вести себя иначе.'
