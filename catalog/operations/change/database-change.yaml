id: practice.database-change
purpose: operations
audience: [operations, platform-devops]
definition: A database change is a change to a database's schema or its data, with the way back if it fails.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/job/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Database change
    many: Database changes
  ru:
    one: Изменение базы данных
    many: Изменения базы данных
description:
  en: A database change alters tables, indexes or rows in a live database, sometimes with a migration that must be reversible. It records what it does, how it is rolled back and what it does to the data while it runs.
  ru: Изменение базы данных меняет таблицы, индексы или строки в работающей базе, иногда миграцией, которую можно отменить. В нём записано, что оно делает, как откатиться и что происходит с данными, пока оно идёт.
