id: practice.maintenance-window
purpose: operations
audience: [operations, platform-devops]
definition: A maintenance window is a period in which the service may be unavailable while work is done on it.
sources:
- https://www.rfc-editor.org/rfc/rfc8594.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Maintenance window
    many: Maintenance windows
  ru:
    one: Окно обслуживания
    many: Окна обслуживания
description:
  en: A maintenance window is an agreed time when a service may be stopped or degraded, announced in advance to the people who use it. Work that cannot be done without a pause is planned into it.
  ru: Окно обслуживания — согласованное время, когда сервис можно остановить или ухудшить, о котором заранее сообщают пользователям. В него планируют работу, которую нельзя сделать без паузы.
