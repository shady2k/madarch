id: practice.on-call-schedule
purpose: operations
audience: [operations, platform-devops]
definition: An on-call schedule says who is answering alerts at which time, and how they are reached.
sources:
- https://sre.google/workbook/on-call/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - assigns
  in:
  - assigns
template-policy: none
labels:
  en:
    one: On-call schedule
    many: On-call schedules
  ru:
    one: График дежурств
    many: Графики дежурств
description:
  en: An on-call schedule assigns periods to people, so someone is always named as the first responder for a service. It rotates the duty and keeps the contact details current.
  ru: График дежурств закрепляет периоды за людьми, чтобы у сервиса всегда был названный первый ответчик. Он чередует дежурство и держит контакты актуальными.
