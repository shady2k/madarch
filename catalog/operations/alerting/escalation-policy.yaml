id: practice.escalation-policy
purpose: operations
audience: [operations, platform-devops]
definition: An escalation policy is the order in which people are told about an unanswered alert, and after how long.
sources:
- https://sre.google/workbook/on-call/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - routesTo
  in:
  - routesTo
template-policy: none
labels:
  en:
    one: Escalation policy
    many: Escalation policies
  ru:
    one: Политика эскалации
    many: Политики эскалации
description:
  en: An escalation policy names who is contacted first, who next and after how long, when an alert is not acknowledged. It makes sure an alert does not wait forever on someone who is asleep.
  ru: Политика эскалации называет, кого извещают первым, кого следующим и через сколько времени, если оповещение не подтвердили. Она не даёт оповещению ждать вечно того, кто спит.
