id: prometheus.alert-rule
purpose: operations
audience: [operations, platform-devops]
definition: An alert rule is a condition over a metric that fires an alert when it holds long enough.
sources:
- https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - measures
  in:
  - monitors
template-policy: none
labels:
  en:
    one: Alert rule
    many: Alert rules
  ru:
    one: Правило оповещения
    many: Правила оповещений
description:
  en: 'An alert rule states when an alert should fire: for example, error rate above one percent for five minutes. The condition and its duration decide whether the alert is worth waking someone for.'
  ru: 'Правило оповещения говорит, когда поднимать оповещение: например, доля ошибок выше процента в течение пяти минут. Условие и его длительность решают, стоит ли будить кого-то из-за этого оповещения.'
