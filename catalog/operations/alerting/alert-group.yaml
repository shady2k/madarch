id: alertmanager.alert-group
purpose: operations
audience: [operations, platform-devops]
definition: An alert group is a set of alerts batched together before they are sent, by the labels they share.
sources:
- https://prometheus.io/docs/alerting/latest/configuration/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Alert group
    many: Alert groups
  ru:
    one: Группа оповещений
    many: Группы оповещений
description:
  en: An alert group collects alerts that share labels and are close in time, so one notification carries them instead of many. Grouping keeps a burst of related failures from flooding the people who must answer.
  ru: Группа оповещений собирает оповещения с общими метками и близкие по времени, чтобы одно сообщение несло их все, а не много сообщений. Группировка не даёт всплеску связанных отказов завалить тех, кто должен отвечать.
derives-from:
- alert-rule
