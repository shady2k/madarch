id: practice.package-manifest
purpose: structure
audience: [developer, architect, platform-devops, security-engineer]
definition: A manifest is a file that declares a package and its dependencies.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/
acquisition:
- extractor operations
relation-constraints:
  out:
  - hasDependencyManifest
  in:
  - partOf
template-policy: page
source: graph
details:
- ecosystem
- name
- version
- module
- goVersion
- private
labels:
  en:
    one: Manifest
    many: Manifests
  ru:
    one: Манифест
    many: Манифесты
description:
  en: 'A manifest names a package, its version and the dependencies it needs, in the form its ecosystem uses: package.json, go.mod, pyproject.toml. It is the starting point from which the exact versions are resolved.'
  ru: 'Манифест называет пакет, его версию и нужные зависимости в форме своей экосистемы: package.json, go.mod, pyproject.toml. С него начинают, чтобы разрешить точные версии.'
