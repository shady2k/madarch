id: practice.package-manifest
purpose: structure
audience: [developer, architect, platform-devops, security-engineer]
definition: A manifest is a file that declares a package and its dependencies.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/
acquisition:
- extractor operations
relation-constraints:
  out:
  - hasDependencyManifest
  - dependsOn
  - partOf
  in:
  - partOf
template-policy: page
source: graph
details:
- ecosystem
- name
- version
- module
- goVersion
- private
fields:
- name: repository
  type: text
  reference: code.repository
  producers:
  - operations
- name: path
  type: path
  labels:
    en: Path
    ru: Путь
  producers:
  - operations
- name: ecosystem
  type: text
  nullable: true
  producers:
  - operations
- name: name
  type: text
  nullable: true
  producers:
  - operations
- name: version
  type: version
  nullable: true
  producers:
  - operations
- name: private
  type: boolean
  nullable: true
  producers:
  - operations
key:
- repository
- path
derives-from:
- code.file
- code.package
labels:
  en:
    one: Manifest
    many: Manifests
  ru:
    one: Манифест
    many: Манифесты
description:
  en: 'A manifest names a package, its version and the dependencies it needs, in the form its ecosystem uses: package.json, go.mod, pyproject.toml. It is the starting point from which the exact versions are resolved.'
  ru: 'Манифест называет пакет, его версию и нужные зависимости в форме своей экосистемы: package.json, go.mod, pyproject.toml. С него начинают, чтобы разрешить точные версии.'
