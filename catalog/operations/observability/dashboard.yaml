id: practice.dashboard
purpose: operations
audience: [developer, operations, platform-devops]
definition: A dashboard is a screen of panels that shows the metrics and logs of one subject over time.
sources:
- https://grafana.com/docs/grafana/latest/dashboards/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Dashboard
    many: Dashboards
  ru:
    one: Панель
    many: Панели
description:
  en: A dashboard arranges panels around one subject — a service, a journey, a business measure — so its state is visible at a glance. It is read during incidents and reviewed to see trends.
  ru: Дашборд располагает панели вокруг одного предмета — сервиса, пути пользователя или бизнес-меры, — чтобы его состояние было видно с одного взгляда. На него смотрят во время инцидентов и возвращаются, чтобы увидеть тенденции.
derives-from:
- code.service
