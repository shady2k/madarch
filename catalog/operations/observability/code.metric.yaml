id: otel.metric-instrument
purpose: operations
audience: [developer, operations, platform-devops]
definition: A metric is a declared counter, gauge or histogram and the code that updates it.
sources:
- https://opentelemetry.io/docs/concepts/signals/metrics/
acquisition:
- extractor code
relation-constraints:
  out:
  - measures
  - partOf
  in:
  - measures
template-policy: page
source: graph
details:
- name
- metricType
- help
- labels
- library
- definitionFormat
- service
fields:
- name: service
  type: text
  reference: code.service
  producers:
  - operations
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  producers:
  - operations
- name: metric_type
  type: text
  nullable: true
  producers:
  - operations
- name: help
  type: text
  nullable: true
  producers:
  - operations
- name: labels
  type: json
  nullable: true
  producers:
  - operations
- name: library
  type: text
  nullable: true
  producers:
  - operations
key:
- service
- name
derives-from:
- code.file
- code.service
labels:
  en:
    one: Metric
    many: Metrics
  ru:
    one: Метрика
    many: Метрики
description:
  en: 'A metric is one measured number a service publishes over time: a counter of requests, a gauge of queue length, a histogram of durations. Its name, its labels and the code that updates it define what can be watched and alerted on.'
  ru: 'Метрика — одно измеряемое число, которое сервис публикует во времени: счётчик запросов, шкала длины очереди, гистограмма длительностей. Её имя, метки и код, который её меняет, задают, за чем можно следить и о чём оповещать.'
