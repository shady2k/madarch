id: otel.log-record
purpose: operations
audience: [developer, operations, platform-devops]
definition: A log record is one entry of what a service did, with its time, its severity and its attributes.
sources:
- https://opentelemetry.io/docs/concepts/signals/logs/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Log record
    many: Log records
  ru:
    one: Запись журнала
    many: Записи журнала
description:
  en: 'A log record is one line a service writes about an event: when it happened, how serious it was, what happened and the context around it. Records are searched together to explain a failure.'
  ru: 'Запись журнала — одна строка, которую сервис пишет о событии: когда оно произошло, насколько серьёзно, что случилось и в каком окружении. Записи ищут вместе, чтобы объяснить сбой.'
derives-from:
- telemetry-pipeline
