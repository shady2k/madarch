id: otel.resource
purpose: operations
audience: [developer, operations, platform-devops]
definition: A telemetry resource is the entity that emitted a piece of telemetry, described by attributes such as service name and host.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Telemetry resource
    many: Telemetry resources
  ru:
    one: Ресурс телеметрии
    many: Ресурсы телеметрии
description:
  en: 'A telemetry resource identifies who produced a metric, a log or a span: the service, its version, the host, the cluster, the environment. These attributes are what let telemetry from many machines be grouped and filtered.'
  ru: 'Ресурс телеметрии называет, кто создал метрику, журнал или интервал: сервис, его версию, хост, кластер, среду. По этим атрибутам телеметрию с многих машин можно группировать и фильтровать.'
