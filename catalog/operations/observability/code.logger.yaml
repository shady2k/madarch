id: practice.logger
purpose: operations
audience: [developer, operations, platform-devops]
definition: A logger is the place where a service sets up its logging.
sources:
- https://opentelemetry.io/docs/concepts/signals/logs/
acquisition:
- extractor code
relation-constraints:
  out:
  - configures
  - partOf
  in:
  - configures
template-policy: page
source: graph
details:
- library
- model
- service
- json
fields:
- name: service
  type: text
  reference: code.service
  producers:
  - operations
- name: file
  type: text
  reference: code.file
  producers:
  - operations
- name: library
  type: text
  nullable: true
  producers:
  - operations
- name: format
  type: text
  nullable: true
  producers:
  - operations
- name: json
  type: boolean
  nullable: true
  producers:
  - operations
key:
- service
- file
derives-from:
- code.service
- code.file
labels:
  en:
    one: Logger
    many: Loggers
  ru:
    one: Логгер
    many: Логгеры
description:
  en: 'A logger is the configuration and the object through which a service writes log records: its level, its format, its destination and its context. It decides what the service tells about itself.'
  ru: 'Логгер — настройка и объект, через которые сервис пишет записи журнала: уровень, формат, назначение и контекст. Он решает, что сервис рассказывает о себе.'
