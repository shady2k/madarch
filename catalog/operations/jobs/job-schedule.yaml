id: practice.job-schedule
purpose: operations
audience: [operations, platform-devops]
definition: A job schedule says when and how often a scheduled job runs, with the limits it runs under.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
acquisition:
- document
- conversation
