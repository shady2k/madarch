template-policy: none
labels:
  en:
    one: Job schedule
    many: Job schedules
  ru:
    one: Расписание задачи
    many: Расписания задачи
description:
  en: 'A job schedule states the times a job runs, such as every night or every five minutes, and the limits around it: how late it may start, how long it may take, what happens to a run still busy at the next time.'
  ru: 'Расписание задачи говорит, когда и как часто выполняется задача: каждую ночь или каждые пять минут, — и её пределы: насколько можно опоздать, сколько можно работать, что делать, если прошлый запуск ещё идёт.'
