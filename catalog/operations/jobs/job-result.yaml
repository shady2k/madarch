id: practice.job-result
purpose: history
audience: [operations, platform-devops]
definition: A job result is what one run of a scheduled job produced or reported.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Job result
    many: Job results
  ru:
    one: Результат задачи
    many: Результаты задачи
description:
  en: 'A job result records the outcome of one scheduled run: what it produced, how many records it handled, and any error it reported. It is the evidence that the timetable did its work.'
  ru: 'Результат задачи записывает итог одного запуска по расписанию: что он создал, сколько записей обработал и какую ошибку сообщил. Это доказательство, что расписание выполнило свою работу.'
