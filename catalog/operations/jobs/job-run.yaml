id: practice.job-run
purpose: history
audience: [operations, platform-devops]
definition: A job run is one execution of a scheduled job, with its result and how long it took.
sources:
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: job
  type: text
  reference: scheduled-job
  binding:
    agent: The scheduled job the run belongs to, by the key of that job in the graph.
- name: started_at
  type: timestamp
  nullable: true
  binding:
    agent: When the run started.
- name: finished_at
  type: timestamp
  nullable: true
  binding:
    agent: When the run ended.
- name: duration
  type: duration-seconds
  nullable: true
  binding:
    agent: How long the run took, in seconds.
- name: result
  type: text
  nullable: true
  binding:
    agent: 'How the run ended: succeeded, failed or skipped.'
- name: output
  type: text
  nullable: true
  binding:
    agent: What the run reported, in the words of its last line of output.
key:
- job
- started_at
labels:
  en:
    one: Job run
    many: Job runs
  ru:
    one: Запуск задачи
    many: Запуски задачи
description:
  en: 'A job run records one execution of a scheduled job: when it started, when it ended, whether it succeeded and what it produced. Comparing runs shows whether the schedule is kept and how the work grows.'
  ru: 'Запуск задачи фиксирует одно выполнение задачи по расписанию: когда началось и закончилось, удачно ли прошло и что создало. Сравнение запусков показывает, соблюдается ли расписание и как растёт работа.'
