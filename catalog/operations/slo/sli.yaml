id: sre.sli
purpose: operations
audience: [operations, platform-devops]
definition: An SLI is a quantitative measure of one aspect of the service as users experience it.
sources:
- https://sre.google/sre-book/service-level-objectives/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: SLI
    many: SLIs
  ru:
    one: SLI
    many: SLI
description:
  en: 'A service level indicator measures one thing users care about, from their side: the share of requests answered quickly, the share that succeeded, the age of the freshest data. It is a number, not a promise.'
  ru: 'SLI измеряет одну сторону сервиса так, как её ощущают пользователи: долю запросов, отвеченных быстро, долю удачных, свежесть данных. Это число, а не обещание.'
derives-from:
- code.service
