id: sre.sla
purpose: operations
audience: [operations, product-lead, analyst]
definition: An SLA is an agreement that states the service level and what happens when it is missed, whether with a user or with another service.
sources:
- https://sre.google/sre-book/service-level-objectives/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: SLA
    many: SLAs
  ru:
    one: SLA
    many: SLA
description:
  en: 'A service level agreement promises a level of service to a customer and states the consequence of missing it: a credit, a penalty, a right to leave. It is the external promise; the internal targets that support it are service level objectives.'
  ru: 'SLA обещает клиенту определённый уровень сервиса и говорит, что будет при его нарушении: скидка, штраф, право уйти. Это внешнее обещание; внутренние цели, которые его поддерживают, — это SLO.'
