id: sre.error-budget-policy
purpose: operations
audience: [operations, platform-devops]
definition: An error budget policy is the rule that says what the team does as the error budget is spent.
sources:
- https://sre.google/workbook/implementing-slos/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Error-budget policy
    many: Error-budget policies
  ru:
    one: Политика бюджета ошибок
    many: Политики бюджета ошибок
description:
  en: 'An error budget policy ties the remaining room for failure to actions: slow down releases, fix reliability first, stop a risky change. It turns a service level objective into a decision rule instead of a number nobody obeys.'
  ru: 'Политика бюджета ошибок связывает оставшийся запас отказов с действиями: замедлить выпуски, сначала заняться надёжностью, остановить рискованное изменение. Она превращает цель уровня сервиса в правило решений, а не в число, которое никто не соблюдает.'
