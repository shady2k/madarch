id: practice.env-definition
purpose: operations
audience: [developer, operations, platform-devops]
definition: An environment definition is a place that gives an environment variable a value.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/
acquisition:
- extractor operations
relation-constraints:
  out:
  - configures
  - partOf
  in:
  - configures
template-policy: page
source: graph
details:
- scope
fields:
- name: place
  type: text
  labels:
    en: Place
    ru: Место
  producers:
  - operations
- name: scope
  type: text
  nullable: true
  producers:
  - operations
- name: value_source
  type: text
  nullable: true
  producers:
  - operations
key:
- place
derives-from:
- code.env-var
- code.file
labels:
  en:
    one: Variable definition
    many: Variable definitions
  ru:
    one: Определение переменной
    many: Определения переменных
description:
  en: 'An environment definition is one place where a variable gets its value for a run: a deployment manifest, a compose file, a shell profile, a secret store. Several definitions of the same name show where configurations can drift.'
  ru: 'Определение переменной — одно место, где переменная получает значение для запуска: манифест развёртывания, файл compose, профиль оболочки, хранилище секретов. Несколько определений одного имени показывают, где настройки могут разойтись.'

key-edges:
