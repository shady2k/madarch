id: practice.env-var
purpose: operations
audience: [developer, operations, platform-devops]
definition: An environment variable is a setting the code reads from its environment, and where it is defined.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/
acquisition:
- extractor operations
relation-constraints:
  out:
  - configures
  in:
  - configures
template-policy: page
source: graph
details:
- required
- default
labels:
  en:
    one: Environment variable
    many: Environment variables
  ru:
    one: Переменная окружения
    many: Переменные окружения
description:
  en: An environment variable is a named value a program reads when it starts, such as a database address, a port or a feature switch. It lets the same program run in several environments without being rebuilt.
  ru: 'Переменная окружения — именованное значение, которое программа читает при запуске: адрес базы данных, порт или переключатель возможности. Она позволяет одной программе работать в разных средах без пересборки.'
