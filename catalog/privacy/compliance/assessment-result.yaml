id: oscal.assessment-result
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: An assessment result is what an assessment found for each control, with the evidence it read.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Assessment result
    many: Assessment results
  ru:
    one: Результат оценки
    many: Результаты оценки
description:
  en: An assessment result records, control by control, whether the system met it and what evidence showed that. A finding can be satisfied, partially satisfied or not satisfied, and each answer points to the evidence behind it.
  ru: Результат оценки по каждому контролю говорит, выполнила ли его система и какие доказательства это показали. Ответ бывает выполненным, частично выполненным или невыполненным, и каждый указывает на доказательства за ним.
