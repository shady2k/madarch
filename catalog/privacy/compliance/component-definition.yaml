id: oscal.component-definition
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A component definition says how one component implements the controls a profile selects, as OSCAL defines it.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - implements
  in:
  - implements
template-policy: none
labels:
  en:
    one: Component definition
    many: Component definitions
  ru:
    one: Определение компонента
    many: Определения компонента
description:
  en: A component definition describes a piece of software once and states which controls it can satisfy and how. Several systems can then reuse it instead of describing the same component again.
  ru: Определение компонента один раз описывает программную часть и говорит, каким контролям она соответствует и как. Разные системы могут затем ссылаться на него, а не описывать тот же компонент заново.
derives-from:
- c4.component
- profile
