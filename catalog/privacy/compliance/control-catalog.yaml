id: oscal.catalog
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A control catalog is an organised collection of controls and their statements, as the NIST OSCAL control layer defines it.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - contains
template-policy: none
labels:
  en:
    one: Control catalogue
    many: Control catalogues
  ru:
    one: Каталог контролей
    many: Каталоги контролей
description:
  en: A control catalog groups controls under families and gives each its statements, parameters and assessment methods. It is the source from which a profile selects the controls that apply to a system.
  ru: Каталог контролей объединяет контроли по семействам и даёт каждому его утверждения, параметры и методы оценки. Из него профиль выбирает контроли, которые относятся к системе.
derives-from:
- product
