description:
  en: A control states one safeguard or one requirement, such as who may access data or how it is encrypted, and splits it into statements and parameters that a system can meet and an assessor can check. Assessment methods say what evidence counts.
  ru: 'Контроль формулирует одну меру защиты или одно требование: кто имеет доступ к данным или как их шифруют, — и делит его на утверждения и параметры, которым система может соответствовать, а оценщик — проверить. Методы оценки говорят, какие доказательства считаются.'
