id: oscal.system-security-plan
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A system security plan binds a system to a profile, its controls and the way they are implemented.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - documents
template-policy: none
labels:
  en:
    one: System security plan
    many: System security plans
  ru:
    one: План безопасности системы
    many: Планы безопасности системы
description:
  en: A system security plan describes a system, the profile it must meet, and for each control how the system implements it and what evidence shows that. It is the main document an assessor reads before testing the system.
  ru: План безопасности системы описывает систему, профиль, которому она должна соответствовать, и по каждому контролю — как система его выполняет и какие доказательства это показывают. Это главный документ, который оценщик читает перед проверкой.
derives-from:
- profile
- software-system
