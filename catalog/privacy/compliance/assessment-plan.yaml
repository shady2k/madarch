id: oscal.assessment-plan
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: An assessment plan says what is to be assessed, how and by whom, as OSCAL's assessment layer defines it.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - contains
  in:
  - documents
template-policy: none
labels:
  en:
    one: Assessment plan
    many: Assessment plans
  ru:
    one: План оценки
    many: Планы оценки
description:
  en: 'An assessment plan sets out the checks a system will undergo: which controls are examined, which methods are used, who carries them out and when. It is the agreement that makes an assessment repeatable and comparable.'
  ru: 'План оценки задаёт проверки, которые пройдёт система: какие контроли рассматривают, какими методами, кто их выполняет и когда. Это договорённость, благодаря которой оценка становится повторимой и сравнимой.'
