id: oscal.poam
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: 'A plan of action and milestones is the plan for the weaknesses an assessment found: what will be fixed, by whom and by when.'
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Plan of action and milestones
    many: Plans of action and milestones
  ru:
    one: План действий и вех
    many: Планы действий и вех
description:
  en: A plan of action and milestones lists each weakness an assessment found, the fix planned for it, the person responsible and the date. It is how an organisation tracks the gap between what a control requires and what the system does.
  ru: План действий и вех перечисляет каждую слабость, найденную оценкой, запланированное исправление, ответственного и срок. По нему организация следит за разрывом между тем, что требует контроль, и тем, что делает система.
