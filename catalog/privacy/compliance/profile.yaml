id: oscal.profile
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A profile is a selection of controls from one or more catalogs, adapted to a purpose, as OSCAL defines it.
sources:
- https://pages.nist.gov/OSCAL/learn/concepts/layer/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Profile
    many: Profiles
  ru:
    one: Профиль
    many: Профили
description:
  en: A profile chooses the controls a system, an organisation or a market must meet from one or more catalogs, and may tailor them by adding, removing or tightening requirements. It is what an assessment is made against.
  ru: 'Профиль выбирает из одного или нескольких каталогов контроли, которым должна соответствовать система, организация или рынок, и может их приспособить: добавить, убрать или ужесточить требования. По нему и проводят оценку.'
