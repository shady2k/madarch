id: gdpr.transfer
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A transfer is a sending of personal data to another country or an international organisation, with the safeguard that makes it lawful.
sources:
- https://gdpr-info.eu/art-30-gdpr/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Transfer
    many: Transfers
  ru:
    one: Передача
    many: Передачи
description:
  en: A transfer sends personal data outside the country or to an international organisation, where different law may apply. It is allowed only with a safeguard such as an adequacy decision, standard contractual clauses or the person's explicit consent.
  ru: 'Передача отправляет персональные данные в другую страну или международную организацию, где может действовать иное право. Она допустима только с гарантией: решением о достаточной защите, типовыми договорными условиями или явным согласием человека.'
derives-from:
- processing-activity
- recipient
