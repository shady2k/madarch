id: gdpr.consent
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: Consent is a person's freely given agreement to the processing of their personal data, which they may withdraw.
sources:
- https://gdpr-info.eu/art-7-gdpr/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Consent
    many: Consents
  ru:
    one: Согласие
    many: Согласия
description:
  en: Consent is a clear, informed and voluntary yes from a person to one or more uses of their personal data. It must be as easy to withdraw as to give, and the processing may continue only while it stands.
  ru: Согласие — ясное, осознанное и добровольное разрешение человека на одно или несколько использований его персональных данных. Отозвать его должно быть так же просто, как дать, и обработка возможна, только пока оно действует.
