id: gdpr.recipient
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A recipient is a party that personal data is shared with, and the ground on which it is shared.
sources:
- https://gdpr-info.eu/art-30-gdpr/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Recipient
    many: Recipients
  ru:
    one: Получатель
    many: Получатели
description:
  en: A recipient is a person or an organisation outside the processing activity that receives personal data, such as a delivery service, a bank or a public body. The record says what is shared and on which legal ground.
  ru: 'Получатель — человек или организация вне действия обработки, которым передают персональные данные: служба доставки, банк или государственный орган. В записи сказано, что именно передают и на каком правовом основании.'
