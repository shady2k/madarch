id: gdpr.data-subject-category
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A data-subject category is a kind of person whose personal data is processed, such as a customer or an employee.
sources:
- https://gdpr-info.eu/art-30-gdpr/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Data-subject category
    many: Data-subject categories
  ru:
    one: Категория субъектов данных
    many: Категории субъектов данных
description:
  en: 'A data-subject category groups people whose personal data is processed for the same reason and under the same rules: customers, employees, applicants, children. It helps an organisation see whose data it holds and what it owes them.'
  ru: 'Категория субъектов данных объединяет людей, чьи персональные данные обрабатывают по одной причине и по одним правилам: клиентов, сотрудников, соискателей, детей. Она помогает организации видеть, чьи данные у неё есть и что она им должна.'
