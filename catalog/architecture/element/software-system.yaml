id: c4.software-system
purpose: structure
audience: [architect, developer, analyst]
definition: A software system is a system that delivers value to its users, described from outside, as C4 defines it.
sources:
- https://c4model.com/abstractions
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - partOf
  in:
  - hasPart
template-policy: none
labels:
  en:
    one: Software system
    many: Software systems
  ru:
    one: Программная система
    many: Программные системы
description:
  en: 'A software system is the whole product or service a person or another system uses, seen from outside: what it does for them, not how it is built. C4 places it at the top, with its users and the other systems it talks to around it.'
  ru: 'Программная система — весь продукт или сервис, которым пользуется человек или другая система, увиденный снаружи: что он для них делает, а не как устроен. C4 ставит её наверх, а вокруг неё — пользователей и другие системы, с которыми она общается.'
