id: uml.state
purpose: structure
audience: [architect, developer, analyst]
definition: A state is one situation a state machine can hold for a while, with the conditions that are true in it.
sources:
- https://www.omg.org/spec/UML/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  - constrains
  in:
  - hasPart
template-policy: member
source: graph
fields:
- name: machine
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-state-machine:v1
  reference: state-machine
  binding:
    agent: The state machine the state belongs to, by the key of that machine in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the machine gives the state, such as open or closed.
- name: label
  type: text
  nullable: true
  binding:
    agent: The words a reader sees for the state, where they differ from its name.
- name: initial
  type: boolean
  nullable: true
  binding:
    agent: Whether the machine starts in this state.
- name: final
  type: boolean
  nullable: true
  binding:
    agent: Whether this state ends the life the machine describes.
key:
- machine
- name
derives-from:
- code.symbol
member:
  relation: partOf
  direction: out
  parentKind: state-machine
labels:
  en:
    one: State
    many: States
  ru:
    one: Состояние
    many: Состояния
description:
  en: A state is one of the situations a thing can be in for a period, such as unpaid, shipped or closed, and the conditions that hold while it is there. Staying in it, leaving it and what may happen during it are defined by the machine.
  ru: 'Состояние — одна из ситуаций, в которых вещь может находиться некоторое время: не оплачено, отправлено или закрыто, — и условия, которые в ней верны. Машина задаёт, как в него приходят, как из него выходят и что во время него может произойти.'
