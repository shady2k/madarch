id: uml.state-machine
purpose: structure
audience: [architect, developer, analyst]
definition: A state machine is the set of states a thing can be in and the transitions between them, as UML defines them.
sources:
- https://www.omg.org/spec/UML/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  - defines
  in:
  - defines
  - partOf
  - constrains
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the code or the document gives this machine, such as FillRun or Task life cycle; it is the machine's key.
- name: subject
  type: json
  nullable: true
  reference: domain-entity
  binding:
    agent: The domain entity whose life the states describe, by the key of that entity in the graph.
- name: lifecycle_of
  type: text
  nullable: true
  binding:
    agent: The name of the kind whose entities this machine gives the life cycle of, where the machine is a kind's workflow rather than one entity's states.
- name: description
  type: text
  nullable: true
  binding:
    agent: What the machine holds and what it governs, in one or two sentences, from the states and transitions it has in the graph.
key:
- name
derives-from:
- domain-entity
labels:
  en:
    one: State machine
    many: State machines
  ru:
    one: Конечный автомат
    many: Конечные автоматы
description:
  en: A state machine describes one object's life as a limited set of states and the moves between them, each move caused by an event and guarded by a condition. UML state machines are the common way to draw and specify one.
  ru: Конечный автомат описывает жизнь объекта как ограниченный набор состояний и переходов между ними, где каждый переход вызван событием и ограничен условием. Конечные автоматы UML — обычный способ нарисовать и задать такой.
