id: bpmn.gateway
purpose: structure
audience: [architect, developer, analyst]
definition: A process gateway is a BPMN point where a process branches into several paths or joins them again, by a condition or an event.
sources:
- https://www.omg.org/spec/BPMN/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: member
source: graph
fields:
- name: process
  type: json
  reference: business-process
  binding:
    agent: The business process the gateway stands in, by the key of that process in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the process gives this branch point, such as Amount within the limit.
- name: type
  type: text
  nullable: true
  binding:
    agent: 'Which kind of gateway it is: exclusive, parallel, inclusive or event-based, as the process states it.'
- name: condition
  type: text
  nullable: true
  binding:
    agent: The condition that decides which way the process goes, where the gateway states one.
key:
- process
- name
member:
  relation: partOf
  direction: out
  parentKind: business-process
labels:
  en:
    one: Process gateway
    many: Process gateways
  ru:
    one: Шлюз процесса
    many: Шлюзы процесса
description:
  en: 'A process gateway is a decision point in a BPMN process: the flow either splits into paths chosen by conditions, or several paths meet and continue as one. It shows where the process can go differently.'
  ru: 'Шлюз процесса — точка решения в процессе BPMN: поток либо разделяется на пути по условиям, либо несколько путей сходятся и продолжаются одним. Он показывает, где процесс может пойти по-разному.'
derives-from:
- business-process
