id: bpmn.process
purpose: structure
audience: [architect, developer, analyst]
definition: A process model is a business process drawn in BPMN, with its tasks, events and gateways.
sources:
- https://www.omg.org/spec/BPMN/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - defines
template-policy: none
labels:
  en:
    one: Process model
    many: Process models
  ru:
    one: Модель процесса
    many: Модели процессов
description:
  en: A process model is a diagram and its definition of how a business process runs, in the notation BPMN gives for tasks, events, gateways and the sequence between them. It can be read by people and run by a process system.
  ru: Модель процесса — схема и её описание того, как идёт бизнес-процесс, в нотации BPMN для задач, событий, шлюзов и порядка между ними. Её читают люди, и её может исполнять система процессов.
