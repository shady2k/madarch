id: uml.transition
purpose: structure
audience: [architect, developer, analyst]
definition: A transition is a move from one state to another, caused by an event and allowed by a condition.
sources:
- https://www.omg.org/spec/UML/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  - triggers
  in:
  - partOf
template-policy: member
source: graph
fields:
- name: machine
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-state-machine:v1
  reference: state-machine
  binding:
    agent: The state machine the transition belongs to, by the key of that machine in the graph.
- name: from
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-state:v1
  reference: state
  binding:
    agent: The state the move leaves, by its key.
- name: to
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-state:v1
  reference: state
  binding:
    agent: The state the move enters, by its key.
- name: event
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-state-event:v1
  nullable: true
  reference: state-event
  binding:
    agent: The event that causes the move, where the machine names one.
- name: guard
  type: text
  nullable: true
  binding:
    agent: The condition that must hold for the move to happen, as the code or the document states it.
key:
- machine
- from
- to
derives-from:
- code.symbol
member:
  relation: partOf
  direction: out
  parentKind: state-machine
labels:
  en:
    one: Transition
    many: Transitions
  ru:
    one: Переход
    many: Переходы
description:
  en: A transition says that when a named event occurs and a guard holds, the thing leaves one state and enters another, often running an action on the way. It is the arrow between two states in a state machine.
  ru: Переход говорит, что при наступлении названного события и выполнении условия вещь покидает одно состояние и входит в другое, часто выполняя действие по пути. Это стрелка между двумя состояниями в конечном автомате.
