id: arc42.crosscutting-concept
purpose: understand
audience: [architect, analyst, developer]
definition: A crosscutting concept is arc42's view of a principle or a pattern that applies across building blocks, such as logging or persistence.
sources:
- https://arc42.org/overview
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - appliesTo
  in:
  - appliesTo
template-policy: none
labels:
  en:
    one: Cross-cutting concept
    many: Cross-cutting concepts
  ru:
    one: Сквозное понятие
    many: Сквозные понятия
description:
  en: 'A crosscutting concept describes one concern that many parts of the system share and must handle the same way: logging, error handling, security, persistence, internationalisation. arc42 collects them so the same problem is not solved differently in each part.'
  ru: 'Сквозное понятие описывает заботу, которую делят многие части системы и должны решать одинаково: журналирование, обработку ошибок, безопасность, хранение, переводы. arc42 собирает их, чтобы одну задачу не решали по-разному в каждой части.'
