description:
  en: A deployment view shows the technical infrastructure — environments, nodes, networks — and which building blocks run on which node, as arc42's chapter 7 asks. It answers where the software actually executes and how the parts reach each other.
  ru: Представление развёртывания показывает техническую инфраструктуру — среды, узлы, сети — и то, какие строительные блоки работают на каком узле, как требует глава 7 arc42. Оно отвечает, где на самом деле исполняется программа и как части достают друг друга.
