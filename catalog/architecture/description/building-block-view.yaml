id: arc42.building-block-view
purpose: understand
audience: [architect, analyst, developer]
definition: A building-block view is arc42's picture of the system's static building blocks and the relations between them.
sources:
- https://arc42.org/overview
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - documents
  in:
  - documents
template-policy: none
labels:
  en:
    one: Building-block view
    many: Building-block views
  ru:
    one: Представление строительных блоков
    many: Представления строительных блоков
description:
  en: A building-block view shows the system as parts inside parts — systems, containers, components — and how they relate, as arc42's chapter 5 asks. It is the structural view a reader uses to find where a piece of behaviour lives.
  ru: Представление строительных блоков показывает систему как части внутри частей — системы, контейнеры, компоненты — и связи между ними, как требует глава 5 arc42. Это структурное представление, по которому читатель находит, где живёт поведение.
