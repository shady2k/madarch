id: c4.infrastructure-node
purpose: operations
audience: [architect, operations, platform-devops]
definition: An infrastructure node is a node that supports a deployment without running the product's software itself, such as a load balancer or a DNS zone.
sources:
- https://c4model.com/diagrams/deployment
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Infrastructure node
    many: Infrastructure nodes
  ru:
    one: Инфраструктурный узел
    many: Инфраструктурные узлы
description:
  en: 'An infrastructure node is a piece of infrastructure that a deployment relies on but that runs none of the product''s own code: a load balancer, a DNS zone, a firewall. If it fails, the software may keep running but become unreachable.'
  ru: 'Инфраструктурный узел — часть инфраструктуры, на которую опирается развёртывание, но которая не исполняет собственный код продукта: балансировщик, зона DNS, межсетевой экран. При его отказе программа может работать, но стать недоступной.'
derives-from:
- deployment-environment
