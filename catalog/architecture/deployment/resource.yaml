id: backstage.resource
purpose: operations
audience: [architect, operations, platform-devops]
definition: A resource is infrastructure a component needs at runtime, such as a database, a topic or a bucket.
sources:
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Resource
    many: Resources
  ru:
    one: Ресурс
    many: Ресурсы
description:
  en: 'A resource is an outside facility a component uses while it runs: a database, a queue, a bucket, a cache or a certificate. It is provisioned and configured separately from the component, and the component depends on its availability.'
  ru: 'Ресурс — внешнее средство, которое компонент использует во время работы: база данных, очередь, бакет, кэш или сертификат. Его создают и настраивают отдельно от компонента, и компонент зависит от его доступности.'
