id: c4.deployment-node
purpose: operations
audience: [architect, operations, platform-devops]
definition: A deployment node is the place where a running instance of a software system or container executes, such as a server, a virtual machine or a cluster.
sources:
- https://c4model.com/diagrams/deployment
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasHost
  in:
  - hasHost
template-policy: none
labels:
  en:
    one: Deployment node
    many: Deployment nodes
  ru:
    one: Узел развёртывания
    many: Узлы развёртывания
description:
  en: 'A deployment node is a piece of infrastructure on which running software executes: a physical server, a virtual machine, a container, a cluster or an execution environment such as a database server. Nodes nest, so a container may run on a virtual machine that itself runs in a cluster.'
  ru: 'Узел развёртывания — часть инфраструктуры, на которой работает программа: физический сервер, виртуальная машина, контейнер, кластер или среда выполнения вроде сервера баз данных. Узлы вкладываются друг в друга: контейнер может работать на виртуальной машине, а та — в кластере.'
derives-from:
- deployment-environment
