id: practice.technology
purpose: structure
audience: [architect, developer, analyst]
definition: A technology is a language, framework, runtime or platform the product builds on.
sources:
- https://endoflife.date/
acquisition:
- document
- agent-from-graph
relation-constraints:
  out:
  - dependsOn
  - partOf
  in:
  - dependsOn
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the technology is known by, such as Bun, PostgreSQL or Kubernetes; it is the technology's key.
- name: version
  type: version
  nullable: true
  binding:
    agent: The version the product requires, where the documents or the code state one.
- name: purpose
  type: text
  nullable: true
  binding:
    agent: What the product builds on it for, in one sentence, from the modules and the documents that name it in the graph.
key:
- name
derives-from:
- product-profile
labels:
  en:
    one: Technology
    many: Technologies
  ru:
    one: Технология
    many: Технологии
description:
  en: 'A technology is one tool the product''s software is made with or runs on: a programming language, a framework, a database, a runtime or a cloud platform. Its version and support dates matter because they decide what the product can rely on and when it must move.'
  ru: 'Технология — средство, которым сделана или на котором работает программа продукта: язык программирования, каркас, база данных, среда выполнения или облачная платформа. Её версия и сроки поддержки важны, потому что от них зависит, на что продукт может опираться и когда ему нужно переезжать.'
