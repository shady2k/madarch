  ru:
    one: Технология
    many: Технологии
description:
  en: 'A technology is one tool the product''s software is made with or runs on: a programming language, a framework, a database, a runtime or a cloud platform. Its version and support dates matter because they decide what the product can rely on and when it must move.'
  ru: 'Технология — средство, которым сделана или на котором работает программа продукта: язык программирования, каркас, база данных, среда выполнения или облачная платформа. Её версия и сроки поддержки важны, потому что от них зависит, на что продукт может опираться и когда ему нужно переезжать.'
