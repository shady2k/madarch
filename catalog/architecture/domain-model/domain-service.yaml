id: ddd.domain-service
purpose: structure
audience: [architect, developer, analyst]
definition: A domain service is an operation of the domain that belongs to no entity or value object.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Domain service
    many: Domain services
  ru:
    one: Служба предметной области
    many: Службы предметной области
description:
  en: A domain service carries an operation that needs several domain objects and does not naturally belong to one of them, such as transferring money between accounts. It holds domain logic without holding state.
  ru: 'Служба предметной области несёт операцию, которой нужны несколько объектов и которая не принадлежит естественно ни одному из них: перевод денег между счетами. Она держит логику предметной области, но не состояние.'
