id: ddd.context-map
purpose: structure
audience: [architect, developer, analyst]
definition: A context map is the picture of the bounded contexts of a domain and the relationships between them.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - contains
template-policy: none
labels:
  en:
    one: Context map
    many: Context maps
  ru:
    one: Карта контекстов
    many: Карты контекстов
description:
  en: A context map places the bounded contexts of a domain side by side and draws the relationships between them, as domain-driven design recommends. It shows where the model changes meaning and which teams must agree.
  ru: Карта контекстов располагает ограниченные контексты предметной области рядом и показывает связи между ними, как советует предметно-ориентированное проектирование. По ней видно, где модель меняет смысл и каким командам нужно договариваться.
