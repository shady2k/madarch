id: ddd.entity
purpose: structure
audience: [architect, developer, analyst]
definition: A domain entity is an object of the domain with an identity of its own, which persists through change.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the domain gives this thing, such as Order or Invoice; it is the entity's key.
- name: description
  type: text
  nullable: true
  binding:
    agent: What the entity is and what keeps it distinct, in one or two sentences, from the glossary terms and the modules that use it in the graph.
key:
- name
derives-from:
- domain
labels:
  en:
    one: Domain entity
    many: Domain entities
  ru:
    one: Сущность предметной области
    many: Сущности предметной области
description:
  en: A domain entity is a thing the business cares about that keeps its identity while its attributes change, such as a customer or an order. Two entities are the same only if their identities match, not their values.
  ru: 'Сущность предметной области — то, что важно для бизнеса и сохраняет свою идентичность при изменении атрибутов: клиент или заказ. Две сущности одинаковы, только если совпадают их идентификаторы, а не значения.'
