id: ddd.repository
purpose: structure
audience: [architect, developer, analyst]
definition: A domain repository is an interface that gives the rest of the domain model access to aggregates of one type, as if they were a collection.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Domain repository
    many: Domain repositories
  ru:
    one: Репозиторий предметной области
    many: Репозитории предметной области
description:
  en: 'A domain repository hides where aggregates of one type come from and go to, and offers them as a collection a domain expert recognises: add one, find one by identity, list some. It belongs to the domain model, unlike a version control repository, which stores source files and their history.'
  ru: 'Репозиторий предметной области скрывает, откуда берутся и куда сохраняются агрегаты одного типа, и предоставляет их как коллекцию: добавить, найти по идентификатору, получить список. Он относится к модели предметной области, в отличие от репозитория системы контроля версий, который хранит исходные файлы и их историю.'
