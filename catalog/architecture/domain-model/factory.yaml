id: ddd.factory
purpose: structure
audience: [architect, developer, analyst]
definition: A factory is a domain object that builds aggregates or other complex objects.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Factory
    many: Factories
  ru:
    one: Фабрика
    many: Фабрики
description:
  en: A factory creates complex domain objects or whole aggregates in one step, hiding how their parts are assembled and which rules must hold at creation. Callers get a valid object instead of building it piece by piece.
  ru: Фабрика создаёт сложные объекты предметной области или целые агрегаты за один шаг, скрывая, как собраны их части и какие правила должны выполняться при создании. Вызывающий получает готовый правильный объект, а не собирает его по частям.
