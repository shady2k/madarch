id: ddd.value-object
purpose: structure
audience: [architect, developer, analyst]
definition: A value object is a domain value defined by its attributes, without an identity of its own.
sources:
- https://www.domainlanguage.com/ddd/reference/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: none
labels:
  en:
    one: Value object
    many: Value objects
  ru:
    one: Объект-значение
    many: Объекты-значения
description:
  en: 'A value object is a domain concept whose equality comes from its values: an amount of money, a date range, an address. Two value objects with the same attributes are interchangeable, and they are usually kept immutable.'
  ru: 'Объект-значение — понятие предметной области, равенство которого определяется его значениями: сумма денег, промежуток дат, адрес. Два объекта-значения с одинаковыми атрибутами взаимозаменяемы, и обычно их не меняют после создания.'
derives-from:
- bounded-context
