id: practice.integration
purpose: structure
audience: [architect, developer, analyst]
definition: An integration is a configured link between two systems, with the protocol and the data it carries.
sources:
- https://c4model.com/abstractions
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Integration
    many: Integrations
  ru:
    one: Интеграция
    many: Интеграции
description:
  en: 'An integration is the working connection between the product and another system: which protocol is used, which address, which credentials and which data crosses. It is the concrete arrangement behind an external interface.'
  ru: 'Интеграция — работающее соединение продукта с другой системой: какой протокол, какой адрес, какие учётные данные и какие данные через него идут. Это конкретное устройство за внешним интерфейсом.'
