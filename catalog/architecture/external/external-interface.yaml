id: practice.external-interface
purpose: structure
audience: [architect, developer, analyst]
definition: An external interface is an interface that a supplier or an outside system offers to the product, as arc42's context view states it.
sources:
- https://arc42.org/overview
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - consumesApi
  in:
  - providesApi
template-policy: none
labels:
  en:
    one: External interface
    many: External interfaces
  ru:
    one: Внешний интерфейс
    many: Внешние интерфейсы
description:
  en: 'An external interface is one point where the product and an outside system exchange something: a called API, a received webhook, a shared file, a message queue. The context view names each interface and what crosses it.'
  ru: 'Внешний интерфейс — точка, где продукт и внешняя система обмениваются чем-то: вызываемый API, полученный вебхук, общий файл или очередь сообщений. Контекстное представление называет каждый интерфейс и то, что через него проходит.'
