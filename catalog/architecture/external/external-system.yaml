id: c4.external-system
purpose: structure
audience: [architect, developer, analyst]
definition: An external system is a software system outside the product's scope that the product communicates with.
sources:
- https://c4model.com/abstractions
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - c4.uses
  in:
  - c4.uses
template-policy: none
labels:
  en:
    one: External system
    many: External systems
  ru:
    one: Внешняя система
    many: Внешние системы
description:
  en: 'An external system is another organisation''s or team''s software that the product depends on or serves: a payment provider, a tax service, a customer''s own system. The product does not control it, so its behaviour is a given constraint.'
  ru: 'Внешняя система — программа другой организации или команды, от которой продукт зависит или которую обслуживает: платёжный провайдер, налоговая служба или система клиента. Продукт ею не управляет, поэтому её поведение — заданное ограничение.'
