id: practice.saas-service
purpose: structure
audience: [architect, developer, analyst]
definition: A software service is software a supplier runs for the product, reached over an interface.
sources:
- https://c4model.com/abstractions
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - c4.uses
  in:
  - c4.uses
template-policy: none
labels:
  en:
    one: SaaS service
    many: SaaS services
  ru:
    one: Сервис SaaS
    many: Сервисы SaaS
description:
  en: 'A software service is a ready-made application a supplier operates, which the product uses over the network: a mail service, a CRM, a payment system. The product does not install or run it, only calls it.'
  ru: 'Сервис SaaS — готовая программа, которую эксплуатирует поставщик, а продукт использует по сети: почтовая служба, CRM или платёжная система. Продукт её не устанавливает и не запускает, а только обращается к ней.'
