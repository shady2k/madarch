id: practice.tracker-task
purpose: history
audience: [developer, product, product-lead, tester]
definition: A tracker task is an item in an issue tracker that commit messages name, which ties work and code together.
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- extractor history
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: page
source: graph
origin: history
history: task
labels:
  en:
    one: Task
    many: Tasks
  ru:
    one: Задача
    many: Задачи
description:
  en: A tracker task is a work item in an issue tracker, such as a ticket or a bug report, that commit messages refer to by its key. The reference connects the change in the repository with the work that asked for it.
  ru: Задача трекера — рабочий элемент в системе учёта задач, например тикет или сообщение об ошибке, на который ссылаются сообщения коммитов по его ключу. Ссылка связывает изменение в репозитории с работой, которая его потребовала.
