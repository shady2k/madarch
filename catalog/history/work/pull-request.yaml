id: otel.vcs-change-request
purpose: history
audience: [developer, architect, product-lead]
definition: A pull request is a proposed change to a repository, holding its commits and the review it received.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - contains
  in:
  - contains
template-policy: none
labels:
  en:
    one: Pull request
    many: Pull requests
  ru:
    one: Запрос на слияние
    many: Запросы на слияние
description:
  en: A pull request asks that the commits of a branch be merged into another branch and shows the difference between them. It holds the discussion and the review of the change, so people can agree on it before it lands.
  ru: Запрос на слияние предлагает влить коммиты одной ветки в другую и показывает разницу между ними. В нём идёт обсуждение и просмотр изменения, чтобы люди договорились о нём до слияния.
