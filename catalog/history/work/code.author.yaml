id: practice.commit-author
purpose: history
audience: [developer, architect, product-lead]
definition: An author is the person named as having made a commit.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- extractor history
relation-constraints:
  out:
  - assigns
  in:
  - assigns
template-policy: page
source: graph
fields:
- name: name
  type: recorded-identity
  producers:
  - git
- name: email
  type: recorded-identity
  producers:
  - git
key:
- name
- email
origin: history
history: author
labels:
  en:
    one: Author
    many: Authors
  ru:
    one: Автор
    many: Авторы
description:
  en: An author is the person a commit names as the one who wrote the change, with an address and a date. The author is not always the person who submitted the commit, so both are recorded.
  ru: Автор — человек, которого коммит называет сделавшим изменение, с адресом и датой. Автор не всегда тот, кто отправил коммит, поэтому записывают обоих.
derives-from:
- code.commit
