id: practice.commit
purpose: history
audience: [developer, architect, product-lead]
definition: A commit is one recorded change to a repository, with its author, its message and the files it touched.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- extractor history
relation-constraints:
  out:
  - contains
  in:
  - partOf
evidence:
  immutable: true
  digestField: hash
template-policy: page
source: graph
fields:
- name: hash
  type: text
  producers:
  - git
- name: algorithm
  type: text
  nullable: true
  producers:
  - git
- name: subject
  type: text
  nullable: true
  producers:
  - git
- name: author_date
  type: timestamp
  nullable: true
  producers:
  - git
- name: author_offset_min
  type: integer
  nullable: true
  producers:
  - git
- name: commit_date
  type: timestamp
  nullable: true
  producers:
  - git
- name: commit_offset_min
  type: integer
  nullable: true
  producers:
  - git
key:
- hash
origin: history
history: commit
details:
- author
- authorEmail
- subject
- authoredAt
- committedAt
- merge
- mergedBranch
labels:
  en:
    one: Commit
    many: Commits
  ru:
    one: Коммит
    many: Коммиты
description:
  en: 'A commit records one change to the files of a repository: who made it, when, what changed and usually why, in the commit message. Git identifies each commit by a hash and lets a reader see the state of the whole repository at that moment.'
  ru: 'Коммит фиксирует одно изменение файлов репозитория: кто и когда его сделал, что изменилось и обычно почему — в сообщении коммита. Git обозначает каждый коммит хешем и позволяет увидеть состояние всего репозитория на этот момент.'
derives-from:
- code.file
- code.repository
