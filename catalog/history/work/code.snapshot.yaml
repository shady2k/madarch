id: practice.repository-landmark
purpose: history
audience: [developer, architect, product-lead]
definition: 'A repository landmark is a point in a repository''s history: one commit together with the files as they stood at that moment.'
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- extractor history
relation-constraints:
  out:
  - contains
  - partOf
  in:
  - partOf
template-policy: page
source: graph
origin: history
details: []
fields: []
key: []
derives-from:
- code.repository
- code.commit
labels:
  en:
    one: Repository landmark
    many: Repository landmarks
  ru:
    one: Ориентир репозитория
    many: Ориентиры репозитория
description:
  en: 'A repository landmark fixes a point in a repository''s history: one commit and the tree of files it holds. Comparing two landmarks shows what changed between them.'
  ru: 'Ориентир репозитория закрепляет точку в его истории: один коммит и дерево файлов, которые в нём лежат. Сравнив два ориентира, видно, что изменилось между ними.'

key-edges:
- role: code.snapshot-repository
  edge: code.snapshot-repository
  side: from
- role: code.snapshot-commit
  edge: code.snapshot-commit
  side: from
