id: otel.vcs-ref
purpose: history
audience: [developer, architect, product-lead]
definition: A branch is a movable name for one line of commits in a repository.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Branch
    many: Branches
  ru:
    one: Ветка
    many: Ветки
description:
  en: A branch names one line of development in a repository and moves as new commits are added to it. Branches let people work on a change apart from the main line and join it back when it is ready.
  ru: 'Ветка — перемещаемое имя одной линии разработки в репозитории: оно сдвигается, когда к линии добавляются коммиты. Ветки позволяют вести работу над изменением отдельно от основной линии и вернуть её туда, когда она готова.'
