id: practice.license-agreement
purpose: operations
audience: [product-lead, operations, security-engineer]
definition: A licence agreement sets the terms on which a supplier lets the product use a component or a service.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Licensing/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Licence agreement
    many: Licence agreements
  ru:
    one: Лицензионное соглашение
    many: Лицензионные соглашения
description:
  en: 'A licence agreement records what a supplier allows the product to do with a component or a service, and under which conditions: how many users or copies, where it may run and what must be paid. It also states what the supplier does not permit.'
  ru: 'Лицензионное соглашение фиксирует, что поставщик разрешает продукту делать с компонентом или сервисом и на каких условиях: сколько пользователей или копий, где это можно запускать и сколько за это платить. В нём же сказано, чего поставщик не разрешает.'
