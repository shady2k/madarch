id: practice.supplier-agreement
purpose: operations
audience: [product-lead, operations, security-engineer]
definition: A supplier agreement records the terms a supplier and the product agreed, including security, service levels and reporting.
sources:
- https://csrc.nist.gov/pubs/sp/800/161/r1/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Supplier agreement
    many: Supplier agreements
  ru:
    one: Соглашение с поставщиком
    many: Соглашения с поставщиками
description:
  en: 'A supplier agreement is the contract between the product''s organisation and a supplier: what the supplier provides, at what quality, for what price and with which security and reporting duties. It is what the organisation can rely on when the supplier''s part fails.'
  ru: 'Соглашение с поставщиком — договор между организацией продукта и поставщиком: что поставщик предоставляет, какого качества, за какую цену и какие обязанности по безопасности и отчётности несёт. На него организация опирается, если часть работы поставщика подводит.'
