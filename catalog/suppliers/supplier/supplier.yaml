id: practice.supplier
purpose: operations
audience: [product-lead, operations, security-engineer]
definition: A supplier is an organisation the product depends on for a service, a component or a platform.
sources:
- https://csrc.nist.gov/pubs/sp/800/161/r1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Supplier
    many: Suppliers
  ru:
    one: Поставщик
    many: Поставщики
description:
  en: A supplier is an outside organisation that provides something the product needs, such as cloud capacity, a software library, a payment service or support. The product's organisation keeps track of each supplier because its failures and its duties reach the product.
  ru: 'Поставщик — внешняя организация, которая даёт продукту то, что ему нужно: вычислительные мощности, программную библиотеку, платёжный сервис или поддержку. Организация продукта ведёт учёт поставщиков, потому что их сбои и обязанности касаются продукта.'
