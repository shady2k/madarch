id: practice.supplier-assessment
purpose: quality
audience: [product-lead, operations, security-engineer]
definition: A supplier assessment is the check of a supplier's security and dependability, and what it found.
sources:
- https://csrc.nist.gov/pubs/sp/800/161/r1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Supplier assessment
    many: Supplier assessments
  ru:
    one: Оценка поставщика
    many: Оценки поставщиков
description:
  en: 'A supplier assessment examines whether a supplier can be trusted with the product''s work: its security practices, its reliability, its finances and its own suppliers. It records what was checked, what was found and what the product decided.'
  ru: 'Оценка поставщика выясняет, можно ли доверить поставщику работу продукта: его практики безопасности, надёжность, финансовое положение и его собственных поставщиков. В ней записано, что проверяли, что нашли и что решили.'
