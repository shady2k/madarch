id: act.rule
purpose: quality
audience: [designer, tester, developer]
definition: An accessibility rule is a W3C ACT rule that checks one success criterion in a way tools can repeat.
sources:
- https://www.w3.org/TR/act-rules-format/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Accessibility rule
    many: Accessibility rules
  ru:
    one: Правило доступности
    many: Правила доступности
description:
  en: An accessibility rule, as the W3C Accessibility Conformance Testing format defines it, states the input, the check and the expected outcome for one kind of content. Because the rule is written precisely, different tools can agree on what passes.
  ru: Правило доступности, как его определяет формат W3C Accessibility Conformance Testing, задаёт вход, проверку и ожидаемый результат для одного вида содержимого. Благодаря точной формулировке разные инструменты сходятся в том, что считается пройденным.
