id: earl.evaluation
purpose: quality
audience: [designer, tester, developer]
definition: An accessibility evaluation records the result of checking a resource against one accessibility criterion, with the tool that made it.
sources:
- https://www.w3.org/TR/EARL10-Schema/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Accessibility evaluation
    many: Accessibility evaluations
  ru:
    one: Оценка доступности
    many: Оценки доступности
description:
  en: An accessibility evaluation is one check of a screen, a component or a document against one criterion, made by a person or by a tool. It records whether the criterion passed, the evidence seen and what has to change.
  ru: Оценка доступности — одна проверка экрана, компонента или документа по одному критерию, сделанная человеком или инструментом. В ней записано, пройден ли критерий, какие доказательства видели и что нужно исправить.
