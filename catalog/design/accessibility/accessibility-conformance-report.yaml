id: practice.accessibility-conformance-report
purpose: quality
audience: [designer, tester, developer]
definition: An accessibility conformance report states which success criteria a product meets and which it does not.
sources:
- https://www.w3.org/TR/WCAG22/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Accessibility conformance report
    many: Accessibility conformance reports
  ru:
    one: Отчёт о соответствии доступности
    many: Отчёты о соответствии доступности
description:
  en: An accessibility conformance report goes through the WCAG success criteria that apply to a product and records, for each, whether it conforms and what evidence shows that. It lets buyers and auditors see the accessibility of the product without testing it themselves.
  ru: Отчёт о соответствии доступности проходит по критериям успеха WCAG, применимым к продукту, и по каждому записывает, выполняется ли он и какие доказательства это показывают. По нему покупатели и аудиторы видят доступность продукта, не проверяя его сами.
derives-from:
- accessibility-evaluation
