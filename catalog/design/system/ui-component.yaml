id: storybook.component
purpose: structure
audience: [designer, developer]
definition: A UI component is a reusable piece of the interface, with the properties it takes.
sources:
- https://storybook.js.org/docs/api/csf
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - dependsOn
  in:
  - uses
template-policy: none
labels:
  en:
    one: UI component
    many: UI components
  ru:
    one: Компонент интерфейса
    many: Компоненты интерфейса
description:
  en: A UI component is a named, reusable part of the interface, such as a button, a table or a date picker, that other parts place with properties. It owns its look and behaviour, so the same interaction works the same way everywhere.
  ru: 'Компонент интерфейса — именованная многоразовая часть интерфейса: кнопка, таблица или выбор даты, — которую другие части вставляют со своими свойствами. Он сам отвечает за вид и поведение, поэтому одно и то же действие всюду работает одинаково.'
