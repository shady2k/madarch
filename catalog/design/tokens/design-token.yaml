id: dtcg.design-token
purpose: structure
audience: [designer, developer]
definition: A design token is a named design value, such as a colour, a spacing or a font size, that designs and styles refer to by name.
sources:
- https://www.designtokens.org/TR/2025.10/format/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  - refines
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Design token
    many: Design tokens
  ru:
    one: Токен дизайна
    many: Токены дизайна
description:
  en: A design token gives a name to one design value — a colour, a spacing, a type size, a border radius — so that screens and styles use the name instead of repeating the value. A change to the token then reaches every place that uses it.
  ru: Токен дизайна даёт имя одному значению оформления — цвету, отступу, размеру шрифта, скруглению угла, — чтобы экраны и стили ссылались на имя, а не повторяли значение. Тогда изменение токена доходит до каждого места, где он используется.
