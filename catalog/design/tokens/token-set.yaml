id: dtcg.token-set
purpose: structure
audience: [designer, developer]
definition: A token set is a named set of design tokens that a theme or a context selects.
sources:
- https://www.designtokens.org/TR/2025.10/resolver/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - contains
template-policy: none
labels:
  en:
    one: Token set
    many: Token sets
  ru:
    one: Набор токенов
    many: Наборы токенов
description:
  en: A token set is one complete selection of design token values, for example the light theme or the compact density. A product switches sets to change the look, while the names the components use stay the same.
  ru: 'Набор токенов — один полный выбор значений токенов дизайна: например, светлая тема или компактная плотность. Продукт переключает наборы, чтобы изменить вид, а имена, которыми пользуются компоненты, остаются прежними.'
derives-from:
- design-system
