id: dtcg.token-group
purpose: structure
audience: [designer, developer]
definition: A token group is a group of design tokens, which may itself hold further groups.
sources:
- https://www.designtokens.org/TR/2025.10/format/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Token group
    many: Token groups
  ru:
    one: Группа токенов
    many: Группы токенов
description:
  en: A token group gathers design tokens under one name, such as all colours or all spacing values, and may hold other groups inside it. The grouping gives the tokens a structure that tools and people can navigate.
  ru: 'Группа токенов собирает токены дизайна под одним именем: например, все цвета или все отступы, — и может содержать внутри другие группы. Группировка даёт токенам устройство, по которому удобно двигаться людям и инструментам.'
