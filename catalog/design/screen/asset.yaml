id: practice.asset
purpose: structure
audience: [designer, developer]
definition: An asset is a file a screen shows, such as an image, an icon or a font.
sources:
- https://www.w3.org/Graphics/SVG/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - uses
template-policy: none
labels:
  en:
    one: Media asset
    many: Media assets
  ru:
    one: Медиафайл
    many: Медиафайлы
description:
  en: 'An asset is a media file the interface uses: a picture, an icon, a font, a video or a sound. Its size and format matter because the person''s device must download it.'
  ru: 'Медиафайл — файл, который использует интерфейс: изображение, значок, шрифт, видео или звук. Его размер и формат важны, потому что устройство человека должно его скачать.'
derives-from:
- code.file
- screen
