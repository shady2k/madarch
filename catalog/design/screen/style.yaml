id: practice.style
purpose: structure
audience: [designer, developer]
definition: A style is a stylesheet or a set of style rules that applies to components and refers to design tokens.
sources:
- https://www.w3.org/TR/CSS22/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - appliesTo
  in:
  - appliesTo
template-policy: none
labels:
  en:
    one: Style
    many: Styles
  ru:
    one: Стиль
    many: Стили
description:
  en: 'A style is the set of rules that decides how components look: colours, spacing, typography, borders. It should take its values from design tokens rather than hard-coded numbers, so a change of theme reaches every place.'
  ru: 'Стиль — набор правил, который решает, как выглядят компоненты: цвета, отступы, шрифты, границы. Значения стоит брать из токенов дизайна, а не задавать числами, чтобы смена темы доходила до каждого места.'
derives-from:
- design-token
- ui-component
