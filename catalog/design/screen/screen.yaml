id: practice.screen
purpose: structure
audience: [designer, developer]
definition: A screen is a view a person sees at one moment in the interface, made of interface components and reached through a route.
sources:
- https://www.nngroup.com/articles/usability-testing-101/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Screen
    many: Screens
  ru:
    one: Экран
    many: Экраны
description:
  en: 'A screen is what a person sees at one moment in the interface: a form, a list, a dashboard, assembled from components and showing one task. A route leads to it, and its states must cover loading, success and failure.'
  ru: 'Экран — то, что человек видит в интерфейсе в один момент: форма, список, панель, — собранное из компонентов и посвящённое одной задаче. К нему ведёт маршрут, а его состояния должны покрывать загрузку, успех и отказ.'
derives-from:
- product-profile
- ui-component
- user-flow
applicability:
  dependencies: []
  markers:
  - '**/index.html'
  - '**/*.tsx'
  - '**/*.vue'
  - '**/*.svelte'
  profile: web_ui
source: graph
