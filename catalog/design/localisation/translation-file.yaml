id: xliff.document
purpose: structure
audience: [designer, developer]
definition: A translation file is an XLIFF file that carries the translation units of one language.
sources:
- https://docs.oasis-open.org/xliff/xliff-core/v2.1/os/xliff-core-v2.1-os.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - contains
template-policy: none
labels:
  en:
    one: Translation file
    many: Translation files
  ru:
    one: Файл перевода
    many: Файлы перевода
description:
  en: A translation file holds the source texts and their translations for one language, in the XLIFF format that translation tools exchange. Translators work in it, and the product reads the translations from it.
  ru: Файл перевода хранит исходные тексты и их перевод на один язык в формате XLIFF, которым обмениваются инструменты перевода. В нём работают переводчики, из него продукт берёт переводы.
