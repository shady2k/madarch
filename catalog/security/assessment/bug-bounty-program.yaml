id: practice.bug-bounty-program
purpose: quality
audience: [security-engineer, tester, developer]
definition: A bug bounty programme pays outside researchers for the vulnerabilities they report, under stated rules.
sources:
- https://www.hackerone.com/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Bug bounty programme
    many: Bug bounty programmes
  ru:
    one: Программа поиска уязвимостей
    many: Программы поиска уязвимостей
description:
  en: A bug bounty programme invites independent researchers to look for weaknesses in the product and pays for valid reports, by severity. Its scope, its rules and its response times are published, so researchers know what is in play.
  ru: Программа поиска уязвимостей приглашает независимых исследователей искать слабости в продукте и платит за действительные сообщения по их важности. Её область, правила и сроки ответа публикуют, чтобы исследователи знали, что в игре.
