id: practice.secret-scan
purpose: quality
audience: [security-engineer, tester, developer]
definition: A secret scan is a tool run that looks for credentials left in the repository.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - foundBy
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Secret scan
    many: Secret scans
  ru:
    one: Поиск секретов
    many: Поиски секретов
description:
  en: A secret scan searches the code, the history and the build output for things that look like keys, passwords or tokens. A real secret found this way must be replaced, not only deleted, because it has already been exposed.
  ru: Поиск секретов просматривает код, историю и результаты сборки в поисках того, что похоже на ключи, пароли или токены. Настоящий найденный секрет нужно заменить, а не только удалить, потому что он уже раскрыт.
derives-from:
- code.repository
