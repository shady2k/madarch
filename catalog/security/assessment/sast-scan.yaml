id: practice.sast-scan
purpose: quality
audience: [security-engineer, tester, developer]
definition: A SAST scan is a tool run that reads the source for patterns that may be exploitable.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - foundBy
  in:
  - evidences
template-policy: none
labels:
  en:
    one: SAST scan
    many: SAST scans
  ru:
    one: Сканирование SAST
    many: Сканирования SAST
description:
  en: 'A static application security test reads the code without running it and flags patterns that often lead to weaknesses: unsafe queries, unescaped output, hard-coded secrets. It finds problems early but needs a person to judge the false alarms.'
  ru: 'Сканирование SAST читает код, не запуская его, и отмечает образцы, которые часто ведут к слабостям: небезопасные запросы, неэкранированный вывод, вписанные секреты. Оно находит проблемы рано, но ложные срабатывания должен оценить человек.'
