id: practice.dast-scan
purpose: quality
audience: [security-engineer, tester, developer]
definition: A DAST scan is a tool run that attacks a running service the way an outsider could.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - foundBy
  in:
  - evidences
template-policy: none
labels:
  en:
    one: DAST scan
    many: DAST scans
  ru:
    one: Сканирование DAST
    many: Сканирования DAST
description:
  en: 'A dynamic application security test sends requests to a running service and looks for weaknesses in what comes back: injection, broken access, exposed data. It sees the service as an attacker would, without reading its code.'
  ru: 'Сканирование DAST отправляет запросы работающему сервису и ищет слабости в ответах: внедрение, сломанный доступ, открытые данные. Оно видит сервис так, как увидел бы атакующий, не читая код.'
