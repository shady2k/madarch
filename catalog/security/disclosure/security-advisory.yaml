id: practice.security-advisory
purpose: quality
audience: [security-engineer, architect]
definition: A security advisory is a published notice of a vulnerability in the product, with the versions affected and the fix.
sources:
- https://www.rfc-editor.org/rfc/rfc9116.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Security advisory
    many: Security advisories
  ru:
    one: Уведомление о безопасности
    many: Уведомления о безопасности
description:
  en: 'A security advisory tells users that a weakness affects some versions of the product, which versions are affected and what to do: update, apply a workaround or nothing if unaffected. It gives enough detail to act without handing an attacker a recipe.'
  ru: 'Уведомление о безопасности сообщает пользователям, что слабость затрагивает некоторые версии продукта, какие именно и что делать: обновиться, применить обход или ничего, если не затронуты. В нём достаточно подробностей для действия, но не готовый рецепт для атакующего.'
