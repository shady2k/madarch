id: practice.disclosure-policy
purpose: quality
audience: [security-engineer, architect]
definition: A disclosure policy is the published rules by which a researcher tells the product team about a vulnerability.
sources:
- https://www.rfc-editor.org/rfc/rfc9116.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Disclosure policy
    many: Disclosure policies
  ru:
    one: Политика раскрытия
    many: Политики раскрытия
description:
  en: A disclosure policy states how a security researcher should report a weakness, what the team promises in return and when the details may be published. It sets the timetable between the report, the fix and the public note.
  ru: Политика раскрытия говорит, как исследователю безопасности сообщать о слабости, что команда обещает взамен и когда подробности можно публиковать. Она задаёт сроки между сообщением, исправлением и публичным извещением.
