id: iso15408.protection-profile
purpose: quality
audience: [security-engineer, architect]
definition: A protection profile is a standard statement of security requirements for a kind of product, as ISO/IEC 15408 defines it.
sources:
- https://www.iso.org/standard/72891.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Protection profile
    many: Protection profiles
  ru:
    one: Профиль защиты
    many: Профили защиты
description:
  en: A protection profile names a kind of product — a firewall, a smart card, an operating system — and states the security problem and the requirements any such product must meet. ISO/IEC 15408 defines it as the vendor-independent half of a security evaluation.
  ru: Профиль защиты называет вид продукта — межсетевой экран, смарт-карту или операционную систему — и излагает проблему безопасности и требования, которым должен соответствовать любой такой продукт. ISO/IEC 15408 определяет его как независимую от изготовителя половину оценки безопасности.
