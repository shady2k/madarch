id: asvs.requirement
purpose: quality
audience: [security-engineer, architect]
definition: A security control is a requirement that reduces a security risk, as OWASP ASVS states them in chapters and levels.
sources:
- https://github.com/OWASP/ASVS/tree/master/5.0/en
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - satisfies
template-policy: none
labels:
  en:
    one: Security control
    many: Security controls
  ru:
    one: Контроль безопасности
    many: Контроли безопасности
description:
  en: 'A security control states one thing a system should do or check to reduce a risk: verify authentication, validate input, protect data in storage. OWASP ASVS groups such controls by chapter and gives each a level that says how strict it is.'
  ru: 'Контроль безопасности формулирует, что система должна делать или проверять, чтобы снизить риск: подтверждать вход, проверять входные данные, защищать данные в хранилище. OWASP ASVS группирует такие контроли по главам и даёт каждому уровень строгости.'
