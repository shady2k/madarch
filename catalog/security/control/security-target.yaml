id: iso15408.security-target
purpose: quality
audience: [security-engineer, architect]
definition: A security target is the document that states the security problem of a product and the measures that answer it, as ISO/IEC 15408 defines it.
sources:
- https://www.iso.org/standard/72891.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - documents
template-policy: none
labels:
  en:
    one: Security target
    many: Security targets
  ru:
    one: Цель безопасности
    many: Цели безопасности
description:
  en: 'A security target is the vendor''s statement about one product: the security problem it faces, the requirements it claims to meet and the evidence that it does. An evaluator judges the product against this statement.'
  ru: 'Цель безопасности — заявление изготовителя об одном продукте: какую проблему безопасности он решает, каким требованиям, по его утверждению, соответствует и какие есть доказательства. Оценщик судит продукт по этому заявлению.'
derives-from:
- protection-profile
- security-control
- software-system
