id: practice.security-exception
purpose: quality
audience: [security-engineer, architect]
definition: An exception is a recorded decision to accept a known deviation from a rule, with its reason and its end date.
sources:
- https://csrc.nist.gov/pubs/sp/800/53/a/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Exception
    many: Exceptions
  ru:
    one: Исключение
    many: Исключения
description:
  en: 'An exception allows a named case to break a security rule for a stated time: the rule, the case, the reason, who accepted the risk and when it ends. When it expires, the rule applies again.'
  ru: 'Исключение разрешает названному случаю нарушать правило безопасности в течение определённого срока: правило, случай, причину, кто принял риск и когда срок кончается. После срока правило снова действует.'
derives-from:
- audit-finding
