id: practice.iam-account
purpose: structure
audience: [security-engineer, architect]
definition: An IAM account is an identity that can be authenticated and given permissions.
sources:
- https://csrc.nist.gov/pubs/sp/800/207/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - memberOf
  in:
  - hasMember
template-policy: none
labels:
  en:
    one: IAM account
    many: IAM accounts
  ru:
    one: Учётная запись IAM
    many: Учётные записи IAM
description:
  en: 'An IAM account is one identity a system recognises: a person''s login, a service''s account or an application''s identity. Permissions are attached to the account, and its activity can be attributed to it.'
  ru: 'Учётная запись IAM — одна идентичность, которую знает система: вход человека, учётная запись сервиса или приложения. Права привязаны к учётной записи, и её действия можно ей приписать.'
