id: practice.iam-role
purpose: structure
audience: [security-engineer, architect]
definition: An IAM role is a named set of permissions a subject can take on, in a cloud or an application.
sources:
- https://csrc.nist.gov/pubs/sp/800/207/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - grants
  in:
  - grants
template-policy: none
labels:
  en:
    one: IAM role
    many: IAM roles
  ru:
    one: Роль IAM
    many: Роли IAM
description:
  en: An IAM role bundles permissions that a person or a service may assume for a while, often without permanent keys. Assuming the role gives the subject its permissions and records who did it.
  ru: Роль IAM объединяет права, которые человек или сервис может принять на время, часто без постоянных ключей. Принятие роли даёт субъекту её права и записывает, кто это сделал.
