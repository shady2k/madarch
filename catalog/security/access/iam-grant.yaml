id: practice.iam-grant
purpose: operations
audience: [security-engineer, architect]
definition: An IAM grant is one permission given to a subject over a resource.
sources:
- https://csrc.nist.gov/pubs/sp/800/207/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - grants
  in:
  - grants
template-policy: none
labels:
  en:
    one: IAM grant
    many: IAM grants
  ru:
    one: Разрешение IAM
    many: Разрешения IAM
description:
  en: An IAM grant states that one subject — a person, a role or a service — may perform one action on one resource, such as read a bucket or start an instance. Grants are the smallest pieces from which a policy is built.
  ru: 'Разрешение IAM говорит, что один субъект — человек, роль или сервис — может выполнить одно действие с одним ресурсом: прочитать бакет или запустить экземпляр. Из таких разрешений строится политика.'
