id: practice.sso-configuration
purpose: operations
audience: [security-engineer, operations, platform-devops]
definition: An SSO configuration records how a service trusts one identity provider to sign its users in.
sources:
- https://docs.oasis-open.org/security/saml/v2.0/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - defines
  in:
  - defines
template-policy: none
labels:
  en:
    one: SSO configuration
    many: SSO configurations
  ru:
    one: Настройка SSO
    many: Настройки SSO
description:
  en: 'An SSO configuration ties a service to one identity provider: which issuer it trusts, which client it is, which claims it reads and how it maps them to roles. It lets people sign in once and reach the service without a separate password.'
  ru: 'Настройка SSO связывает сервис с одним поставщиком идентичности: какому издателю он доверяет, какой он клиент, какие утверждения читает и как переводит их в роли. Она позволяет человеку войти один раз и попасть в сервис без отдельного пароля.'
derives-from:
- code.service
- iam-account
