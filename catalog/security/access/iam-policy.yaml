id: practice.iam-policy
purpose: operations
audience: [security-engineer, architect]
definition: An IAM policy is a written rule that says who may do what with which resources.
sources:
- https://csrc.nist.gov/pubs/sp/800/207/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: IAM policy
    many: IAM policies
  ru:
    one: Политика IAM
    many: Политики IAM
description:
  en: An IAM policy collects statements that allow or deny actions on resources for subjects, often with conditions such as a network or a time. The provider evaluates the policies that apply and answers yes or no.
  ru: 'Политика IAM собирает утверждения, которые разрешают или запрещают действия с ресурсами для субъектов, часто с условиями: сетью или временем. Поставщик оценивает применимые политики и отвечает да или нет.'
