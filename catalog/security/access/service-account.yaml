id: kubernetes.service-account
purpose: structure
audience: [security-engineer, operations, platform-devops]
definition: A service account is an identity a workload uses rather than a person.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - memberOf
  in:
  - grants
template-policy: none
labels:
  en:
    one: Service account
    many: Service accounts
  ru:
    one: Сервисная учётная запись
    many: Сервисные учётные записи
description:
  en: A service account is a non-human identity that a program, a job or a container signs in with, with permissions of its own. Its credentials are managed like any secret, and its activity is separate from any person's.
  ru: Сервисная учётная запись — нечеловеческая идентичность, под которой входит программа, задача или контейнер, со своими правами. Её учётные данные хранят как любой секрет, а её действия отделены от действий людей.
