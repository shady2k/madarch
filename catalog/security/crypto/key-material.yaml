id: practice.key-material
purpose: structure
audience: [security-engineer, architect, developer]
definition: Key material is a key the product uses to sign, encrypt or authenticate, with where it is kept and when it expires.
sources:
- https://www.rfc-editor.org/rfc/rfc5280.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Key material
    many: Key materials
  ru:
    one: Ключевой материал
    many: Ключевой материал
description:
  en: Key material is the actual secret the product uses in cryptography, such as a signing key or a shared secret. Its record says where it is stored, who may use it and when it must be rotated.
  ru: 'Ключевой материал — сам секрет, которым продукт пользуется в криптографии: ключ подписи или общий секрет. В записи сказано, где он хранится, кто может им пользоваться и когда его нужно сменить.'
