id: practice.secret
purpose: operations
audience: [security-engineer, operations, platform-devops, developer]
definition: A secret is a value that only the service that needs it may read, such as a password or a token.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - configures
  in:
  - configures
template-policy: none
labels:
  en:
    one: Secret
    many: Secrets
  ru:
    one: Секрет
    many: Секреты
description:
  en: 'A secret is a piece of data whose disclosure would let someone act as the product or reach its protected resources: a password, an API key, a private key, a token. It must be stored protected, rotated and never written into the code.'
  ru: 'Секрет — данные, раскрытие которых позволит кому-то действовать от имени продукта или добраться до его защищённых ресурсов: пароль, ключ API, закрытый ключ, токен. Его нужно хранить защищённо, менять и никогда не вписывать в код.'
derives-from:
- code.service
