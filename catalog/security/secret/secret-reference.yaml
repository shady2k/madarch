id: practice.secret-reference
purpose: operations
audience: [security-engineer, operations, platform-devops, developer]
definition: A secret reference is a place the code names a secret, without the value itself being kept there.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - usesTool
  in:
  - configures
template-policy: none
labels:
  en:
    one: Secret reference
    many: Secret references
  ru:
    one: Ссылка на секрет
    many: Ссылки на секреты
description:
  en: A secret reference points from the code or the configuration to a secret stored elsewhere, such as a secret manager or a mounted file. Keeping only the reference out of the repository stops the value from being exposed with the code.
  ru: 'Ссылка на секрет указывает из кода или настроек на секрет, хранимый в другом месте: в хранилище секретов или смонтированном файле. В репозитории остаётся только ссылка, поэтому значение не раскрывается вместе с кодом.'
