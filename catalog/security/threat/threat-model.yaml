id: owasp.threat-model
purpose: quality
audience: [security-engineer, architect, developer]
definition: A threat model describes a system, its assumptions and its threats, with the mitigations that answer them.
sources:
- https://community.owasp.org/Threat_Modeling
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - documents
template-policy: none
labels:
  en:
    one: Threat model
    many: Threat models
  ru:
    one: Модель угроз
    many: Модели угроз
description:
  en: A threat model sets out what is being protected, which trust boundaries it crosses, who might attack it and in which ways, and what is done about each. It is kept with the design, so it changes when the system does.
  ru: Модель угроз излагает, что защищают, какие границы доверия пересекает система, кто и какими способами может напасть и что с этим делают. Её хранят вместе с проектом, поэтому она меняется вместе с системой.
