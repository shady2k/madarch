id: practice.trust-boundary
purpose: structure
audience: [security-engineer, architect]
definition: A trust boundary is a line across which the level of trust changes, which data flows cross.
sources:
- https://cyclonedx.org/docs/1.6/json/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - appliesTo
template-policy: none
labels:
  en:
    one: Trust boundary
    many: Trust boundaries
  ru:
    one: Граница доверия
    many: Границы доверия
description:
  en: 'A trust boundary marks where data passes from one level of trust to another: from a browser into a server, from one service to a database, from our network to a partner''s. Every crossing is a place to check who is speaking and what they may do.'
  ru: 'Граница доверия отмечает, где данные переходят с одного уровня доверия на другой: из браузера на сервер, из сервиса в базу данных, из нашей сети к партнёру. Каждый переход — место, где проверяют, кто говорит и что ему можно.'
derives-from:
- information-flow
- trust-zone
