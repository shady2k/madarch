id: stix.indicator
purpose: quality
audience: [security-engineer, architect]
definition: An indicator is an observable pattern, such as an address or a file hash, that suggests an attack.
sources:
- https://docs.oasis-open.org/cti/stix/v2.1/stix-v2.1.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Indicator
    many: Indicators
  ru:
    one: Индикатор
    many: Индикаторы
description:
  en: 'An indicator is a concrete sign that may mean an attack is present or was present: an address, a domain, a file hash, a command line. It is useful only with its context, because the same sign can be innocent.'
  ru: 'Индикатор — конкретный признак, который может означать, что атака идёт или шла: адрес, домен, хеш файла, командная строка. Он полезен только с контекстом, потому что тот же признак может быть безобидным.'
