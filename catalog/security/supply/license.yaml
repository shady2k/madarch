id: spdx.license
purpose: quality
audience: [security-engineer, platform-devops, developer]
definition: A licence is the terms under which a component may be used, named by its SPDX identifier.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Licensing/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - hasDeclaredLicense
template-policy: none
labels:
  en:
    one: Licence
    many: Licences
  ru:
    one: Лицензия
    many: Лицензии
description:
  en: 'A licence states what the copyright holder allows others to do with a component and under which conditions: use, change, redistribute, keep the notice. Its SPDX identifier names the standard terms without repeating them.'
  ru: 'Лицензия говорит, что держатель прав разрешает делать с компонентом и на каких условиях: использовать, менять, распространять, сохранять уведомление. Её идентификатор SPDX называет стандартные условия, не повторяя их.'
derives-from:
- product
