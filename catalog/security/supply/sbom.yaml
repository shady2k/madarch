id: cyclonedx.bom
purpose: quality
audience: [security-engineer, platform-devops, developer]
definition: An SBOM is the list of the components a product is built from, with the versions and the relations between them.
sources:
- https://cyclonedx.org/docs/1.6/json/
- https://spdx.github.io/spdx-spec/v3.0.1/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - generates
template-policy: none
labels:
  en:
    one: SBOM
    many: SBOMs
  ru:
    one: SBOM
    many: SBOM
description:
  en: A software bill of materials records every component that goes into a product — libraries, bases, tools — with its version, its supplier and its licence, and how the pieces depend on each other. It lets someone answer which products carry a newly found weakness.
  ru: 'Ведомость состава программы записывает каждый компонент, из которого собран продукт: библиотеки, основы, инструменты, — с версией, поставщиком и лицензией, а также связи между частями. По ней можно ответить, в каких продуктах есть только что найденная слабость.'
derives-from:
- build-artifact
