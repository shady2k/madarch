id: practice.subscription
purpose: structure
audience: [developer, architect, operations, platform-devops]
definition: A subscription is a consumer's standing interest in a topic or a queue, with the delivery rules it asks for.
sources:
- https://www.asyncapi.com/docs/reference/specification/v3.0.0
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - subscribes
  in:
  - subscribes
template-policy: none
labels:
  en:
    one: Subscription
    many: Subscriptions
  ru:
    one: Подписка
    many: Подписки
description:
  en: 'A subscription records that a consumer wants the messages of a topic or a queue and how they should reach it: how many times a failed message is retried, whether order matters and what happens to undelivered messages.'
  ru: 'Подписка фиксирует, что потребитель хочет получать сообщения темы или очереди и как их ему доставлять: сколько раз повторять неудачную доставку, важен ли порядок и что делать с недоставленными сообщениями.'
