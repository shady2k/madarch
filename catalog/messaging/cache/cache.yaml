template-policy: none
labels:
  en:
    one: Cache
    many: Caches
  ru:
    one: Кэш
    many: Кэши
description:
  en: A cache keeps a copy of data closer to where it is needed, in memory or on a faster medium, so a repeated read does not go back to the slow source. A policy decides what is kept, for how long and when a stale copy is dropped.
  ru: Кэш держит копию данных ближе к тому месту, где она нужна, — в памяти или на более быстром носителе, — чтобы повторное чтение не шло к медленному источнику. Правило решает, что хранить, как долго и когда выбрасывать устаревшую копию.
