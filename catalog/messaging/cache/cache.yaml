id: practice.cache
purpose: structure
audience: [developer, architect, operations, platform-devops]
definition: A cache is a store that keeps values where they are quicker to read, with the rule that decides how long they stay.
sources:
- https://www.rfc-editor.org/rfc/rfc9111.html
