id: practice.notification-template
purpose: structure
audience: [developer, architect, operations, platform-devops]
definition: A notification template is the text of a notification with its placeholders, kept apart from the code that sends it.
sources:
- https://www.rfc-editor.org/rfc/rfc5322.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - defines
  in:
  - defines
template-policy: none
labels:
  en:
    one: Notification template
    many: Notification templates
  ru:
    one: Шаблон уведомления
    many: Шаблоны уведомлений
description:
  en: A notification template holds the wording of a message with named places for the values that change, such as a name or an order number. Keeping it separate lets people edit the text without touching the code.
  ru: 'Шаблон уведомления хранит текст сообщения с именованными местами для меняющихся значений: имени или номера заказа. Отдельное хранение позволяет править текст, не трогая код.'
