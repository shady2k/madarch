id: practice.email-message
purpose: structure
audience: [developer, architect, operations, platform-devops]
definition: An email message is a message a service sends by e-mail, with its sender, its recipients and its template.
sources:
- https://www.rfc-editor.org/rfc/rfc5322.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Email message
    many: Email messages
  ru:
    one: Письмо
    many: Письма
description:
  en: 'An email message is a letter a service sends to one or more addresses: a receipt, a password reset, a newsletter. It has a sender, recipients, a subject and a body, which usually comes from a template with the recipient''s details put in.'
  ru: 'Письмо — сообщение, которое сервис отправляет на один или несколько адресов: квитанцию, сброс пароля, рассылку. У него есть отправитель, получатели, тема и текст, который обычно берут из шаблона и подставляют в него данные получателя.'
