id: practice.file-share
purpose: operations
audience: [operations, platform-devops, architect]
definition: A file share is a network file system that a service mounts and reads as a folder.
sources:
- https://www.rfc-editor.org/rfc/rfc7530.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasHost
  in:
  - hasHost
template-policy: none
labels:
  en:
    one: File share
    many: File shares
  ru:
    one: Сетевая папка
    many: Сетевые папки
description:
  en: A file share is storage on another machine that a server mounts and then uses like a local folder. Several servers can mount the same share, so they see the same files.
  ru: Сетевая папка — хранилище на другой машине, которое сервер монтирует и дальше использует как обычную папку. Несколько серверов могут смонтировать одну папку и видеть одни и те же файлы.
derives-from:
- code.service
- product-profile
