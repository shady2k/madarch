id: practice.object-store
purpose: operations
audience: [operations, platform-devops, architect]
definition: An object store is a store that keeps objects under keys inside named buckets.
sources:
- https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Object store
    many: Object stores
  ru:
    one: Объектное хранилище
    many: Объектные хранилища
description:
  en: An object store keeps files as objects, each reached by a key inside a bucket, and scales to a very large number of them. Objects are written and read whole, and the store usually keeps several copies for durability.
  ru: Объектное хранилище держит файлы как объекты, каждый из которых доступен по ключу внутри бакета, и выдерживает очень большое их число. Объекты записывают и читают целиком, а хранилище обычно держит несколько копий для сохранности.
