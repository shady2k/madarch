# The kinds this product's wiki shows (decision 0029, docs/decisions/0029-knowledge-in-markdown-graph-as-index.md).
# Each kind names where its entities come from and the template that draws them:
#   source: markdown  the entity is a Markdown file of this repository (a folder of them, or one file)
#   source: graph     the entity is a node of the graph the fill builds from the code repositories
#   source: document  the entity is a section of a Markdown document of this or a code repository that opens with an
#                     identifier (`identifier: UC` takes UC-1, UC-2 ...), a bold term of a glossary (`terms: [...]`), or
#                     that stands under a heading this manifest declares (`headings: [Qualities]` takes the list items
#                     under `## Qualities`, numbered or not)
# A document kind may also say what its sections mean: `semantics` names the general kind of a passage (scenario, actor,
# rule, quality, decision, procedure, term), which the classifier's answer is shown as, and `structure` names the
# sections it holds (`structure: [Status, Context, Decision, Consequences]`), which a section without them is a finding
# for. `documents.expect` lists the kinds the documents must hold: one no document section is read as is a finding too,
# so the wiki says what the documents lack.
# A kind with `file:` is one page; the first such kind is the home page.
# `group` puts the kind in a group of the navigation and the catalogue; `labels` and `description` name and explain
# the kind in each interface language (en, ru); `origin` says how its entities came to be (agent, person, code, history).
# `relations` declares an edge between kinds: {attribute|dirname} puts a part of the entity into the other end's key.
# `card: true` says a ground on one of the kind's entities shows a card of it — its facts, what it is related to
# and the way to its page — instead of the code it was read from; a kind without it keeps the code excerpt.
# `history` names the shape of the story the history block tells of the kind's entities: repositories (the
# product's whole history), author, path, membership (the files a container holds), commit or task. A kind
# without it gets no history page.
# The views, listings and places of a kind are its declaration's too, so no screen of the wiki holds a kind of its
# own. `views` lists the views a page of the kind may draw of its entities: c4-component (its modules) and state (the
# state machines in its code). `er` says how the ER view reads its entities: tables (the tables the entity holds) or
# links (the entity as one table and the tables its foreign keys reach). `sequence` says how the
# end-to-end chain a page draws starts at its entities: route (at the entity) or symbol (at the route that reaches
# it); a kind without it starts no chain. `system` says the part its entities play in the system view: container
# (drawn as a box, read as the implementation a domain names, and the folder a treemap covers), data-store or
# channel. `definition-block` says what the definition block finds in its entities: contract (the file it reads),
# operation or channel (a row of it). `listing` says the form of its listing page: operations (what declares,
# serves and calls each one), the plain table of names and places without it. `nav` says where the kind stands in
# the navigation: own-page (its entities stand at a place of their own) or loop (the loop keeps its place); a
# kind without it is a page among the pages by kind.
# `documents.exclude` lists Markdown files that are not product documents (the files that steer a coding agent).
# `roles` says, per role a reader can read as (product, analyst, architect, developer, operations, tester), which blocks of a
# template stand open on a page and which groups lead the navigation. A block a role does not open stays on the page, collapsed:
# one page serves every role. A role left out, and the role "everything", open every block in the order above.
# A glossary is a document named by a kind's `terms`: each list item starts with a bold term, and may list under it
# "Also called", "In code", "Used in" and "Ambiguous" (decision 0031).
# `problems.rules` declares every rule the Problems page runs: the engine's predicate it keys to, the kind of
# finding it makes, its Sonar kind and severity (blocker, critical, major, minor, info), the section it belongs to,
# what the page offers on it and its label in each interface language. A rule may carry `params` (the marker a
# debt rule reads, the secret names a product declares) and `enabled`. The engine keeps only the predicates: a rule
# is run because this manifest declares it, and switching it off here is what stops it. The thresholds say when a
# file is large or a hotspot.
# A group is { en: <its name>, ru: <its name> }, and may name the group it is a sub-area of (`parent`) and say it
# opens on the menu by itself (`open: true`); a group without a parent is an area and a group with one is a subgroup.
# `catalog` declares the schema of the entity catalog (decision 0033, items 8 to 10) and every kind below declares
# its row: its concept `id` (one concept has one kind), its subgroup (`group`), its `definition`, the `sources` it was
# taken from as addresses a person can read, the ways it is `acquisition` (an extractor's mark, or document,
# conversation, agent-from-graph, live-system, not-implemented), the `relation-constraints` it may carry (out and in,
# from `catalog.relations`), and its `template-policy` (page, member or none). A kind whose policy is `none` is
# catalogue data only: it shows no page yet.
# Shared value contracts (decision 0039, items 3, 4 and 29). Schema ids are immutable.
# Resolve references from this installed library only; writes never fetch schemas.
value-types:
  document-anchors:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:document-anchors:v1
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [title, start, end, markdown]
        properties:
          title: {type: string}
          start: {type: integer, minimum: 1}
          end: {type: integer, minimum: 1}
          markdown: {type: string}
  git-remote:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:git-remote:v1
      type: string
      format: git-remote
  recorded-identity:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:recorded-identity:v1
      type: string
  bigint:
    storage: bigint
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:bigint:v1
      anyOf:
      - type: integer
      - type: string
        pattern: ^(0|-?[1-9][0-9]*)$
  boolean:
    storage: boolean
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:boolean:v1
      type: boolean
  class-diagram-level:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:class-diagram-level:v1
      type: string
      enum:
      - code
      - domain
  code.ci-job-steps:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.ci-job-steps:v1
      type: array
      items:
        type: object
        properties:
          env:
            $ref: urn:madarch:value-type:text-map:v1
          id:
            $ref: urn:madarch:value-type:text:v1
          if:
            $ref: urn:madarch:value-type:text:v1
          name:
            $ref: urn:madarch:value-type:text:v1
          run:
            $ref: urn:madarch:value-type:text:v1
          shell:
            $ref: urn:madarch:value-type:text:v1
          uses:
            $ref: urn:madarch:value-type:text:v1
          with:
            type: object
            additionalProperties:
              anyOf:
              - $ref: urn:madarch:value-type:text:v1
              - $ref: urn:madarch:value-type:number:v1
              - $ref: urn:madarch:value-type:boolean:v1
          working-directory:
            $ref: urn:madarch:value-type:path:v1
        unevaluatedProperties: false
  code.ci-workflow-on:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.ci-workflow-on:v1
      anyOf:
      - $ref: urn:madarch:value-type:text:v1
      - &id001
        $ref: urn:madarch:value-type:text-list:v1
      - type: object
        additionalProperties:
          anyOf:
          - type: 'null'
          - type: object
            additionalProperties:
              anyOf:
              - $ref: urn:madarch:value-type:text:v1
              - $ref: urn:madarch:value-type:boolean:v1
              - $ref: urn:madarch:value-type:number:v1
              - type: 'null'
              - *id001
          - type: array
            items:
              type: object
              properties:
                cron:
                  $ref: urn:madarch:value-type:text:v1
              required:
              - cron
              unevaluatedProperties: false
  code.compose-service-environment:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.compose-service-environment:v1
      type: object
      additionalProperties:
        anyOf:
        - $ref: urn:madarch:value-type:text:v1
        - type: 'null'
  code.dockerfile-stages:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.dockerfile-stages:v1
      type: array
      items:
        type: object
        properties:
          image:
            $ref: urn:madarch:value-type:text:v1
          name:
            $ref: urn:madarch:value-type:text:v1
        required:
        - image
        unevaluatedProperties: false
  code.k8s-deployment-probes:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.k8s-deployment-probes:v1
      type: object
      properties:
        liveness:
          type: object
          properties:
            path:
              $ref: urn:madarch:value-type:path:v1
            port:
              anyOf:
              - $ref: urn:madarch:value-type:port:v1
              - $ref: urn:madarch:value-type:text:v1
            scheme:
              type: string
              enum:
              - HTTP
              - HTTPS
          required:
          - path
          unevaluatedProperties: false
        readiness:
          type: object
          properties:
            path:
              $ref: urn:madarch:value-type:path:v1
            port:
              anyOf:
              - $ref: urn:madarch:value-type:port:v1
              - $ref: urn:madarch:value-type:text:v1
            scheme:
              type: string
              enum:
              - HTTP
              - HTTPS
          required:
          - path
          unevaluatedProperties: false
        startup:
          type: object
          properties:
            path:
              $ref: urn:madarch:value-type:path:v1
            port:
              anyOf:
              - $ref: urn:madarch:value-type:port:v1
              - $ref: urn:madarch:value-type:text:v1
            scheme:
              type: string
              enum:
              - HTTP
              - HTTPS
          required:
          - path
          unevaluatedProperties: false
      unevaluatedProperties: false
  code.k8s-service-ports:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.k8s-service-ports:v1
      type: array
      items:
        type: object
        properties:
          name:
            $ref: urn:madarch:value-type:text:v1
          nodePort:
            $ref: urn:madarch:value-type:port:v1
          port:
            $ref: urn:madarch:value-type:port:v1
          protocol:
            type: string
            enum:
            - SCTP
            - TCP
            - UDP
          targetPort:
            anyOf:
            - $ref: urn:madarch:value-type:port:v1
            - $ref: urn:madarch:value-type:text:v1
        required:
        - port
        unevaluatedProperties: false
  code.lockfile-packages:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:code.lockfile-packages:v1
      type: array
      items:
        type: object
        properties:
          dev:
            $ref: urn:madarch:value-type:boolean:v1
          integrity:
            $ref: urn:madarch:value-type:text:v1
          name:
            $ref: urn:madarch:value-type:text:v1
          resolved:
            $ref: urn:madarch:value-type:url:v1
          version:
            $ref: urn:madarch:value-type:version:v1
        required:
        - name
        - version
        unevaluatedProperties: false
  date:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:date:v1
      type: string
      format: date
  duration:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:duration:v1
      type: string
      format: duration
  duration-ms:
    storage: integer
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:duration-ms:v1
      type: integer
      minimum: 0
  duration-seconds:
    storage: integer
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:duration-seconds:v1
      type: integer
      minimum: 0
  email:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:email:v1
      type: string
      format: email
  field-set-fields:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:field-set-fields:v1
      type: array
      items:
        type: object
        properties:
          labels:
            $ref: urn:madarch:value-type:localized-text:v1
          name:
            $ref: urn:madarch:value-type:text:v1
          nullable:
            $ref: urn:madarch:value-type:boolean:v1
          type:
            $ref: urn:madarch:value-type:text:v1
        required:
        - name
        - type
        unevaluatedProperties: false
  integer:
    storage: integer
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:integer:v1
      type: integer
  ipv4:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:ipv4:v1
      type: string
      format: ipv4
  ipv6:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:ipv6:v1
      type: string
      format: ipv6
  json:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:json:v1
      anyOf:
      - type: array
      - type: boolean
      - type: 'null'
      - type: number
      - type: object
      - type: string
  link-type-labels:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:link-type-labels:v1
      type: object
      additionalProperties:
        type: object
        properties:
          in:
            $ref: urn:madarch:value-type:text:v1
          out:
            $ref: urn:madarch:value-type:text:v1
        required:
        - in
        - out
        unevaluatedProperties: false
  localized-text:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:localized-text:v1
      type: object
      properties:
        en:
          $ref: urn:madarch:value-type:text:v1
        ru:
          $ref: urn:madarch:value-type:text:v1
      required:
      - en
      - ru
      unevaluatedProperties: false
  money:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:money:v1
      type: string
      pattern: ^[A-Z]{3} -?(0|[1-9][0-9]*)(\.[0-9]+)?$
  number:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:number:v1
      type: number
  path:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:path:v1
      type: string
      minLength: 1
      pattern: ^[^\u0000]+$
  path-list:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:path-list:v1
      type: array
      items:
        $ref: urn:madarch:value-type:path:v1
  port:
    storage: integer
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:port:v1
      type: integer
      minimum: 1
      maximum: 65535
  port-list:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:port-list:v1
      type: array
      items:
        $ref: urn:madarch:value-type:port:v1
  text:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:text:v1
      type: string
  text-list:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:text-list:v1
      type: array
      items:
        $ref: urn:madarch:value-type:text:v1
  text-map:
    storage: json
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:text-map:v1
      type: object
      additionalProperties:
        $ref: urn:madarch:value-type:text:v1
  timestamp:
    storage: timestamp
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:timestamp:v1
      type: string
      format: date-time
  url:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:url:v1
      type: string
      format: uri
  value-set-value:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:value-set-value:v1
      type: string
      minLength: 1
  version:
    storage: text
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:madarch:value-type:version:v1
      type: string
      minLength: 1
      pattern: ^[^\s\u0000]+$

