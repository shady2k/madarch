documents:
  exclude: [AGENTS.md, CLAUDE.md, GEMINI.md, "**/AGENTS.md", "**/CLAUDE.md", "**/GEMINI.md"]
  expect: []
  ignore: [code, html, thematicBreak, definition]
# The roles a reader can read as. Each key is the natural key of a «Роль» entity (role.yaml): a kind's `audience` names
# those roles, and a person holds them, so the audience of a kind and the actor of its use cases are the same entities
# (madarch-64o5.109, madarch-64o5.115).
roles:
  product: { lead: [strategy, discovery, requirements, rd], open: [stated, implementedby, linkedfrom, related, properties] }
  analyst: { lead: [strategy, requirements, data, contracts, information], open: [stated, implementedby, linkedfrom, related, properties, er, sequence, children] }
  architect: { lead: [architecture, code, contracts, data, infrastructure, security, common], open: [graph, related, sequence, er, stated, implementedby, linkedfrom, properties, children] }
  developer: { lead: [code, contracts, data, testing, delivery, review, history, work], open: [source, callers, callees, sequence, graph, related, history, properties, children, er, stated] }
  operations: { lead: [operations, infrastructure, messaging, resilience], open: [properties, related, history, children, source, er, stated] }
  tester: { lead: [testing, requirements, strategy], open: [stated, implementedby, linkedfrom, related, properties, callers, children] }
  designer: { lead: [design, requirements, discovery], open: [stated, implementedby, linkedfrom, related, properties, children] }
  security-engineer: { lead: [security, privacy, architecture, delivery], open: [properties, related, graph, children, source, stated] }
  platform-devops: { lead: [infrastructure, delivery, operations, messaging, automation, decommissioning], open: [properties, related, history, children, source, er, stated] }
  product-lead: { lead: [strategy, costs, suppliers, documentation, organisation, ml, work, common], open: [stated, implementedby, linkedfrom, related, properties] }
problems:
  thresholds:
    largeFileLines: 600
    hotspotLines: 200
    hotspotCommits: 10
    hotspotScore: 10000
  rules:
    dependency.cycle: { predicate: dependency-cycle, kind: dependency-cycle, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Dependency cycle", ru: "Цикл зависимостей" } }
    security.sql-input: { predicate: sql-input, kind: sql-input, sonar: vulnerability, severity: blocker, section: code, action: task, enabled: true, label: { en: "Untrusted input reaches SQL", ru: "Внешние данные попадают в SQL" } }
    security.export-route: { predicate: route-outside-auth, kind: route-outside-auth, sonar: vulnerability, severity: critical, section: code, action: task, enabled: true, label: { en: "Route outside the auth group", ru: "Маршрут вне группы авторизации" } }
    large-file: { predicate: large-file, kind: large-file, sonar: code-smell, severity: minor, section: code, action: task, enabled: true, label: { en: "Large file", ru: "Большой файл" } }
    hotspot: { predicate: change-hotspot, kind: change-hotspot, sonar: code-smell, severity: major, section: code, action: task, enabled: true, label: { en: "Change hotspot", ru: "Горячая точка изменений" } }
    dead-export: { predicate: dead-export, kind: dead-export, sonar: code-smell, severity: minor, section: code, action: task, enabled: true, label: { en: "Exported but unused", ru: "Экспорт без использования" } }
    debt.todo: { predicate: debt, kind: debt-todo, sonar: code-smell, severity: info, section: code, action: task, enabled: true, params: { marker: "TODO" }, label: { en: "TODO", ru: "TODO" } }
    debt.fixme: { predicate: debt, kind: debt-fixme, sonar: code-smell, severity: minor, section: code, action: task, enabled: true, params: { marker: "FIXME" }, label: { en: "FIXME", ru: "FIXME" } }
    config.required-dev-value: { predicate: config-development-value, kind: config-development-value, sonar: vulnerability, severity: critical, section: code, action: task, enabled: true, params: { secrets: [], developmentValues: [] }, label: { en: "Required setting has a checked-in value", ru: "Обязательная настройка задана в репозитории" } }
    dependency.declared-unused: { predicate: dependency-declared-unused, kind: dependency-declared-unused, sonar: code-smell, severity: minor, section: code, action: task, enabled: true, label: { en: "Dependency declared but unused", ru: "Зависимость объявлена, но не используется" } }
    dependency.used-undeclared: { predicate: dependency-used-undeclared, kind: dependency-used-undeclared, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Dependency used but undeclared", ru: "Зависимость используется, но не объявлена" } }
    contract.operation-without-route: { predicate: operation-without-route, kind: operation-without-route, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Contract operation is not implemented", ru: "Операция контракта не реализована" } }
    contract.route-without-operation: { predicate: route-without-operation, kind: route-without-operation, sonar: bug, severity: minor, section: code, action: task, enabled: true, label: { en: "Route is not in the contract", ru: "Маршрута нет в контракте" } }
    document.contradiction: { predicate: document-contradiction, kind: document-contradiction, sonar: bug, severity: major, section: documents, action: task, enabled: true, label: { en: "Contradiction", ru: "Противоречие" } }
    document.stale: { predicate: document-stale, kind: document-stale, sonar: bug, severity: major, section: documents, action: task, enabled: true, label: { en: "Stale statement", ru: "Устаревшее утверждение" } }
    document.undocumented: { predicate: document-undocumented, kind: document-undocumented, sonar: code-smell, severity: major, section: documents, action: task, enabled: true, label: { en: "Undocumented behaviour", ru: "Неописанное поведение" } }
    document.ambiguous-term: { predicate: document-ambiguous, kind: document-ambiguous, sonar: code-smell, severity: minor, section: documents, action: task, enabled: true, label: { en: "Ambiguous term", ru: "Неоднозначный термин" } }
    wiki.correction: { predicate: wiki, kind: correction, sonar: bug, severity: major, section: wiki, action: task, enabled: true, label: { en: "Correction", ru: "Исправление" } }
    wiki.ground-removed: { predicate: wiki, kind: ground-removed, sonar: bug, severity: major, section: wiki, action: task, enabled: true, label: { en: "Ground removed", ru: "Основание исчезло" } }
    wiki.broken-link: { predicate: wiki, kind: broken-link, sonar: bug, severity: major, section: wiki, action: task, enabled: true, label: { en: "Broken link", ru: "Ссылка никуда не ведёт" } }
    wiki.unreadable-file: { predicate: wiki, kind: unreadable-file, sonar: bug, severity: major, section: wiki, action: task, enabled: true, label: { en: "Unreadable file", ru: "Файл не читается" } }
    wiki.unplaced: { predicate: wiki, kind: unplaced, sonar: code-smell, severity: minor, section: wiki, action: task, enabled: true, label: { en: "Unplaced finding", ru: "Находка без места" } }
    wiki.manifest: { predicate: wiki, kind: manifest, sonar: bug, severity: major, section: wiki, action: task, enabled: true, label: { en: "Manifest finding", ru: "Замечание к манифесту" } }
