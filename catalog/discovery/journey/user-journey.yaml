id: practice.user-journey
purpose: understand
audience: [product, analyst, designer]
definition: A user journey is a person's experience of reaching an outcome over time, including the moments outside the product.
sources:
- https://www.nngroup.com/articles/journey-mapping-101/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: User journey
    many: User journeys
  ru:
    one: Путь пользователя
    many: Пути пользователя
description:
  en: A user journey describes what a person goes through while trying to reach a goal, across all the channels and moments involved, including waiting, talking to other people and using other services. It captures how the person feels at each stage, not only which screens they saw.
  ru: 'Путь пользователя описывает, что человек переживает на пути к цели, во всех каналах и во все моменты: ожидание, разговоры с другими людьми, другие сервисы. В нём важно и то, что человек чувствует на каждом этапе, а не только какие экраны он видел.'
