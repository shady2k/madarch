id: practice.touchpoint
purpose: understand
audience: [product, analyst, designer]
definition: A touchpoint is a place in a journey where a person meets the product or the organisation.
sources:
- https://www.nngroup.com/articles/journey-mapping-101/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Touchpoint
    many: Touchpoints
  ru:
    one: Точка контакта
    many: Точки контакта
description:
  en: 'A touchpoint is any moment where a person comes into contact with the product or the organisation: a screen, a letter, a phone call, a shop counter. Journeys are made of touchpoints, and each one can help or hinder the person.'
  ru: 'Точка контакта — любой момент, когда человек соприкасается с продуктом или организацией: экран, письмо, звонок, стойка в магазине. Путь человека складывается из точек контакта, и каждая может помочь или помешать.'
