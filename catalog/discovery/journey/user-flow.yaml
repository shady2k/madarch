id: practice.user-flow
purpose: understand
audience: [product, analyst, designer]
definition: A user flow is the sequence of steps a person takes through the product to reach one outcome.
sources:
- https://www.nngroup.com/articles/journey-mapping-101/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: User flow
    many: User flows
  ru:
    one: Пользовательский путь
    many: Пользовательские пути
description:
  en: A user flow follows one person through the product from a starting point to a single outcome, such as placing an order. It shows each step, each decision and each place the person can go next.
  ru: Пользовательский путь — последовательность шагов, которые человек проходит по продукту от начала до одного результата, например до оформления заказа. В нём видны каждый шаг, каждое решение и каждый дальнейший вариант.
derives-from:
- user-journey
