id: practice.interview
purpose: understand
audience: [product, analyst, designer]
definition: An interview is a recorded conversation with a person that yields research findings.
sources:
- https://www.nngroup.com/articles/user-interviews/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Interview
    many: Interviews
  ru:
    one: Интервью
    many: Интервью
description:
  en: An interview is a conversation in which a researcher asks a person about their work, their needs and their difficulties, and records what they say. The conversation is later read for findings rather than taken as a vote.
  ru: Интервью — разговор, в котором исследователь расспрашивает человека о его работе, нуждах и трудностях и записывает сказанное. Позднее из разговора выводят находки, а не считают его голосом на голосовании.
