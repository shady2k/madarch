id: practice.research-question
purpose: understand
audience: [product, analyst, designer]
definition: A research question is the question a piece of user research is meant to answer.
sources:
- https://www.nngroup.com/articles/ux-research-cheat-sheet/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Research question
    many: Research questions
  ru:
    one: Вопрос исследования
    many: Вопросы исследования
description:
  en: A research question states what a team does not yet know about its users and wants to learn, such as why people abandon a purchase. It keeps the interviews, observations and surveys pointed at one answer.
  ru: 'Вопрос исследования формулирует то, чего команда ещё не знает о своих пользователях и хочет выяснить: например, почему люди бросают покупку. Он держит интервью, наблюдения и опросы нацеленными на один ответ.'
