id: practice.survey
purpose: understand
audience: [product, analyst, designer]
definition: A survey is a set of questions put to many people, whose answers are evidence for a decision.
sources:
- https://www.nngroup.com/articles/which-ux-research-methods/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Survey
    many: Surveys
  ru:
    one: Опрос
    many: Опросы
description:
  en: A survey asks the same questions of many people and collects their answers, usually in writing or online. The answers show how common a view or a problem is, while interviews and observations explain why.
  ru: Опрос задаёт одним и тем же набором вопросов многим людям и собирает их ответы, обычно письменно или через интернет. Ответы показывают, насколько распространено мнение или затруднение, а интервью и наблюдения объясняют почему.
