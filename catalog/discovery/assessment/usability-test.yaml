id: practice.usability-test
purpose: quality
audience: [designer, tester, product, analyst]
definition: A usability test is a session in which people use the product while their success and their difficulties are recorded.
sources:
- https://www.nngroup.com/articles/usability-testing-101/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Usability test
    many: Usability tests
  ru:
    one: Тест удобства
    many: Тесты удобства
description:
  en: A usability test puts a person in front of the product with a task to do and watches how it goes. The session records what the person succeeded at, where they hesitated or failed, and what they said aloud.
  ru: Тест удобства — занятие, на котором человек получает задачу и работает с продуктом, а наблюдатели записывают, как это идёт. В записи сессии остаётся, что человек сделал, где замялся или не справился и что сказал вслух.
