id: practice.pull-request-review
purpose: quality
audience: [developer, tester]
definition: A pull-request review is the assessment one or more people give a proposed change, with their comments and their verdict.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - reviews
  in:
  - reviews
template-policy: none
labels:
  en:
    one: Pull-request review
    many: Pull-request reviews
  ru:
    one: Просмотр запроса на слияние
    many: Просмотры запросов на слияние
description:
  en: 'A pull-request review records what one or more reviewers thought of a proposed change: their comments on the code, their questions and the verdict to approve, request changes or comment. It is the conversation a change goes through before it is merged.'
  ru: 'Просмотр запроса на слияние фиксирует, что один или несколько проверяющих думают о предложенном изменении: замечания к коду, вопросы и решение одобрить, потребовать изменений или просто высказаться. Это разговор, через который проходит изменение до слияния.'
