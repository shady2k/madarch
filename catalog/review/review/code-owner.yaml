id: codeowners.owner
purpose: history
audience: [developer, architect]
definition: A code owner is a person or a team named as the reviewer for a set of paths in a repository.
sources:
- https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - ownedBy
  in:
  - ownedBy
template-policy: none
labels:
  en:
    one: Code owner
    many: Code owners
  ru:
    one: Владелец кода
    many: Владельцы кода
description:
  en: A code owner is a person or a team that a repository's CODEOWNERS file names as the reviewer for particular files or folders. Their review is expected before a change to those paths is merged.
  ru: Владелец кода — человек или команда, которых файл CODEOWNERS в репозитории называет проверяющими для определённых файлов или папок. Их просмотр ожидается до того, как изменение этих путей будет слито.
