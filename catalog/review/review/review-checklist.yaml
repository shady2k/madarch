id: practice.review-checklist
purpose: quality
audience: [developer, tester]
definition: A review checklist is the list of points a reviewer is expected to check before approving a change.
sources:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Review checklist
    many: Review checklists
  ru:
    one: Контрольный список просмотра
    many: Контрольные списки просмотра
description:
  en: A review checklist lists the points a reviewer should check before approving a change, such as tests, error handling, security and documentation. It makes the review the same for everyone and reminds the reviewer of what is easy to miss.
  ru: 'Контрольный список просмотра перечисляет то, что проверяющий должен посмотреть до одобрения изменения: тесты, обработку ошибок, безопасность, документацию. Он делает просмотр одинаковым для всех и напоминает о том, что легко пропустить.'
derives-from:
- code-convention
- secure-development-practice
