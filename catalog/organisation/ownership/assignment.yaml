id: practice.assignment
purpose: history
audience: [product-lead, product, architect]
definition: An assignment is a piece of work given to a person or a group, with the time it is expected by.
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - assigns
  in:
  - assigns
template-policy: none
labels:
  en:
    one: Assignment
    many: Assignments
  ru:
    one: Назначение
    many: Назначения
description:
  en: An assignment says who is to do which piece of work and by when, such as a task, a review or a shift. It turns a plan into a duty someone holds.
  ru: 'Назначение говорит, кто должен выполнить какую работу и к какому сроку: задачу, просмотр или смену. Оно превращает план в обязанность конкретного человека или группы.'
