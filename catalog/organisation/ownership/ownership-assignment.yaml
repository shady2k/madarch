id: practice.ownership-assignment
purpose: history
audience: [product-lead, architect, developer, operations]
definition: An ownership assignment records that one element of the product belongs to one person or group, and since when.
sources:
- https://backstage.io/docs/features/software-catalog/well-known-relations
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - assigns
  in:
  - assigns
template-policy: none
labels:
  en:
    one: Ownership assignment
    many: Ownership assignments
  ru:
    one: Назначение владельца
    many: Назначения владельца
description:
  en: An ownership assignment states that a person or a group owns a named element, from a given date. A new assignment ends the previous one, so the product always has one answer to who is responsible.
  ru: Назначение владельца фиксирует, что определённый элемент продукта принадлежит человеку или группе с определённой даты. Новое назначение сменяет прежнее, поэтому у элемента всегда один ответственный.
