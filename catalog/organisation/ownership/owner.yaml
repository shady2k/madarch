id: backstage.owner
purpose: history
audience: [product-lead, architect, developer, operations]
definition: An owner is the person or the group that answers for an element of the product.
sources:
- https://backstage.io/docs/features/software-catalog/well-known-relations
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - ownedBy
  in:
  - ownedBy
template-policy: none
labels:
  en:
    one: Owner
    many: Owners
  ru:
    one: Владелец
    many: Владельцы
description:
  en: An owner is the person or the group that answers for one element of the product, such as a service, a kind of data or a repository. The owner decides what happens to it and is the one others ask when it changes.
  ru: 'Владелец — человек или группа, которые отвечают за один элемент продукта: сервис, вид данных или репозиторий. Владелец решает, что с ним будет, и к нему обращаются, когда элемент меняется.'
