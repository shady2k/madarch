id: backstage.user
purpose: history
audience: [product-lead, product, architect]
definition: A user is a person the product knows, with the identity they sign in by.
sources:
- https://backstage.io/docs/features/software-catalog/well-known-relations
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - memberOf
  in:
  - hasMember
template-policy: none
labels:
  en:
    one: User
    many: Users
  ru:
    one: Пользователь
    many: Пользователи
description:
  en: A user is a person who has an account or a known identity in the product and uses it, whether a customer, an employee or a partner. The product keeps the identity they sign in with, their preferences and what they are allowed to do.
  ru: 'Пользователь — человек, которого продукт знает по учётной записи или иной идентичности и который им пользуется: клиент, сотрудник или партнёр. Продукт хранит его идентичность для входа, его настройки и то, что ему разрешено делать.'
