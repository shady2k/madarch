id: scrum.accountability
purpose: history
audience: [product-lead, product, architect]
definition: An accountability is what a role answers for, as the Scrum Guide states for a Scrum team.
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Accountability
    many: Accountabilities
  ru:
    one: Ответственность
    many: Ответственности
description:
  en: 'An accountability is the part of the work that a role owns and answers for, such as the product owner''s care for the product''s value. The Scrum Guide names three on a Scrum team: the product owner, the developers and the scrum master.'
  ru: 'Ответственность — то, за что роль держит ответ: например, владелец продукта отвечает за ценность продукта. Scrum Guide называет три такие роли в команде Scrum: владелец продукта, разработчики и скрам-мастер.'
