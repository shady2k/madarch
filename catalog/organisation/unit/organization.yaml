id: org.organization
purpose: history
audience: [product-lead, product, architect]
definition: An organisation is a body of people with a common purpose, which holds its units and its members.
sources:
- https://www.w3.org/TR/vocab-org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - hasMember
  in:
  - memberOf
template-policy: none
labels:
  en:
    one: Organisation
    many: Organisations
  ru:
    one: Организация
    many: Организации
description:
  en: An organisation is a group of people working towards a common purpose under a name, with its units, roles and members. A company, a public body or a non-profit is an organisation, as W3C ORG defines it.
  ru: Организация — объединение людей с общей целью и названием, у которого есть подразделения, роли и участники. Компания, государственный орган или некоммерческое объединение — всё это организации, как определяет W3C ORG.
