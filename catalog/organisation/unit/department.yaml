id: org.organizational-unit
purpose: history
audience: [product-lead, product, architect]
definition: A department is a division of an organisation that stands above its teams.
sources:
- https://www.w3.org/TR/vocab-org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Department
    many: Departments
  ru:
    one: Подразделение
    many: Подразделения
description:
  en: A department groups teams and people under one part of the organisation, such as finance, engineering or customer service. It usually has its own leader, budget and responsibilities.
  ru: 'Подразделение объединяет команды и людей в одну часть организации: финансы, разработку или обслуживание клиентов. У него обычно есть руководитель, бюджет и свои обязанности.'
derives-from:
- organization
