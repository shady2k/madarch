id: practice.known-failure
purpose: operations
audience: [developer, platform-devops]
definition: A newcomer failure is a failure the README names, with its symptom and its fix.
sources:
- https://diataxis.fr/
acquisition:
- extractor operations
status: implemented
relation-constraints:
  out:
  - documents
  in:
  - documents
template-policy: page
source: graph
details:
- symptom
- command
- fix
- port
labels:
  en:
    one: Known failure
    many: Known failures
  ru:
    one: Известная ошибка
    many: Известные ошибки
description:
  en: A newcomer failure records a problem that people hit while following the README, how it shows itself and what resolves it. Naming it saves the next person the same search.
  ru: Известная ошибка — проблема, с которой сталкиваются, следуя README, как она проявляется и что её устраняет. Названная заранее, она избавляет следующего человека от тех же поисков.
