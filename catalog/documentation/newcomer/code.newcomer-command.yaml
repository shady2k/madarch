id: practice.setup-command
purpose: operations
audience: [developer, platform-devops]
definition: A newcomer command is a command the README tells a newcomer to run.
sources:
- https://diataxis.fr/
acquisition:
- agent-from-graph
- extractor operations
relation-constraints:
  out:
  - documents
  - partOf
  in:
  - documents
template-policy: page
source: graph
details:
- command
- folder
- purpose
- order
fields:
- name: command
  type: text
  binding:
    agent: The command as a newcomer runs it, in the words the repository gives it.
- name: purpose
  type: text
  nullable: true
  binding:
    agent: What the command does, in one sentence, from the documents that mention
      it in the graph.
- name: order
  type: integer
  nullable: true
  binding:
    agent: Where the command stands in the setup, lowest first, from the order the
      documents give.
key:
- command
derives-from:
- document
labels:
  en:
    one: Setup command
    many: Setup commands
  ru:
    one: Команда запуска
    many: Команды запуска
description:
  en: 'A newcomer command is one line a README asks a person to run when they first open the repository: install the dependencies, start the tests, build the project. It is the first thing a new developer types, so it must work on a fresh machine.'
  ru: 'Команда запуска — строка, которую README просит выполнить при первом знакомстве с репозиторием: установить зависимости, запустить тесты, собрать проект. Её новый разработчик набирает первой, поэтому она должна работать на чистой машине.'

key-edges:
- role: code.newcomer-command-repository
  edge: code.newcomer-command-repository
  side: from
