id: practice.problem-dismissal
purpose: quality
audience: [product, analyst, developer, tester]
definition: A problem dismissal records why a person judged a finding not to be a problem, naming its rule and stable identity.
sources:
- https://arc42.org/overview
acquisition:
- conversation
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: page
source: graph
fields:
- name: rule
  type: text
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The rule front matter value.
- name: identity
  type: text
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The identity front matter value.
- name: place
  type: text
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The place front matter value.
- name: dismissal_reason
  type: text
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The reason front matter value.
- name: by
  type: json
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The by front matter object {name, email, verified}.
- name: at
  type: timestamp
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The at front matter timestamp.
- name: file
  type: text
  binding:
    agent: Read each docs/problems/**/*.md source file as one entity. The repository-relative source file path.
key:
- rule
- identity
origin: person
details:
- rule
- identity
- place
- dismissal_reason
- by
- at
- file
labels:
  en:
    one: Problem dismissal
    many: Problem dismissals
  ru:
    one: Отклонение проблемы
    many: Отклонения проблем
description:
  en: 'A problem dismissal is a person''s decision that a reported finding does not need fixing, with the reason: a false positive, an accepted risk, a rule that does not apply here. It names the rule and the finding, so the same finding is not raised and dismissed again.'
  ru: 'Отклонение проблемы — решение человека, что найденная проблема не требует исправления, с причиной: ложное срабатывание, принятый риск, неприменимое здесь правило. Оно называет правило и саму находку, чтобы одну и ту же не находили и не отклоняли снова.'
