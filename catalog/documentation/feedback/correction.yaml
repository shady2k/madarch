id: practice.correction
purpose: quality
audience:
- product
- analyst
- developer
- tester
definition: A correction is a person's statement that something a product document
  says is wrong, with the ground it rests on.
sources:
- https://arc42.org/overview
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - evidences
  - affects
  in:
  - evidences
template-policy: page
source: graph
origin: person
details:
- statement
- correction_reason
- status
- at
- resolved_at
- file
fields:
- name: statement
  type: text
  binding:
    agent: What the document says that is wrong, in the person's words.
- name: correction_reason
  type: text
  nullable: true
  binding:
    agent: 'The ground the correction rests on: what is true instead, and where it
      is seen.'
- name: status
  type: value-set-value
  nullable: true
  binding:
    agent: Where the correction stands, as the work kinds keep it.
- name: at
  type: timestamp
  nullable: true
  binding:
    agent: When the correction was made.
- name: resolved_at
  type: timestamp
  nullable: true
  binding:
    agent: When the correction was settled.
- name: slug
  type: text
  nullable: true
  binding:
    agent: The stable slug used by the correction presentation.
- name: file
  type: text
  nullable: true
  binding:
    agent: The product-relative Markdown path carrying the correction.
- name: language
  type: text
  nullable: true
  binding:
    agent: The language tag of the correction text.
nav: loop
labels:
  en:
    one: Correction
    many: Corrections
  ru:
    one: Поправка
    many: Поправки
description:
  en: 'A correction records a person saying that a statement in the product''s documents
    is wrong, and why they think so: a changed fact, a different rule, an example
    that contradicts it. It is kept beside the statement until someone confirms and
    rewrites it.'
  ru: 'Поправка фиксирует, что человек считает утверждение в документах продукта неверным,
    и почему: изменился факт, правило другое, пример противоречит. Её держат рядом
    с утверждением, пока кто-то не подтвердит и не перепишет его.'
