id: practice.enrichment
purpose: quality
audience: [product, analyst, developer, tester]
definition: What the agent established about a use case, a rule or a decision from the code and the graph.
sources:
- https://arc42.org/overview
acquisition:
- agent-from-graph
status: implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: page
template: templates/enrichment.liquid
source: graph
fields:
- name: title
  type: text
  binding:
    agent: 'Read docs/enrichment/**/*.md: the page title; use it as the entity label.'
- name: slug
  type: text
  binding:
    agent: 'Read docs/enrichment/**/*.md: The stable page slug from its id; identify the entity with its declared page id.'
- name: body
  type: text
  binding:
    agent: 'Read docs/enrichment/**/*.md: The complete Markdown body, preserving paragraphs and references.'
- name: body_line
  type: integer
  binding:
    agent: 'Read docs/enrichment/**/*.md: The positive source line where the body starts.'
- name: file
  type: text
  binding:
    agent: 'Read docs/enrichment/**/*.md: The repository-relative page source path.'
- name: relates
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: The array of related entity ids.'
- name: sources
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: The array of source paths.'
- name: statements
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: Complete statements as [{id,text,digest,labels,mentions,grounds,line,paragraph}],
      preserving ids and grounds.'
- name: digest
  type: text
  binding:
    agent: 'Read docs/enrichment/**/*.md: The body digest identifying this page revision.'
- name: producer
  type: text
  nullable: true
  binding:
    agent: 'Read docs/enrichment/**/*.md: The producer text, or null when absent.'
- name: links
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: All body links as [{url,line,ground}].'
- name: findings
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: All page findings as [{file,line,message}].'
- name: ungrounded
  type: json
  binding:
    agent: 'Read docs/enrichment/**/*.md: All ungrounded statements as [{text,line}].'
key:
- slug
origin: agent
labels:
  en:
    one: Enrichment
    many: Enrichments
  ru:
    one: Обогащение
    many: Обогащения
description:
  en: 'What the agent established about a use case, a rule or a decision of the documents: its parts in their own order, the
    code that carries it out, and the chain from its route — written beside the person''s text, never over it.'
  ru: 'То, что агент установил о сценарии, правиле или решении из документов: их части в своём порядке, код, который их выполняет,
    и цепочка от маршрута — записано рядом с текстом человека, а не поверх него.'
