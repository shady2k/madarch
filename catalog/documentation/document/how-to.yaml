id: practice.how-to
purpose: operations
audience: [product, analyst, developer, operations]
definition: A how-to gives the steps that solve one real problem a person has.
sources:
- https://diataxis.fr/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: How-to
