description:
  en: A how-to is a short set of steps for one concrete task, such as connecting a bank account or rotating a key. It assumes the reader already knows the product and needs the exact sequence that works.
  ru: 'Инструкция — короткий набор шагов для одной конкретной задачи: подключить банковский счёт или сменить ключ. Она исходит из того, что читатель уже знает продукт и ему нужна точная работающая последовательность.'
derives-from:
- doc.use-case
