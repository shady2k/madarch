id: practice.document-section
purpose: understand
audience: [product, analyst, developer, operations]
definition: A document section is a heading and the text under it in a repository document.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/
acquisition:
- extractor code
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
details:
- heading
- level
- path
labels:
  en:
    one: Document section
    many: Document sections
  ru:
    one: Раздел документа
    many: Разделы документов
description:
  en: A document section is one part of a document, beginning at a heading and running to the next heading of the same or higher level. It groups related statements, so a reader or a tool can refer to that part by its heading.
  ru: Раздел документа — часть документа, которая начинается с заголовка и идёт до следующего заголовка того же или более высокого уровня. Он объединяет связанные утверждения, чтобы на эту часть можно было сослаться по заголовку.
