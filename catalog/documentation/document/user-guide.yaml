id: practice.user-guide
purpose: understand
audience: [product, analyst, designer, tester]
definition: A user guide describes the tasks a person can do with the product and the procedures that reach them.
sources:
- https://diataxis.fr/
acquisition:
- agent-from-graph
relation-constraints:
  out:
  - documents
  in:
  - documents
template-policy: page
source: graph
origin: agent
labels:
  en:
    one: User guide
    many: User guide
  ru:
    one: Руководство пользователя
    many: Руководство пользователя
description:
  en: A user guide explains what the product lets a person do and how to do each thing, in the language of the work rather than of the code. It is the reference a user returns to when a task is unclear.
  ru: Руководство пользователя объясняет, что продукт позволяет человеку делать и как делать каждое дело, на языке работы, а не кода. К нему возвращаются, когда задача неясна.
