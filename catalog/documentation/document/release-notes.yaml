id: practice.release-notes
purpose: history
audience: [product, analyst, developer, operations]
definition: Release notes say what one release changes for the people who use the product.
sources:
- https://keepachangelog.com/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Release notes
    many: Release notes
  ru:
    one: Заметки о выпуске
    many: Заметки о выпуске
description:
  en: 'Release notes describe one release from the user''s side: new behaviour, changed behaviour, fixed problems and anything that requires action before upgrading. They are shorter and more focused than a changelog, which covers many releases.'
  ru: 'Заметки о выпуске описывают один выпуск со стороны пользователя: что появилось, что изменилось, что исправлено и что нужно сделать до обновления. Они короче и точнее журнала изменений, который охватывает много выпусков.'
derives-from:
- release
