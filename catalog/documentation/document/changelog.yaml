id: practice.changelog
purpose: history
audience: [product, analyst, developer, operations]
definition: A changelog is the ordered list of what changed in the product between releases.
sources:
- https://keepachangelog.com/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - contains
template-policy: none
labels:
  en:
    one: Changelog
    many: Changelogs
  ru:
    one: Журнал изменений
    many: Журналы изменений
description:
  en: A changelog lists, release by release, what was added, changed, fixed or removed, in words the people who use the product understand. Its order lets a reader see what arrived when and whether an upgrade affects them.
  ru: Журнал изменений перечисляет выпуск за выпуском, что добавили, изменили, исправили или убрали, словами, понятными пользователям продукта. По порядку видно, что и когда появилось и затронет ли обновление читателя.
