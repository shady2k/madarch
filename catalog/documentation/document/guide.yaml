id: practice.guide
purpose: understand
audience: [product, analyst, developer, operations]
definition: A guide is a written walkthrough that takes a person through a task to an outcome.
sources:
- https://diataxis.fr/
acquisition:
- document
- agent-from-graph
relation-constraints:
  out:
  - documents
  - hasPart
  - partOf
  in:
  - documents
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the guide is known by, such as Administrator guide or User guide; it is the guide's key.
- name: audience
  type: json
  nullable: true
  reference: role
  binding:
    agent: The role the guide is written for, by the key of that role in the graph.
- name: purpose
  type: text
  nullable: true
  binding:
    agent: What the guide takes its reader through, in one or two sentences, from the sections it holds in the graph.
- name: document
  type: text
  nullable: true
  reference: document
  binding:
    agent: The document the guide is read from, where the product holds it as a document.
key:
- name
derives-from:
- document
labels:
  en:
    one: Guide
    many: Guides
  ru:
    one: Руководство
    many: Руководства
description:
  en: A guide leads a reader through a piece of work from a starting point to a result, explaining each step and why it is needed. It assumes the reader wants to get something done, not to learn the product from the beginning.
  ru: Руководство ведёт читателя через работу от начала к результату, объясняя каждый шаг и зачем он нужен. Оно исходит из того, что читатель хочет что-то сделать, а не изучить продукт с самого начала.
