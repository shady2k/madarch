id: practice.document
purpose: understand
audience: [product, analyst, developer, operations]
definition: A document is a written text of the product, such as a README, a guide or a reference.
sources:
- https://diataxis.fr/
acquisition:
- document
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  - linksTo
  - documents
  - partOf
  in:
  - documents
  - partOf
template-policy: page
source: graph
fields:
- name: repository
  type: text
  reference: code.repository
  binding:
    agent: The repository the document stands in, by the key of that repository in the graph.
- name: path
  type: path
  labels:
    en: Path
    ru: Путь
  binding:
    agent: The path of the document in the repository.
- name: title
  type: text
  nullable: true
  binding:
    agent: The title the document gives itself.
- name: format
  type: text
  nullable: true
  binding:
    agent: 'The form the document is written in: Markdown, reStructuredText, AsciiDoc or plain text.'
- name: commit
  type: text
  nullable: true
  reference: code.commit
  binding:
    agent: The commit whose text the document was read at, where the graph holds one.
key:
- repository
- path
derives-from:
- code.file
labels:
  en:
    one: Document
    many: Documents
  ru:
    one: Документ
    many: Документы
description:
  en: 'A document is a text written for a person who works with the product: what it is for, how to use it, how it is built or what was decided. It has a title, sections and a place in the repository, and its purpose decides what belongs in it.'
  ru: 'Документ — текст, написанный для человека, который работает с продуктом: для чего он, как им пользоваться, как он устроен или что решили. У документа есть название, разделы и место в репозитории, а его назначение решает, что в нём должно быть.'
