id: practice.document
purpose: understand
audience: [product, analyst, developer, operations]
definition: A document is a written text of the product, such as a README, a guide or a reference.
sources:
- https://diataxis.fr/
acquisition:
- document
- conversation
status: implemented
relation-constraints:
  out:
  - hasDocumentation
  in:
  - documents
template-policy: page
source: graph
fields:
- name: commit
  type: text
  binding:
    agent: 'Read each **/*.md source file at the pinned repository revision: the exact commit that grounds its Markdown, heading
      anchors and line extents.'
- name: path
  type: text
  binding:
    agent: 'Read each **/*.md source file: repository-relative path of the document.'
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read each **/*.md source file: the repository name, or null for the product repository.'
- name: markdown
  type: text
  binding:
    agent: 'Read each **/*.md source file: the full document Markdown.'
- name: anchors
  type: json
  binding:
    agent: 'Read each **/*.md source file: map each Markdown heading anchor to {title, start, end, markdown}, preserving source
      line numbers and full section Markdown.'
- name: links
  type: json
  binding:
    agent: 'Read each **/*.md source file: an array of Markdown link targets for document navigation.'
key:
- repository
- path
labels:
  en:
    one: Document
    many: Documents
  ru:
    one: Документ
    many: Документы
description:
  en: 'A document is a text written for a person who works with the product: what it is for, how to use it, how it is built or what was decided. It has a title, sections and a place in the repository, and its purpose decides what belongs in it.'
  ru: 'Документ — текст, написанный для человека, который работает с продуктом: для чего он, как им пользоваться, как он устроен или что решили. У документа есть название, разделы и место в репозитории, а его назначение решает, что в нём должно быть.'
