id: practice.document
purpose: understand
audience: [product, analyst, developer, operations]
definition: A document is a written text of the product, such as a README, a guide or a reference.
sources:
- https://diataxis.fr/
acquisition:
- document
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  - linksTo
  - documents
  - partOf
  in:
  - documents
  - partOf
template-policy: page
source: graph
fields:
- name: content
  type: text
  labels: {en: Content, ru: Содержимое}
  binding:
    agent: The document text from its declared source.
- name: anchors
  type: document-anchors
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:document-anchors:v1
  labels: {en: Sections, ru: Разделы}
  binding:
    agent: Every document section keyed by its exact anchor, with title, start and end lines and Markdown excerpt.
- name: path
  type: path
  labels:
    en: Path
    ru: Путь
  binding:
    agent: The path of the document in the repository.
- name: title
  type: text
  nullable: true
  binding:
    agent: The title the document gives itself.
- name: format
  type: text
  nullable: true
  binding:
    agent: 'The form the document is written in: Markdown, reStructuredText, AsciiDoc
      or plain text.'
key:
- path
derives-from:
- product
labels:
  en:
    one: Document
    many: Documents
  ru:
    one: Документ
    many: Документы
description:
  en: 'A document is a text written for a person who works with the product: what it is for, how to use it, how it is built or what was decided. It has a title, sections and a place in the repository, and its purpose decides what belongs in it.'
  ru: 'Документ — текст, написанный для человека, который работает с продуктом: для чего он, как им пользоваться, как он устроен или что решили. У документа есть название, разделы и место в репозитории, а его назначение решает, что в нём должно быть.'

key-edges:
- role: document-repository
  edge: document-repository
  side: from
