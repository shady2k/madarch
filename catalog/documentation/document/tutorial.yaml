description:
  en: A tutorial starts with a person who knows nothing and leads them to a finished small result, teaching one thing at a time. Every step is meant to work, so the learner gains confidence as well as knowledge.
  ru: Учебник начинает с человека, который ничего не знает, и ведёт его к небольшому законченному результату, уча одному за раз. Каждый шаг должен работать, чтобы учащийся получил и уверенность, и знания.
