id: practice.support-answer
purpose: understand
audience: [operations, product, developer]
definition: A support answer is the answer support gave a request, and whether it solved the problem.
sources:
- https://www.atlassian.com/software/jira/service-management
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Support answer
    many: Support answers
  ru:
    one: Ответ поддержки
    many: Ответы поддержки
description:
  en: A support answer records what support told a person who asked for help, and whether that resolved the problem. Reused answers become the basis of FAQ entries and troubleshooting steps.
  ru: Ответ поддержки фиксирует, что поддержка сказала человеку, обратившемуся за помощью, и решило ли это проблему. Повторно использованные ответы становятся основой частых вопросов и шагов устранения неполадок.
