id: practice.support-request
purpose: quality
audience: [operations, product, developer]
definition: A support request is a question or a problem a person raises with the support of the product.
sources:
- https://www.atlassian.com/software/jira/service-management
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Support request
    many: Support requests
  ru:
    one: Обращение в поддержку
    many: Обращения в поддержку
description:
  en: 'A support request is a message in which a user, a customer or a colleague asks for help with the product: something does not work, is unclear or is missing. It carries the situation, what was tried and what the person expected.'
  ru: 'Обращение в поддержку — сообщение, в котором пользователь, клиент или коллега просит помочь с продуктом: что-то не работает, непонятно или отсутствует. В нём описаны обстановка, что уже пробовали и чего человек ожидал.'
derives-from:
- person
- product
