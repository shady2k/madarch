id: practice.known-issue
purpose: quality
audience: [operations, product, developer]
definition: A known issue is a defect or a limitation the people who use the product are told about.
sources:
- https://glossary.istqb.org/en_US/term/defect
acquisition:
- document
- agent-from-graph
relation-constraints:
  out:
  - refines
  - documents
  in:
  - refines
  - documents
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: 'What people meet, in the words the product tells them: the symptom and where it shows.'
- name: symptom
  type: text
  nullable: true
  binding:
    agent: What the person sees when they meet the issue.
- name: fix
  type: text
  nullable: true
  binding:
    agent: What a person does about it, in the words of the document that tells them.
- name: command
  type: text
  nullable: true
  binding:
    agent: The command that clears it, where the document gives one.
key:
- name
derives-from:
- document
labels:
  en:
    one: Known issue
    many: Known issues
  ru:
    one: Известная проблема
    many: Известные проблемы
description:
  en: A known issue describes a defect or a limitation that is already understood but not yet fixed, and what a person can do meanwhile. It is published so users do not spend time reporting what is already known.
  ru: Известная проблема описывает дефект или ограничение, о котором уже знают, но ещё не исправили, и что человек может делать пока. Её публикуют, чтобы пользователи не тратили время на сообщения о том, что уже известно.
