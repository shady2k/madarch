id: practice.faq
purpose: understand
audience: [operations, product, developer]
definition: A frequently asked question is a question people often ask, with the answer that resolves it.
sources:
- https://diataxis.fr/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: FAQ
    many: FAQs
  ru:
    one: Частый вопрос
    many: Частые вопросы
description:
  en: A frequently asked question is one that users, customers or colleagues keep raising, written with an answer that ends the need to ask. The answers are short and point to the full document where one exists.
  ru: Частый вопрос — тот, который постоянно задают пользователи, клиенты или коллеги, вместе с ответом, после которого спрашивать больше не нужно. Ответы короткие и указывают на полный документ, если он есть.
