id: sacm.claim
purpose: quality
audience: [product, analyst, tester, architect]
definition: An assurance claim is a proposition an assurance case argues for, supported by an argument and evidence.
sources:
- https://www.omg.org/spec/SACM/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  - refines
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Assurance claim
    many: Assurance claims
  ru:
    one: Утверждение обеспечения
    many: Утверждения обеспечения
description:
  en: An assurance claim states something that must be true for the product to be acceptable, such as that no single fault can cause a hazardous failure. It is the top of an assurance case, which must show why it holds.
  ru: 'Утверждение обеспечения говорит, что должно быть верно, чтобы продукт был приемлем: например, что один отказ не может привести к опасному сбою. С него начинается обоснование обеспечения, которое должно показать, почему это верно.'
derives-from:
- assurance-case
