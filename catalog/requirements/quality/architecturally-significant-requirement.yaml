id: practice.asr
purpose: quality
audience: [architect, analyst, developer, tester]
definition: An architecturally significant requirement is a requirement that measurably affects the architecture, so a decision answers it.
sources:
- https://adr.github.io/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Architecturally significant requirement
    many: Architecturally significant requirements
  ru:
    one: Архитектурно значимое требование
    many: Архитектурно значимые требования
description:
  en: 'An architecturally significant requirement is one whose fulfilment shapes the structure of the system: a performance target, a regulation, a need to work offline, a hard limit on cost. It is singled out because it must drive an architecture decision rather than be fitted in later.'
  ru: 'Архитектурно значимое требование — то, выполнение которого определяет устройство системы: цель по производительности, правило закона, работа без сети, жёсткое ограничение стоимости. Его выделяют, потому что оно должно вести архитектурное решение, а не подстраиваться под него потом.'
