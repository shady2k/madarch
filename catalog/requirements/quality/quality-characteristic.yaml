id: iso25010.quality-characteristic
purpose: quality
audience: [product, analyst, tester, architect]
definition: A quality characteristic is one of the characteristics a quality requirement is stated against, as ISO/IEC 25010 lists them.
sources:
- https://committee.iso.org/standard/78176.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - refines
template-policy: none
labels:
  en:
    one: Quality characteristic
    many: Quality characteristics
  ru:
    one: Характеристика качества
    many: Характеристики качества
description:
  en: A quality characteristic names one aspect of how well the product works — performance, reliability, security, usability, maintainability — as ISO/IEC 25010 divides them. A quality requirement is stated against one such characteristic and measured with its sub-characteristics.
  ru: 'Характеристика качества называет одну сторону того, насколько хорошо работает продукт: производительность, надёжность, безопасность, удобство, сопровождаемость, — как их делит ISO/IEC 25010. Требование качества заявляют против такой характеристики и измеряют её подхарактеристиками.'
derives-from:
- system.product
