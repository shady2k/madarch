id: arc42.quality-scenario
purpose: quality
audience: [product, analyst, tester, architect]
definition: A quality scenario is a concrete, measurable situation that states a quality requirement so a test can judge it.
sources:
- https://arc42.org/overview
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  - verifies
  in:
  - refines
template-policy: none
labels:
  en:
    one: Quality scenario
    many: Quality scenarios
  ru:
    one: Сценарий качества
    many: Сценарии качества
description:
  en: A quality scenario describes a source of stimulation, the system's response and the measure that tells whether the response is good enough, for example a thousand users in one minute with a response under a second. Because it is concrete, a test or a review can decide whether the requirement is met.
  ru: 'Сценарий качества описывает источник воздействия, ответ системы и меру, по которой видно, достаточно ли хорош ответ: например, тысяча пользователей за минуту при отклике меньше секунды. Благодаря конкретности тест или проверка могут решить, выполнено ли требование.'
derives-from:
- doc.requirement
- quality-characteristic
