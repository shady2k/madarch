id: sacm.assurance-case
purpose: quality
audience: [product, analyst, tester, architect]
definition: An assurance case is a structured argument, with its evidence, that the product meets a claim such as a safety or security goal.
sources:
- https://www.omg.org/spec/SACM/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Assurance case
    many: Assurance cases
  ru:
    one: Обоснование обеспечения
    many: Обоснования обеспечения
description:
  en: An assurance case gathers a claim, the argument that supports it and the evidence behind every step, so someone outside the team can judge whether the claim holds. Safety and security cases are the common kinds.
  ru: Обоснование обеспечения собирает утверждение, рассуждение в его поддержку и доказательства за каждым шагом, чтобы человек вне команды мог судить, держится ли утверждение. Обоснования безопасности и защищённости — самые частые.
