id: iso29148.information-item
purpose: understand
audience: [product, analyst, tester, architect]
definition: A requirements specification states the requirements of a product in the form ISO/IEC/IEEE 29148 prescribes.
sources:
- https://standards.ieee.org/ieee/29148/6937/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  - hasRequirement
  in:
  - documents
template-policy: none
labels:
  en:
    one: Requirements specification
    many: Requirements specifications
  ru:
    one: Спецификация требований
    many: Спецификации требований
description:
  en: A requirements specification collects what the product must do and how well, in a structure that separates purpose, stakeholders, functions, qualities and constraints. ISO/IEC/IEEE 29148 describes what such a document should hold and how each requirement should be written.
  ru: Спецификация требований собирает то, что продукт должен делать и насколько хорошо, в структуре, которая отделяет назначение, заинтересованные стороны, функции, качества и ограничения. ISO/IEC/IEEE 29148 описывает, что должен содержать такой документ и как формулировать каждое требование.
derives-from:
- doc.requirement
