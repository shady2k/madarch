id: istqb.acceptance-criterion
purpose: quality
audience: [product, analyst, tester, developer, architect]
definition: An acceptance criterion is a condition a work product must meet to be accepted by its stakeholders.
sources:
- https://glossary.istqb.org/en_US/term/acceptance-criteria
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Acceptance criterion
    many: Acceptance criteria
  ru:
    one: Критерий приёмки
    many: Критерии приёмки
description:
  en: An acceptance criterion states one checkable condition that a piece of work must satisfy before it is accepted, such as a behaviour, a limit or a document. Written before the work starts, it turns an expectation into something the team and the stakeholder can agree on.
  ru: 'Критерий приёмки формулирует одно проверяемое условие, которому должна соответствовать работа до приёмки: поведение, предел или документ. Записанный до начала работы, он превращает ожидание в то, о чём команда и заинтересованная сторона могут договориться.'
