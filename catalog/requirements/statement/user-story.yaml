id: practice.user-story
purpose: understand
audience: [product, analyst, tester, developer, architect]
definition: A user story is a short narrative of a need from one person's point of view, with the benefit it carries.
sources:
- https://glossary.istqb.org/en_US/term/user-story
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  - hasAcceptanceCriterion
  in:
  - refines
template-policy: none
labels:
  en:
    one: User story
    many: User stories
  ru:
    one: Пользовательская история
    many: Пользовательские истории
description:
  en: 'A user story says who wants something, what they want and why it matters, in one or two sentences: as a customer, I want to save a card so that I can pay faster. It is a promise of a conversation, not a full specification.'
  ru: 'Пользовательская история говорит, кому что нужно и почему это важно, в одной-двух фразах: как клиент, я хочу сохранить карту, чтобы платить быстрее. Это повод для разговора, а не полная спецификация.'
