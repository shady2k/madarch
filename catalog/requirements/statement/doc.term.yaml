id: practice.glossary-term
purpose: understand
audience: [product, analyst, developer, architect, designer, tester]
definition: A glossary term is a concept with a definition in one subject field, named by a preferred label and synonyms.
sources:
- https://www.w3.org/TR/skos-reference/
- https://www.iso.org/standard/79077.html
acquisition:
- agent-from-graph
- document
- conversation
relation-constraints:
  out:
  - defines
  - partOf
  - implements
  - term.in-domain
  in:
  - uses
template-policy: page
source: graph
origin: person
fields:
- name: identifier
  type: text
  binding:
    agent: A stable identifier for this concept within its subject field, independent of its labels.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The preferred label of the concept; show the subject in brackets when the word is ambiguous.
- name: synonyms
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  binding:
    agent: Alternative labels for the same concept in this subject field.
- name: definition
  type: text
  binding:
    agent: The meaning of this concept within its subject field.
- name: ambiguous
  type: text
  nullable: true
  binding:
    agent: Other meanings of this word in other subject fields; never merge them solely because their labels match.
key:
- identifier
listing: glossary
nav: own-page
labels:
  en:
    one: Glossary term
    many: Glossary terms
  ru:
    one: Термин
    many: Термины
description:
  en: A glossary term is a concept defined within a subject field. Its preferred name and synonyms are labels, not its identity.
    The same word in two fields names two concepts; the field in brackets tells them apart.
  ru: Термин — понятие, определённое в предметной области. Предпочтительное имя и синонимы служат обозначениями, а не идентичностью.
    Одно слово в двух областях обозначает два понятия; область в скобках различает их.
derives-from:
- domain

key-edges:
- role: doc.term-subject
  edge: term.in-domain
  side: from
