id: practice.glossary-term
purpose: understand
audience: [product, analyst, developer, architect, designer, tester]
definition: A glossary term is a word or phrase of the product's own language whose meaning the product fixes once, so everyone uses it the same way.
sources:
- https://arc42.org/overview
acquisition:
- agent-from-graph
- document
- conversation
relation-constraints:
  out:
  - defines
  - partOf
  - implements
  in:
  - uses
template-policy: page
source: graph
origin: person
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The word or the phrase the product fixes the meaning of; it is the term's key.
- name: definition
  type: text
  binding:
    agent: What the term means in this product, in one or two sentences.
- name: also_called
  type: json
  nullable: true
  binding:
    agent: The other words the product uses for the same thing.
- name: ambiguous
  type: text
  nullable: true
  binding:
    agent: How the word is used elsewhere and where that reading misleads.
key:
- name
listing: glossary
nav: own-page
labels:
  en:
    one: Glossary term
    many: Glossary terms
  ru:
    one: Термин
    many: Термины
description:
  en: A glossary term is a word or a short phrase with a precise meaning in the product, such as order or settlement. The glossary states that meaning once, and the product's documents and people then use the word in exactly that sense.
  ru: Термин — слово или короткое словосочетание с точным значением в продукте, например «заказ» или «расчёт». Глоссарий один раз задаёт это значение, и дальше документы и люди продукта употребляют слово именно в нём.
