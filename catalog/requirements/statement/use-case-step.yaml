id: practice.use-case-step
purpose: understand
audience: [product, analyst, architect]
definition: 'A use-case step is one action inside a use case: the actor does something, the system answers, or the flow takes an extension.'
sources:
- https://www.omg.org/spec/UML/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  - triggers
  in:
  - hasPart
template-policy: member
source: graph
fields:
- name: order
  type: integer
  binding:
    agent: Where the step stands in the use case, lowest first.
- name: action
  type: text
  binding:
    agent: What happens in the step, in one sentence.
key:
- order
member:
  relation: partOf
  direction: out
  parentKind: use-case
derives-from:
- doc.use-case
labels:
  en:
    one: Use-case step
    many: Use-case steps
  ru:
    one: Шаг сценария использования
    many: Шаги сценария использования
description:
  en: 'A use-case step is one move of a use case: the actor does something, the system answers, or the flow takes an extension because a condition holds. Read in order, the steps are the main path of the use case and its alternatives.'
  ru: 'Шаг сценария использования — один ход сценария: действующее лицо что-то делает, система отвечает или поток уходит в расширение, потому что выполнилось условие. Прочитанные по порядку, шаги — это основной путь сценария и его альтернативы.'

key-edges:
- role: use-case-step-use-case
  edge: use-case-step-use-case
  side: from
