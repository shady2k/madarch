id: practice.change-request
purpose: understand
audience: [product, analyst, tester, architect, product-lead]
definition: A change request asks to change the product, with the reason and the scope it touches.
sources:
- https://glossary.istqb.org/en_US/term/change-request
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Change request
    many: Change requests
  ru:
    one: Запрос на изменение
    many: Запросы на изменение
description:
  en: A change request proposes an alteration to the product and says why it is needed and what it would affect. It is a request, not yet an agreement, and it goes through impact analysis before someone accepts it.
  ru: Запрос на изменение предлагает изменить продукт и говорит, зачем это нужно и что это затронет. Это просьба, а не договорённость, и до принятия она проходит анализ влияния.
