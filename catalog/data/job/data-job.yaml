id: openlineage.job
purpose: operations
audience: [analyst, developer, operations]
definition: A data job is a unit of work that reads or writes datasets, identified by a namespace and a name.
sources:
- https://openlineage.io/docs/spec/object-model
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasInput
  - hasOutput
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Data job
    many: Data jobs
  ru:
    one: Задача обработки данных
    many: Задачи обработки данных
description:
  en: A data job is a step of data processing — a query, a script, a pipeline stage — that takes some datasets as input and produces others. Its namespace and name identify it, and its runs show when it worked and what it touched.
  ru: 'Задача обработки данных — шаг обработки: запрос, сценарий, этап конвейера, — который берёт одни наборы данных и создаёт другие. Пространство имён и имя отличают её, а запуски показывают, когда она работала и что затронула.'
