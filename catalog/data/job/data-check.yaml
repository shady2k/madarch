id: practice.data-check
purpose: quality
audience: [analyst, tester, developer]
definition: A data check is a rule that a dataset is checked against, such as referential integrity or a value range.
sources:
- https://www.w3.org/TR/vocab-dqv/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Data check
    many: Data checks
  ru:
    one: Проверка данных
    many: Проверки данных
description:
  en: A data check states a condition a dataset should satisfy, such as a column that must never be empty, a value within a range or a reference that must exist elsewhere. Each run of the check says whether the data passed.
  ru: 'Проверка данных формулирует условие, которому должен соответствовать набор данных: столбец, который не должен быть пустым, значение в заданном диапазоне или ссылка, которая должна существовать в другом месте. Каждый прогон проверки говорит, прошли ли данные.'
