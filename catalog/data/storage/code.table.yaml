id: practice.table
purpose: structure
audience: [analyst, architect, developer]
definition: A table is a named set of rows with the same columns, kept in a database.
sources:
- https://www.postgresql.org/docs/
acquisition:
- extractor data-model
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: name
  type: text
  binding: db-schema@1.name
- name: schema
  type: text
  nullable: true
  binding: db-schema@1.schema
- name: unsupported
  type: text
  nullable: true
  binding: db-schema@1.unsupported
key:
- name
card: true
er: links
details:
- schema
- unsupported
labels:
  en:
    one: Table
    many: Tables
  ru:
    one: Таблица
    many: Таблицы
description:
  en: A table is a named collection of rows, each with the same columns, that a database stores together. Its columns give the row's fields, its keys identify rows, and its indexes help find them.
  ru: Таблица — именованный набор строк с одинаковыми столбцами, который база данных хранит вместе. Столбцы задают поля строки, ключи отличают строки, а индексы помогают их находить.
derives-from:
- code.database

key-edges:
- role: code.table-database
  edge: code.table-database
  side: from
