id: practice.database-index
purpose: structure
audience: [analyst, architect, developer]
definition: An index is a structure a database keeps aside to find rows faster, with the columns it covers.
sources:
- https://www.postgresql.org/docs/
acquisition:
- extractor data-model
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: table
  type: text
  binding: db-schema@1.table
- name: name
  type: text
  binding: db-schema@1.name
- name: unique
  type: boolean
  binding: db-schema@1.unique
- name: columns
  type: json
  binding: db-schema@1.columns
- name: where
  type: text
  nullable: true
  binding: db-schema@1.where
key:
- table
- name
terms:
- '**/*.ts'
- '**/*.tsx'
details:
- columns
- unique
- where
labels:
  en:
    one: Index
    many: Indexes
  ru:
    one: Индекс
    many: Индексы
description:
  en: An index is a separate structure a database keeps so it can find rows without reading a whole table, built over one or more columns. It makes reads faster and writes slower, and its definition should match how the table is queried.
  ru: Индекс — отдельная структура, которую база данных держит, чтобы находить строки, не читая всю таблицу; он построен по одному или нескольким столбцам. Он ускоряет чтение и замедляет запись, и его состав должен соответствовать тому, как таблицу запрашивают.
derives-from:
- code.table
