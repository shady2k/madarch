id: practice.column
purpose: structure
audience: [analyst, architect, developer]
definition: A column is a named field of a table, with its type and the constraints it holds.
sources:
- https://www.postgresql.org/docs/
acquisition:
- extractor data-model
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
fields:
- name: name
  type: text
  binding: db-schema@1.name
- name: type
  type: text
  binding: db-schema@1.type
- name: nullable
  type: boolean
  binding: db-schema@1.nullable
- name: default
  type: text
  nullable: true
  binding: db-schema@1.default
- name: primary_key
  type: boolean
  binding: db-schema@1.primary_key
- name: unique
  type: boolean
  binding: db-schema@1.unique
- name: check
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  binding: db-schema@1.check
key:
- name
details:
- type
- nullable
- default
- primary_key
- unique
- check
labels:
  en:
    one: Column
    many: Columns
  ru:
    one: Столбец
    many: Столбцы
description:
  en: 'A column is one field of a database table: it has a name, a data type and rules such as not being empty or being unique. A table''s columns together say what one row of it describes.'
  ru: 'Столбец — одно поле таблицы базы данных: у него есть имя, тип и правила, например запрет пустого значения или требование уникальности. Столбцы таблицы вместе говорят, что описывает одна её строка.'
derives-from:
- code.table

key-edges:
- role: code.column-table
  edge: code.column-table
  side: from
