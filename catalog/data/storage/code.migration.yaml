  ru:
    one: Миграция
    many: Миграции
description:
  en: A migration is a scripted change to a database's structure or data, such as adding a table or renaming a column. Migrations run in a fixed order, so any database can be brought to the same version.
  ru: 'Миграция — изменение устройства или данных базы, записанное сценарием: добавить таблицу или переименовать столбец. Миграции выполняют в определённом порядке, поэтому любую базу можно привести к одной версии.'
