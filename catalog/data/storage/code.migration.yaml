id: practice.migration
purpose: structure
audience: [analyst, architect, developer]
definition: A migration is a step that changes a database's schema, run in order with the other steps.
sources:
- https://www.postgresql.org/docs/
acquisition:
- agent-from-graph
- extractor data-model
relation-constraints:
  out:
  - configures
  - partOf
  in:
  - configures
template-policy: page
source: graph
details:
- ordinal
- path
fields:
- name: repository
  type: json
  reference: code.repository
  binding:
    agent: The repository the migration stands in, by the key of that repository in the graph.
- name: path
  type: text
  labels:
    en: Path
    ru: Путь
  binding:
    agent: The path of the migration file in the repository.
- name: ordinal
  type: integer
  nullable: true
  binding:
    agent: Where the migration stands in the order the schema changes are applied, lowest first.
key:
- repository
- path
derives-from:
- code.file
- code.database
labels:
  en:
    one: Migration
    many: Migrations
  ru:
    one: Миграция
    many: Миграции
description:
  en: A migration is a scripted change to a database's structure or data, such as adding a table or renaming a column. Migrations run in a fixed order, so any database can be brought to the same version.
  ru: 'Миграция — изменение устройства или данных базы, записанное сценарием: добавить таблицу или переименовать столбец. Миграции выполняют в определённом порядке, поэтому любую базу можно привести к одной версии.'
