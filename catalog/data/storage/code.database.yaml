id: practice.database
purpose: structure
audience: [analyst, architect, developer]
definition: A database is an organised store of data that a service owns, with its tables and its schema changes.
sources:
- https://www.postgresql.org/docs/
acquisition:
- extractor data-model
relation-constraints:
  out:
  - contains
  in:
  - dependsOn
template-policy: page
source: graph
fields:
- name: name
  type: text
  binding: db-schema@1.name
- name: repository
  type: text
  binding: db-schema@1.repository
key:
- name
terms:
- '**/*.ts'
- '**/*.tsx'
card: true
er: tables
system: data-store
details:
- service
- path
- evidenceKind
labels:
  en:
    one: Database
    many: Databases
  ru:
    one: База данных
    many: Базы данных
description:
  en: A database is a store where a service keeps its data in tables that relate to one another, protected by its own accounts and backup. It is changed through migrations, so its structure has a history.
  ru: База данных — хранилище, где сервис держит свои данные в связанных таблицах, со своими учётными записями и резервными копиями. Её меняют миграциями, поэтому у её устройства есть история.
derives-from:
- code.repository
- code.file
