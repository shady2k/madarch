id: dcat.catalog
purpose: structure
audience: [analyst, architect, developer]
definition: 'A data catalog is a curated collection of dataset records, as a DCAT catalog is: the datasets one publisher describes together.'
sources:
- https://www.w3.org/TR/vocab-dcat-3/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - data-catalog.contains
  in:
  - partOf
  - data-catalog.contains
template-policy: none
labels:
  en:
    one: Data catalog
    many: Data catalogs
  ru:
    one: Каталог данных
    many: Каталоги данных
description:
  en: A data catalog gathers descriptions of datasets that one publisher makes available, with the metadata that helps someone find and judge them. DCAT defines such a catalog as a set of dataset records published together.
  ru: Каталог данных собирает описания наборов, которые один издатель делает доступными, с метаданными, помогающими найти их и оценить. DCAT определяет такой каталог как набор записей о наборах, опубликованных вместе.
derives-from:
- system.product
- product-profile
