id: openlineage.dataset
purpose: structure
audience: [analyst, architect, developer]
definition: A dataset is a collection of data that programs read or write, identified by a namespace and a name.
sources:
- https://openlineage.io/docs/spec/object-model
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  in:
  - hasInput
  - hasOutput
template-policy: page
source: graph
fields:
- name: namespace
  type: text
  binding:
    agent: The namespace the dataset is named in, as the jobs that read it name it.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the dataset is known by inside its namespace; it is the dataset's key.
- name: description
  type: text
  nullable: true
  binding:
    agent: What the dataset holds, in one or two sentences, from the jobs that read and write it in the graph.
key:
- namespace
- name
labels:
  en:
    one: Dataset
    many: Datasets
  ru:
    one: Набор данных
    many: Наборы данных
description:
  en: A dataset is a named collection of data that programs read or write, such as a table, a file or a stream. Its namespace and name identify it among other datasets, and its schema and version say what the data looks like.
  ru: 'Набор данных — именованная совокупность данных, которую читают или записывают программы: таблица, файл или поток. Пространство имён и имя отличают его от других наборов, а схема и версия описывают, как устроены данные.'
