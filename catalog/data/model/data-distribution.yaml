id: dcat.distribution
purpose: structure
audience: [analyst, architect, developer]
definition: A data distribution is one accessible form of a dataset, such as a file, an API or a stream, with its media type and address.
sources:
- https://www.w3.org/TR/vocab-dcat-3/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: none
labels:
  en:
    one: Distribution
    many: Distributions
  ru:
    one: Распространение
    many: Распространения
description:
  en: 'A data distribution is a way the same dataset can actually be obtained: a downloadable file, a query endpoint, a feed. It names the media type, the address and the format, so a consumer knows what it will get.'
  ru: 'Распространение — способ, которым набор данных действительно можно получить: скачиваемый файл, точка запросов, поток. В нём указаны тип содержимого, адрес и формат, чтобы потребитель знал, что получит.'
