id: dcat.catalog-record
purpose: structure
audience: [analyst, architect, developer]
definition: A data-catalog entry is a dataset's record in a data catalog, with its description, its owner and where it can be found.
sources:
- https://www.w3.org/TR/vocab-dcat-3/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Catalog entry
    many: Catalog entries
  ru:
    one: Запись каталога
    many: Записи каталога
description:
  en: 'A data-catalog entry describes one dataset for people looking for data: what it holds, who owns it, where it lives and how often it is updated. The dataset itself is one thing wherever it is described; the entry is one catalogue''s view of it.'
  ru: 'Запись каталога данных описывает один набор для тех, кто ищет данные: что в нём, кто владелец, где он лежит и как часто обновляется. Сам набор остаётся одним и тем же, где бы его ни описывали, а запись — взгляд одного каталога на него.'
