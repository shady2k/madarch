id: dcat.catalog-record
depends-on: [data-catalog, dataset]
purpose: structure
audience: [analyst, architect, developer]
definition: A dataset's entry in a data catalog, with its description, its owner and where it can be found; the dataset itself
  is one kind, wherever it is described.
sources:
- https://www.w3.org/TR/vocab-dcat-3/
