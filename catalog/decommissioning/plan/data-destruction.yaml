id: nist800-88.destruction
purpose: operations
audience: [operations, platform-devops, product-lead]
definition: Data destruction is the method that makes data on a retiring medium unrecoverable, such as overwriting, degaussing or physical shredding.
sources:
- https://csrc.nist.gov/pubs/sp/800/88/r1/final
