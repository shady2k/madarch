id: practice.deprecation
purpose: operations
audience: [operations, platform-devops, product-lead]
definition: A deprecation is the announcement that a part of the product will be withdrawn, together with its replacement and the date.
sources:
- https://www.rfc-editor.org/rfc/rfc8594.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Deprecation
    many: Deprecations
  ru:
    one: Прекращение поддержки
    many: Прекращения поддержки
description:
  en: A deprecation announces that a part of the product will stop being available, and says what replaces it and from when. It gives users time to move to the replacement and states what still works during the transition.
  ru: Прекращение поддержки — объявление о том, что часть продукта перестанет работать, что придёт ей на замену и с какого времени. Оно даёт пользователям время перейти на замену и говорит, что продолжает работать в переходный период.
