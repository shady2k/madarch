id: bpmn.process
purpose: operations
audience: [analyst, platform-devops, operations, architect]
definition: A business process is an ordered set of steps an organisation follows to reach a defined outcome, such as onboarding a customer or paying an invoice.
sources:
- https://www.omg.org/spec/BPMN/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  - triggers
  in:
  - defines
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the organisation gives this process, such as Onboarding a customer; it is the process's key.
- name: goal
  type: text
  nullable: true
  binding:
    agent: The outcome the process reaches when it ends, in one sentence, from the steps and the events that close it in the graph.
- name: trigger
  type: text
  nullable: true
  binding:
    agent: What starts the process, from the start event of the process in the graph.
- name: owner
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-role:v1
  nullable: true
  reference: role
  binding:
    agent: The role that answers for the process, from the roles named on its steps in the graph.
key:
- name
derives-from:
- document
labels:
  en:
    one: Business process
    many: Business processes
  ru:
    one: Бизнес-процесс
    many: Бизнес-процессы
description:
  en: A business process is an ordered set of steps an organisation carries out to reach a defined outcome, such as onboarding a customer or paying an invoice. Each step has an owner and a result, and together they turn an input into something the organisation or its customer needs.
  ru: 'Бизнес-процесс — упорядоченный набор шагов, которые организация выполняет, чтобы прийти к определённому результату: например, подключить клиента или оплатить счёт. У каждого шага есть исполнитель и результат, а вместе они превращают исходные данные в то, что нужно организации или её клиенту.'
