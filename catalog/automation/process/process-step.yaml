id: practice.process-step
purpose: operations
audience: [analyst, platform-devops, operations]
definition: A process step is one action in a business process, done by a person, by a program or by an agent.
sources:
- https://www.omg.org/spec/BPMN/
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: member
source: graph
fields:
- name: process
  type: json
  reference: business-process
  binding:
    agent: The business process the step stands in, by the key of that process in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the process gives this step, such as Check the invoice; it names the step inside its process.
- name: order
  type: integer
  nullable: true
  binding:
    agent: Where the step stands in the process, from the sequence of nodes the graph holds, lowest first.
- name: performer
  type: json
  nullable: true
  reference: role
  binding:
    agent: The role that carries the step out, when a person does it.
- name: performed_by
  type: json
  nullable: true
  reference: code.service
  binding:
    agent: The service that carries the step out, when a program does it.
key:
- process
- name
member:
  relation: partOf
  direction: out
  parentKind: business-process
labels:
  en:
    one: Process step
    many: Process steps
  ru:
    one: Шаг процесса
    many: Шаги процесса
description:
  en: A process step is one action inside a business process, such as checking a document or sending a notification. A person, a program or an agent can carry it out, and it takes defined inputs and produces a defined result for the steps that follow.
  ru: Шаг процесса — одно действие внутри бизнес-процесса, например проверить документ или отправить уведомление. Его может выполнять человек, программа или агент; шаг получает определённые входные данные и даёт определённый результат следующим шагам.
