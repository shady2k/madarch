id: practice.code-convention
purpose: understand
audience: [developer, architect, tester]
definition: A code convention is a rule of how code is written, such as a naming scheme, a structure or a forbidden pattern, with the check that holds it.
sources:
- https://google.github.io/styleguide/
- https://github.com/shady2k/madarch/blob/main/docs/vision.md
acquisition:
- agent-from-graph
- conversation
- document
- not-implemented
relation-constraints:
  out:
  - appliesTo
  - constrains
  - verifies
  in:
  - appliesTo
  - constrains
  - verifies
template-policy: page
source: graph
origin: person
details:
- name
- rule
- example
- paths
- status
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the convention is known by, such as file names in kebab-case; it is the convention's key.
- name: rule
  type: text
  binding:
    agent: The rule itself, in one sentence a person can check.
- name: example
  type: text
  nullable: true
  binding:
    agent: An example of the code following the rule, where the product gives one.
- name: paths
  type: json
  nullable: true
  binding:
    agent: The paths the rule covers, where it covers some folders only.
- name: status
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: Whether the convention is in force.
key:
- name
nav: own-page
labels:
  en:
    one: Code convention
    many: Code conventions
  ru:
    one: Соглашение о коде
    many: Соглашения о коде
description:
  en: A code convention states one rule of how the code is written — which names, which structure, which patterns are forbidden — and where it applies. A linter configuration, a type check or an architecture check carries it, so the rule is enforced rather than remembered.
  ru: 'Соглашение о коде формулирует одно правило о том, как пишут код: какие имена, какая структура, какие образцы запрещены, — и где оно действует. Его держит настройка линтера, проверка типов или проверка архитектуры, поэтому правило исполняется, а не запоминается.'
derives-from:
- constitution
