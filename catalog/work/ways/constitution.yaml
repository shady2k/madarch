id: practice.constitution
purpose: understand
audience: [product-lead, developer, architect]
definition: A constitution is the one document of a product that states the principles, practices and conventions in force and their order of precedence.
sources:
- https://github.com/shady2k/madarch/blob/main/docs/vision.md
- https://agents.md/
acquisition:
- agent-from-graph
- conversation
- document
- not-implemented
relation-constraints:
  out:
  - hasPart
  - defines
  - constrains
  in:
  - partOf
  - refines
template-policy: page
source: graph
origin: person
details:
- body
- precedence
- status
fields:
- name: product
  type: json
  reference: product
  binding:
    agent: The product the constitution is written for, by the key of that product in the graph.
- name: body
  type: text
  binding:
    agent: The principles, practices and conventions in force, as the constitution states them.
- name: precedence
  type: json
  nullable: true
  binding:
    agent: Which statement wins where two disagree, in the order the constitution gives.
- name: status
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: Whether the constitution is in force.
key:
- product
nav: own-page
labels:
  en:
    one: Constitution
    many: Constitutions
  ru:
    one: Конституция
    many: Конституции
description:
  en: A constitution is the one place where a product states the principles, practices and conventions in force, in the order that settles which wins when two disagree. The product's instructions for its agents are made from it, so a new rule is changed once and reaches every agent.
  ru: Конституция — одно место, где продукт называет действующие принципы, практики и соглашения, в порядке, который решает, что важнее при расхождении. Из неё строят инструкции продукта для агентов, поэтому новое правило меняют один раз и оно доходит до каждого агента.
