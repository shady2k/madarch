id: practice.skill
purpose: understand
audience: [developer, product-lead, analyst]
definition: 'A skill is an instruction for an agent for one kind of work: when to use it, what to do and what to check.'
sources:
- https://agents.md/
- https://github.com/shady2k/madarch/blob/main/docs/vision.md
acquisition:
- agent-from-graph
- conversation
- document
- not-implemented
relation-constraints:
  out:
  - appliesTo
  - constrains
  in:
  - appliesTo
  - constrains
template-policy: page
source: graph
origin: person
details:
- name
- when
- instructions
- checks
- status
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the skill is known by; it is the skill's key.
- name: when
  type: text
  binding:
    agent: When an agent uses the skill, in one or two sentences.
- name: instructions
  type: text
  binding:
    agent: What the agent does, step by step.
- name: checks
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  binding:
    agent: What the agent checks before it says it is done.
- name: status
  type: value-set-value
  nullable: true
  binding:
    agent: Whether the skill is in force.
key:
- name
nav: own-page
labels:
  en:
    one: Skill
    many: Skills
  ru:
    one: Навык
    many: Навыки
description:
  en: 'A skill tells an agent how to do one kind of work: when the work calls for it, the steps to follow and what to check before calling the work done. A skill is written for a repeated task, so the agent does not work it out again each time.'
  ru: 'Навык говорит агенту, как выполнять один вид работы: когда она этого требует, какие шаги пройти и что проверить, прежде чем считать её сделанной. Навык пишут для повторяющейся задачи, чтобы агент не выяснял её заново каждый раз.'
