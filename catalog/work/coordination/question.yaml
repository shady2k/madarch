id: practice.question
purpose: understand
audience:
- developer
- product
- analyst
- product-lead
definition: A question is a point in the work that cannot be settled from the product
  itself, put to the person who can answer it; an open question makes the work it
  concerns blocked without becoming a status of its own.
sources:
- https://arc42.org/overview
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - constrains
  - evidences
  in:
  - evidences
template-policy: page
extends: system:question
source: graph
origin: person
details:
- question
- why
- answer
- type
- status
- asked_at
- resolved_at
- file
fields:
- name: question
  type: text
  nullable: true
  labels:
    en: Question
    ru: Вопрос
  binding:
    agent: What cannot be settled from the product, in the words it is put in.
- name: why
  type: text
  nullable: true
  binding:
    agent: Why it matters and what it blocks.
- name: answer
  type: text
  nullable: true
  binding:
    agent: The answer, once it is given, in the words of the person who gave it.
- name: type
  type: text
  nullable: true
  binding:
    agent: 'What kind of question it is: a missing fact, a contested value or a choice
      of the product.'
- name: status
  type: value-set-value
  nullable: true
  binding:
    agent: Whether the question is open or settled.
- name: asked_at
  type: timestamp
  nullable: true
  binding:
    agent: When it was asked.
- name: resolved_at
  type: timestamp
  nullable: true
  binding:
    agent: When it was settled.
- name: slug
  type: text
  nullable: true
  binding:
    agent: The stable slug used by the question presentation.
- name: file
  type: text
  nullable: true
  binding:
    agent: The product-relative Markdown path carrying the question.
- name: language
  type: text
  nullable: true
  binding:
    agent: The language tag of the question text.
nav: loop
labels:
  en:
    one: Question
    many: Questions
  ru:
    one: Вопрос
    many: Вопросы
description:
  en: A question records something the person doing the work could not settle from
    the product's code and documents, addressed to the responsible person who can
    answer. The work it concerns waits for the answer instead of guessing.
  ru: Вопрос — то, что исполнитель работы не смог решить по коду и документам продукта
    и адресовал ответственному человеку, который может ответить. Работа, к которой
    относится вопрос, ждёт ответа, а не догадки.
derives-from:
- product
