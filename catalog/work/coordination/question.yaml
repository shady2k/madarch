id: practice.question
purpose: understand
audience: [developer, product, analyst, product-lead]
definition: A question is a point in the work that cannot be settled from the product itself, put to the person who can answer it; an open question makes the work it concerns blocked without becoming a status of its own.
sources:
- https://arc42.org/overview
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - constrains
  - evidences
  in:
  - evidences
template-policy: page
source: graph
origin: person
details:
- question
- why
- sides
- answer
- type
- status
- about
- asked_in
- asked_at
- resolved_by
- resolved_at
- written_at
- file
fields:
- name: question
  type: text
  labels:
    en: Question
    ru: Вопрос
  binding:
    agent: What cannot be settled from the product, in the words it is put in.
- name: why
  type: text
  nullable: true
  binding:
    agent: Why it matters and what it blocks.
- name: sides
  type: text
  nullable: true
  binding:
    agent: What the sources say, side by side, where the question is a disagreement.
- name: answer
  type: text
  nullable: true
  binding:
    agent: The answer, once it is given, in the words of the person who gave it.
- name: type
  type: text
  nullable: true
  binding:
    agent: 'What kind of question it is: a missing fact, a contested value or a choice of the product.'
- name: status
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-value-set-entry:v1
  nullable: true
  reference: value-set-entry
  binding:
    agent: Whether the question is open or settled.
- name: asked_by
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-person:v1
  nullable: true
  reference: person
  binding:
    agent: The person who asked it.
- name: asked_at
  type: timestamp
  nullable: true
  binding:
    agent: When it was asked.
- name: resolved_by
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-person:v1
  nullable: true
  reference: person
  binding:
    agent: The person who settled it.
- name: resolved_at
  type: timestamp
  nullable: true
  binding:
    agent: When it was settled.
nav: loop
labels:
  en:
    one: Question
    many: Questions
  ru:
    one: Вопрос
    many: Вопросы
description:
  en: A question records something the person doing the work could not settle from the product's code and documents, addressed to the responsible person who can answer. The work it concerns waits for the answer instead of guessing.
  ru: Вопрос — то, что исполнитель работы не смог решить по коду и документам продукта и адресовал ответственному человеку, который может ответить. Работа, к которой относится вопрос, ждёт ответа, а не догадки.
