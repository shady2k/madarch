  ru:
    one: Вопрос
    many: Вопросы
description:
  en: A question records something the person doing the work could not settle from the product's code and documents, addressed to the responsible person who can answer. The work it concerns waits for the answer instead of guessing.
  ru: Вопрос — то, что исполнитель работы не смог решить по коду и документам продукта и адресовал ответственному человеку, который может ответить. Работа, к которой относится вопрос, ждёт ответа, а не догадки.
