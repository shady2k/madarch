id: practice.handoff
purpose: operations
audience: [developer, product, analyst, product-lead]
definition: A handoff passes a branch and the work on it from one responsible person to another, with what is finished and what remains.
sources:
- https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/assigning-issues-and-pull-requests-to-other-github-users
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - assigns
  - contains
  in:
  - assigns
  - partOf
template-policy: none
labels:
  en:
    one: Handoff
    many: Handoffs
  ru:
    one: Передача
    many: Передачи
description:
  en: A handoff gives a branch and the work in it to another responsible person, together with what is finished and what still has to be done. It keeps two people from continuing the same work at once.
  ru: Передача — переход ветки и работы в ней к другому ответственному человеку вместе со сведениями о том, что сделано и что осталось. Она нужна, чтобы одну и ту же работу не продолжали двое сразу.
