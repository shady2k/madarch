id: practice.evidence
purpose: quality
audience: [developer, tester, product-lead]
definition: Evidence is what acceptance checked and where the result can be seen, kept together with the check that produced it.
sources:
- https://glossary.istqb.org/en_US/term/test-evidence
- https://glossary.istqb.org/en_US/term/acceptance-testing
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - verifies
  - evidences
  in:
  - evidences
  - verifies
template-policy: none
origin: agent
fields:
- name: check
  type: text
  binding:
    agent: The check that was run, such as the catalogue check or a test file; it names the checked claim.
- name: result
  type: text
  nullable: true
  binding:
    agent: 'What the check answered: passed, failed, or the number it reported.'
- name: where
  type: text
  nullable: true
  binding:
    agent: 'Where the result can be seen: an address, a file and a line, or the run it belongs to.'
- name: at
  type: timestamp
  nullable: true
  binding:
    agent: When the check ran.
key:
- check
- at
labels:
  en:
    one: Evidence
    many: Evidence
  ru:
    one: Доказательство
    many: Доказательства
description:
  en: 'Evidence shows that an acceptance check was made: what was checked, what it showed and where the result can be seen, such as a test output, a report or a screenshot. It is kept with the check that produced it, so a later reader can judge the claim.'
  ru: 'Доказательство показывает, что проверку приёмки действительно провели: что проверяли, что получилось и где это видно — вывод теста, отчёт или снимок экрана. Его хранят вместе с проверкой, которая его дала, чтобы позднее можно было судить об утверждении.'
derives-from:
- assessment-finding
- test-result
