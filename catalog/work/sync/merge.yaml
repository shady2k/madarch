id: practice.merge
purpose: history
audience: [developer, tester, product-lead]
definition: A merge is the joining of a branch or a pull request into the line of development it targets, with who allowed it and under which conditions.
sources:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/about-pull-request-merges
- https://github.com/shady2k/madarch/blob/main/docs/vision/architecture-talk-2026-11-01.md
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  - approves
  in:
  - partOf
template-policy: none
fields:
- name: source
  type: text
  binding:
    agent: 'What is merged: the branch or the change request it comes from.'
- name: target
  type: text
  binding:
    agent: The line of development it is merged into.
- name: merged_at
  type: timestamp
  nullable: true
  binding:
    agent: When the merge happened.
- name: merged_by
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-person:v1
  nullable: true
  reference: person
  binding:
    agent: The person who allowed the merge.
- name: commit
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-code.commit:v1
  nullable: true
  reference: code.commit
  binding:
    agent: The commit the merge made, where it made one.
- name: conditions
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  binding:
    agent: 'What had to hold for the merge: the checks that passed and the approvals given.'
key:
- source
- target
- merged_at
labels:
  en:
    one: Merge
    many: Merges
  ru:
    one: Слияние
    many: Слияния
description:
  en: A merge brings the changes of a branch or a pull request into the line of development they target. Its record says who allowed the merge, when it happened and which review conditions it met.
  ru: Слияние вносит изменения ветки или пул-реквеста в ту линию разработки, для которой они предназначены. В записи о слиянии указано, кто его разрешил, когда оно произошло и при каких условиях проверки.
