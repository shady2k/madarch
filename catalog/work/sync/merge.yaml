id: practice.merge
purpose: history
audience: [developer, tester, product-lead]
definition: A merge is the joining of a branch or a pull request into the line of development it targets, with who allowed it and under which conditions.
sources:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/about-pull-request-merges
- https://github.com/shady2k/madarch/blob/main/docs/vision/architecture-talk-2026-11-01.md
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
  - approves
template-policy: none
fields:
- name: status
  type: json
  reference: value-set-entry
  producers:
  - person
- name: priority
  type: json
  nullable: true
  reference: value-set-entry
  producers:
  - person
- name: labels
  type: json
  nullable: true
  producers:
  - person
- name: assignee
  type: text
  nullable: true
  producers:
  - person
- name: owner
  type: text
  nullable: true
  producers:
  - person
- name: created_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: updated_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: closed_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: close_reason
  type: text
  nullable: true
  producers:
  - person
labels:
  en:
    one: Merge
    many: Merges
  ru:
    one: Слияние
    many: Слияния
description:
  en: A merge brings the changes of a branch or a pull request into the line of development they target. Its record says who allowed the merge, when it happened and which review conditions it met.
  ru: Слияние вносит изменения ветки или пул-реквеста в ту линию разработки, для которой они предназначены. В записи о слиянии указано, кто его разрешил, когда оно произошло и при каких условиях проверки.
