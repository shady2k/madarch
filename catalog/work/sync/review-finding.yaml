id: practice.review-finding
purpose: quality
audience: [developer, tester, product-lead]
definition: A review finding is one problem a review raises about a change, with its severity and what was done about it.
sources:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/about-pull-request-reviews
- https://glossary.istqb.org/en_US/term/review
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  - affects
  - evidences
  - fixedIn
  in:
  - hasPart
  - foundBy
  - evidences
template-policy: none
fields:
- name: severity
  type: text
  nullable: true
  binding:
    agent: How serious the finding is, in the words the review grades its findings
      by.
- name: text
  type: text
  binding:
    agent: What the review says is wrong, in its own words.
- name: line
  type: integer
  nullable: true
  binding:
    agent: The line the finding stands on.
- name: resolution
  type: text
  nullable: true
  binding:
    agent: 'What was done about it: fixed, argued down or left open.'
labels:
  en:
    one: Review finding
    many: Review findings
  ru:
    one: Находка ревью
    many: Находки ревью
description:
  en: 'A review finding names one problem that a reviewer saw in a change: what is wrong, how serious it is and where. It ends as fixed, or as declined with the reason the team accepted.'
  ru: 'Находка ревью называет одну проблему, которую проверяющий увидел в изменении: что не так, насколько это серьёзно и где. Она заканчивается исправлением или отказом с причиной, которую команда приняла.'
derives-from:
- code.file
- pull-request-review
