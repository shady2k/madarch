id: practice.stage
purpose: understand
audience: [developer, product, product-lead, tester]
definition: A stage is a part of a feature bounded so that one responsible person or agent can carry it to its end; a stage holds tasks and bugs.
sources:
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
- https://support.atlassian.com/jira-software-cloud/docs/what-is-an-epic/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Stage
    many: Stages
  ru:
    one: Этап
    many: Этапы
description:
  en: A stage is a part of a feature cut small enough for one responsible person or agent to finish. It holds the tasks and bugs that make up that piece of work.
  ru: Этап — часть возможности, очерченная так, чтобы один ответственный человек или агент мог довести её до конца. В этап входят задачи и ошибки, из которых состоит эта часть работы.
