id: practice.epic
purpose: understand
audience: [developer, product, product-lead, tester]
definition: An epic is a large need of a stakeholder that takes more than one iteration to meet, and that features and stories break into work.
sources:
- https://glossary.istqb.org/en_US/term/epic
- https://support.atlassian.com/jira-software-cloud/docs/what-is-an-epic/
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - hasPart
  - refines
  in:
  - partOf
  - realises
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the product gives the need, such as Offline orders; it is the epic's key.
- name: need
  type: text
  nullable: true
  binding:
    agent: The stakeholder need the epic meets, in one or two sentences.
- name: outcome
  type: text
  nullable: true
  binding:
    agent: What is true once the epic is met.
- name: status
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: Where the epic stands, as the work kinds keep it.
- name: priority
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: How urgent the epic is compared with the others.
key:
- name
labels:
  en:
    one: Epic
    many: Epics
  ru:
    one: Эпик
    many: Эпики
description:
  en: An epic states a need of a stakeholder that is too large to meet in one iteration. Features and user stories break it into parts small enough to plan and deliver.
  ru: Эпик называет потребность заинтересованной стороны, которую нельзя закрыть за одну итерацию. Возможности и истории пользователя делят его на части, которые можно спланировать и выполнить.
