id: practice.epic
purpose: understand
audience: [developer, product, product-lead, tester]
definition: An epic is a large need of a stakeholder that takes more than one iteration to meet, and that features and stories break into work.
sources:
- https://glossary.istqb.org/en_US/term/epic
- https://support.atlassian.com/jira-software-cloud/docs/what-is-an-epic/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  - refines
  in:
  - partOf
  - realises
template-policy: none
labels:
  en:
    one: Epic
    many: Epics
  ru:
    one: Эпик
    many: Эпики
description:
  en: An epic states a need of a stakeholder that is too large to meet in one iteration. Features and user stories break it into parts small enough to plan and deliver.
  ru: Эпик называет потребность заинтересованной стороны, которую нельзя закрыть за одну итерацию. Возможности и истории пользователя делят его на части, которые можно спланировать и выполнить.
