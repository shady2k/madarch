id: practice.epic
purpose: understand
audience: [developer, product, product-lead, tester]
definition: An epic is a large need of a stakeholder that takes more than one iteration to meet, and that features and stories break into work.
sources:
- https://glossary.istqb.org/en_US/term/epic
- https://support.atlassian.com/jira-software-cloud/docs/what-is-an-epic/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - refines
  in:
  - partOf
  - realises
template-policy: none
fields:
- name: status
  type: json
  reference: value-set-entry
  producers:
  - person
- name: priority
  type: json
  reference: value-set-entry
  producers:
  - person
- name: issue_type
  type: json
  reference: value-set-entry
  producers:
  - person
- name: labels
  type: json
  nullable: true
  producers:
  - person
- name: assignee
  type: text
  nullable: true
  producers:
  - person
- name: owner
  type: text
  nullable: true
  producers:
  - person
- name: created_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: updated_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: closed_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: close_reason
  type: text
  nullable: true
  producers:
  - person
- name: dependencies
  type: json
  nullable: true
  producers:
  - person
- name: comments
  type: json
  nullable: true
  producers:
  - person
labels:
  en:
    one: Epic
    many: Epics
  ru:
    one: Эпик
    many: Эпики
description:
  en: An epic states a need of a stakeholder that is too large to meet in one iteration. Features and user stories break it into parts small enough to plan and deliver.
  ru: Эпик называет потребность заинтересованной стороны, которую нельзя закрыть за одну итерацию. Возможности и истории пользователя делят его на части, которые можно спланировать и выполнить.
