id: practice.milestone
purpose: understand
audience: [developer, product, product-lead, tester]
definition: A milestone is a dated point that a set of epics is planned to reach.
sources:
- https://docs.github.com/en/issues/using-labels-and-milestones-to-track-work/about-milestones
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
fields:
- name: legacy_id
  type: text
  nullable: true
  producers:
  - person
- name: title
  type: text
  producers:
  - person
- name: body
  type: text
  nullable: true
  producers:
  - person
- name: status
  type: json
  reference: value-set-entry
  producers:
  - person
- name: priority
  type: json
  reference: value-set-entry
  producers:
  - person
- name: issue_type
  type: json
  reference: value-set-entry
  producers:
  - person
- name: labels
  type: json
  nullable: true
  producers:
  - person
- name: assignee
  type: text
  nullable: true
  producers:
  - person
- name: owner
  type: text
  nullable: true
  producers:
  - person
- name: created_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: updated_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: closed_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: close_reason
  type: text
  nullable: true
  producers:
  - person
- name: dependencies
  type: json
  nullable: true
  producers:
  - person
- name: comments
  type: json
  nullable: true
  producers:
  - person
labels:
  en:
    one: Milestone
    many: Milestones
  ru:
    one: Веха
    many: Вехи
description:
  en: A milestone marks a date by which a set of epics is planned to be finished, such as a public release or a contract deadline. It gives the plan a fixed point against which progress can be measured.
  ru: Веха отмечает дату, к которой планируют завершить набор эпиков, например публичный выпуск или срок по договору. Она даёт плану неподвижную точку, с которой сверяют ход работы.
