id: practice.milestone
purpose: understand
audience: [developer, product, product-lead, tester]
definition: A milestone is a dated point that a set of epics is planned to reach.
sources:
- https://docs.github.com/en/issues/using-labels-and-milestones-to-track-work/about-milestones
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - hasPart
  - work.depends-on
  in:
  - partOf
  - work.depends-on
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the product gives the dated point, such as Version 1.0; it is
      the milestone's key.
- name: target_date
  type: timestamp
  nullable: true
  binding:
    agent: The date the milestone is planned to be reached.
- name: status
  type: value-set-value
  nullable: true
  binding:
    agent: Where the milestone stands, as the work kinds keep it.
- name: criterion
  type: text
  nullable: true
  binding:
    agent: What has to be true on the date for the milestone to be reached.
key:
- name
labels:
  en:
    one: Milestone
    many: Milestones
  ru:
    one: Веха
    many: Вехи
description:
  en: A milestone marks a date by which a set of epics is planned to be finished, such as a public release or a contract deadline. It gives the plan a fixed point against which progress can be measured.
  ru: Веха отмечает дату, к которой планируют завершить набор эпиков, например публичный выпуск или срок по договору. Она даёт плану неподвижную точку, с которой сверяют ход работы.
derives-from:
- epic
