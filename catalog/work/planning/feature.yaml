id: practice.feature
purpose: understand
audience: [developer, product, product-lead, tester]
definition: A feature is a service the product offers that meets a need of a stakeholder, made of smaller stories and requirements.
sources:
- https://cucumber.io/docs/gherkin/reference/
- https://support.atlassian.com/jira-software-cloud/docs/what-is-an-epic/
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - realises
  - hasPart
  - implements
  - refines
  - feature.contains
  in:
  - partOf
  - refines
  - realises
  - feature.contains
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the product gives the service it offers, such as Pay by card; it is the feature's key.
- name: description
  type: text
  nullable: true
  binding:
    agent: What a person can do once the feature exists, in one or two sentences.
- name: value
  type: text
  nullable: true
  binding:
    agent: The need the feature meets and why it is worth doing.
- name: status
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: Where the feature stands, as the work kinds keep it.
- name: priority
  type: json
  nullable: true
  reference: value-set-entry
  binding:
    agent: The priority level set by the product owner; suggested by the configured method, WSJF by default.
- name: queue_position
  type: integer
  nullable: true
  binding:
    agent: The position of this work among work at the same priority level; a smaller number comes first.
key:
- name
labels:
  en:
    one: Feature
    many: Features
  ru:
    one: Возможность
    many: Возможности
description:
  en: A feature is a service the product gives its users, described by the need it meets. User stories and requirements break the feature into what has to be built.
  ru: Возможность — услуга, которую продукт даёт своим пользователям, описанная через потребность, которую она закрывает. Истории пользователя и требования делят её на то, что нужно построить.
derives-from:
- epic
