id: practice.product-task
purpose: operations
audience: [developer, product, product-lead, tester]
definition: A task is a unit of work with a defined scope and a criterion for being done, assigned to a person or an agent.
sources:
- https://scrumguides.org/scrum-guide.html
- https://support.atlassian.com/jira-software-cloud/docs/create-a-work-item-and-a-subtask/
acquisition:
- conversation
status: implemented
relation-constraints:
  out:
  - hasPart
  - refines
  in:
  - partOf
  - refines
template-policy: page
source: graph
