id: practice.bug
purpose: quality
audience: [developer, tester, product]
definition: A bug is a record of a defect in the product, with how serious it is and the steps that show it.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/issue-types-how-do-team-managed-and-company-managed-projects-differ/
- https://glossary.istqb.org/en_US/term/defect
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  - fixedIn
  in:
  - foundBy
  - affects
template-policy: none
fields:
- name: legacy_id
  type: text
  nullable: true
  producers:
  - person
- name: title
  type: text
  producers:
  - person
- name: body
  type: text
  nullable: true
  producers:
  - person
- name: status
  type: json
  reference: value-set-entry
  producers:
  - person
- name: priority
  type: json
  reference: value-set-entry
  producers:
  - person
- name: issue_type
  type: json
  reference: value-set-entry
  producers:
  - person
- name: labels
  type: json
  nullable: true
  producers:
  - person
- name: assignee
  type: text
  nullable: true
  producers:
  - person
- name: owner
  type: text
  nullable: true
  producers:
  - person
- name: created_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: updated_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: closed_at
  type: timestamp
  nullable: true
  producers:
  - person
- name: close_reason
  type: text
  nullable: true
  producers:
  - person
- name: dependencies
  type: json
  nullable: true
  producers:
  - person
- name: comments
  type: json
  nullable: true
  producers:
  - person
labels:
  en:
    one: Bug
    many: Bugs
  ru:
    one: Ошибка
    many: Ошибки
description:
  en: 'A bug describes a defect in the product: what goes wrong, how serious it is and the steps that show it. It is a task whose subject is the defect, so fixing it goes through the same work as any other change.'
  ru: 'Ошибка описывает дефект продукта: что идёт не так, насколько это серьёзно и какими шагами это видно. Это задача, предмет которой — дефект, поэтому исправление проходит ту же работу, что и любое другое изменение.'
