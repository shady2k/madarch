id: practice.technical-debt
purpose: quality
audience: [developer, architect, product-lead]
definition: Technical debt is a known weakness of the implementation that will cost more to fix later than now.
sources:
- https://arc42.org/overview
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Technical debt
    many: Technical debts
  ru:
    one: Технический долг
    many: Технические долги
description:
  en: Technical debt is a compromise in the code or the design that made something faster to build but makes changes harder or riskier later. It is recorded with the work it would take to repay and the interest it charges while it stays.
  ru: Технический долг — компромисс в коде или устройстве, который позволил сделать быстрее, но позже усложняет или делает рискованными изменения. Его записывают вместе с работой, нужной для возврата, и с той ценой, которую он берёт, пока остаётся.
