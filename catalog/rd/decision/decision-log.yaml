id: practice.decision-log
purpose: history
audience: [product, analyst, architect, developer]
definition: A decision log is the ordered record of the decisions taken, each beside the one it replaces.
sources:
- https://adr.github.io/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - contains
template-policy: none
labels:
  en:
    one: Decision log
    many: Decision logs
  ru:
    one: Журнал решений
    many: Журналы решений
description:
  en: A decision log keeps the decisions of a product in the order they were taken, so a reader can follow how the architecture arrived where it is. Each entry points to the decision it supersedes or is superseded by.
  ru: Журнал решений хранит решения продукта в порядке их принятия, чтобы читатель видел, как архитектура пришла к нынешнему виду. Каждая запись указывает на решение, которое она заменяет или которым заменена.
derives-from:
- product
