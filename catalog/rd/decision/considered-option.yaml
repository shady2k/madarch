id: madr.considered-option
purpose: understand
audience: [product, analyst, architect, developer]
definition: A considered option is one option a decision weighed, with the reason it was taken or set aside.
sources:
- https://adr.github.io/madr/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Considered option
    many: Considered options
  ru:
    one: Рассмотренный вариант
    many: Рассмотренные варианты
description:
  en: A considered option is a choice a decision examined, described well enough to compare with the others. The record says why it was taken or rejected.
  ru: Рассмотренный вариант — один из вариантов, которые взвешивало решение, описанный так, чтобы его можно было сравнить с другими. В записи сказано, почему его приняли или отклонили.
