id: madr.decision-driver
purpose: understand
audience: [product, analyst, architect, developer]
definition: A decision driver is a force or concern that a decision was made against, as MADR records it.
sources:
- https://adr.github.io/madr/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Decision driver
    many: Decision drivers
  ru:
    one: Движущая сила решения
    many: Движущие силы решения
description:
  en: 'A decision driver is the concern that pushes a decision one way: a quality requirement, a deadline, a cost, a regulation or a risk. Naming the drivers shows what a decision had to satisfy.'
  ru: 'Движущая сила решения — забота, которая подталкивает решение в определённую сторону: требование к качеству, срок, стоимость, правило закона или риск. Названные силы показывают, чему решение должно было соответствовать.'
derives-from:
- doc.decision
