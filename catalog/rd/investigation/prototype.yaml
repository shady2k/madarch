id: practice.prototype
purpose: understand
audience: [product, designer, developer, architect]
definition: A prototype is a quick build that explores an option before the product commits to it.
sources:
- https://www.nngroup.com/articles/paper-prototyping/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Prototype
    many: Prototypes
  ru:
    one: Прототип
    many: Прототипы
description:
  en: A prototype is a rough, often throwaway version of a feature or a screen, built to learn how it could work and what it would cost. It is not meant to ship; what it teaches is.
  ru: Прототип — быстрая, часто одноразовая версия возможности или экрана, которую строят, чтобы понять, как это может работать и чего будет стоить. Его не выпускают в продукт; в продукт идут знания, которые он дал.
