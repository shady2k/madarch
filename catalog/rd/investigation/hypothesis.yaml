id: practice.hypothesis
purpose: understand
audience: [product, analyst, designer]
definition: A hypothesis is a stated expectation about a benefit, which an experiment is meant to confirm or refute.
sources:
- https://en.wikipedia.org/wiki/Hypothesis
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Hypothesis
    many: Hypotheses
  ru:
    one: Гипотеза
    many: Гипотезы
description:
  en: A hypothesis says what the team expects to be true and why it would matter, for example that a shorter form will be completed more often. It must be worded so that an experiment can prove it wrong.
  ru: 'Гипотеза говорит, что команда ожидает увидеть и почему это важно: например, что короткую форму чаще доводят до конца. Её формулируют так, чтобы эксперимент мог её опровергнуть.'
derives-from:
- goal
