id: practice.spike
purpose: understand
audience: [product, analyst, architect, developer]
definition: A spike is a short piece of work that answers a question so a decision can be made.
sources:
- https://en.wikipedia.org/wiki/Spike_(software_development)
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Spike
    many: Spikes
  ru:
    one: Исследование
    many: Исследования
description:
  en: A spike is a time-boxed investigation into a technical unknown, such as whether a library can handle the load or how an old system behaves. It ends with an answer, not with production code.
  ru: 'Исследование — ограниченная по времени работа над технической неизвестностью: выдержит ли библиотека нагрузку или как ведёт себя старая система. Оно заканчивается ответом, а не рабочим кодом.'
