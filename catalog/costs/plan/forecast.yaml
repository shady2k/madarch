id: practice.forecast
purpose: operations
audience: [product-lead, operations, platform-devops]
definition: A cost forecast is what the costs are expected to be, made from the spending so far.
sources:
- https://focus.finops.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: Cost forecast
    many: Cost forecasts
  ru:
    one: Прогноз затрат
    many: Прогнозы затрат
description:
  en: A cost forecast estimates future spending from the bills already seen and the plan ahead, such as a run rate for the rest of the month. It warns early when the budget will be exceeded.
  ru: Прогноз затрат оценивает будущие расходы по уже полученным счётам и предстоящему плану, например по текущему темпу до конца месяца. Он заранее предупреждает, что бюджет будет превышен.
derives-from:
- budget
- cost-record
