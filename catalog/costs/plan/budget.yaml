description:
  en: A budget sets the most a product or a team may spend in a period, such as a month or a quarter, and says who is warned when spending approaches it. It turns a plan into a limit someone watches.
  ru: Бюджет задаёт, сколько продукт или команда могут потратить за период — месяц или квартал, — и говорит, кого предупреждают о приближении к пределу. Он превращает план в ограничение, за которым следят.
