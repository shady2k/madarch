id: focus.cloud-cost
purpose: operations
audience: [product-lead, operations, platform-devops]
definition: A cloud cost is what a cloud provider charges for the resources the product uses.
sources:
- https://focus.finops.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Cloud cost
    many: Cloud costs
  ru:
    one: Облачная стоимость
    many: Облачные стоимости
description:
  en: 'A cloud cost is the money a cloud provider charges for the capacity the product consumes: computing time, storage, network traffic and managed services. It is usually billed per period and can be split by resource, service or team.'
  ru: 'Облачная стоимость — деньги, которые облачный провайдер берёт за ресурсы, потребляемые продуктом: вычислительное время, хранилище, сетевой трафик и управляемые сервисы. Обычно её выставляют за период и делят по ресурсам, сервисам или командам.'
derives-from:
- cost-record
