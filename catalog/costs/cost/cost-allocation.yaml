id: focus.allocation
purpose: operations
audience: [product-lead, operations, platform-devops]
definition: A cost allocation is the way a cost is split over the products, teams or services that caused it.
sources:
- https://focus.finops.org/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
