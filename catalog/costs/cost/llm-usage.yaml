id: practice.llm-usage
purpose: operations
audience: [product-lead, developer, operations]
definition: Model usage is the tokens and the money one use of a model cost, with the model and the purpose it served.
sources:
- https://opentelemetry.io/docs/specs/semconv/gen-ai/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Model use
    many: Model uses
  ru:
    one: Использование модели
    many: Использования модели
description:
  en: 'Model usage records one call or one session with a language model: how many input and output tokens it took, which model answered, what it cost and what the work was for. It lets a team see which tasks the spending goes to.'
  ru: 'Использование модели фиксирует один вызов или одну сессию с языковой моделью: сколько было входных и выходных токенов, какая модель отвечала, сколько это стоило и для какой работы. Так видно, на какие задачи уходят деньги.'
derives-from:
- cost-record
- ml-model
