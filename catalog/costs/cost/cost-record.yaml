id: focus.cost-record
purpose: operations
audience: [product-lead, operations, platform-devops]
definition: A cost record is one measured cost of a resource over a period, in one currency, as FinOps FOCUS describes it.
sources:
- https://focus.finops.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - allocates
template-policy: none
labels:
  en:
    one: Cost record
    many: Cost records
  ru:
    one: Запись затрат
    many: Записи затрат
description:
  en: A cost record states what one resource cost over one period in one currency, as the FinOps FOCUS specification lays it out. It is the smallest unit of a bill that can be summed, compared and charged back.
  ru: Запись затрат говорит, сколько стоил один ресурс за один период в одной валюте, как это описывает спецификация FinOps FOCUS. Это наименьшая единица счёта, которую можно складывать, сравнивать и относить на подразделения.
