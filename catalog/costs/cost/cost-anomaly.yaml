id: focus.anomaly
purpose: quality
audience: [product-lead, operations, platform-devops]
definition: A cost anomaly is a cost that departed from what was expected, with the resource that caused it.
sources:
- https://focus.finops.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Cost anomaly
    many: Cost anomalies
  ru:
    one: Аномалия затрат
    many: Аномалии затрат
description:
  en: A cost anomaly is spending that is unusually high or low compared with the recent past or the plan, such as a sudden jump from one service. It names the resource behind the change, so someone can check whether it is a fault or a legitimate increase.
  ru: 'Аномалия затрат — трата, которая резко отличается от недавней или от плана: например, внезапный рост по одному сервису. Она называет ресурс, вызвавший изменение, чтобы кто-то проверил, ошибка это или законный рост.'
