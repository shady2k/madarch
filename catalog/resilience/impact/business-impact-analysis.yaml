id: nist800-34.business-impact-analysis
purpose: operations
audience: [operations, product-lead, analyst, architect]
definition: A business impact analysis studies what the loss of a process or a system would cost, and how soon it must be back.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: Business impact analysis
    many: Business impact analyses
  ru:
    one: Анализ влияния на бизнес
    many: Анализы влияния на бизнес
description:
  en: A business impact analysis asks, for each process and system, what stops when it fails, what that costs per hour or per day, and which recovery time and data loss the business can bear. Its answers set the recovery objectives.
  ru: Анализ влияния на бизнес выясняет по каждому процессу и системе, что останавливается при их отказе, во что это обходится за час или за день и какое время восстановления и какую потерю данных бизнес может вынести. Его ответы задают цели восстановления.
