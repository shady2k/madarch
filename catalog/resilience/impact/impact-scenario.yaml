id: nist800-34.impact-scenario
purpose: operations
audience: [operations, product-lead, analyst, architect]
definition: An impact scenario is one described outage, with its effect over time and the point at which it becomes unacceptable.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Impact scenario
    many: Impact scenarios
  ru:
    one: Сценарий последствий
    many: Сценарии последствий
description:
  en: 'An impact scenario follows one outage through time: what fails first, what the effect is after an hour, a day or a week, and when the loss becomes unacceptable. It turns a vague worry into a threshold the plan can aim at.'
  ru: 'Сценарий последствий прослеживает один простой во времени: что отказывает первым, каков эффект через час, день или неделю и когда ущерб становится недопустимым. Он превращает смутную тревогу в порог, на который может ориентироваться план.'
