id: nist800-34.exercise-result
purpose: quality
audience: [operations, platform-devops, architect]
definition: 'A drill result records what a drill showed: the objectives reached, the time taken and the gaps found.'
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Drill result
    many: Drill results
  ru:
    one: Результат учения
    many: Результаты учения
description:
  en: 'A drill result sums up one exercise: which objectives were reached, how long the response took and where the plan or the people fell short. The gaps become work items, so the next drill tests the fixes.'
  ru: 'Результат учения подводит итог одной тренировки: какие цели достигнуты, сколько занял ответ и где план или люди не справились. Пробелы становятся задачами, чтобы следующее учение проверило исправления.'
