id: nist800-34.backup-policy
purpose: operations
audience: [operations, platform-devops, architect]
definition: A backup policy sets how often a backup is taken, how long it is kept and where it is stored.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
