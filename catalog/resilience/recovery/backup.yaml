id: nist800-34.backup
purpose: operations
audience: [operations, platform-devops, architect]
definition: A backup is a copy of data or configuration kept apart from the original so it can be restored.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - restores
  in:
  - restores
template-policy: none
labels:
  en:
    one: Backup
    many: Backups
  ru:
    one: Резервная копия
    many: Резервные копии
description:
  en: A backup is a copy of data, configuration or a whole system, stored where a failure of the original does not reach it. It is useful only if it can be restored within the time the business needs.
  ru: Резервная копия — копия данных, настроек или целой системы, хранимая там, куда отказ оригинала не достаёт. Она полезна, только если её можно восстановить за время, которое нужно бизнесу.
