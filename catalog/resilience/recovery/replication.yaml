id: nist800-34.replication
purpose: operations
audience: [operations, platform-devops, architect]
definition: Replication is the continuous copying of data or a service to a second place, with its delay.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - replicates
  in:
  - replicates
template-policy: none
labels:
  en:
    one: Replication
    many: Replications
  ru:
    one: Репликация
    many: Репликации
description:
  en: Replication keeps a second copy of data or a running service up to date by copying every change as it happens. The copying lag says how far behind the second place can be, and therefore how much data a failure may lose.
  ru: Репликация поддерживает вторую копию данных или работающего сервиса в актуальном состоянии, копируя каждое изменение по мере появления. Задержка копирования говорит, насколько второе место может отставать и сколько данных потеряется при отказе.
