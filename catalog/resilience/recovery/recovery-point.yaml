template-policy: none
labels:
  en:
    one: Recovery point
    many: Recovery points
  ru:
    one: Точка восстановления
    many: Точки восстановления
description:
  en: A recovery point is a moment a backup or a replica can restore the data to. The distance from the failure to that moment is the data that would be lost.
  ru: Точка восстановления — момент, к которому резервная копия или реплика может вернуть данные. Расстояние от сбоя до этого момента и есть данные, которые будут потеряны.
