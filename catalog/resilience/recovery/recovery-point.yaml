id: nist800-34.recovery-point
purpose: operations
audience: [operations, platform-devops, architect]
definition: A recovery point is one moment in time that a restore can return the data to, and how much data that loses.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
