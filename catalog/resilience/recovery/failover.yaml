id: nist800-34.failover
purpose: operations
audience: [operations, platform-devops, architect]
definition: A failover moves a service from its failed place to a standby, by a decision and a procedure.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - restores
  in:
  - restores
template-policy: none
labels:
  en:
    one: Failover
    many: Failovers
  ru:
    one: Переключение при отказе
    many: Переключения при отказе
description:
  en: A failover switches a service to a standby copy when the active one fails, either automatically or by a person's decision. It records what triggered it, how long the switch took and whether the service stayed available.
  ru: Переключение при отказе переводит сервис на резервную копию, когда основная отказала, — само или по решению человека. В записи сказано, что его вызвало, сколько занял переход и оставался ли сервис доступен.
derives-from:
- geo-redundancy
- recovery-plan
