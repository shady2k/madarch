id: nist800-34.business-continuity-plan
purpose: operations
audience: [operations, platform-devops, architect]
definition: A business continuity plan keeps the business running while its systems are recovered.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
