id: nist800-34.recovery-plan
purpose: operations
audience: [operations, platform-devops, architect]
definition: A recovery plan is the ordered steps that restore one system, with the evidence that each step worked.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Recovery plan
    many: Recovery plans
  ru:
    one: План восстановления
    many: Планы восстановления
description:
  en: 'A recovery plan lists, in order, what must be done to bring one system back: restore the data, start the services, check the connections, confirm the result. Each step says how the person knows it worked.'
  ru: 'План восстановления перечисляет по порядку, что нужно сделать, чтобы вернуть одну систему: восстановить данные, запустить сервисы, проверить связи, подтвердить результат. Для каждого шага сказано, как понять, что он сработал.'
