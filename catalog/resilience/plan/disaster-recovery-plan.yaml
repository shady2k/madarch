id: nist800-34.disaster-recovery-plan
purpose: operations
audience: [operations, platform-devops, architect]
definition: A disaster recovery plan is the part of the contingency plan that covers the loss of a site or a region.
sources:
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Disaster recovery plan
    many: Disaster recovery plans
  ru:
    one: План аварийного восстановления
    many: Планы аварийного восстановления
description:
  en: 'A disaster recovery plan takes over when a whole site or region is lost: where the service runs instead, how the data gets there and how long the move takes. It is tested by drills that assume the primary place is gone.'
  ru: 'План аварийного восстановления включается, когда потеряна целая площадка или регион: где сервис работает вместо них, как туда попадают данные и сколько занимает переезд. Его проверяют учениями, которые исходят из того, что основное место потеряно.'
