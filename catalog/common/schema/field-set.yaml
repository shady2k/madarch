id: manifest.properties
purpose: structure
audience: [architect, product-lead]
definition: A field set is a named group of fields several kinds share in their declarations.
sources:
- https://doc.anytype.io/anytype/organize/properties
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0021-product-repository-contract.md
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  - defines
  in:
  - partOf
  - defines
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the manifest gives the field set, such as task-status.
- name: fields
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:field-set-fields:v1
  nullable: true
  binding:
    agent: The fields the set holds, each with its name and the interface words it is shown by.
key:
- name
labels:
  en:
    one: Field set
    many: Field sets
  ru:
    one: Набор полей
    many: Наборы полей
description:
  en: A field set is a named group of fields that several kinds declare alike, such as the status and priority a work item carries. Naming it once keeps the declarations of the kinds that share it the same.
  ru: 'Набор полей — именованная группа полей, которые несколько видов объявляют одинаково: например, статус и приоритет рабочей записи. Названный один раз, он держит объявления этих видов одинаковыми.'
derives-from:
- product
