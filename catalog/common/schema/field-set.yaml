id: manifest.properties
purpose: structure
audience: [architect, product-lead]
definition: A field set is a named group of fields that several kinds share in their declarations.
sources:
- https://doc.anytype.io/anytype/organize/properties
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0021-product-repository-contract.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  - defines
  in:
  - partOf
  - defines
template-policy: none
labels:
  en:
    one: Field set
    many: Field sets
  ru:
    one: Набор полей
    many: Наборы полей
description:
  en: A field set gathers fields that several kinds need, such as an owner, a status or a time entry, and lets each kind include them by name instead of repeating them. No kind extends another; they share the set.
  ru: 'Набор полей объединяет поля, нужные нескольким видам: владельца, статус или запись времени, — и позволяет каждому виду включить их по имени, а не повторять. Один вид не наследует другой: они делят набор.'
