id: manifest.statuses
purpose: structure
audience: [architect, product-lead]
definition: A workflow status is a named state an entity may be in, declared in the product's workflow.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/create-edit-and-delete-statuses-in-team-managed-projects/
- https://support.atlassian.com/jira-software-cloud/docs/create-and-edit-workflows-in-team-managed-projects/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  - constrains
  in:
  - hasPart
template-policy: none
labels:
  en:
    one: Status
    many: Statuses
  ru:
    one: Статус
    many: Статусы
description:
  en: A workflow status names one state of a kind's life, such as draft, in review or done. An entity has one current status, and its transitions say which states may follow.
  ru: 'Статус — именованное состояние, в котором может быть сущность: черновик, на проверке или готово. У сущности один текущий статус, а переходы говорят, какие состояния могут за ним последовать.'
