id: manifest.event
purpose: structure
audience: [architect, product-lead]
definition: An event is a named happening that moves a workflow transition, such as an approval or a merge.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/transition-an-issue/
- https://www.omg.org/spec/BPMN/2.0.2/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - triggers
  - partOf
  in:
  - partOf
  - triggers
template-policy: none
labels:
  en:
    one: Event
    many: Events
  ru:
    one: Событие
    many: События
description:
  en: 'An event is something that happened in the product''s life and that a workflow reacts to: an entity was created or linked, a package was approved, a branch was merged, a test passed. A transition names the event that may trigger it.'
  ru: 'Событие — то, что произошло в жизни продукта и на что реагирует рабочий процесс: сущность создали или связали, пакет согласовали, ветку слили, тест прошёл. Переход называет событие, которое может его запустить.'
