id: manifest.responsibility
purpose: structure
audience: [architect, product-lead]
definition: Responsibility is the shared part of a kind that names the responsible person who answers for an entity and the executor, a person or an agent, who carries out the work.
sources:
- https://scrumguides.org/scrum-guide.html
- https://support.atlassian.com/jira-software-cloud/docs/edit-the-assignee-of-an-issue-with-your-keyboard/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - assigns
  - constrains
  in:
  - defines
  - partOf
template-policy: none
labels:
  en:
    one: Responsibility
    many: Responsibilities
  ru:
    one: Ответственность
    many: Ответственности
description:
  en: 'Responsibility is the common part of a kind''s declaration that records two people: the responsible person who answers for the entity, and the executor — a person or an agent — who does the work.'
  ru: 'Ответственность — общая часть объявления вида, которая записывает двоих: ответственного человека, который отвечает за сущность, и исполнителя — человека или агента, — который выполняет работу.'
