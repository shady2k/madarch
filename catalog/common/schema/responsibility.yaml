id: manifest.responsibility
purpose: structure
audience: [architect, product-lead]
definition: Responsibility is the part of an entity that names the person who answers for it and the person or agent who carries its work out.
sources:
- https://scrumguides.org/scrum-guide.html
- https://support.atlassian.com/jira-software-cloud/docs/edit-the-assignee-of-an-issue-with-your-keyboard/
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - assigns
  - constrains
  in:
  - defines
  - partOf
template-policy: page
source: graph
fields:
- name: responsible
  type: json
  nullable: true
  reference: person
  binding:
    agent: The person who answers for the entity.
- name: executor_type
  type: text
  nullable: true
  binding:
    agent: 'Who carries the work out: a person or an agent.'
- name: executor
  type: json
  nullable: true
  reference: person
  binding:
    agent: The person who carries the work out, where a person does it.
labels:
  en:
    one: Responsibility
    many: Responsibilities
  ru:
    one: Ответственность
    many: Ответственности
description:
  en: Responsibility is the shared part of a kind that names who answers for an entity and who carries its work out. It becomes a reference field of every kind that takes it, so the person and the role stand in the graph rather than in a string.
  ru: Ответственность — общая часть вида, которая называет, кто отвечает за сущность и кто выполняет работу. Она становится полем-ссылкой каждого вида, который её берёт, поэтому человек и роль стоят в графе, а не в строке.
