id: manifest.link-behaviours
purpose: structure
audience: [architect, product-lead]
definition: 'A link behaviour says what a link type does when its entities change: cardinality, backlink, whether it is required and how it is copied or removed.'
sources:
- https://doc.anytype.io/anytype/organize/properties
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0021-product-repository-contract.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - constrains
  - defines
  in:
  - constrains
  - defines
template-policy: none
labels:
  en:
    one: Link behaviour
    many: Link behaviours
  ru:
    one: Поведение связи
    many: Поведения связей
description:
  en: 'A link behaviour states the rules of one link type: how many links an end may have, whether a backlink appears on the other side, whether a link is required, and what happens to it when an entity is copied or deleted.'
  ru: 'Поведение связи задаёт правила одного типа связи: сколько связей может быть у конца, появляется ли обратная ссылка на другой стороне, обязательна ли связь и что с ней происходит, когда сущность копируют или удаляют.'
