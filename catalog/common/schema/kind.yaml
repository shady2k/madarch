id: manifest.kinds
purpose: structure
audience: [architect, product-lead]
definition: A kind is one declared type of entity of the product, with the fields it holds, its natural key and the page it shows.
sources:
- https://doc.anytype.io/anytype/organize/types
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0021-product-repository-contract.md
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - defines
  - hasPart
  in:
  - defines
  - partOf
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The kind's key in the manifest, such as domain or code.module.
- name: concept
  type: text
  nullable: true
  binding:
    agent: 'The canonical concept the kind declares, such as c4.container: one concept has one kind.'
- name: definition
  type: text
  nullable: true
  binding:
    agent: What the kind is, in one sentence, as its declaration words it.
- name: template_policy
  type: text
  nullable: true
  binding:
    agent: 'What the kind shows: a page of its own, a member row on another page, or nothing yet.'
key:
- name
labels:
  en:
    one: Kind
    many: Kinds
  ru:
    one: Вид
    many: Виды
description:
  en: 'A kind is the product’s declaration of a type of entity: what it is, the sources it was taken from, how its entities are acquired, the relations it may carry and what its page shows. The catalogue is made of kinds, and the engine reads the product’s kinds as entities of the graph like any other.'
  ru: 'Вид — объявление продуктом типа сущности: что это, из каких источников взято, как сущности появляются, какие связи допустимы и что показывает страница. Каталог состоит из видов, и движок читает виды продукта как сущности графа наравне с остальными.'
