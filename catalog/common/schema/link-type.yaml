id: manifest.link-types
purpose: structure
audience: [architect, product-lead]
definition: 'A link type declares a kind of connection between entities: its name, the kinds it may join and the labels at each end.'
sources:
- https://support.atlassian.com/jira-software-cloud/docs/link-issues/
- https://doc.anytype.io/anytype/create/links
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - defines
  - constrains
  in:
  - defines
template-policy: none
labels:
  en:
    one: Link type
    many: Link types
  ru:
    one: Тип связи
    many: Типы связей
description:
  en: A link type names a relationship that entities may have, such as uses, contains or depends on, and states which kinds may stand at each end and what the ends are called. Every link of that relationship follows the type's declaration.
  ru: 'Тип связи называет отношение, которое может быть между сущностями: использует, содержит или зависит от, — и говорит, какие виды могут стоять на каждом конце и как эти концы называются. Каждая связь такого отношения следует объявлению типа.'
