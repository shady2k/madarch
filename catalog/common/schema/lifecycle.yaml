id: manifest.lifecycle
purpose: structure
audience: [architect, product-lead]
definition: A lifecycle is the set of statuses and transitions a kind attaches; an entity has one current status, and an open question makes it blocked rather than becoming a status.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/create-and-edit-workflows-in-team-managed-projects/
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  - constrains
  in:
  - defines
  - partOf
template-policy: none
labels:
  en:
    one: Lifecycle
    many: Lifecycles
  ru:
    one: Жизненный цикл
    many: Жизненные циклы
description:
  en: A lifecycle is the set of statuses an entity may be in and the allowed moves between them, declared for a kind. An entity holds one current status at a time, and an open question can mark it as blocked without becoming a status.
  ru: Жизненный цикл — набор статусов, в которых может быть сущность, и разрешённых переходов между ними, объявленный для вида. У сущности один текущий статус, а открытый вопрос может пометить её как заблокированную, не становясь статусом.
