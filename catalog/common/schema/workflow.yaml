id: manifest.workflows
purpose: structure
audience: [architect, product-lead]
definition: A workflow is a named set of the engine’s stages a product runs, with the status that says what the engine can do with it today.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/create-and-edit-workflows-in-team-managed-projects/
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - hasPart
  in:
  - defines
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the product gives the workflow, such as first-fill or complete.
- name: status
  type: text
  nullable: true
  binding:
    agent: 'What the engine can do with the workflow today: implemented or planned.'
- name: stages
  type: json
  nullable: true
  binding:
    agent: The stages the workflow enables, in the order the engine runs them.
key:
- name
labels:
  en:
    one: Workflow
    many: Workflows
  ru:
    one: Рабочий процесс
    many: Рабочие процессы
description:
  en: A workflow is a named sequence of the engine’s stages that a product runs, such as the first fill or an update by commit, with a status saying whether the engine can run it today. The product declares its workflows, and the run page draws the state machine each one follows.
  ru: 'Рабочий процесс — именованная последовательность стадий движка, которую запускает продукт: первый проход или обновление по коммиту, — со статусом, говорящим, может ли движок её выполнить сегодня. Продукт объявляет свои процессы, а страница прогона рисует конечный автомат каждого из них.'
