id: manifest.workflows
purpose: structure
audience: [architect, product-lead]
definition: A workflow is a named sequence of stages with the limits and settings it runs under.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/create-and-edit-workflows-in-team-managed-projects/
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - defines
template-policy: none
labels:
  en:
    one: Workflow
    many: Workflows
  ru:
    one: Рабочий процесс
    many: Рабочие процессы
description:
  en: A workflow names a sequence of stages that a piece of work goes through, such as draft, review and release, with the limits and settings that apply to it. Its stages and transitions are declared, so the allowed moves are known.
  ru: 'Рабочий процесс — именованная последовательность этапов, которые проходит работа: черновик, проверка и выпуск, — с действующими для неё пределами и настройками. Его этапы и переходы объявлены, поэтому допустимые ходы известны.'
