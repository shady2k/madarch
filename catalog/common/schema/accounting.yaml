description:
  en: 'Accounting is the common part of a kind''s declaration that lets each of its entities keep a record of the steps taken: how long each took, which model did it, how many tokens and how much money it used, and how it ended.'
  ru: 'Учёт — общая часть объявления вида, которая позволяет каждой его сущности хранить записи о сделанных шагах: сколько занял каждый, какая модель его выполняла, сколько токенов и денег он стоил и чем закончился.'
