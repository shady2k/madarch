id: manifest.transitions
purpose: structure
audience: [architect, product-lead]
definition: A workflow transition is an allowed move from one status to another, with the event that triggers it and the rule that allows it.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/transition-an-issue/
- https://support.atlassian.com/jira-software-cloud/docs/create-and-edit-workflows-in-team-managed-projects/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  - triggers
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Transition
    many: Transitions
  ru:
    one: Переход
    many: Переходы
description:
  en: A workflow transition permits an entity to move from one status to another when a named event happens and a rule is satisfied, such as an approval or a passing test. It is one step in the sequence a workflow allows.
  ru: 'Переход разрешает сущности сменить один статус на другой, когда происходит названное событие и выполняется правило: согласование или успешный тест. Это один шаг из тех, что допускает рабочий процесс.'
