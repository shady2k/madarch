id: practice.external-reference
purpose: structure
audience: [product-lead, analyst, developer]
definition: An external reference points to the same thing in another system, by that system's name, its identifier there and a link.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/link-issues/
- https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - documents
  - evidences
  in:
  - documents
  - evidences
template-policy: none
labels:
  en:
    one: External reference
    many: External references
  ru:
    one: Внешняя ссылка
    many: Внешние ссылки
description:
  en: 'An external reference connects an entity to its counterpart elsewhere: a ticket in an issue tracker, a record in a customer system, a row in a catalogue. It names the other system, the identifier used there and the address a person can open.'
  ru: 'Внешняя ссылка связывает сущность с её двойником в другой системе: тикетом в трекере, записью в системе клиентов, строкой в каталоге. В ней названы другая система, тамошний идентификатор и адрес, который можно открыть.'
