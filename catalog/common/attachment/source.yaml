id: practice.source
purpose: structure
audience: [developer, architect]
definition: A source file is the text of one repository file at the commit that was recorded.
sources:
- https://git-scm.com/docs/git-show
acquisition:
- document
status: implemented
relation-constraints:
  out: []
  in: []
template-policy: page
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read **/* files in every declared repository and the product repository: repository name, or null for the product
      repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* files in every declared repository and the product repository: repository-relative file path.'
- name: source_text
  type: text
  binding:
    agent: 'Read **/* files in every declared repository and the product repository: full source text grounded in the file
      at its recorded commit; never omit or shorten content silently.'
- name: commit
  type: text
  binding:
    agent: 'Read **/* files in every declared repository and the product repository: the exact repository commit whose file
      text grounds this opinion.'
key:
- repository
- path
labels:
  en:
    one: Source file
    many: Source files
  ru:
    one: Исходный файл
    many: Исходные файлы
description:
  en: A source file keeps the full text of one file from a repository as it stood at a given commit, so a claim about the code can be checked later. It is the evidence behind a statement about what the code does.
  ru: Исходный файл хранит полный текст одного файла репозитория в том виде, в каком он был на записанном коммите, чтобы утверждение о коде можно было проверить позже. Это доказательство за высказыванием о том, что делает код.
