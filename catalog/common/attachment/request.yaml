id: practice.request
purpose: understand
audience: [product-lead, analyst, developer]
definition: 'A request is what a person asks of a team, kept in the words they used: a question, a change or a report of a problem.'
sources:
- https://github.com/shady2k/madarch/blob/main/docs/vision/architecture-talk-2026-11-01.md
- https://support.atlassian.com/jira-service-management-cloud/docs/what-are-service-requests/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  - evidences
  in:
  - approves
  - evidences
template-policy: none
labels:
  en:
    one: Request
    many: Requests
  ru:
    one: Запрос
    many: Запросы
description:
  en: 'A request is a message in which a person asks for something: an answer, a change or a fix. It is kept in the words the person used, and it belongs to the piece of work that answers it.'
  ru: 'Запрос — сообщение, в котором человек о чём-то просит: ответа, изменения или исправления. Его сохраняют в тех словах, в которых человек его написал, и он относится к работе, которая на него отвечает.'
