id: practice.request
purpose: understand
audience: [product-lead, analyst, developer]
definition: A request is a person's utterance or an agent's proposal, kept verbatim, that may change something in the product; its consequences are reviewed and a responsible person approves them before they are applied.
sources:
- https://github.com/shady2k/madarch/blob/main/docs/vision/architecture-talk-2026-11-01.md
- https://support.atlassian.com/jira-service-management-cloud/docs/what-are-service-requests/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  - evidences
  in:
  - approves
  - evidences
template-policy: none
labels:
  en:
    one: Request
    many: Requests
  ru:
    one: Запрос
    many: Запросы
description:
  en: A request is a person's utterance or an agent's proposal, kept in the words in which it was made, that may change something in the product. Its consequences are reviewed, and a responsible person approves them before they are applied.
  ru: Запрос — высказывание человека или предложение агента, сохранённое дословно, которое может изменить что-то в продукте; последствия разбирают, а ответственный человек согласует их до применения.
