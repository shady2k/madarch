id: practice.operation
purpose: history
audience: [product-lead, analyst, developer]
definition: An operation is one intended change with its author, time and expectation, applied as a single step of the record.
sources:
- https://hal.inria.fr/inria-00555588/document
- https://martinfowler.com/eaaDev/EventSourcing.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  - generates
  in:
  - affects
template-policy: none
labels:
  en:
    one: Operation
    many: Operations
  ru:
    one: Операция
    many: Операции
description:
  en: An operation is one change someone intends to make — create an entity, change a field, add a link — with who asked for it, when and what result is expected. Applying operations in order reproduces the state they describe.
  ru: 'Операция — одно изменение, которое кто-то намерен сделать: создать сущность, изменить поле, добавить связь, — с указанием автора, времени и ожидаемого результата. Применённые по порядку операции воспроизводят описанное ими состояние.'
