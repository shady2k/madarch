id: practice.link
purpose: structure
audience: [architect, analyst, developer]
definition: A link is a typed connection between two entities, with its own identity, attributes and history.
sources:
- https://doc.anytype.io/anytype/create/links
- https://support.atlassian.com/jira-software-cloud/docs/link-issues/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - linksTo
  in:
  - linksTo
template-policy: none
labels:
  en:
    one: Link
    many: Links
  ru:
    one: Связь
    many: Связи
description:
  en: A link joins two entities under a declared type, such as a service using a database or a task belonging to a stage. It can carry its own attributes and history, so the connection itself is a thing that can change.
  ru: 'Связь соединяет две сущности под объявленным типом: сервис использует базу данных или задача входит в этап. У неё могут быть свои атрибуты и история, поэтому сама связь — вещь, которая меняется.'
