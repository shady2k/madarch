id: practice.comment
purpose: history
audience: [product-lead, analyst, developer]
definition: A comment is a remark a person or an agent attaches to something, kept with its author and time.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/watch-share-and-comment-on-a-work-item/
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/about-pull-request-reviews
acquisition:
- conversation
- agent-from-graph
relation-constraints:
  out:
  - appliesTo
  - partOf
  in:
  - partOf
template-policy: page
source: graph
origin: person
details:
- body
- created_at
- edited_at
fields:
- name: body
  type: text
  producers:
  - person
- name: created_at
  type: timestamp
  producers:
  - person
- name: edited_at
  type: timestamp
  nullable: true
  producers:
  - person
nav: own-page
labels:
  en:
    one: Comment
    many: Comments
  ru:
    one: Комментарий
    many: Комментарии
description:
  en: 'A comment is a short remark someone attaches to an entity: a question, a warning, an explanation or a note for later. It keeps the author and the time, so a reader knows who said it and when.'
  ru: 'Комментарий — короткое замечание, которое человек или агент прикрепляет к сущности: вопрос, предупреждение, пояснение или заметку на будущее. В нём остаются автор и время, чтобы читатель знал, кто и когда это сказал.'
