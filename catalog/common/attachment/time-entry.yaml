id: practice.time-entry
purpose: history
audience: [product-lead, developer]
definition: A time entry records time spent on something, with its kind (work time, waiting or an agent's run), its duration and who spent it.
sources:
- https://support.atlassian.com/jira-software-cloud/docs/log-time-on-an-issue/
- https://support.atlassian.com/jira-service-management-cloud/docs/create-an-sla/
- https://opentelemetry.io/docs/specs/semconv/gen-ai/gen-ai-metrics/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - appliesTo
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: Time entry
    many: Time entries
  ru:
    one: Запись времени
    many: Записи времени
description:
  en: 'A time entry records one stretch of time spent on an entity: work time, waiting or an agent''s run, how long it lasted and who spent it. Entries add up to what a piece of work cost in time.'
  ru: 'Запись времени фиксирует один отрезок времени, потраченного на сущность: рабочее время, ожидание или прогон агента, — его длительность и того, кто его потратил. Записи складываются в то, сколько времени стоила работа.'
