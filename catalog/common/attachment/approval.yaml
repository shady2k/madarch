id: practice.approval
purpose: history
audience: [product-lead, analyst, developer]
definition: 'An approval is a responsible person''s decision on a package of changes: accepted, or refused with a reason.'
sources:
- https://support.atlassian.com/jira-software-cloud/docs/what-are-approvals/
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/about-pull-request-reviews
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - approves
  in:
  - approves
template-policy: none
labels:
  en:
    one: Approval
    many: Approvals
  ru:
    one: Согласование
    many: Согласования
description:
  en: 'An approval records the decision a responsible person made about a package of changes: that it may be applied, or that it is refused and why. It names who decided and when.'
  ru: 'Согласование фиксирует решение ответственного человека о пакете изменений: применить его или отказать и почему. В нём указано, кто и когда решил.'
