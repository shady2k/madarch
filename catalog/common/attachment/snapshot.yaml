id: practice.snapshot
purpose: history
audience: [architect, platform-devops, operations]
definition: A snapshot is a complete copy of the product's knowledge at one moment, kept as a restore point.
sources:
- https://csrc.nist.gov/pubs/sp/800/209/final
- https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  - restores
  in:
  - partOf
  - restores
template-policy: none
labels:
  en:
    one: Snapshot
    many: Snapshots
  ru:
    one: Снимок
    many: Снимки
description:
  en: A snapshot captures the whole state of the product's knowledge at one moment, so it can be brought back to that point. Changes made after it are kept as separate steps, which can be replayed on the restored state.
  ru: Снимок захватывает всё состояние знаний продукта на один момент, чтобы к этой точке можно было вернуться. Изменения после него хранят отдельными шагами, которые можно повторить на восстановленном состоянии.
derives-from:
- system.product
