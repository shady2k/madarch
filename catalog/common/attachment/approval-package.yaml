id: practice.approval-package
purpose: quality
audience: [product-lead, analyst, developer]
definition: An approval package gathers the pending changes to one entity — what will be created or altered, with their links and risks — for a responsible person to approve.
sources:
- https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests
- https://support.atlassian.com/jira-software-cloud/docs/what-are-approvals/
- https://github.com/shady2k/madarch/blob/main/docs/decisions/0033-one-workflow-by-entity-kinds.md
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  - contains
  - evidences
  in:
  - approves
  - evidences
template-policy: none
labels:
  en:
    one: Approval package
    many: Approval packages
  ru:
    one: Пакет согласования
    many: Пакеты согласования
description:
  en: 'An approval package puts before a responsible person one set of pending changes to an entity: what will be created or changed, how it is connected and what could go wrong. The entity keeps its current state until the package is approved or declined.'
  ru: 'Пакет согласования представляет ответственному человеку один набор предстоящих изменений сущности: что будет создано или изменено, как это связано и что может пойти не так. Сущность сохраняет текущее состояние, пока пакет не согласуют или не отклонят.'
