id: x509.certificate
purpose: operations
audience: [operations, platform-devops, security-engineer]
definition: A certificate is a signed statement that binds a public key to a name, which a service presents to be trusted.
sources:
- https://www.rfc-editor.org/rfc/rfc5280.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Certificate
    many: Certificates
  ru:
    one: Сертификат
    many: Сертификаты
description:
  en: A certificate ties a public key to a name and is signed by an authority that the other side trusts. A service presents it to prove that it is the name it claims, and it expires, so it must be renewed.
  ru: Сертификат связывает открытый ключ с именем и подписан удостоверяющим центром, которому другая сторона доверяет. Сервис предъявляет его, чтобы доказать, что он и есть заявленное имя; сертификат истекает, поэтому его нужно продлевать.
derives-from:
- domain-name
- key-material
- product-profile
