description:
  en: A port is one numbered entrance on a machine's network address, such as 443 for secure HTTP, where a program waits for connections. A service publishes the port it listens on, and a firewall or a proxy decides who may reach it.
  ru: Порт — пронумерованный вход по сетевому адресу машины, например 443 для защищённого HTTP, где программа ждёт соединений. Сервис объявляет порт, который слушает, а брандмауэр или прокси решает, кому до него можно.
