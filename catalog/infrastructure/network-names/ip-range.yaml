id: practice.ip-range
purpose: operations
audience: [operations, platform-devops, architect]
definition: An IP range is a block of addresses the product's networks and rules are written against.
sources:
- https://www.rfc-editor.org/rfc/rfc4632.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - appliesTo
template-policy: none
labels:
  en:
    one: IP range
    many: IP ranges
  ru:
    one: Диапазон IP
    many: Диапазоны IP
description:
  en: An IP range is a continuous block of network addresses, written as a base address and a prefix length, such as 10.0.0.0/8. Networks, firewall rules and access policies name ranges to say which addresses they cover.
  ru: Диапазон IP — непрерывный блок сетевых адресов, записанный базовым адресом и длиной префикса, например 10.0.0.0/8. Сети, правила брандмауэра и политики доступа называют диапазоны, чтобы указать, какие адреса они покрывают.
