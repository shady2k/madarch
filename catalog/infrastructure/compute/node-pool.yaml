id: kubernetes.node-pool
purpose: structure
audience: [operations, platform-devops, architect]
definition: A node pool is a group of cluster nodes with the same shape, scaled together.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Node pool
    many: Node pools
  ru:
    one: Пул узлов
    many: Пулы узлов
description:
  en: A node pool is a set of nodes in a cluster that share their machine type, their size and often their purpose, such as general work or memory-heavy work. The pool is scaled as one, so the cluster adds or removes nodes of that shape together.
  ru: 'Пул узлов — набор узлов кластера с общим типом машины, размером и обычно назначением: общая работа или работа с большим объёмом памяти. Пул масштабируют целиком, поэтому кластер добавляет или убирает узлы этой формы вместе.'
