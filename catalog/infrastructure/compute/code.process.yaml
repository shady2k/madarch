id: practice.runtime-process
purpose: operations
audience: [operations, platform-devops, architect]
definition: A process is a running program the system starts, with the port it listens on.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/process/
acquisition:
- extractor operations
relation-constraints:
  out:
  - hasHost
  - partOf
  in:
  - hasHost
template-policy: page
source: graph
details:
- binary
- command
fields:
- name: service
  type: text
