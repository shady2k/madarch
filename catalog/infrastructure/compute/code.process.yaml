id: practice.runtime-process
purpose: operations
audience: [operations, platform-devops, architect]
definition: A process is a running program the system starts, with the port it listens on.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/process/
acquisition:
- extractor operations
status: implemented
relation-constraints:
  out:
  - hasHost
  in:
  - hasHost
template-policy: page
source: graph
details:
- binary
- command
labels:
  en:
    one: Process
    many: Processes
  ru:
    one: Процесс
    many: Процессы
description:
  en: A process is one running instance of a program in the system, with the command that started it, its environment and the ports it listens on. Several processes of the same program may run side by side.
  ru: Процесс — один работающий экземпляр программы в системе с командой, которая его запустила, его окружением и портами, которые он слушает. Несколько процессов одной программы могут работать одновременно.
