    many: Процессы
description:
  en: A process is one running instance of a program in the system, with the command that started it, its environment and the ports it listens on. Several processes of the same program may run side by side.
  ru: Процесс — один работающий экземпляр программы в системе с командой, которая его запустила, его окружением и портами, которые он слушает. Несколько процессов одной программы могут работать одновременно.
