description:
  en: A Kubernetes node is one machine — a server, a virtual machine or a managed instance — that the cluster schedules pods onto and that runs the container runtime. Its capacity and its labels decide which pods it can take.
  ru: 'Узел Kubernetes — одна машина кластера: сервер, виртуальная машина или управляемый экземпляр, — на которую кластер ставит поды и которая запускает среду контейнеров. От её мощности и меток зависит, какие поды она примет.'
