id: practice.cloud-resource
purpose: structure
audience: [operations, platform-devops, architect]
definition: A cloud resource is a resource a cloud provider offers and the product uses, such as a virtual machine, a bucket or a managed database.
sources:
- https://opentelemetry.io/docs/specs/semconv/resource/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - dependsOn
  in:
  - dependsOn
template-policy: none
labels:
  en:
    one: Cloud resource
    many: Cloud resources
  ru:
    one: Облачный ресурс
    many: Облачные ресурсы
description:
  en: 'A cloud resource is one unit of capacity a cloud provider supplies to the product, named by the provider''s own type: an instance, a bucket, a load balancer, a managed queue. The product pays for it while it exists and depends on the provider''s rules for it.'
  ru: 'Облачный ресурс — единица мощности, которую облачный провайдер даёт продукту, под именем типа самого провайдера: виртуальная машина, бакет, балансировщик, управляемая очередь. Продукт платит за неё, пока она существует, и зависит от правил провайдера для неё.'
