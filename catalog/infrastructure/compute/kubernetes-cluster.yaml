id: kubernetes.cluster
purpose: structure
audience: [operations, platform-devops, architect]
definition: A Kubernetes cluster is a set of nodes that one control plane schedules workloads onto.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - contains
template-policy: none
labels:
  en:
    one: Kubernetes cluster
    many: Kubernetes clusters
  ru:
    one: Кластер Kubernetes
    many: Кластеры Kubernetes
description:
  en: A Kubernetes cluster groups machines and a control plane that decides where each workload runs, keeps the declared number of copies and restarts what fails. It is the boundary within which Kubernetes objects live.
  ru: Кластер Kubernetes объединяет машины и панель управления, которая решает, где работает каждая нагрузка, держит объявленное число копий и перезапускает отказавшее. Это граница, внутри которой существуют объекты Kubernetes.
applicability:
  dependencies: []
  markers:
  - '**/Chart.yaml'
  - '**/kustomization.yaml'
  - '**/kustomization.yml'
  - '**/*deployment.yaml'
  - '**/*deployment.yml'
  - '**/*k8s*.yaml'
  - '**/*k8s*.yml'
  profile: deployment
source: graph
derives-from: [product-profile]
