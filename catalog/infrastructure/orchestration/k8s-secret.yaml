id: kubernetes.secret
purpose: operations
audience: [security-engineer, platform-devops, operations]
definition: A Kubernetes secret is an object that holds a secret value a pod reads.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - configures
  in:
  - configures
template-policy: none
labels:
  en:
    one: Kubernetes Secret
    many: Kubernetes Secrets
  ru:
    one: Секрет Kubernetes
    many: Секреты Kubernetes
description:
  en: A Kubernetes secret stores a password, a token or a certificate in a form a pod can mount or read, kept apart from the image. It is not encrypted by default, so the cluster's storage and access rules must protect it.
  ru: Секрет Kubernetes хранит пароль, токен или сертификат в виде, который под может смонтировать или прочитать, отдельно от образа. По умолчанию он не зашифрован, поэтому его защищают хранилище кластера и правила доступа.
derives-from:
- k8s-namespace
- product-profile
