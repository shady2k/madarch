id: kubernetes.daemonset
purpose: operations
audience: [operations, platform-devops, architect]
definition: A DaemonSet is a Kubernetes workload that runs one pod on every node it selects.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: DaemonSet
    many: DaemonSets
  ru:
    one: DaemonSet
    many: DaemonSet
description:
  en: A DaemonSet places one copy of a pod on each node that matches its selector, so the number of copies follows the number of nodes. It suits a job that must run everywhere, such as a log collector or a network agent.
  ru: 'DaemonSet ставит одну копию пода на каждый узел, подходящий под его отбор, поэтому число копий следует за числом узлов. Он подходит для работы, которая нужна повсюду: сборщика журналов или сетевого агента.'
