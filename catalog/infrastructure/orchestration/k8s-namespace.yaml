id: kubernetes.namespace
purpose: operations
audience: [operations, platform-devops, architect]
definition: A namespace is a named division of a cluster within which names and quotas hold.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Namespace
    many: Namespaces
  ru:
    one: Пространство имён
    many: Пространства имён
description:
  en: A Kubernetes namespace groups objects inside a cluster, so names are unique within it and quotas and access rules can be set for it. Teams usually get a namespace of their own, and one cluster can hold many.
  ru: 'Пространство имён объединяет объекты внутри кластера: имена уникальны в его пределах, а квоты и правила доступа задают для него. Обычно у команды своё пространство имён, и в одном кластере их может быть много.'
