id: kubernetes.deployment
purpose: operations
audience: [operations, platform-devops, architect]
definition: A Kubernetes Deployment declares the image a workload runs, how many copies and how they are checked.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- extractor operations
relation-constraints:
  out:
  - hasPart
  - code.runs
  - partOf
  in:
  - partOf
template-policy: page
source: graph
details:
- image
- replicas
- containerPorts
- probePath
- probePaths
- envFrom
fields:
- name: namespace
  type: text
  producers:
  - operations
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  producers:
  - operations
- name: image
  type: text
  nullable: true
  producers:
  - operations
- name: replicas
  type: integer
  nullable: true
  producers:
  - operations
- name: container_ports
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:port-list:v1
  nullable: true
  producers:
  - operations
- name: probes
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:code.k8s-deployment-probes:v1
  nullable: true
  producers:
  - operations
- name: env_from
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  producers:
  - operations
key:
- namespace
- name
derives-from:
- code.file
- code.image
labels:
  en:
    one: Kubernetes deployment
    many: Kubernetes deployments
  ru:
    one: Развёртывание Kubernetes
    many: Развёртывания Kubernetes
description:
  en: A Kubernetes Deployment says which container image should run, how many replicas of it and how the cluster should check and replace them. Changing the declaration makes the cluster roll out a new version gradually.
  ru: Развёртывание Kubernetes говорит, какой образ контейнера должен работать, сколько его копий нужно и как кластер должен их проверять и заменять. Изменение объявления заставляет кластер постепенно выпустить новую версию.
applicability:
  dependencies:
  - kubernetes-cluster
  markers: []
