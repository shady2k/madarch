id: kubernetes.job
purpose: operations
audience: [operations, platform-devops, architect]
definition: A Kubernetes job is a workload that runs to completion once.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Kubernetes job
    many: Kubernetes jobs
  ru:
    one: Задача Kubernetes
    many: Задачи Kubernetes
description:
  en: A Kubernetes job starts one or more pods, waits until they finish successfully and then stops, retrying failures up to a limit. It is for work with an end, such as a migration or a report, not for a service that keeps running.
  ru: 'Задача Kubernetes запускает один или несколько подов, ждёт их успешного завершения и останавливается, повторяя неудачи до предела. Она нужна для работы с концом: миграции или отчёта, — а не для сервиса, который работает постоянно.'
