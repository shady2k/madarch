id: kubernetes.cronjob
purpose: operations
audience: [operations, platform-devops, architect]
definition: A CronJob is a Kubernetes workload that runs a job on a schedule.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: CronJob
    many: CronJobs
  ru:
    one: CronJob
    many: CronJob
description:
  en: A CronJob tells Kubernetes to create a job at the times a schedule gives, such as every night at two. Each run finishes on its own, and the object records how many successful and failed runs to keep.
  ru: 'CronJob велит Kubernetes создавать задачу в моменты, заданные расписанием: например, каждую ночь в два часа. Каждый запуск завершается сам, а объект хранит, сколько удачных и неудачных запусков оставлять.'
