id: kubernetes.ingress
purpose: operations
audience: [operations, platform-devops, architect]
definition: An Ingress is a Kubernetes rule that routes traffic from outside the cluster to a service.
sources:
- https://kubernetes.io/docs/reference/kubernetes-api/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - routesTo
  in:
  - routesTo
template-policy: none
labels:
  en:
    one: Ingress
    many: Ingresses
  ru:
    one: Ingress
    many: Ingress
description:
  en: 'A Kubernetes Ingress declares how requests arriving from outside reach services inside: by host name and path, with TLS settings and redirects. An ingress controller carries the rule out, so its behaviour depends on which controller runs.'
  ru: 'Ingress объявляет, как запросы извне доходят до сервисов внутри: по имени хоста и пути, с настройками TLS и перенаправлениями. Правило исполняет контроллер входа, поэтому поведение зависит от того, какой контроллер работает.'
derives-from:
- code.k8s-service
- product-profile
applicability:
  dependencies:
  - kubernetes-cluster
  markers: []
source: graph
