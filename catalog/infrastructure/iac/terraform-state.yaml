id: terraform.state
purpose: operations
audience: [operations, platform-devops, architect]
definition: A Terraform state is the record Terraform keeps of the resources it created and their last known attributes.
sources:
- https://developer.hashicorp.com/terraform/language/state
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - contains
template-policy: none
labels:
  en:
    one: Terraform state
    many: Terraform states
  ru:
    one: Состояние Terraform
    many: Состояния Terraform
description:
  en: A Terraform state file records which real infrastructure objects a definition created, their identifiers and their last known values. Terraform reads it to decide what must change, so losing or changing it wrongly can make Terraform recreate or forget objects.
  ru: Состояние Terraform записывает, какие настоящие объекты инфраструктуры создало описание, их идентификаторы и последние известные значения. Terraform читает его, чтобы решить, что менять, поэтому потеря или неверное изменение состояния заставляет его пересоздать объекты или забыть о них.
derives-from:
- product-profile
- terraform-resource
