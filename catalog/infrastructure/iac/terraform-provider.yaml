id: terraform.provider
purpose: operations
audience: [operations, platform-devops, architect]
definition: A Terraform provider is the extension through which Terraform manages the resources of one platform.
sources:
- https://developer.hashicorp.com/terraform/language/providers
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - defines
  in:
  - defines
template-policy: none
labels:
  en:
    one: Terraform provider
    many: Terraform providers
  ru:
    one: Провайдер Terraform
    many: Провайдеры Terraform
description:
  en: A Terraform provider is a program that teaches Terraform the resources of one platform — its cloud, its database service or its DNS — and how to create, read, change and delete them. Each provider has its own version, and its upgrades can change what a definition does.
  ru: 'Провайдер Terraform — программа, которая учит Terraform ресурсам одной платформы: облака, службы баз данных или DNS, — и тому, как их создавать, читать, менять и удалять. У каждого провайдера своя версия, а обновление может изменить поведение описания.'
