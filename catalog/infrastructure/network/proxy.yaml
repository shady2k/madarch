id: practice.proxy
purpose: structure
audience: [operations, platform-devops, architect]
definition: A proxy forwards traffic and may change, cache or refuse it on the way.
sources:
- https://www.rfc-editor.org/rfc/rfc9110.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - routesTo
  in:
  - routesTo
template-policy: none
labels:
  en:
    one: Proxy
    many: Proxies
  ru:
    one: Прокси
    many: Прокси
description:
  en: A proxy stands between a client and a server and passes requests and answers through itself. On the way it can add headers, cache answers, hide addresses, limit requests or refuse traffic it does not allow.
  ru: Прокси стоит между клиентом и сервером и пропускает запросы и ответы через себя. По пути он может добавлять заголовки, кэшировать ответы, скрывать адреса, ограничивать запросы или отклонять недопустимый трафик.
