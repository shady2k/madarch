id: practice.network-zone
purpose: structure
audience: [operations, platform-devops, architect]
definition: A network zone is a part of the network with one level of trust, whose border traffic crosses at a controlled point.
sources:
- https://cyclonedx.org/docs/1.6/json/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Network zone
    many: Network zones
  ru:
    one: Сетевая зона
    many: Сетевые зоны
description:
  en: A network zone groups addresses and machines that share a level of trust, such as a public zone, an internal zone or a management zone. Traffic between zones passes only through controlled points, where it can be filtered.
  ru: 'Сетевая зона объединяет адреса и машины с одним уровнем доверия: внешняя зона, внутренняя зона или зона управления. Трафик между зонами идёт только через контролируемые точки, где его можно отфильтровать.'
