id: practice.load-balancer
purpose: structure
audience: [operations, platform-devops, architect]
definition: A load balancer spreads traffic over several targets and checks which of them are healthy.
sources:
- https://www.rfc-editor.org/rfc/rfc7230.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - routesTo
  in:
  - routesTo
template-policy: none
labels:
  en:
    one: Load balancer
    many: Load balancers
  ru:
    one: Балансировщик
    many: Балансировщики
description:
  en: A load balancer receives traffic on one address and sends each request to one of several targets, by a rule such as round robin or least load. It checks the targets with health probes and stops sending to those that fail.
  ru: 'Балансировщик принимает трафик на один адрес и отправляет каждый запрос одной из нескольких целей по правилу: по кругу или на менее загруженную. Он проверяет цели пробами и перестаёт слать тем, что не отвечают.'
