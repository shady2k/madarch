id: practice.security-group
purpose: operations
audience: [operations, platform-devops, security-engineer]
definition: A security group is a named set of firewall rules attached to the resources of one cloud network.
sources:
- https://www.rfc-editor.org/rfc/rfc4949.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - appliesTo
template-policy: none
labels:
  en:
    one: Security group
    many: Security groups
  ru:
    one: Группа безопасности
    many: Группы безопасности
description:
  en: A security group collects the rules that one group of cloud resources shares, such as the servers of a service, and applies them together. A resource belongs to one or more groups, and all their rules decide what reaches it.
  ru: 'Группа безопасности собирает правила, общие для одной группы облачных ресурсов: например, серверов сервиса, — и применяет их вместе. Ресурс входит в одну или несколько групп, и все их правила решают, что до него доходит.'
derives-from:
- network-zone
- product-profile
