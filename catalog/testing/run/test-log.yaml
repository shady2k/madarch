id: istqb.test-log
purpose: quality
audience: [tester, developer]
definition: A test log is the chronological record of what a test run did.
sources:
- https://glossary.istqb.org/en_US/term/test-log
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Test log
    many: Test logs
  ru:
    one: Журнал тестирования
    many: Журналы тестирования
description:
  en: 'A test log records what happened during a run, in order: which test started, what it printed, which setup or call failed. It is what a person reads when a result needs explaining.'
  ru: 'Журнал тестирования записывает по порядку, что происходило во время запуска: какой тест начался, что он вывел, какая подготовка или вызов отказали. Его читают, когда результат нужно объяснить.'
