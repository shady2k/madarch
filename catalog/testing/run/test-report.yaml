id: istqb.test-report
purpose: quality
audience: [tester, developer]
definition: 'A test report is the summary of a test run: what passed, what failed and what could not run.'
sources:
- https://glossary.istqb.org/en_US/term/test-report
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Test report
    many: Test reports
  ru:
    one: Отчёт о тестировании
    many: Отчёты о тестировании
description:
  en: 'A test report sums up one run: the counts of passed, failed and skipped tests, the failures with their messages and the time taken. It is what a person or a gate reads to decide whether the version may go on.'
  ru: 'Отчёт о тестировании подводит итог одного запуска: сколько тестов прошло, упало и было пропущено, какие были сбои с их сообщениями и сколько всё заняло. По нему человек или шлюз решает, можно ли двигать версию дальше.'
