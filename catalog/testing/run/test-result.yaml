id: istqb.test-result
purpose: quality
audience: [tester, developer]
definition: A test result is the outcome of one test case in one run, with the time it took and the failure it reported.
sources:
- https://glossary.istqb.org/en_US/term/test-result
acquisition:
- extractor test-quarantine
- agent-from-graph
relation-constraints:
  out:
  - partOf
  - evidences
  in:
  - hasPart
  - evidences
template-policy: page
source: graph
fields:
- name: outcome
  type: text
  nullable: true
  binding:
    agent: 'What the run answered: passed, failed or skipped.'
- name: at
  type: timestamp
  nullable: true
  binding:
    agent: When the test ran.
- name: duration
  type: duration-ms
  nullable: true
  binding:
    agent: How long the test took, in milliseconds.
key:
- at
labels:
  en:
    one: Test result
    many: Test results
  ru:
    one: Результат теста
    many: Результаты тестов
description:
  en: A test result states whether one test case passed, failed or was skipped, how long it took and, on failure, what went wrong and where. Results put side by side across runs show what changed.
  ru: Результат теста говорит, прошёл ли один тест, упал или был пропущен, сколько он занял и при сбое — что и где пошло не так. Сравнив результаты разных запусков, видно, что изменилось.

key-edges:
- role: test-result-test
  edge: test-result-test
  side: from
