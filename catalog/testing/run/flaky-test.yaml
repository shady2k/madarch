id: practice.flaky-test
purpose: quality
audience: [tester, developer]
definition: A flaky test is a test whose result differs between runs of the same code.
sources:
- https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Flaky test
    many: Flaky tests
  ru:
    one: Нестабильный тест
    many: Нестабильные тесты
description:
  en: A flaky test passes and fails on the same version without the code changing, usually because of timing, order, shared state or an outside service. It costs trust in the suite, so it is tracked and either fixed or set aside.
  ru: Нестабильный тест проходит и падает на одной и той же версии без изменения кода, обычно из-за времени, порядка, общего состояния или внешнего сервиса. Он подрывает доверие к набору, поэтому его ведут и либо чинят, либо откладывают.
