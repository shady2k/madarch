id: istqb.test-double
purpose: quality
audience: [tester, developer]
definition: A test double is a stand-in for a component or an interface that a test runs against.
sources:
- https://glossary.istqb.org/en_US/term/test-double
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Test double
    many: Test doubles
  ru:
    one: Тестовый дублёр
    many: Тестовые дублёры
description:
  en: 'A test double replaces a real component in a test: a stub returns prepared answers, a mock records calls, a fake is a simple working version. It lets the test control what the other side does and check what the code sends.'
  ru: 'Тестовый дублёр заменяет настоящий компонент в тесте: заглушка возвращает подготовленные ответы, макет записывает вызовы, подделка — простая работающая версия. Он позволяет тесту управлять другой стороной и проверять, что отправляет код.'
