id: istqb.test-data
purpose: quality
audience: [tester, developer]
definition: Test data is the data a test needs to run, kept apart from the test code.
sources:
- https://glossary.istqb.org/en_US/term/test-data
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Test data
    many: Test data
  ru:
    one: Тестовые данные
    many: Тестовые данные
description:
  en: 'Test data is the input and the starting state a test needs: records, accounts, files, messages. Keeping it separate from the code makes the test easier to read and to run on another machine.'
  ru: 'Тестовые данные — входные данные и начальное состояние, нужные тесту: записи, учётные записи, файлы, сообщения. Хранение отдельно от кода делает тест понятнее и позволяет запускать его на другой машине.'
