id: practice.test-quarantine
purpose: quality
audience: [tester, developer]
definition: A test quarantine is a test temporarily kept out of the regular suite because it is flaky, slow or broken, with the work to repair it.
sources:
- https://docs.gitlab.com/development/testing_guide/quarantining_tests/
- https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html
acquisition:
- extractor test-quarantine
relation-constraints:
  out:
  - quarantines
  - fixedBy
  in: []
template-policy: page
source: graph
fields:
- name: repository
  type: text
  binding: test-quarantine@1.repository
- name: path
  type: path
  binding: test-quarantine@1.path
- name: name
  type: text
  binding: test-quarantine@1.name
- name: test
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-code.test-case:v1
  reference: code.test-case
  binding: test-quarantine@1.test
- name: task
  type: text
  reference: task
  binding: test-quarantine@1.task
- name: quarantine_reason
  type: text
  binding: test-quarantine@1.quarantine_reason
- name: since
  type: text
  reference: code.commit
  binding: test-quarantine@1.since
- name: latest_result
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-test-result:v1
  nullable: true
  reference: test-result
  binding: test-quarantine@1.latest_result
key:
- repository
- path
- name
origin: code
details:
- test
- task
- quarantine_reason
- since
- latest_result
labels:
  en:
    one: Test quarantine
    many: Test quarantines
  ru:
    one: Карантин теста
    many: Тесты в карантине
description:
  en: 'A test quarantine marks one test as set aside from the default suite for a reason: it fails intermittently, it is too slow, or it is known to be broken. The entry names the repair task and, when known, the commit that introduced the problem.'
  ru: 'Карантин теста отмечает один тест, временно выведенный из обычного набора по причине: он нестабилен, слишком медленный или заведомо сломан. В записи названа задача исправления и, если известно, коммит, который внёс проблему.'
derives-from:
- code.file
