id: practice.test-quarantine
purpose: quality
audience: [tester, developer]
definition: A test temporarily excluded from the default suite, with its repair task, slow/flaky/broken reason, introducing
  commit and latest quarantine CI result when known.
sources:
- https://docs.gitlab.com/development/testing_guide/quarantining_tests/
- https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html
acquisition:
- extractor test-quarantine
status: implemented
relation-constraints:
  out:
  - quarantines
  - fixedBy
  in: []
template-policy: page
source: graph
fields:
- name: repository
  type: text
  binding: test-quarantine@1.repository
- name: path
  type: text
  binding: test-quarantine@1.path
- name: name
  type: text
  binding: test-quarantine@1.name
- name: test
  type: json
  reference: code.test-case
  binding: test-quarantine@1.test
- name: task
  type: text
  reference: task
  binding: test-quarantine@1.task
- name: quarantine_reason
  type: text
  binding: test-quarantine@1.quarantine_reason
- name: since
  type: text
  reference: code.commit
  binding: test-quarantine@1.since
- name: latest_result
  type: json
  nullable: true
  binding: test-quarantine@1.latest_result
key:
- repository
- path
- name
origin: code
details:
- test
- task
- quarantine_reason
- since
- latest_result
labels:
  en:
    one: Test quarantine
    many: Test quarantines
  ru:
    one: Карантин теста
    many: Тесты в карантине
description:
  en: A quarantined test, its repair task, reason and introducing commit; the latest quarantine CI result when known.
  ru: Тест в карантине, задача исправления, причина и коммит введения; последний результат CI карантина, если он известен.
derives-from:
- code.file
