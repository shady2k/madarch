id: istqb.test-condition
purpose: quality
audience: [tester, developer]
definition: A test condition is a testable aspect of the product that is meant to be tested.
sources:
- https://glossary.istqb.org/en_US/term/test-condition
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - derivesFrom
  in:
  - hasTest
template-policy: none
labels:
  en:
    one: Test condition
    many: Test conditions
  ru:
    one: Условие тестирования
    many: Условия тестирования
description:
  en: A test condition names one aspect that should be checked, such as a discount applied above a limit or a failure answered with an error. It is written before the cases, so the cases can cover it deliberately.
  ru: 'Условие тестирования называет один аспект, который следует проверить: скидку выше предела или отказ, на который отвечают ошибкой. Его пишут до тестов, чтобы те покрывали его намеренно.'
