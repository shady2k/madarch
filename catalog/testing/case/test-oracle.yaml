id: istqb.test-oracle
purpose: quality
audience: [tester, developer]
definition: A test oracle is the source a test takes its expected result from, such as a golden file or a specification.
sources:
- https://glossary.istqb.org/en_US/term/test-oracle
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Test oracle
    many: Test oracles
  ru:
    one: Тестовый оракул
    many: Тестовые оракулы
description:
  en: 'A test oracle says what the right result is: a written expected value, a golden file, a property the answer must satisfy or a second implementation. Without an oracle a test can see what happened but not decide whether it was correct.'
  ru: 'Тестовый оракул говорит, каким должен быть правильный результат: записанное ожидаемое значение, золотой файл, свойство, которому ответ обязан удовлетворять, или вторая реализация. Без оракула тест видит, что вышло, но не может решить, верно ли это.'
