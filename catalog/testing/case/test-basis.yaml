id: istqb.test-basis
purpose: quality
audience: [tester, developer]
definition: A test basis is the body of knowledge a test condition is derived from, such as a requirement or a story.
sources:
- https://glossary.istqb.org/en_US/term/test-basis
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Test basis
    many: Test bases
  ru:
    one: Основа тестирования
    many: Основы тестирования
description:
  en: 'A test basis is the source a tester reads to decide what must be checked: a requirement, a user story, a design, a regulation or the code. Every test condition should point back to the basis that asked for it.'
  ru: 'Основа тестирования — источник, по которому проверяющий решает, что надо проверить: требование, история пользователя, проект, правило закона или код. Каждое условие тестирования должно указывать на основу, которая его потребовала.'
derives-from:
- doc.requirement
- user-story
