id: practice.capacity-test
purpose: quality
audience: [tester, developer]
definition: A capacity test finds how much load the product can take before it degrades.
sources:
- https://glossary.istqb.org/en_US/term/capacity-testing
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Capacity test
    many: Capacity tests
  ru:
    one: Тест ёмкости
    many: Тесты ёмкости
description:
  en: A capacity test raises the load step by step until response times or errors cross an agreed limit, and records where that happened. The result says how many users, requests or messages the current setup can carry.
  ru: Тест ёмкости поднимает нагрузку шаг за шагом, пока время ответа или ошибки не перейдут согласованный предел, и записывает, где это случилось. Результат говорит, сколько пользователей, запросов или сообщений выдерживает нынешняя установка.
