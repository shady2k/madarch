id: practice.benchmark
purpose: quality
audience: [tester, developer]
definition: A benchmark is a repeatable measurement of the product's speed or cost, kept so a change can be compared.
sources:
- https://web.dev/articles/vitals
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: Benchmark
    many: Benchmarks
  ru:
    one: Замер
    many: Замеры
description:
  en: A benchmark runs a fixed task on a fixed set of inputs and measures time, memory or cost, under conditions written down with it. Comparing a new measurement with the stored one shows whether a change helped or hurt.
  ru: Замер выполняет одну и ту же работу на одном и том же наборе входных данных и измеряет время, память или стоимость в записанных условиях. Сравнив новый замер с сохранённым, видно, помогло изменение или навредило.
