id: practice.chaos-experiment
purpose: quality
audience: [tester, developer]
definition: A chaos experiment injects a controlled fault into a running system to see whether it keeps its promises.
sources:
- https://principlesofchaos.org/
acquisition:
- agent-from-graph
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: What the experiment does, in one line; it is the experiment's key.
- name: steady_state
  type: text
  nullable: true
  binding:
    agent: What the system promises while the fault is injected.
- name: outcome
  type: text
  nullable: true
  binding:
    agent: 'What the experiment showed: the promise held or it did not.'
- name: started_at
  type: timestamp
  nullable: true
  binding:
    agent: When the experiment ran.
key:
- name
labels:
  en:
    one: Chaos experiment
    many: Chaos experiments
  ru:
    one: Эксперимент с отказами
    many: Эксперименты с отказами
description:
  en: A chaos experiment deliberately breaks something in a running system — stops a server, delays a network, kills a pod — and watches whether the service still meets its stated steady state. It tests resilience against real failure rather than a prediction of it.
  ru: 'Эксперимент с отказами намеренно ломает что-то в работающей системе: останавливает сервер, задерживает сеть, убивает под, — и смотрит, соблюдает ли сервис заявленное устойчивое состояние. Он проверяет стойкость настоящим сбоем, а не его предсказанием.'
