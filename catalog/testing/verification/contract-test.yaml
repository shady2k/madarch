id: pact.contract-test
purpose: quality
audience: [tester, developer]
definition: A contract test checks that a provider still honours the contracts its consumers expect.
sources:
- https://docs.pact.io/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Contract test
    many: Contract tests
  ru:
    one: Тест контракта
    many: Тесты контрактов
description:
  en: A contract test runs a provider against the expectations its consumers recorded, without starting the consumers themselves. If the provider stops meeting one, the test fails before the client breaks in production.
  ru: Тест контракта проверяет поставщика по ожиданиям, которые записали потребители, не запуская самих потребителей. Если поставщик перестаёт выполнять одно из них, тест падает раньше, чем клиент сломается в промышленной среде.
derives-from:
- consumer-contract
