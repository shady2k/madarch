id: practice.chaos-result
purpose: quality
audience: [tester, developer]
definition: A chaos result is what a chaos experiment showed, with the steady state it compared against.
sources:
- https://principlesofchaos.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - evidences
  in:
  - evidences
template-policy: none
labels:
  en:
    one: Chaos result
    many: Chaos results
  ru:
    one: Результат эксперимента с отказами
    many: Результаты экспериментов с отказами
description:
  en: 'A chaos result records what happened when the fault was injected: whether the steady state held, what the users saw and how the system recovered. It says which weaknesses were confirmed and which were not.'
  ru: 'Результат эксперимента с отказами записывает, что произошло при внесении сбоя: удержалось ли устойчивое состояние, что видели пользователи и как система восстановилась. Он говорит, какие слабости подтвердились, а какие нет.'
