id: practice.performance-budget
purpose: quality
audience: [tester, developer]
definition: A performance budget is a limit a screen or a route must stay within, which a performance test checks.
sources:
- https://web.dev/articles/performance-budgets-101
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Performance budget
    many: Performance budgets
  ru:
    one: Бюджет производительности
    many: Бюджеты производительности
description:
  en: 'A performance budget sets a number a page, a screen or a route may not exceed: load time, size, frame time or the number of requests. A test that crosses the budget fails, so slowness is caught as a defect.'
  ru: 'Бюджет производительности задаёт число, которое страница, экран или маршрут не должны превышать: время загрузки, размер, время кадра или число запросов. Тест, вышедший за бюджет, падает, поэтому медленность ловится как дефект.'
