id: pact.provider-verification
purpose: quality
audience: [tester, developer]
definition: A provider verification is the run in which a provider is checked against the contracts its consumers published.
sources:
- https://docs.pact.io/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - verifies
  in:
  - verifies
template-policy: none
labels:
  en:
    one: Provider verification
    many: Provider verifications
  ru:
    one: Проверка поставщика
    many: Проверки поставщика
description:
  en: A provider verification replays the expectations consumers published against the provider's current version and reports which still hold. It is the provider's half of contract testing.
  ru: Проверка поставщика повторяет ожидания, опубликованные потребителями, на текущей версии поставщика и сообщает, какие из них ещё выполняются. Это половина проверки контрактов, которая приходится на поставщика.
derives-from:
- contract-test
- test-run
