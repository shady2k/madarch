id: istqb.failure
purpose: quality
audience: [tester, developer]
definition: A failure is an event in which the product does not meet its requirements or its expected result.
sources:
- https://glossary.istqb.org/en_US/term/failure
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - foundBy
template-policy: none
labels:
  en:
    one: Failure
    many: Failures
  ru:
    one: Сбой
    many: Сбои
description:
  en: 'A failure is what happens when the product behaves differently from what was required or expected: a wrong answer, a stopped service, a lost payment. A failure is the visible effect of one or more defects.'
  ru: 'Сбой — событие, когда продукт ведёт себя не так, как требуется или ожидается: неверный ответ, остановленный сервис, потерянный платёж. Сбой — видимое следствие одного или нескольких дефектов.'
