id: istqb.test-environment
purpose: quality
audience: [tester, developer]
definition: A test environment is the hardware, the services and the tools a test needs to run as it is meant to.
sources:
- https://glossary.istqb.org/en_US/term/test-environment
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - contains
  in:
  - hasHost
template-policy: none
labels:
  en:
    one: Test environment
    many: Test environments
  ru:
    one: Тестовая среда
    many: Тестовые среды
description:
  en: 'A test environment is the setup a test relies on: the machines, the deployed version, the databases, the accounts and the test tools. An environment that differs from the real one can hide failures or create false ones.'
  ru: 'Тестовая среда — обстановка, на которую опирается тест: машины, развёрнутая версия, базы данных, учётные записи и инструменты. Среда, отличающаяся от настоящей, может скрыть сбой или создать ложный.'
