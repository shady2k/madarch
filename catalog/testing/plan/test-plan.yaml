id: istqb.test-plan
purpose: quality
audience: [tester, developer]
definition: A test plan is the objectives, the means and the schedule of the testing for a product or a change.
sources:
- https://glossary.istqb.org/en_US/term/test-plan
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - contains
  in:
  - documents
template-policy: none
labels:
  en:
    one: Test plan
    many: Test plans
  ru:
    one: План тестирования
    many: Планы тестирования
description:
  en: A test plan states what testing must establish, which levels and techniques will be used, what environments and data are needed, who does it and when. It also records the risks the plan is not covering.
  ru: План тестирования говорит, что должны установить тесты, какие уровни и приёмы будут применены, какие среды и данные нужны, кто это делает и когда. В нём также записаны риски, которые план не покрывает.
