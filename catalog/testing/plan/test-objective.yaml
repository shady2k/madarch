id: istqb.test-objective
purpose: quality
audience: [tester, developer]
definition: A test objective is the purpose a test level or a test is meant to serve.
sources:
- https://glossary.istqb.org/en_US/term/test-objective
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Test objective
    many: Test objectives
  ru:
    one: Цель тестирования
    many: Цели тестирования
description:
  en: 'A test objective states what testing should establish at a level: that the units work, that the parts fit, that the product meets its requirements, or that it behaves under load. The objective decides which tests are worth writing.'
  ru: 'Цель тестирования говорит, что должны установить тесты на своём уровне: что модули работают, части стыкуются, продукт отвечает требованиям или держится под нагрузкой. От цели зависит, какие тесты стоит писать.'
