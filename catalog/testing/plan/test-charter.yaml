id: istqb.test-charter
purpose: quality
audience: [tester, developer]
definition: A test charter is the mission that guides one exploratory test session.
sources:
- https://glossary.istqb.org/en_US/term/test-charter
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Test charter
    many: Test charters
  ru:
    one: Миссия тестовой сессии
    many: Миссии тестовых сессий
description:
  en: 'A test charter states what one exploratory session should explore and learn, in a sentence or two: the area, the risks and the questions. It keeps the session focused without prescribing each step.'
  ru: 'Миссия тестовой сессии говорит, что должна исследовать и узнать одна сессия, в одной-двух фразах: область, риски и вопросы. Она держит сессию в фокусе, не расписывая каждый шаг.'
derives-from:
- test-objective
