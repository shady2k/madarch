# The page every entity opens with unless its kind or the entity itself names another (decision 0036, section 6). Its
# sections read the entity through the `Entity` interface and its relations both ways, so one base page serves every
# kind of the product: a kind's own fields are shown by a template that extends this one.
template: entity
sections:
  - id: header
    component: header
    title: { en: Page, ru: Страница }
    query: |
      id
      kind
      label
      template
      origin
      trail {
        id
        kind
        label
      }
    params:
      titlePath: label
      kindPath: kind
      chainPath: trail
      provenancePath: origin
  # Every field the kind declares, with the value its producers agreed and the place each opinion rests on: the page a
  # template has not described still says what the graph knows of it (madarch-64o5.134).
  - id: details
    component: details
    after: header
    title: { en: Details, ru: Подробности }
    query: |
      details {
        name
        type
        key
        value
        contested
        assertions {
          id
          source { id kind label }
          author { id kind label }
          recordedAt
          validFrom
          selected
          value
          evidence { target { id kind label } relation locator }
        }
      }
    params:
      path: details
  # The picture is drawn by the server (decision 0036, sections 7 and 8): the section names the entity and how far around
  # it reads; no relation is asked here, because the renderer reads the neighbourhood through the graph read layer.
  - id: diagram
    component: diagram
    title: { en: Around it, ru: Вокруг }
    query: |
      id
    params:
      depth: 1
      aggregateAbove: 12
  - id: outgoing
    component: relations
    title: { en: Leads to, ru: Ведёт к }
    query: |
      outgoing(first: $outgoing_first, after: $outgoing_after) {
        edges {
          cursor
          node {
            relation
            label
            edge
            inverse
            to {
              id
              kind
              label
            }
          }
        }
        pageInfo {
          endCursor
          hasNextPage
        }
        totalCount
        pageInfo { hasNextPage endCursor }
      }
    params:
      path: outgoing
      pageSize: 10
      labelPath: relation
      emptyText: { en: Nothing leads out of it, ru: Ничего не ведёт отсюда }
  - id: backlinks
    component: relations
    title: { en: Linked from, ru: Ссылаются }
    query: |
      backlinks(first: $backlinks_first, after: $backlinks_after) {
        edges {
          cursor
          node {
            relation
            label
            edge
            inverse
            from {
              id
              kind
              label
            }
          }
        }
        pageInfo {
          endCursor
          hasNextPage
        }
        totalCount
        pageInfo { hasNextPage endCursor }
      }
    params:
      path: backlinks
      pageSize: 10
      labelPath: relation
      emptyText: { en: Nothing links to it yet, ru: Сюда пока ничего не ведёт }
