# The page every entity opens with unless its kind or the entity itself names another (decision 0036, section 6). Its
# sections read the entity through the `Entity` interface and its relations both ways, so one base page serves every
# kind of the product: a kind's own fields are shown by a template that extends this one.
template: entity
sections:
  - id: header
    component: header
    title: { en: Page, ru: Страница }
    query: |
      id
      kind
      label
      template
    params:
      titlePath: label
      kindPath: kind
  # The picture is drawn by the server (decision 0036, sections 7 and 8): the section names the entity and how far around
  # it reads; no relation is asked here, because the renderer reads the neighbourhood through the graph read layer.
  - id: diagram
    component: diagram
    title: { en: Around it, ru: Вокруг }
    query: |
      id
    params:
      depth: 1
      aggregateAbove: 12
  - id: outgoing
    component: relations
    title: { en: Leads to, ru: Ведёт к }
    query: |
      outgoing(first: 50) {
        edges {
          node {
            relation
            label
            edge
            inverse
            to {
              id
              kind
              label
            }
          }
        }
        totalCount
      }
    params:
      path: outgoing
      labelPath: relation
      emptyText: { en: Nothing leads out of it, ru: Ничего не ведёт отсюда }
  # 0039 items 5, 6 and 29: the names this entity's own text leaves without a link, each with the entities it may mean
  # and one Button that links it. A text with no unlinked name draws nothing.
  - id: mentions
    component: mentions
    title: { en: Mentions without a link, ru: Упоминания без ссылки }
    query: |
      id
      kind
      unlinkedMentions {
        field
        path
        start
        end
        name
        candidates { uid kind kindLabel label domain }
      }
  - id: backlinks
    component: relations
    title: { en: Linked from, ru: Ссылаются }
    query: |
      backlinks(first: 50) {
        edges {
          node {
            relation
            label
            edge
            inverse
            from {
              id
              kind
              label
            }
          }
        }
        totalCount
      }
    params:
      path: backlinks
      labelPath: relation
      emptyText: { en: Nothing links to it yet, ru: Сюда пока ничего не ведёт }
