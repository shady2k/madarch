template: code-repository
extends: entity
records:
- code.repository
variables:
  files_where:
    type: JSON
  files_orderBy:
    type: '[RelatedOrder!]'
sections:
- id: facts
  after: header
  component: facts
  title:
    en: Details
    ru: Сведения
  query: |
    url
    defaultBranch
    historyShallow
    contested
  params:
    rows:
    - label:
        en: URL
        ru: Адрес
      path: url
      format: link
    - label:
        en: Default branch
        ru: Основная ветка
      path: defaultBranch
    - label:
        en: Shallow history
        ru: Неполная история
      path: historyShallow
      format: boolean
- id: map
  component: treemap
  'on': root
  title:
    en: Files by size and change
    ru: Файлы по размеру и изменчивости
  query: |
    related(id: $id, edge: "code.contains", inverse: false, kinds: ["code.file"], depth: 3, first: $map_first, after: $map_after) {
      edges { node { id kind label ... on KindCodeFile { path bytes lines language lastChange } } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pathPath: node.path
    valuePath: node.bytes
    languagePath: node.language
    changedPath: node.lastChange
    pageSize: 100
    valuePaths:
    - label:
        en: Size
        ru: Размер
      path: node.bytes
    - label:
        en: Lines
        ru: Строки
      path: node.lines
- id: files
  component: table
  'on': root
  title:
    en: Files
    ru: Файлы
  query: |
    related(id: $id, edge: "code.contains", inverse: false, kinds: ["code.file"], depth: 3, where: $files_where, orderBy: $files_orderBy, first: $files_first, after: $files_after) {
      edges { node { id kind label ... on KindCodeFile { path language lines bytes commitCount lastChange } } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pageSize: 20
    emptyText:
      en: No records
      ru: Нет записей
    columns:
    - label:
        en: Path
        ru: Путь
      path: node.label
      sortField: path
    - label:
        en: Language
        ru: Язык
      path: node.language
      sortField: language
    - label:
        en: Lines
        ru: Строк
      path: node.lines
      format: number
      sortField: lines
    - label:
        en: Size
        ru: Размер
      path: node.bytes
      format: bytes
      sortField: bytes
    - label:
        en: Commits
        ru: Коммитов
      path: node.commitCount
      format: number
      sortField: commitCount
    - label:
        en: Last change
        ru: Последнее изменение
      path: node.lastChange
      format: date
      sortField: lastChange
    filterFields:
    - label:
        en: Path
        ru: Путь
      field: path
      operator: _contains
    - label:
        en: Language
        ru: Язык
      field: language
      operator: _eq
    - label:
        en: At least lines
        ru: Строк не менее
      field: lines
      operator: _gte
    - label:
        en: At most lines
        ru: Строк не более
      field: lines
      operator: _lte
    - label:
        en: At least bytes
        ru: Байт не менее
      field: bytes
      operator: _gte
    - label:
        en: At most bytes
        ru: Байт не более
      field: bytes
      operator: _lte
- id: folders
  component: table
  'on': root
  title:
    en: Folders
    ru: Папки
  query: |
    related(id: $id, edge: "code.contains", inverse: false, kinds: ["code.directory"], depth: 3, first: $folders_first, after: $folders_after) {
      edges { node { id kind label  } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pageSize: 20
    emptyText:
      en: No records
      ru: Нет записей
    columns:
    - label:
        en: Name
        ru: Название
      path: node.label
- id: modules
  component: text
  title:
    en: Modules
    ru: Модули
  params:
    path: .
    emptyText:
      en: 'Unavailable: the current catalogue does not declare a relation for this list.'
      ru: 'Недоступно: текущий каталог не объявляет связь для этого списка.'
  'on': root
  query: |
    __typename
- id: current
  component: table
  'on': root
  title:
    en: Current commit
    ru: Текущий коммит
  query: |
    related(id: $id, edge: "code.as-is", inverse: false, first: $current_first, after: $current_after) {
      edges { node { id kind label ... on KindCodeCommit { hash subject commitDate codeAuthoredOf(first: 1) { edges { node { node { id label } } } } } } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pageSize: 20
    emptyText:
      en: No records
      ru: Нет записей
    columns:
    - label:
        en: Commit
        ru: Коммит
      path: node
      format: commit
    - label:
        en: Date
        ru: Дата
      path: node.commitDate
      format: date
    - label:
        en: Author
        ru: Автор
      path: node.codeAuthoredOf.edges.0.node.node.label
- id: history
  component: table
  'on': root
  title:
    en: History
    ru: История
  query: |
    related(id: $id, edge: "code.history", inverse: false, orderBy: [{ field: "commitDate", direction: DESC }], first: $history_first, after: $history_after) {
      edges { node { id kind label ... on KindCodeCommit { hash subject commitDate codeAuthoredOf(first: 1) { edges { node { node { id label } } } } } } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pageSize: 20
    emptyText:
      en: No records
      ru: Нет записей
    columns:
    - label:
        en: Commit
        ru: Коммит
      path: node
      format: commit
    - label:
        en: Date
        ru: Дата
      path: node.commitDate
      format: date
    - label:
        en: Author
        ru: Автор
      path: node.codeAuthoredOf.edges.0.node.node.label
- id: root
  component: table
  'on': root
  title:
    en: Files and folders
    ru: Файлы и папки
  query: |
    related(id: $id, edge: "code.contains", inverse: false, kinds: ["code.file", "code.directory"], first: $root_first, after: $root_after) {
      edges { node { id kind label  } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  params:
    path: .
    pageSize: 20
    emptyText:
      en: No records
      ru: Нет записей
    columns:
    - label:
        en: Name
        ru: Название
      path: node.label
