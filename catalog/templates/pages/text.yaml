# A page whose body is stored text (decision 0036, section 6): the entity's `body` field as Markdown, with the entity's
# facts and relations around it. A kind whose body field is named otherwise extends this template and replaces the
# `body` section's query.
template: text
extends: entity
records: [practice.admin-guide, practice.user-guide, practice.bug, practice.business-rule, practice.comment, practice.constitution, practice.correction, practice.decision, practice.enrichment, practice.epic, practice.feature, practice.glossary-term, practice.milestone, practice.product, practice.product-task, practice.question, practice.stage, practice.use-case, iso29148.requirement, backstage.domain]
sections:
  - id: body
    component: text
    after: details
    title: { en: Text, ru: Текст }
    query: |
      body
    params:
      path: body
