# A document of the product (decision 0036, sections 6 and 7): the Markdown the graph holds of it, under a header that
# names the file it lies in, its place in the folders and the repository. The body is the graph's `markdown` field: the
# page draws no copy of its own (madarch-64o5.134).
template: document
extends: text
records: [practice.document]
sections:
  - id: header
    replace: true
    component: header
    title: { en: Document, ru: Документ }
    query: |
      id
      kind
      label
      template
      origin
      repository
      path
      commit
      trail {
        id
        kind
        label
      }
    params:
      titlePath: label
      kindPath: kind
      provenancePath: origin
      trail: { repository: repository, path: path }
  - id: body
    replace: true
    component: text
    after: details
    title: { en: Text, ru: Текст }
    query: |
      markdown
    params:
      path: markdown
