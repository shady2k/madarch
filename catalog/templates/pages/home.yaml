# The product's home page (decision 0036, section 6): the page every product opens at `/`. It shows the product the
# graph holds (its name from the manifest, and the description an agent or a person wrote; an unwritten description says
# so), the code repositories it spans, the main facts of the graph and what it holds of each kind. The whole catalogue
# is a page of its own, not this one.
template: home
sections:
  - id: header
    component: header
    on: root
    title: { en: Product, ru: Продукт }
    query: |
      home(lang: $lang) {
        id
        kind
        label
      }
    params:
      titlePath: label
      # The product's own name (its files' name, the top bar's), not the home entity's page title.
      productTitle: true
  # Who the product is and what needs a person now: the open problems and the last fill, before the counts (madarch-64o5.83).
  - id: overview
    component: product-overview
    after: header
    title: { en: Overview, ru: Обзор }
  - id: firstRun
    component: first-run
    after: header
    title: { en: First run, ru: Первый запуск }
  # The repositories the product connects, from its workspace and manifest: they stand here before any fill has put
  # them in the graph (madarch-64o5.85, the owner's walk).
  - id: repositories
    component: repositories
    on: root
    title: { en: Repositories, ru: Репозитории }
  - id: kinds
    component: kinds
    on: root
    title: { en: What the graph holds, ru: Что держит граф }
    params: {}

  # The facts the graph answers about the code it holds (madarch-64o5.133, the home's fact cards): each card is one
  # aggregate over the current tree, drawn as a number or a chart, with the ground it rests on under it and the way into
  # the kind's catalogue page. A card opens for the roles whose work reads it, as the kind's own audience names them; the
  # reader who reads as everything reads them all.
  - id: filesCount
    component: fact
    on: root
    title: { en: Files, ru: Файлы }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
      }
    params:
      kind: code.file
      display: number
  - id: filesByLanguage
    component: fact
    on: root
    title: { en: By language, ru: По языку }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        groupBy(field: "language", limit: 8) { key count }
      }
    params:
      kind: code.file
      display: bar
      by: language
  - id: filesByFolder
    component: fact
    on: root
    title: { en: By folder, ru: По папке }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        groupBy(field: "directory", limit: 20) { key count }
      }
    params:
      kind: code.file
      display: treemap
      by: directory
  - id: filesByRepository
    component: fact
    on: root
    title: { en: Files by repository, ru: Файлы по репозиторию }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        groupBy(field: "repository", limit: 20) { key count }
      }
    params:
      kind: code.file
      display: bar
      by: repository
  - id: filesByAge
    component: fact
    on: root
    title: { en: Time since last change, ru: Время с последнего изменения }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        histogram(field: "lastChange", bounds: [30, 90, 365]) { from to count }
      }
    params:
      kind: code.file
      display: timeline
      by: lastChange
  - id: largestFiles
    component: fact
    on: root
    title: { en: Largest files in bytes, ru: Самые большие файлы в байтах }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        topN(field: "bytes", n: 10) { node { label } value }
      }
    params:
      kind: code.file
      display: bar
      by: bytes
  - id: mostChangedFiles
    component: fact
    on: root
    title: { en: "Most changed files (commits, merge commits included)", ru: "Чаще изменяемые файлы (коммиты, включая слияния)" }
    roles: { show: [developer, architect] }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        count
        topN(field: "commitCount", n: 10) { node { label } value }
      }
    params:
      kind: code.file
      display: bar
      by: commitCount
