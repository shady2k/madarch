# The product's home page (decision 0036, section 6): the page every product opens at `/`. It shows the product the
# graph holds (its name from the manifest, and the description an agent or a person wrote; an unwritten description says
# so), the code repositories it spans, the main facts of the graph and what it holds of each kind. The whole catalogue
# is a page of its own, not this one.
template: home
sections:
  - id: header
    component: header
    on: root
    title: { en: Product, ru: Продукт }
    query: |
      home(lang: $lang) {
        id
        kind
        label
      }
    params:
      titlePath: label
      # The product's own name (its files' name, the top bar's), not the home entity's page title.
      productTitle: true
  # Who the product is and what needs a person now: the open problems and the last fill, before the counts (madarch-64o5.83).
  - id: overview
    component: product-overview
    after: header
    title: { en: Overview, ru: Обзор }
  - id: firstRun
    component: first-run
    after: header
  - id: repositories
    component: table
    on: root
    title: { en: Repositories, ru: Репозитории }
    query: |
      allCodeRepository(first: 20) {
        edges {
          node {
            id
            kind
            label
            ... on CodeRepository {
              name
              defaultBranch
            }
          }
        }
        totalCount
      }
    params:
      path: .
      emptyText: { en: No code repository is connected yet, ru: Ни один репозиторий кода пока не подключён }
      columns:
        - { label: { en: Repository, ru: Репозиторий }, path: node.label }
        - { label: { en: Branch, ru: Ветка }, path: node.defaultBranch }
  - id: kinds
    component: kinds
    on: root
    title: { en: What the graph holds, ru: Что держит граф }
    query: |
      navigation(lang: $lang) {
        kinds { kind one many count entryId }
      }
    params: {}

  - id: byLanguage
    component: bars
    on: root
    title: { en: By language, ru: По языку }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        groupBy(field: "language", limit: 10) { key count }
      }
    params:
      path: groupBy
      valuePath: count
  - id: byRepository
    component: bars
    on: root
    title: { en: Files by repository, ru: Файлы по репозиторию }
    query: |
      allCodeFileAggregate(where: { removedAt: { _is_null: true } }) {
        groupBy(field: "repository", limit: 20) { key count }
      }
    params:
      path: groupBy
      valuePath: count
