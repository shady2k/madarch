template: code-symbol
extends: entity
records:
- code.symbol
sections:
- id: facts
  after: header
  component: facts
  title:
    en: Details
    ru: Сведения
  query: |
    codeSymbolFile(first: 1) { edges { node { node { id label } } } }
    name
    contested
  params:
    rows:
    - label:
        en: Repository
        ru: Репозиторий
      path: codeSymbolFile.edges.0.node.node.label
    - label:
        en: Name
        ru: Имя
      path: name
- id: source
  after: facts
  component: relations
  title: { en: Declared in, ru: Объявлено в }
  query: |
    related(edge: "code.symbol-file", first: 1) { relationLabel edges { node { id kind label } } totalCount }
  params:
    path: related
    edge: code.symbol-file
    inverse: false
- id: callers
  component: text
  title:
    en: Callers
    ru: Кто вызывает
  params:
    path: .
    emptyText:
      en: 'Unavailable: the current catalogue does not declare a relation for this list.'
      ru: 'Недоступно: текущий каталог не объявляет связь для этого списка.'
  'on': root
  query: |
    __typename
