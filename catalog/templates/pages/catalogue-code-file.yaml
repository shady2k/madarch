# A kind's catalogue page, as the graph's own kind (decision 0036, section 6): what the kind is, then the Files page
# the graph fills: the repository map, its legend and the table of every file. The map and the table are one template
# section fed by the graph's `filesPage` read; no page of the app names the kind or draws a file of its own.
template: catalogue-code-file
extends: catalogue-entity
catalogue: [code.file]
sections:
  - id: header
    replace: true
    component: header
    title: { en: Kind, ru: Вид }
    query: |
      kind
      label
    params:
      titlePath: label
      kindPath: kind
  - id: facts
    replace: true
    component: facts
    title: { en: What it is, ru: Что это }
    query: |
      label
      definition
      group
      subgroup
      purpose
      audience
      taken
      standards
    params:
      rows:
        - { label: { en: Definition, ru: Определение }, path: definition, keep: true }
        - { label: { en: Area, ru: Область }, path: group, format: group }
        - { label: { en: Subgroup, ru: Подгруппа }, path: subgroup, format: group }
        - { label: { en: Purpose, ru: Назначение }, path: purpose, format: purpose }
        - { label: { en: Audience, ru: Аудитория }, path: audience, format: audience }
        - { label: { en: In the product, ru: В продукте }, path: taken, format: boolean }
        - { label: { en: Sources, ru: Источники }, path: standards, format: links }
  - id: files
    component: files-page
    on: root
    after: facts
    query: |
      filesPage
