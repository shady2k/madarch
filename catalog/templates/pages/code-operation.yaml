template: code-operation
extends: entity
records:
- code.operation
sections:
- id: facts
  after: header
  component: facts
  title:
    en: Details
    ru: Сведения
  query: |
    codeOperationContract(first: 1) { edges { node { node { id label } } } }
    path
    name
    contested
  params:
    rows:
    - label:
        en: Repository
        ru: Репозиторий
      path: codeOperationContract.edges.0.node.node.label
    - label:
        en: Path
        ru: Путь
      path: path
    - label:
        en: Name
        ru: Имя
      path: name
- id: source
  after: facts
  component: relations
  title: { en: Declared in, ru: Объявлено в }
  query: |
    related(edge: "code.operation-contract", first: 1) { relationLabel edges { node { id kind label } } totalCount }
  params:
    path: related
    edge: code.operation-contract
    inverse: false
- id: declared
  component: text
  title:
    en: Declared by
    ru: Объявлена в
  params:
    path: .
    emptyText:
      en: 'Unavailable: the current catalogue does not declare a relation for this list.'
      ru: 'Недоступно: текущий каталог не объявляет связь для этого списка.'
  'on': root
  query: |
    __typename
- id: served
  component: text
  title:
    en: Served by
    ru: Обслуживается
  params:
    path: .
    emptyText:
      en: 'Unavailable: the current catalogue does not declare a relation for this list.'
      ru: 'Недоступно: текущий каталог не объявляет связь для этого списка.'
  'on': root
  query: |
    __typename
