# The glossary (decision 0031): the terms the document kinds read, each with its definition and where it is used.
# A product whose documents hold no term yet says so.
template: glossary
sections:
  - id: header
    component: header
    on: root
    title: { en: Glossary, ru: Глоссарий }
    query: |
      home(lang: $lang) {
        id
        kind
        label
      }
    params:
      titlePath: label
  - id: terms
    component: table
    on: root
    title: { en: Terms, ru: Термины }
    query: |
      allDocTerm(first: 200) {
        edges {
          node {
            id
            kind
            label
          }
        }
        totalCount
      }
    params:
      path: .
      # A reader's words, not ours: the glossary is what a person or an agent writes, and the plugin reads `docs/` for it
      # (madarch-64o5.83).
      emptyText: { en: No glossary terms yet. A person or an agent writes them; the glossary plugin reads the product's documents when a fill runs., ru: Терминов пока нет. Их пишет человек или агент; плагин глоссария читает документы продукта во время заполнения. }
      columns:
        - { label: { en: Term, ru: Термин }, path: node.label }
