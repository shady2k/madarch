description:
  en: 'A message describes what travels through a channel: its fields, their types and what they mean. The sending and the reading service agree on the shape, so each can read the other''s data.'
  ru: 'Событие — описание того, что передаётся по каналу: его поля, их типы и смысл. Отправляющий и читающий сервис договариваются о форме, чтобы каждый понимал данные другого.'
