id: practice.message-schema
purpose: structure
audience: [developer, architect, analyst, tester]
definition: A message is the shape of one piece of data sent over a channel.
sources:
- https://www.asyncapi.com/docs/reference/specification/v3.0.0
acquisition:
- agent-from-graph
- extractor contracts
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
details:
- channel
- eventTypes
- path
fields:
- name: contract
  type: json
  reference: code.contract
  binding:
    agent: The contract that declares the message, by the key of that contract in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the contract gives the message.
- name: channel
  type: json
  nullable: true
  reference: code.channel
  binding:
    agent: The channel the message travels on, where the contract says so.
- name: event_types
  type: json
  nullable: true
  binding:
    agent: The event types the message may carry, as the contract names them.
key:
- contract
- name
derives-from:
- code.contract
- product-profile
card: true
labels:
  en:
    one: Event
    many: Events
  ru:
    one: Событие
    many: События
description:
  en: 'A message describes what travels through a channel: its fields, their types and what they mean. The sending and the reading service agree on the shape, so each can read the other''s data.'
  ru: 'Событие — описание того, что передаётся по каналу: его поля, их типы и смысл. Отправляющий и читающий сервис договариваются о форме, чтобы каждый понимал данные другого.'
