id: practice.channel
purpose: structure
audience: [developer, architect, analyst, tester]
definition: A channel is a topic or a queue that services publish messages to and read them from.
sources:
- https://www.asyncapi.com/docs/reference/specification/v3.0.0
acquisition:
- agent-from-graph
- extractor contracts
relation-constraints:
  out:
  - hasPart
  - documents
  in:
  - publishes
  - subscribes
  - documents
template-policy: page
source: graph
details:
- protocol
- contract
- path
- description
- consumerStatus
- consumerFound
fields:
- name: address
  type: text
  labels:
    en: Address
    ru: Адрес
  binding:
    agent: The topic, queue or address name the channel is known by, on the broker or in the contract.
- name: protocol
  type: text
  binding:
    agent: The protocol the channel speaks, such as Kafka, AMQP or NATS.
- name: broker
  type: json
  nullable: true
  reference: code.broker
  binding:
    agent: The broker the channel stands on, by the key of that broker in the graph.
- name: description
  type: text
  nullable: true
  binding:
    agent: What the channel carries and who reads it, in one or two sentences, from the messages it holds and the services linked to it in the graph.
key:
- protocol
- address
derives-from:
- code.contract
- code.file
card: true
system: channel
definition-block: channel
labels:
  en:
    one: Event channel
    many: Event channels
  ru:
    one: Канал событий
    many: Каналы событий
description:
  en: 'A channel is a named path for messages between services: a topic that several readers subscribe to, or a queue that one consumer works through. Its name and its message shape are the agreement between the sending and the reading side.'
  ru: 'Канал — именованный путь сообщений между сервисами: тема, на которую подписываются несколько читателей, или очередь, которую разбирает один потребитель. Его имя и форма сообщений — договорённость между отправляющей и читающей стороной.'
