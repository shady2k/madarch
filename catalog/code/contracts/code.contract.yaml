id: practice.interface-contract
purpose: structure
audience: [developer, architect, analyst, tester]
definition: A contract is an OpenAPI, gRPC or AsyncAPI file that fixes an interface between systems.
sources:
- https://spec.openapis.org/oas/v3.1.1.html
- https://www.asyncapi.com/docs/reference/specification/v3.0.0
acquisition:
- agent-from-graph
- extractor contracts
relation-constraints:
  out:
  - contains
  - hasDocumentation
  in:
  - documents
  - partOf
template-policy: page
source: graph
details:
- format
- specVersion
- version
- path
fields:
- name: repository
  type: json
  reference: code.repository
  binding:
    agent: The repository the contract file stands in, by the key of that repository in the graph.
- name: path
  type: text
  labels:
    en: Path
    ru: Путь
  binding:
    agent: The path of the contract file in the repository.
- name: format
  type: text
  nullable: true
  binding:
    agent: 'Which notation the contract is written in: OpenAPI, gRPC or AsyncAPI.'
- name: spec_version
  type: text
  nullable: true
  binding:
    agent: The version of the notation the contract declares.
- name: version
  type: text
  nullable: true
  binding:
    agent: The version of the interface the contract declares.
- name: title
  type: text
  nullable: true
  binding:
    agent: The title the contract gives itself.
key:
- repository
- path
derives-from:
- code.file
card: true
definition-block: contract
labels:
  en:
    one: Contract
    many: Contracts
  ru:
    one: Контракт
    many: Контракты
description:
  en: 'A contract is a machine-readable description of an interface: what operations it offers, what they take and return, and which errors they produce. OpenAPI covers HTTP, gRPC covers remote procedure calls and AsyncAPI covers messages; each lets both sides build and check against the same agreement.'
  ru: 'Контракт — машиночитаемое описание интерфейса: какие операции он предлагает, что они принимают и возвращают и какие дают ошибки. OpenAPI описывает HTTP, gRPC — удалённые вызовы, AsyncAPI — сообщения; по каждому обе стороны могут строить и проверять одну договорённость.'
