id: practice.interface-contract
purpose: structure
audience: [developer, architect, analyst, tester]
definition: A contract is an OpenAPI, gRPC or AsyncAPI file that fixes an interface between systems.
sources:
- https://spec.openapis.org/oas/v3.1.1.html
- https://www.asyncapi.com/docs/reference/specification/v3.0.0
acquisition:
- extractor contracts
status: implemented
relation-constraints:
  out:
  - contains
  - hasDocumentation
  in:
  - documents
template-policy: page
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read the declared repositories: repository name, or null for the product repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* source files: repository-relative path of the file or folder defining this entity.'
- name: definition
  type: json
  nullable: true
  binding:
    agent: 'Read the contract source files **/* for this entity: complete structured definition {spec:{text,lines},document?,protobuf?,descriptions?,selection?,diagnostics?},
      preserving the full spec text and source lines; use null when no definition applies.'
key:
- repository
- path
card: true
definition-block: contract
details:
- format
- specVersion
- version
- path
labels:
  en:
    one: Contract
    many: Contracts
  ru:
    one: Контракт
    many: Контракты
description:
  en: 'A contract is a machine-readable description of an interface: what operations it offers, what they take and return, and which errors they produce. OpenAPI covers HTTP, gRPC covers remote procedure calls and AsyncAPI covers messages; each lets both sides build and check against the same agreement.'
  ru: 'Контракт — машиночитаемое описание интерфейса: какие операции он предлагает, что они принимают и возвращают и какие дают ошибки. OpenAPI описывает HTTP, gRPC — удалённые вызовы, AsyncAPI — сообщения; по каждому обе стороны могут строить и проверять одну договорённость.'
