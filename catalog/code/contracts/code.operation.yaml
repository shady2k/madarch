id: practice.api-operation
purpose: structure
audience: [developer, architect, analyst, tester]
definition: An API operation is one action an OpenAPI or a gRPC contract declares.
sources:
- https://spec.openapis.org/oas/v3.1.1.html
acquisition:
- agent-from-graph
- extractor contracts
relation-constraints:
  out:
  - partOf
  - hasInput
  - hasOutput
  - providesApi
  in:
  - implements
  - documents
template-policy: page
source: graph
details:
- method
- path
- operationId
- public
- service
- package
- input
- output
- rpc
- servers
- summary
fields:
- name: contract
  type: json
  reference: code.contract
  binding:
    agent: The contract that declares the operation, by the key of that contract in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: 'The name the contract gives the operation: its operation id, or the RPC name.'
- name: method
  type: text
  nullable: true
  binding:
    agent: The HTTP method the operation answers, where the contract is an HTTP one.
- name: path
  type: text
  nullable: true
  binding:
    agent: The path the operation answers, where the contract is an HTTP one.
- name: rpc
  type: text
  nullable: true
  binding:
    agent: The RPC name and stream shape the operation declares, where the contract is a gRPC one.
- name: summary
  type: text
  nullable: true
  binding:
    agent: What the operation does, in the words the contract gives it.
- name: public
  type: boolean
  nullable: true
  binding:
    agent: Whether the contract marks the operation as open to callers outside the product.
key:
- contract
- name
derives-from:
- code.contract
card: true
definition-block: operation
listing: operations
labels:
  en:
    one: API operation
    many: API operations
  ru:
    one: Операция API
    many: Операции API
description:
  en: An API operation is one callable action of an interface, such as listing orders or cancelling a booking, with its address, its input and its answers. The contract states it once, and both the service and its clients follow it.
  ru: 'Операция API — одно вызываемое действие интерфейса: получить список заказов или отменить бронь, — с его адресом, входными данными и ответами. Контракт объявляет её один раз, и ей следуют и сервис, и его клиенты.'
