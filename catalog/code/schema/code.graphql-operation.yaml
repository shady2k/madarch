id: graphql.operation
purpose: structure
audience: [developer, architect, analyst]
definition: A GraphQL operation is a query, a mutation or a subscription, with the types it reads and returns.
sources:
- https://spec.graphql.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: GraphQL operation
    many: GraphQL operations
  ru:
    one: Операция GraphQL
    many: Операции GraphQL
description:
  en: A GraphQL operation asks a GraphQL service for data (a query), changes it (a mutation) or listens for changes (a subscription). Its selection says which fields it needs, and its result follows the schema's types.
  ru: Операция GraphQL запрашивает данные (запрос), меняет их (мутация) или слушает изменения (подписка). Её выбор полей говорит, что нужно, а результат следует типам схемы.
derives-from:
- code.graphql-schema-type
