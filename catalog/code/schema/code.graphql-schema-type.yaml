id: graphql.schema-type
purpose: structure
audience: [developer, architect, analyst]
definition: A GraphQL schema type is one named type of a GraphQL schema, with its fields.
sources:
- https://spec.graphql.org/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: GraphQL type
    many: GraphQL types
  ru:
    one: Тип GraphQL
    many: Типы GraphQL
description:
  en: A GraphQL schema type describes one kind of object a service can return or accept, with its fields, their types and which of them are required. Queries and mutations are written against these types.
  ru: 'Тип GraphQL описывает один вид объекта, который сервис может вернуть или принять: его поля, их типы и обязательность. Запросы и мутации пишут против этих типов.'
derives-from:
- code.contract
