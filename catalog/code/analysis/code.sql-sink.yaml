id: practice.sql-sink
purpose: structure
audience: [developer, architect]
definition: An SQL sink is a call that sends SQL text to a database for execution.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- agent-from-graph
- extractor code
relation-constraints:
  out:
  - code.writes-table
  - code.reads-table
  - dependsOn
  - partOf
  in:
  - partOf
  - dependsOn
template-policy: page
source: graph
fields:
- name: repository
  type: json
  reference: code.repository
  binding:
    agent: The repository the call stands in, by the key of that repository in the graph.
- name: path
  type: text
  binding:
    agent: The path of the file that holds the call.
- name: line
  type: integer
  binding:
    agent: The line the call stands on.
key:
- repository
- path
- line
derives-from:
- code.file
- code.table
labels:
  en:
    one: SQL sink
    many: SQL sinks
  ru:
    one: Выполнение SQL
    many: Места выполнения SQL
description:
  en: An SQL sink is a place where SQL text is handed to a database to run, such as a query function or an execution call. It is where an unsafe build becomes an actual risk.
  ru: 'Выполнение SQL — место, где текст SQL передают базе данных на исполнение: функция запроса или вызов выполнения. Здесь небезопасная сборка становится настоящим риском.'
