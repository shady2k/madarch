id: practice.code-input
purpose: structure
audience: [developer, architect]
definition: An input is a value that enters the code from outside, such as a query parameter, a header or a message field.
sources:
- https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
acquisition:
- agent-from-graph
- extractor code
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: page
source: graph
details:
- name
- source
fields:
- name: symbol
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:key-code.symbol:v1
  reference: code.symbol
  binding:
    agent: The symbol that reads the value, by the key of that symbol in the graph.
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the code gives the value, such as id, cursor or filter.
- name: source
  type: text
  nullable: true
  binding:
    agent: 'Where the value comes from, as the code names it: a parameter, a header, a field of the body, an environment variable.'
key:
- symbol
- name
derives-from:
- code.symbol
labels:
  en:
    one: Input
    many: Inputs
  ru:
    one: Входные данные
    many: Входные данные
description:
  en: 'An input is a value the code receives from beyond its own boundary: a request parameter, a header, a field of a message, a line of a file. Its source decides how far it can be trusted and which checks it needs.'
  ru: 'Входные данные — значение, которое код получает извне своей границы: параметр запроса, заголовок, поле сообщения или строка файла. От источника зависит, насколько ему можно доверять и какие проверки нужны.'
