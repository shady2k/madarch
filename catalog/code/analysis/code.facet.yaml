id: practice.file-facet
purpose: structure
audience: [developer, architect]
definition: A code facet is one thing the code reading found out about a file, such as its role, its language or its test status.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor code
relation-constraints:
  out:
  - partOf
  in:
  - partOf
template-policy: member
source: graph
member:
  relation: code.facet-of
  direction: out
  parentKind: code.file
details:
- language
- role
- authors
- commitCount
- parsed
labels:
  en:
    one: File facet
    many: File facets
  ru:
    one: Срез файла
    many: Срезы файлов
description:
  en: 'A code facet is one property of a file that a code analysis records: its language, whether it is source, test or documentation, which symbol it defines, what it imports. Facets let files be searched and counted by what they are.'
  ru: 'Срез файла — одно свойство файла, которое записывает анализ кода: язык, роль (исходный код, тест или документация), какой символ он объявляет, что импортирует. По срезам файлы можно искать и считать по тому, что они собой представляют.'
