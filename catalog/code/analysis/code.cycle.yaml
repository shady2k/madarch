id: practice.dependency-cycle
purpose: quality
audience: [developer, architect]
definition: A dependency cycle is a ring of files or modules that import one another, so none can be understood or built without the others.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/RelationshipType/
acquisition:
- agent-from-graph
- extractor code
relation-constraints:
  out:
  - hasPart
  - dependsOn
  in:
  - partOf
template-policy: page
source: graph
details:
- level
- size
fields:
- name: level
  type: text
  nullable: true
  binding:
    agent: 'Whether the ring stands between folders, modules or services: file, module or service.'
- name: members
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  binding:
    agent: The files or modules in the ring, by their keys in the graph, in code point order so the same ring always reads the same.
- name: size
  type: integer
  nullable: true
  binding:
    agent: How many members the ring holds, from the edges between them.
key:
- level
- members
derives-from:
- code.file
- code.module
labels:
  en:
    one: Dependency cycle
    many: Dependency cycles
  ru:
    one: Цикл зависимостей
    many: Циклы зависимостей
description:
  en: A dependency cycle exists when file A imports B, B imports C and C imports A, directly or through more files. Such a ring makes code harder to test, to replace and to reason about, because the parts cannot be separated.
  ru: 'Цикл зависимостей — кольцо файлов или модулей, которые импортируют друг друга: A импортирует B, B — C, а C — A, напрямую или через другие файлы. Такое кольцо мешает проверять код, заменять части и понимать его, потому что части нельзя разделить.'
