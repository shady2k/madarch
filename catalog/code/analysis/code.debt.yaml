id: practice.debt-marker
purpose: quality
audience: [developer, architect]
definition: A debt marker is a TODO or FIXME comment left in the code, which points at work that was knowingly postponed.
sources:
- https://arc42.org/overview
acquisition:
- agent-from-graph
- extractor code
relation-constraints:
  out:
  - partOf
  - evidences
  in:
  - partOf
template-policy: page
source: graph
details:
- marker
- text
- path
- line
fields:
- name: repository
  type: json
  reference: code.repository
  binding:
    agent: The repository the marker stands in, by the key of that repository in the graph.
- name: path
  type: text
  binding:
    agent: The path of the file the marker stands in, as the file entity holds it.
- name: line
  type: integer
  binding:
    agent: The line the marker stands on.
- name: marker
  type: text
  binding:
    agent: The word that marks the work, such as TODO or FIXME.
- name: text
  type: text
  nullable: true
  binding:
    agent: What the marker says, in the words the comment gives it.
key:
- repository
- path
- line
derives-from:
- code.file
labels:
  en:
    one: Debt marker
    many: Debt markers
  ru:
    one: Маркер долга
    many: Маркеры долга
description:
  en: 'A debt marker is a comment such as TODO or FIXME in which a developer records something left undone: a shortcut, a missing case or a known weakness. The marker names the debt; the debt itself is the weakness it points at.'
  ru: 'Маркер долга — комментарий вида TODO или FIXME, в котором разработчик записывает недоделанное: упрощение, пропущенный случай или известную слабость. Маркер называет долг, а сам долг — та слабость, на которую он указывает.'
