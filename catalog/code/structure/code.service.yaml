id: c4.container
purpose: structure
audience: [developer, architect]
definition: A service is a deployable part of the system, with the interfaces it offers and the parts it depends on.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor operations
relation-constraints:
  out:
  - providesApi
  - dependsOn
  - ownedBy
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read the declared repositories: repository name, or null for the product repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* source files: repository-relative path of the file or folder defining this entity.'
- name: state_machines
  type: json
  nullable: true
  labels: { en: State machines, ru: Машины состояний }
  binding:
    agent: 'Read all declared repository source files **/* for this entity: complete state machines as an array of {name,type,path,lineStart,lineEnd,states:[{name,label,line}],transitions:[{from,to,event,line}]};
      use [] when none exist and preserve source positions.'
key:
- repository
- path
relations:
- type: code.contains
  to: code.package:{span.path|dirname}
card: true
history: membership
views:
- c4-component
- state
system: container
details:
- language
- frameworks
- infrastructure
- testFramework
labels:
  en:
    one: Service
    many: Services
  ru:
    one: Сервис
    many: Сервисы
description:
  en: A service is a part of the system that can be deployed and run on its own, such as an application, a database or a queue, and it talks to other parts through defined interfaces. Its responsibility and its interfaces are what make it separate.
  ru: 'Сервис — часть системы, которую можно развернуть и запустить отдельно: приложение, база данных или очередь, — и которая общается с другими частями через определённые интерфейсы. Его ответственность и интерфейсы делают его отдельным.'
