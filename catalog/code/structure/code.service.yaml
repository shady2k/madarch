id: c4.container
definition: A deployable part of the system, with the interfaces it offers and the parts it depends on.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor operations
status: implemented
relation-constraints:
  out:
  - providesApi
  - dependsOn
  - ownedBy
  in:
  - partOf
template-policy: page
template: templates/service.liquid
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read the declared repositories: repository name, or null for the product repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* source files: repository-relative path of the file or folder defining this entity.'
- name: state_machines
  type: json
  nullable: true
  binding:
    agent: 'Read all declared repository source files **/* for this entity: complete state machines as an array of {name,type,path,lineStart,lineEnd,states:[{name,label,line}],transitions:[{from,to,event,line}]};
      use [] when none exist and preserve source positions.'
key:
- repository
- path
relations:
- type: code.contains
  to: code.package:{span.path|dirname}
card: true
history: membership
views:
- c4-component
- state
system: container
details:
- language
- frameworks
- infrastructure
- testFramework
labels:
  en:
    one: Service
    many: Services
  ru:
    one: Сервис
    many: Сервисы
description:
  en: A deployable part of the system, read from its manifest.
  ru: Развёртываемая часть системы, прочитанная из её манифеста.
