id: c4.container
purpose: structure
audience: [developer, architect]
definition: A service is a deployable part of the system, with the interfaces it offers and the parts it depends on.
sources:
- https://c4model.com/abstractions
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - contains
  - providesApi
  - consumesApi
  - publishes
  - subscribes
  - dependsOn
  - ownedBy
  - code.service.contains
  - container.contains-component
  in:
  - partOf
  - code.service.contains
template-policy: page
source: graph
details:
- language
- frameworks
- infrastructure
- testFramework
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the people who run the product give this service, such as madarch or billing-api; it is the service's key.
- name: repository
  type: json
  nullable: true
  reference: code.repository
  binding:
    agent: The repository whose folder holds the service, by the key of that repository in the graph.
- name: path
  type: text
  nullable: true
  binding:
    agent: The folder inside the repository where the service stands, as the folder entity holds it in the graph.
- name: language
  type: text
  nullable: true
  binding:
    agent: The language most of the service is written in, from its files in the graph.
- name: frameworks
  type: json
  nullable: true
  binding:
    agent: The frameworks the service is built with, from the packages it imports in the graph.
- name: runtime
  type: text
  nullable: true
  binding:
    agent: What runs the service, from the images, deployments and processes that carry it in the graph.
- name: purpose
  type: text
  nullable: true
  binding:
    agent: What the service answers for, in one or two sentences, from its modules, the operations and channels it serves and the documents that mention it in the graph.
key:
- name
derives-from:
- product-profile
- software-system
card: true
views: [c4-component]
system: container
history: membership
relations:
  - type: code.contains
    to: code.package:{span.path|dirname}
labels:
  en:
    one: Service
    many: Services
  ru:
    one: Сервис
    many: Сервисы
description:
  en: A service is a part of the system that can be deployed and run on its own, such as an application, a database or a queue, and it talks to other parts through defined interfaces. Its responsibility and its interfaces are what make it separate.
  ru: 'Сервис — часть системы, которую можно развернуть и запустить отдельно: приложение, база данных или очередь, — и которая общается с другими частями через определённые интерфейсы. Его ответственность и интерфейсы делают его отдельным.'
