id: practice.code-symbol
purpose: structure
audience: [developer, architect]
definition: A symbol is a function, a class or a constant the code declares, with its callers and its callees.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor code
relation-constraints:
  out:
  - contains
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read the declared repositories: repository name, or null for the product repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* source files: repository-relative path of the file or folder defining this entity.'
- name: name
  type: text
  binding:
    agent: 'Read the defining source file: fully qualified symbol name, API operation identity (method and route or RPC name),
      or channel address, unique within this file.'
key:
- repository
- path
- name
sequence: symbol
details:
- symbolKind
- qualifiedName
- typeText
- language
- exported
- abstract
- inline
- test
- deadExport
- entryPoint
- entryPoints
labels:
  en:
    one: Symbol
    many: Symbols
  ru:
    one: Символ
    many: Символы
description:
  en: 'A symbol is a named declaration in the code: a function, a class, a method or a constant. Following which symbols call it and which it calls shows how a piece of behaviour is built and what depends on changing it.'
  ru: 'Символ — именованное объявление в коде: функция, класс, метод или константа. Проследив, кто его вызывает и что вызывает он, видно, из чего сложено поведение и от чего зависит его изменение.'
