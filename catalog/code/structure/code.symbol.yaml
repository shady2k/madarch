id: practice.code-symbol
purpose: structure
audience: [developer, architect]
definition: A symbol is a function, a class or a constant the code declares, with its callers and its callees.
sources:
- https://c4model.com/abstractions
acquisition:
- agent-from-graph
- conversation
relation-constraints:
  out:
  - partOf
  - defines
  - code.calls
  - code.calls-remote
  - code.inherits
  - code.implements
  - contains
  in:
  - partOf
  - code.calls
  - code.inherits
  - code.implements
  - code.references
template-policy: page
source: graph
details:
- symbolKind
- qualifiedName
- typeText
- language
- exported
- abstract
- inline
- test
- deadExport
- entryPoint
- entryPoints
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the code gives the symbol, fully qualified inside its file, such
      as FillRunner.run; it is the symbol's key.
- name: symbol_kind
  type: text
  nullable: true
  binding:
    agent: Whether the symbol is a function, a method, a class, an interface, a constant
      or a type.
- name: qualified_name
  type: text
  nullable: true
  binding:
    agent: The fully qualified name the code gives the symbol, with its enclosing
      names.
- name: type_text
  type: text
  nullable: true
  binding:
    agent: The type the symbol is declared with, in the words of the language.
- name: language
  type: text
  nullable: true
  binding:
    agent: The language the symbol is written in.
- name: exported
  type: boolean
  nullable: true
  binding:
    agent: Whether the code declares the symbol for use outside its file.
- name: abstract
  type: boolean
  nullable: true
  binding:
    agent: Whether the declaration is abstract, with no body of its own.
- name: test
  type: boolean
  nullable: true
  binding:
    agent: Whether the symbol is a test the code declares.
- name: line_start
  type: integer
  nullable: true
  binding:
    agent: The line the declaration starts on.
- name: line_end
  type: integer
  nullable: true
  binding:
    agent: The line the declaration ends on.
key:
- name
derives-from:
- code.file
sequence: symbol
labels:
  en:
    one: Symbol
    many: Symbols
  ru:
    one: Символ
    many: Символы
description:
  en: 'A symbol is a named declaration in the code: a function, a class, a method or a constant. Following which symbols call it and which it calls shows how a piece of behaviour is built and what depends on changing it.'
  ru: 'Символ — именованное объявление в коде: функция, класс, метод или константа. Проследив, кто его вызывает и что вызывает он, видно, из чего сложено поведение и от чего зависит его изменение.'

key-edges:
- role: code.symbol-file
  edge: code.symbol-file
  side: from
