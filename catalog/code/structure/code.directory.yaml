id: practice.directory
purpose: structure
audience: [developer, architect]
definition: A directory is a folder in a code repository that holds files and further folders.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/
acquisition:
- extractor files
relation-constraints:
  out:
  - contains
  - code.directory.contains
  in:
  - partOf
  - code.directory.contains
template-policy: page
source: graph
# The paths this kind leaves out: a product's own declaration, so no engine list decides what a repository's
# knowledge is. Only what is never a person's source by nature stands here — the dependency tree and the repository's
# own folder; a build output can be a product's tracked code (a GitHub Action's bundle), so it is not excluded by
# default and a product that wants it gone names it itself (madarch-64o5.83).
exclude:
  - "**/node_modules/**"
  - "**/.git/**"
fields:
- name: repository
  type: text
  producers:
  - disk
- name: path
  type: text
  producers:
  - disk
key:
- repository
- path
details:
- path
labels:
  en:
    one: Directory
    many: Directories
  ru:
    one: Папка
    many: Папки
description:
  en: A directory groups files and other directories under one name in a repository, usually along the structure of the code. Its path places it, and what it holds says what part of the product it belongs to.
  ru: Папка объединяет файлы и другие папки под одним именем в репозитории, обычно по устройству кода. Её путь указывает место, а содержимое говорит, к какой части продукта она относится.
derives-from:
- code.repository
