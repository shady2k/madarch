id: practice.gitlink
purpose: structure
audience:
- developer
- architect
definition: A submodule is a path in a repository that points to a fixed commit of another repository.
sources:
- https://git-scm.com/docs/gitmodules
acquisition:
- extractor files
status: implemented
relation-constraints:
  out: []
  in:
  - contains
template-policy: page
source: graph
fields:
- name: repository
  type: text
  producers:
  - disk
- name: path
  type: text
  producers:
  - disk
- name: other_repository
  type: text
  nullable: true
  producers:
  - disk
- name: commit_hash
  type: text
  nullable: true
  producers:
  - disk
key:
- repository
- path
derives-from:
- code.repository
labels:
  en:
    one: Submodule
    many: Submodules
  ru:
    one: Подмодуль
    many: Подмодули
description:
  en: A submodule is a folder a repository borrows from another repository at a pinned commit, such as a shared library. The parent records which commit it expects, so the borrowed code changes only when someone updates that record.
  ru: Подмодуль — папка, которую репозиторий берёт из другого репозитория на закреплённом коммите, например общую библиотеку. Родитель записывает ожидаемый коммит, поэтому заимствованный код меняется, только когда эту запись обновляют.
