id: spdx.file
purpose: structure
definition: A file of a code repository.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Classes/File/
acquisition:
- extractor files
status: implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
audience: [developer, architect]
facts:
# Every fact counts the current tree by default: a file that left it stays an entity with a removal, and is not a file.
- id: count
  labels: { en: Files, ru: Файлы }
  measure: count
  display: number
  where: { removed_at: null }
- id: by-language
  labels: { en: By language, ru: По языку }
  measure: group-by
  field: language
  display: bar
  where: { removed_at: null }
- id: by-folder
  labels: { en: By folder, ru: По папке }
  measure: group-by
  field: directory
  display: treemap
  where: { removed_at: null }
- id: age
  labels: { en: Time since last change, ru: Время с последнего изменения }
  measure: histogram
  field: last_change
  buckets: [30, 90, 365]
  display: timeline
  where: { removed_at: null }
- id: largest
  labels: { en: Largest files in bytes, ru: Самые большие файлы в байтах }
  measure: top-n
  field: bytes
  limit: 10
  display: bar
  where: { removed_at: null }
- id: most-changed
  labels: { en: "Most changed files (commits, merge commits included)", ru: "Чаще изменяемые файлы (коммиты, включая слияния)" }
  measure: top-n
  field: commit_count
  limit: 10
  display: bar
  where: { removed_at: null }
template-policy: page
source: graph
fields:
- name: state_machines
  type: json
  nullable: true
  binding:
    agent: 'Read all declared repository source files **/* for this entity: complete state machines as an array of {name,type,path,lineStart,lineEnd,states:[{name,label,line}],transitions:[{from,to,event,line}]};
      use [] when none exist and preserve source positions.'
- name: repository
  type: text
  producers:
  - disk
  - git
- name: path
  type: text
  producers:
  - disk
  - git
- name: mode
  type: text
  nullable: true
  producers:
  - disk
- name: blob
  type: text
  nullable: true
  producers:
  - disk
- name: bytes
  type: bigint
  nullable: true
  producers:
  - disk
- name: form
  type: text
  nullable: true
  producers:
  - disk
- name: lines
  type: bigint
  nullable: true
  producers:
  - disk
- name: content
  type: text
  nullable: true
  producers:
  - disk
- name: language
  type: text
  nullable: true
  producers:
  - disk
- name: languages
  type: json
  nullable: true
  producers:
  - disk
- name: class
  type: text
  nullable: true
  producers:
  - disk
- name: directory
  type: text
  producers:
  - disk
- name: last_change
  type: timestamp
  nullable: true
  producers:
  - git
- name: commit_count
  type: integer
  nullable: true
  producers:
  - git
- name: added_at
  type: timestamp
  nullable: true
  producers:
  - git
- name: added_in
  type: text
  nullable: true
  producers:
  - git
- name: removed_at
  type: timestamp
  nullable: true
  producers:
  - git
- name: removed_in
  type: text
  nullable: true
  producers:
  - git
key:
- repository
- path
classes:
- name: dependency
  paths:
  - "**/node_modules/**"
  - "**/bower_components/**"
  - "**/vendor/**"
  - "**/vendored/**"
  - "**/third_party/**"
  - "**/third-party/**"
  - "**/jspm_packages/**"
  - "**/web_modules/**"
- name: generated
  paths:
  - "**/dist/**"
  - "**/build/**"
  - "**/out/**"
  - "**/target/**"
  - "**/coverage/**"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/*.map"
  - "**/*.generated.*"
  - "**/*.gen.*"
  - "**/*.pb.go"
  - "**/*.pb.ts"
  - "**/*_pb2.py"
  - "**/*.lock"
  - "**/bun.lock"
  - "**/bun.lockb"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/composer.lock"
  - "**/Cargo.lock"
  - "**/go.sum"
  - "**/gradle.lockfile"
  - "**/packages.lock.json"
- name: test
  paths:
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/spec/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*_spec.*"
  - "**/test_*.py"
- name: documentation
  paths:
  - "**/docs/**"
  - "**/doc/**"
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.rst"
  - "**/*.adoc"
  - "**/README*"
  - "**/CHANGELOG*"
  - "**/CHANGES*"
  - "**/CONTRIBUTING*"
  - "**/LICENSE*"
  - "**/COPYING*"
  - "**/AGENTS.md"
- name: code
  default: true
history: path
views:
- state
details:
- mode
- blob
- bytes
- lines
- form
- language
- candidates
- class
- commitCount
- authors
labels:
  en:
    one: File
    many: Files
  ru:
    one: Файл
    many: Файлы
description:
  en: A file of a code repository.
  ru: Файл репозитория кода.
derives-from:
- code.repository
- code.directory
