id: spdx.file
purpose: structure
definition: A file is a named item of content in a repository, such as a source file, a configuration file, a document or an image.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Classes/File/
acquisition:
- extractor files
relation-constraints:
  out:
  - contains
  in:
  - partOf
audience: [developer, architect]
facts:
# Every fact counts the current tree by default: a file that left it stays an entity with a removal, and is not a file.
- id: count
  labels:
    en: Files
    ru: Файлы
  measure: count
  display: number
  where:
    removed_at: null
- id: by-language
  labels:
    en: By language
    ru: По языку
  measure: group-by
  field: language
  display: bar
  where:
    removed_at: null
- id: age
  labels:
    en: Time since last change
    ru: Время с последнего изменения
  measure: histogram
  field: last_change
  buckets:
  - 30
  - 90
  - 365
  display: timeline
  where:
    removed_at: null
- id: largest
  labels:
    en: Largest files in bytes
    ru: Самые большие файлы в байтах
  measure: top-n
  field: bytes
  limit: 10
  display: bar
  where:
    removed_at: null
- id: most-changed
  labels:
    en: Most changed files (commits, merge commits included)
    ru: Чаще изменяемые файлы (коммиты, включая слияния)
  measure: top-n
  field: commit_count
  limit: 10
  display: bar
  where:
    removed_at: null
template-policy: page
source: graph
# The paths this kind leaves out: a product's own declaration, so no engine list decides what a repository's
# knowledge is. Only what is never a person's source by nature stands here — the dependency tree and the repository's
# own folder; a build output can be a product's tracked code (a GitHub Action's bundle), so it is not excluded by
# default and a product that wants it gone names it itself (madarch-64o5.83).
exclude:
  - "**/node_modules/**"
  - "**/.git/**"
fields:
- name: path
  type: path
  producers:
  - disk
  - git
- name: mode
  type: text
  nullable: true
  producers:
  - disk
- name: blob
  type: text
  nullable: true
  producers:
  - disk
- name: bytes
  type: bigint
  nullable: true
  producers:
  - disk
- name: form
  type: text
  nullable: true
  producers:
  - disk
- name: lines
  type: bigint
  nullable: true
  producers:
  - disk
- name: language
  type: text
  nullable: true
  producers:
  - disk
- name: languages
  type: json
  schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $ref: urn:madarch:value-type:text-list:v1
  nullable: true
  producers:
  - disk
- name: class
  type: text
  nullable: true
  producers:
  - disk
- name: last_change
  type: timestamp
  nullable: true
  producers:
  - git
- name: commit_count
  type: integer
  nullable: true
  producers:
  - git
- name: added_at
  type: timestamp
  nullable: true
  producers:
  - git
- name: removed_at
  type: timestamp
  nullable: true
  producers:
  - git
# The file text is read by its repository edge, path and immutable blob (decision 0037).
file-text:
  repository: code.file-repository
  path: path
  blob: blob
key:
- path
classes:
- name: dependency
  paths:
  - "**/node_modules/**"
  - "**/bower_components/**"
  - "**/vendor/**"
  - "**/vendored/**"
  - "**/third_party/**"
  - "**/third-party/**"
  - "**/jspm_packages/**"
  - "**/web_modules/**"
- name: generated
  paths:
  - "**/dist/**"
  - "**/build/**"
  - "**/out/**"
  - "**/target/**"
  - "**/coverage/**"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/*.map"
  - "**/*.generated.*"
  - "**/*.gen.*"
  - "**/*.pb.go"
  - "**/*.pb.ts"
  - "**/*_pb2.py"
  - "**/*.lock"
  - "**/bun.lock"
  - "**/bun.lockb"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/composer.lock"
  - "**/Cargo.lock"
  - "**/go.sum"
  - "**/gradle.lockfile"
  - "**/packages.lock.json"
- name: test
  paths:
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/spec/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*_spec.*"
  - "**/test_*.py"
- name: documentation
  paths:
  - "**/docs/**"
  - "**/doc/**"
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.rst"
  - "**/*.adoc"
  - "**/README*"
  - "**/CHANGELOG*"
  - "**/CHANGES*"
  - "**/CONTRIBUTING*"
  - "**/LICENSE*"
  - "**/COPYING*"
  - "**/AGENTS.md"
- name: code
  default: true
history: path
details:
- mode
- blob
- bytes
- lines
- form
- language
- candidates
- class
- commitCount
- authors
labels:
  en:
    one: File
    many: Files
  ru:
    one: Файл
    many: Файлы
description:
  en: 'A file is a named unit of content in a repository: for example a source file, a configuration file, a document or an image. Its path places it in a folder, and its content is what a person or a program reads or runs.'
  ru: 'Файл — именованная единица содержимого в репозитории: например, исходный код, настройки, документ или изображение. Путь указывает его место в папках, а содержимое читает человек или программа.'
derives-from:
- code.directory

key-edges:
- role: code.file-repository
  edge: code.file-repository
  side: from
