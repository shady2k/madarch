id: spdx.file
purpose: structure
definition: A file of a code repository.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Classes/File/
acquisition:
- extractor files
status: implemented
relation-constraints:
  out:
  - contains
  in:
  - partOf
audience: [developer, architect]
facts:
- id: count
  labels: { en: Files, ru: Файлы }
  measure: count
  display: number
- id: by-language
  labels: { en: By language, ru: По языку }
  measure: group-by
  field: language
  display: bar
- id: by-folder
  labels: { en: By folder, ru: По папке }
  measure: group-by
  field: directory
  display: treemap
- id: age
  labels: { en: Time since last change, ru: Время с последнего изменения }
  measure: histogram
  field: last_change
  buckets: [30, 90, 365]
  display: timeline
- id: largest
  labels: { en: Largest files in bytes, ru: Самые большие файлы в байтах }
  measure: top-n
  field: bytes
  limit: 10
  display: bar
- id: most-changed
  labels: { en: Most changed files (dated non-merge commits), ru: Чаще изменяемые файлы (датированные немержевые коммиты) }
  measure: top-n
  field: commit_count
  limit: 10
  display: bar
template-policy: page
template: templates/file.liquid
source: graph
capability: git
fields:
# Graph projections: git tree/path/blob reads fill directory and bytes;
# git language detection fills language; git touched/history reads fill dates and counts.
- { name: language, type: text, nullable: true, producers: [git] }
- { name: directory, type: text, producers: [git] }
- { name: bytes, type: bigint, nullable: true, producers: [git] }
- { name: last_change, type: timestamp, nullable: true, producers: [git] }
- { name: commit_count, type: integer, nullable: true, producers: [git] }
- name: state_machines
  type: json
  nullable: true
  binding:
    agent: 'Read all declared repository source files **/* for this entity: complete state machines as an array of {name,type,path,lineStart,lineEnd,states:[{name,label,line}],transitions:[{from,to,event,line}]};
      use [] when none exist and preserve source positions.'
- name: repository_node
  type: bigint
  producers:
  - git
  reference: code.repository
- name: path_id
  type: bigint
  producers:
  - git
- name: mode
  type: text
  nullable: true
  producers:
  - git
- name: blob_id
  type: bigint
  nullable: true
  producers:
  - git
- name: content
  type: text
  nullable: true
  producers:
  - git
key:
- repository_node
- path_id
depends-on:
- code.repository
- code.directory
history: path
views:
- state
details:
- mode
- blob
- bytes
- lines
- form
- language
- candidates
- commitCount
- authors
labels:
  en:
    one: File
    many: Files
  ru:
    one: Файл
    many: Файлы
description:
  en: A file of a code repository.
  ru: Файл репозитория кода.
