id: spdx.package
purpose: structure
audience: [developer, architect]
definition: A package is an outside library or component that a repository's files import, named as its ecosystem names it.
sources:
- https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Classes/Package/
acquisition:
- extractor imports
status: implemented
relation-constraints:
  out: []
  in:
  - dependsOn
template-policy: page
source: graph
fields:
- name: ecosystem
  type: text
  binding: imports@1.ecosystem
- name: name
  type: text
  binding: imports@1.name
key:
- ecosystem
- name
card: true
details:
- ecosystem
- name
labels:
  en:
    one: Package
    many: Packages
  ru:
    one: Пакет
    many: Пакеты
description:
  en: A package is a reusable piece of software published by someone else and brought into a repository, such as a library, a framework or a command-line tool. Its ecosystem names it and versions it, and its licence and security matter to the product.
  ru: 'Пакет — многоразовая программная часть, опубликованная кем-то другим и подключённая в репозиторий: библиотека, каркас или программа. Экосистема даёт ему имя и версии, а его лицензия и безопасность важны для продукта.'
