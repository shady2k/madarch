id: practice.field
purpose: structure
audience: [developer, architect]
definition: A field is a named value that a type or an object holds.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor code
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: member
source: graph
member:
  relation: code.contains
  direction: in
  parentKind: code.symbol
details:
- symbolKind
- qualifiedName
- typeText
- value
- language
labels:
  en:
    one: Field
    many: Fields
  ru:
    one: Поле
    many: Поля
description:
  en: A field is one named value inside a class, a structure, an interface or an object, with its type and usually its visibility. Fields are the data a type carries, as opposed to the operations it offers.
  ru: Поле — именованное значение внутри класса, структуры, интерфейса или объекта, с его типом и обычно видимостью. Поля — данные, которые несёт тип, в отличие от операций, которые он предлагает.
