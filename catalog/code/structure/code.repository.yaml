id: practice.vcs-repository
purpose: structure
audience: [developer, architect, platform-devops]
definition: A version control repository holds the source files and folders of a product together with the full history of their changes.
sources:
- https://opentelemetry.io/docs/specs/semconv/registry/attributes/vcs/
acquisition:
- extractor files
- extractor history
relation-constraints:
  out:
  - contains
  in:
  - contains
  - product.uses-repository
template-policy: page
source: graph
fields:
- name: name
  type: text
  producers:
  - disk
  - git
- name: url
  type: git-remote
  nullable: true
  producers:
  - disk
- name: default_branch
  type: text
  nullable: true
  producers:
  - disk
- name: tree_snapshot
  type: text
  nullable: true
  labels:
    en: Tree snapshot digest
    ru: Дайджест снимка дерева
  producers:
  - disk
- name: history_shallow
  type: boolean
  nullable: true
  producers:
  - git
key:
- name
history: repositories
labels:
  en:
    one: Repository
    many: Repositories
  ru:
    one: Репозиторий
    many: Репозитории
description:
  en: A version control repository holds the source files and folders of a product, and every commit records who changed what and when. A product may keep everything in one repository or spread it over several, for example one per service.
  ru: Репозиторий — хранилище исходного кода продукта вместе с полной историей его изменений в системе контроля версий (например, git). В нём лежат файлы и папки продукта, а каждый коммит фиксирует, кто, когда и что изменил. У продукта может быть один или несколько репозиториев.
derives-from:
- product
- product-profile
