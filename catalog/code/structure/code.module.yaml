id: practice.module
purpose: structure
audience: [developer, architect]
definition: A module is a folder of code with a purpose of its own, with the modules it depends on.
sources:
- https://c4model.com/abstractions
acquisition:
- extractor code
relation-constraints:
  out:
  - contains
  - dependsOn
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: repository
  type: text
  nullable: true
  binding:
    agent: 'Read the declared repositories: repository name, or null for the product repository.'
- name: path
  type: text
  binding:
    agent: 'Read **/* source files: repository-relative path of the file or folder defining this entity.'
- name: state_machines
  type: json
  nullable: true
  binding:
    agent: 'Read all declared repository source files **/* for this entity: complete state machines as an array of {name,type,path,lineStart,lineEnd,states:[{name,label,line}],transitions:[{from,to,event,line}]};
      use [] when none exist and preserve source positions.'
key:
- repository
- path
history: membership
views:
- state
details:
- role
- kind
- language
- files
- parsedFiles
- packageName
labels:
  en:
    one: Module
    many: Modules
  ru:
    one: Модуль
    many: Модули
description:
  en: A module is a group of code files that belong together around one responsibility, such as billing or authentication, and depend on other modules through their public parts. Its boundary says what may be changed without reaching the rest of the product.
  ru: 'Модуль — группа файлов кода, объединённых одной ответственностью: оплата или вход, — и зависящих от других модулей через их открытые части. Его граница говорит, что можно менять, не задевая остальной продукт.'
