id: practice.module
purpose: structure
audience: [developer, architect]
definition: A module is a group of code files with one purpose of its own, held in one folder of a repository, with the modules it depends on.
sources:
- https://c4model.com/abstractions
acquisition:
- agent-from-graph
relation-constraints:
  out:
  - contains
  - dependsOn
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: 'The name the people who work on the code give this module, one or two words such as fill, graph or catalogue; it is the module''s key.'
- name: folder
  type: json
  reference: code.directory
  labels:
    en: Folder
    ru: Папка
  binding:
    agent: 'The folder the module covers, named by the key of that folder entity in the graph: its repository and its path.'
- name: description
  type: text
  nullable: true
  labels:
    en: Description
    ru: Описание
  binding:
    agent: 'What the module is responsible for, in one or two sentences, read from the text of the files the folder holds in the graph.'
- name: state_machines
  type: json
  nullable: true
  labels:
    en: State machines
    ru: Машины состояний
  binding:
    agent: 'The state machines the module''s own files declare, as [{name, states: [{name, line}], transitions: [{from, to, event, line}], repository, path, lineStart, lineEnd}], each resting on the file of the graph it was read from; [] when the module declares none.'
key:
- name
views:
- state
labels:
  en:
    one: Module
    many: Modules
  ru:
    one: Модуль
    many: Модули
description:
  en: A module is a group of code files that belong together around one responsibility, such as billing or authentication, and that depend on other modules through their public parts. Its boundary says what may be changed without reaching the rest of the product.
  ru: 'Модуль — группа файлов кода, объединённых одной ответственностью: оплата или вход, — и зависящих от других модулей через их открытые части. Его граница говорит, что можно менять, не задевая остальной продукт.'
derives-from:
- code.directory
- code.file
