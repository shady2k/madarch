id: scrum.backlog-item
purpose: understand
audience: [product, product-lead, analyst]
definition: 'A backlog item is one item of the product backlog: a need, a change or a defect, ordered by the product owner.'
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Backlog item
    many: Backlog items
  ru:
    one: Элемент журнала
    many: Элементы журнала
description:
  en: 'A backlog item is one candidate piece of work: a feature, a user story, a bug or a chore, with what it should achieve and how it will be accepted. The product owner orders the items, so the team always knows what matters most.'
  ru: 'Элемент журнала — одна возможная работа: возможность, история пользователя, ошибка или подсобное дело, — с тем, чего она должна добиться и как её примут. Владелец продукта упорядочивает элементы, чтобы команда всегда знала, что важнее.'
