id: scrum.sprint
purpose: understand
audience: [product, product-lead, analyst]
definition: A sprint is a fixed period in which the team turns backlog items into an increment.
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - refines
template-policy: none
labels:
  en:
    one: Sprint
    many: Sprints
  ru:
    one: Спринт
    many: Спринты
description:
  en: A sprint is a short, fixed period, usually one to four weeks, during which a team works on a chosen set of backlog items and finishes an increment. Its length stays the same, so the rhythm of planning, work and review is steady.
  ru: Спринт — короткий фиксированный период, обычно от одной до четырёх недель, за который команда выполняет выбранные элементы бэклога и завершает инкремент. Его длина не меняется, поэтому ритм планирования, работы и обзора остаётся ровным.
