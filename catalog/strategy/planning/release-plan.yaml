id: practice.release-plan
purpose: understand
audience: [product, product-lead, analyst]
definition: A release plan says what a release is meant to contain and when it is expected.
sources:
- https://www.atlassian.com/agile/product-management/product-roadmaps
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Release plan
    many: Release plans
  ru:
    one: План выпуска
    many: Планы выпуска
description:
  en: A release plan states which items a release should deliver, what must be true before it ships and the date it is expected. It aligns the team, the stakeholders and the operations that will carry the release.
  ru: План выпуска говорит, какие элементы должен дать выпуск, что должно быть верно до его отправки и когда его ждут. Он согласует команду, заинтересованные стороны и эксплуатацию, которая будет выпуск проводить.
derives-from:
- feature
- milestone
