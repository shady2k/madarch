id: practice.user-role
purpose: understand
audience: [product, product-lead, analyst]
definition: A user role is the part a person plays when using the product, with the permissions and duties it carries.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: User role
    many: User roles
  ru:
    one: Роль пользователя
    many: Роли пользователя
description:
  en: A user role groups what a person may see and do in the product, such as administrator, editor or reader. One account may hold several roles, and the role decides both its permissions and what it is expected to do.
  ru: 'Роль пользователя объединяет то, что человек может видеть и делать в продукте: администратор, редактор или читатель. Одна учётная запись может иметь несколько ролей, а роль задаёт и права, и ожидаемые обязанности.'
