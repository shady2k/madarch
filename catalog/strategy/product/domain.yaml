id: backstage.domain
purpose: understand
audience: [product, analyst, architect, developer]
definition: A part of the business the product serves, which groups the systems that answer for it.
sources:
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- document
- conversation
status: implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: page
template: templates/domain.liquid
source: graph
fields:
- name: title
  type: text
  binding:
    agent: 'Read docs/domains/**/*.md: the page title; use it as the entity label.'
- name: slug
  type: text
  binding:
    agent: 'Read docs/domains/**/*.md: The stable page slug from its id; identify the entity with its declared page id.'
- name: body
  type: text
  binding:
    agent: 'Read docs/domains/**/*.md: The complete Markdown body, preserving paragraphs and references.'
- name: body_line
  type: integer
  binding:
    agent: 'Read docs/domains/**/*.md: The positive source line where the body starts.'
- name: file
  type: text
  binding:
    agent: 'Read docs/domains/**/*.md: The repository-relative page source path.'
- name: relates
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: The array of related entity ids.'
- name: sources
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: The array of source paths.'
- name: statements
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: Complete statements as [{id,text,digest,labels,mentions,grounds,line,paragraph}], preserving
      ids and grounds.'
- name: digest
  type: text
  binding:
    agent: 'Read docs/domains/**/*.md: The body digest identifying this page revision.'
- name: producer
  type: text
  nullable: true
  binding:
    agent: 'Read docs/domains/**/*.md: The producer text, or null when absent.'
- name: links
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: All body links as [{url,line,ground}].'
- name: findings
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: All page findings as [{file,line,message}].'
- name: ungrounded
  type: json
  binding:
    agent: 'Read docs/domains/**/*.md: All ungrounded statements as [{text,line}].'
key:
- slug
labels:
  en:
    one: Domain
    many: Domains
  ru:
    one: Домен
    many: Домены
description:
  en: 'A part of the business the product serves, such as payment or ordering: how it works and what implements it.'
  ru: 'Часть бизнеса, которую обслуживает продукт, например оплата или заказы: как она работает и что её реализует.'
