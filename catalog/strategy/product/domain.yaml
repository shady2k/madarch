id: backstage.domain
purpose: understand
audience: [product, analyst, architect, developer]
definition: A domain is a part of the business the product serves, which groups the modules and folders of the product's code that answer for it, and the words it uses.
sources:
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- agent-from-graph
- conversation
# The code the domain covers is stated as an edge, not as text (owner's rule, 2026-11-15): a domain covers modules and
# folders of the product's code, and both stand in the graph the agent reads.
relation-constraints:
  out:
  - contains
  - uses
  in: []
template-policy: page
source: graph
title: name
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: 'The name the business gives this part of itself, one or two words such as Payments, Orders or Identity; it is the domain''s key.'
- name: description
  type: text
  nullable: true
  labels:
    en: Description
    ru: Описание
  binding:
    agent: 'What the domain answers for in this product, in one or two sentences: the part of the business it holds and what the modules and folders it covers do for it, read from the text of their files in the graph.'
key:
- name
# What a domain's discovery reads: the folders that hold the product's code and the files in them (owner's decision,
# 2026-11-15: a fill of a domain reads the code it covers from the graph, so those kinds are filled before it).
derives-from:
- code.file
- code.directory
labels:
  en:
    one: Domain
    many: Domains
  ru:
    one: Домен
    many: Домены
description:
  en: A domain is one area of the business — payments, orders, identity — that the product serves, and it groups the modules and folders of the product's code that answer for that area. It is a business division; its systems are the code, and the domain names them.
  ru: 'Домен — часть бизнеса, которую обслуживает продукт: оплата, заказы, идентификация. Он объединяет модули и папки кода продукта, которые отвечают за эту часть. Это деление бизнеса; его системы — это код, и домен их называет.'
