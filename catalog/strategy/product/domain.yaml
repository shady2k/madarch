id: backstage.domain
purpose: understand
audience: [product, analyst, architect, developer]
definition: A domain is a part of the business the product serves, with its own responsibilities and language.
sources:
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- document
- conversation
- agent-from-graph
relation-constraints:
  out:
  - contains
  - uses
  - domain.contains
  in:
  - domain.contains
  - architecture.serves-domain
  - term.in-domain
template-policy: page
source: graph
title: name
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the business gives this part of itself, one or two words such as Payments, Orders or Identity; it is the
      domain's key.
- name: description
  type: text
  nullable: true
  labels:
    en: Description
    ru: Описание
  binding:
    agent: What this business area answers for. Use stated intent and documents in the graph first, then code evidence. Without
      documents, code-based proposals remain unconfirmed until a person approves them. If no source answers, open a question
      instead of guessing; conflicting sources remain an open question.
- name: type
  type: text
  nullable: true
  labels:
    en: Type
    ru: Тип
  binding:
    agent: 'How much of the product''s own advantage this part of the business carries: core, supporting or generic, as the
      product states it.'
key:
- name
derives-from:
- product
labels:
  en:
    one: Domain
    many: Domains
  ru:
    one: Домен
    many: Домены
description:
  en: A domain is a business area such as payments, orders or identity, with its own responsibilities and language. It may
    contain smaller domains. A system or component may serve several domains without being copied.
  ru: Домен — область бизнеса, например оплата, заказы или идентификация, со своими обязанностями и языком. Он может содержать
    меньшие домены. Система или компонент может обслуживать несколько доменов без копирования.
