id: practice.product
purpose: understand
audience: [product, product-lead, analyst]
definition: What the product is, who it serves and how it is built, as its home page states it.
sources:
- https://arc42.org/overview
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- document
- conversation
status: implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: page
template: templates/product.liquid
source: graph
fields:
- name: title
  type: text
  binding:
    agent: 'Read docs/product.md: the page title; use it as the entity label.'
- name: slug
  type: text
  binding:
    agent: 'Read docs/product.md: The stable page slug from its id; identify the entity with its declared page id.'
- name: body
  type: text
  binding:
    agent: 'Read docs/product.md: The complete Markdown body, preserving paragraphs and references.'
- name: body_line
  type: integer
  binding:
    agent: 'Read docs/product.md: The positive source line where the body starts.'
- name: file
  type: text
  binding:
    agent: 'Read docs/product.md: The repository-relative page source path.'
- name: relates
  type: json
  binding:
    agent: 'Read docs/product.md: The array of related entity ids.'
- name: sources
  type: json
  binding:
    agent: 'Read docs/product.md: The array of source paths.'
- name: statements
  type: json
  binding:
    agent: 'Read docs/product.md: Complete statements as [{id,text,digest,labels,mentions,grounds,line,paragraph}], preserving
      ids and grounds.'
- name: mentions
  type: json
  binding:
    agent: 'Read docs/product.md: The array of mentioned entity ids.'
- name: digest
  type: text
  binding:
    agent: 'Read docs/product.md: The body digest identifying this page revision.'
- name: producer
  type: text
  nullable: true
  binding:
    agent: 'Read docs/product.md: The producer text, or null when absent.'
- name: links
  type: json
  binding:
    agent: 'Read docs/product.md: All body links as [{url,line,ground}].'
- name: findings
  type: json
  binding:
    agent: 'Read docs/product.md: All page findings as [{file,line,message}].'
- name: ungrounded
  type: json
  binding:
    agent: 'Read docs/product.md: All ungrounded statements as [{text,line}].'
key:
- slug
history: repositories
labels:
  en:
    one: Product
    many: Products
  ru:
    one: Продукт
    many: Продукты
description:
  en: 'What the product is, for whom, and its architecture: the home page the agent writes.'
  ru: 'Что это за продукт, для кого и как устроен: главная страница, которую пишет агент.'
