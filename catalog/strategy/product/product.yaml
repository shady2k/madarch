id: practice.product
purpose: understand
audience: [product, product-lead, analyst]
definition: A product is the software and service an organisation offers to a group of people, together with what it does for them and how it is built.
sources:
- https://arc42.org/overview
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- agent-from-graph
- document
- conversation
relation-constraints:
  out:
  - hasPart
  - ownedBy
  - product.uses-repository
  in:
  - partOf
template-policy: page
source: graph
# The product's page is titled by the name the product gives itself.
title: name
fields:
- name: name
  type: text
  labels:
    en: Name
    ru: Имя
  binding:
    agent: The name the product is known by, such as madarch; it is the product's key.
- name: purpose
  type: text
  nullable: true
  binding:
    agent: What the product does for the people it serves, in one or two sentences.
- name: audience
  type: json
  nullable: true
  reference: role
  binding:
    agent: The roles the product serves, by the keys of those roles in the graph.
- name: status
  type: text
  nullable: true
  binding:
    agent: 'Where the product stands: in development, in service, retired.'
- name: vision
  type: text
  nullable: true
  binding:
    agent: What the product intends to become, in the words the product gives it.
key:
- name
labels:
  en:
    one: Product
    many: Products
  ru:
    one: Продукт
    many: Продукты
description:
  en: A product is the software and service an organisation offers to a group of people, together with what it does for them and how it is built. It has an owner, users, a purpose and a life from the first idea to retirement.
  ru: Продукт — программа и услуга, которые организация предлагает группе людей, вместе с тем, что она для них делает и как устроена. У продукта есть владелец, пользователи, назначение и жизнь от первой идеи до вывода.
derives-from: []
