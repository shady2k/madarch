id: practice.product
purpose: understand
audience: [product, product-lead, analyst]
definition: A product is the software and service an organisation offers to a group of people, together with what it does for them and how it is built.
sources:
- https://arc42.org/overview
- https://backstage.io/docs/features/software-catalog/system-model
acquisition:
- document
- conversation
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: page
source: graph
fields:
- name: title
  type: text
  binding:
    agent: 'Read docs/product.md: the page title; use it as the entity label.'
- name: slug
  type: text
  binding:
    agent: 'Read docs/product.md: The stable page slug from its id; identify the entity with its declared page id.'
- name: body
  type: text
  binding:
    agent: 'Read docs/product.md: The complete Markdown body, preserving paragraphs and references.'
- name: body_line
  type: integer
  binding:
    agent: 'Read docs/product.md: The positive source line where the body starts.'
- name: file
  type: text
  binding:
    agent: 'Read docs/product.md: The repository-relative page source path.'
- name: relates
  type: json
  binding:
    agent: 'Read docs/product.md: The array of related entity ids.'
- name: sources
  type: json
  binding:
    agent: 'Read docs/product.md: The array of source paths.'
- name: statements
  type: json
  binding:
    agent: 'Read docs/product.md: Complete statements as [{id,text,digest,labels,mentions,grounds,line,paragraph}], preserving
      ids and grounds.'
- name: digest
  type: text
  binding:
    agent: 'Read docs/product.md: The body digest identifying this page revision.'
- name: producer
  type: text
  nullable: true
  binding:
    agent: 'Read docs/product.md: The producer text, or null when absent.'
- name: links
  type: json
  binding:
    agent: 'Read docs/product.md: All body links as [{url,line,ground}].'
- name: findings
  type: json
  binding:
    agent: 'Read docs/product.md: All page findings as [{file,line,message}].'
- name: ungrounded
  type: json
  binding:
    agent: 'Read docs/product.md: All ungrounded statements as [{text,line}].'
key:
- slug
history: repositories
labels:
  en:
    one: Product
    many: Products
  ru:
    one: Продукт
    many: Продукты
description:
  en: A product is the software and service an organisation offers to a group of people, together with what it does for them and how it is built. It has an owner, users, a purpose and a life from the first idea to retirement.
  ru: Продукт — программа и услуга, которые организация предлагает группе людей, вместе с тем, что она для них делает и как устроена. У продукта есть владелец, пользователи, назначение и жизнь от первой идеи до вывода.
