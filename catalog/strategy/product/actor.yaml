id: c4.person
purpose: understand
audience: [product, product-lead, analyst]
definition: An actor is a person who interacts with the system, as C4's person is.
sources:
- https://c4model.com/abstractions
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - c4.uses
  in:
  - c4.uses
template-policy: none
labels:
  en:
    one: Actor
    many: Actors
  ru:
    one: Действующее лицо
    many: Действующие лица
description:
  en: 'An actor is a person who uses or is affected by the system to reach a goal: a customer, an administrator, an operator. External systems are not actors; they are another system at the boundary, not a person.'
  ru: 'Действующее лицо — человек, который пользуется системой или испытывает её влияние, чтобы достичь цели: клиент, администратор, оператор. Внешние системы — не действующие лица, а другие системы на границе.'
