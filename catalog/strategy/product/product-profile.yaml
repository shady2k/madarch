key: []
derives-from:
- product
labels:
  en:
    one: Product profile
    many: Product profiles
  ru:
    one: Профиль продукта
    many: Профили продукта
description:
  en: A product profile lists deployment platforms, data stores, web interfaces, mobile platforms, machine learning and messaging technologies known to apply, and the languages and frameworks in use. Null means unknown; an empty list means searched and none found. Assertion support edges carry evidence.
  ru: Профиль продукта перечисляет применимые платформы развёртывания, хранилища данных, веб-интерфейсы, мобильные платформы, технологии машинного обучения и обмена сообщениями, а также языки и каркасы. Null означает неизвестность; пустой список — поиск выполнен, ничего не найдено. Свидетельства хранятся в связях утверждений.

key-edges:
- role: product
  edge: profile-product
  side: from
