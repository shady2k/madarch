id: scrum.product-goal
purpose: understand
audience: [product, product-lead, analyst]
definition: 'A product goal is the commitment the product backlog is ordered against: the single objective the product works towards now.'
sources:
- https://scrumguides.org/scrum-guide.html
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Product goal
    many: Product goals
  ru:
    one: Цель продукта
    many: Цели продукта
description:
  en: A product goal states the one outcome the product is trying to reach at present, such as making onboarding possible without help. The backlog is ordered to serve it, and a new goal replaces it when the old one is met or abandoned.
  ru: 'Цель продукта называет один результат, к которому продукт идёт сейчас: например, сделать подключение возможным без помощи. Бэклог продукта упорядочен ради неё, а новая цель сменяет прежнюю, когда та достигнута или оставлена.'
