id: archimate.assessment
purpose: understand
audience: [product, product-lead, analyst]
definition: An assessment is the organisation's judgement of a driver, a goal or another element, with the grounds it rests on.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - affects
  in:
  - affects
template-policy: none
labels:
  en:
    one: Assessment
    many: Assessments
  ru:
    one: Оценка
    many: Оценки
description:
  en: 'An assessment records how the organisation judges something that shapes its direction: how strong a driver is, whether a goal is met, how well a capability performs. It states the judgement and the evidence or reasoning behind it.'
  ru: 'Оценка фиксирует суждение организации о том, что влияет на её курс: насколько сильна движущая сила, достигнута ли цель, как работает способность. В ней изложены само суждение и доводы или доказательства за ним.'
