id: practice.key-result
purpose: understand
audience: [product, product-lead, analyst]
definition: A key result is a measurable result that tells whether an objective was reached.
sources:
- https://www.whatmatters.com/faqs/okr-meaning-definition-example
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - measures
  in:
  - measures
template-policy: none
labels:
  en:
    one: Key result
    many: Key results
  ru:
    one: Ключевой результат
    many: Ключевые результаты
description:
  en: 'A key result puts a number and a time on an objective: a share, a count, a time or a rate that should change. When the period ends, the key result says plainly whether the objective was reached.'
  ru: 'Ключевой результат привязывает к задаче число и срок: долю, количество, время или темп, которые должны измениться. Когда период кончается, по ключевому результату прямо видно, достигнута ли задача.'
