id: archimate.stakeholder
purpose: understand
audience: [product, product-lead, analyst]
definition: A stakeholder is a person or a group with an interest in the product and a concern that shapes it.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
