  in:
  - refines
template-policy: none
labels:
  en:
    one: Stakeholder
    many: Stakeholders
  ru:
    one: Заинтересованная сторона
    many: Заинтересованные стороны
description:
  en: 'A stakeholder is anyone who affects or is affected by the product: a customer, a user, a regulator, the owner, an operator, a supplier. Their concerns are what an architecture must answer and what makes a decision good or bad.'
  ru: 'Заинтересованная сторона — тот, кто влияет на продукт или испытывает его влияние: клиент, пользователь, регулятор, владелец, оператор, поставщик. Их заботы — то, на что отвечает архитектура и чем измеряется удачность решения.'
