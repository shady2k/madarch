id: practice.objective
purpose: understand
audience: [product, product-lead, analyst]
definition: An OKR objective is a measurable objective under a goal, as an OKR states it.
sources:
- https://www.whatmatters.com/faqs/okr-meaning-definition-example
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  - measures
  in:
  - refines
template-policy: none
labels:
  en:
    one: Objective
    many: Objectives
  ru:
    one: Задача OKR
    many: Задачи OKR
description:
  en: An objective is one concrete aim for a period, such as cutting delivery time in half this quarter, whose progress key results measure. It points the work of a team at one result instead of a list of tasks.
  ru: 'Задача OKR — одна конкретная цель на период: например, вдвое сократить время доставки за квартал, — а её продвижение измеряют ключевые результаты. Она направляет работу команды на один результат, а не на список дел.'
derives-from:
- goal
