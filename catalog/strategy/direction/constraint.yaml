id: archimate.constraint
purpose: understand
audience: [product, product-lead, analyst]
definition: A constraint is a limit on what the product may do, as arc42 section 2 and ArchiMate state it.
sources:
- https://arc42.org/overview
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Constraint
    many: Constraints
  ru:
    one: Ограничение
    many: Ограничения
description:
  en: 'A constraint is a condition the product must respect that cannot be chosen away: a law, a standard, an agreed budget, an existing technology, a deadline. arc42 collects them in section 2 so later decisions know their bounds.'
  ru: 'Ограничение — условие, которое продукт должен соблюдать и которое нельзя просто отменить: закон, стандарт, согласованный бюджет, уже выбранная технология, срок. arc42 собирает их в разделе 2, чтобы позднее решения знали свои рамки.'
