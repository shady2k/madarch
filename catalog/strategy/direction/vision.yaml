id: practice.vision
purpose: understand
audience: [product, product-lead, analyst]
definition: A vision is where the product means to go and who it serves, as the product owner states it.
sources:
- https://scrumguides.org/scrum-guide.html
- https://www.omg.org/spec/BMM/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out: []
  in: []
template-policy: none
labels:
  en:
    one: Vision
    many: Visions
  ru:
    one: Видение
    many: Видения
description:
  en: 'A vision describes the future the product is meant to create: which people it serves, what changes for them and why this product is worth building. It is short and ambitious, and it gives every smaller goal its direction.'
  ru: 'Видение описывает будущее, которое должен создать продукт: каким людям он служит, что у них изменится и зачем этот продукт вообще строить. Оно короткое и смелое и задаёт направление всем целям поменьше.'
derives-from:
