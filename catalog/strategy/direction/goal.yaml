id: archimate.goal
purpose: understand
audience: [product, product-lead, analyst]
definition: A goal is a state or condition the organisation wants to reach, as ArchiMate motivation elements and the Business Motivation Model state it.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
- https://www.omg.org/spec/BMM/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  - realises
  in:
  - realises
template-policy: none
labels:
  en:
    one: Goal
    many: Goals
  ru:
    one: Цель
    many: Цели
description:
  en: A goal states a state the organisation wants to be in, such as lower cost per order or coverage of a new country, without saying how to reach it. Objectives break it into measurable steps, and a course of action says what will be done.
  ru: 'Цель называет состояние, в котором организация хочет оказаться: ниже стоимость заказа или присутствие в новой стране, — и не говорит, как этого достичь. Задачи делят её на измеримые шаги, а курс действий говорит, что будет делаться.'
