id: archimate.outcome
purpose: understand
audience: [product, product-lead, analyst]
definition: 'An outcome is a result that follows from a goal: what is different once the goal is reached.'
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - realises
  in:
  - realises
template-policy: none
labels:
  en:
    one: Outcome
    many: Outcomes
  ru:
    one: Результат
    many: Результаты
description:
  en: 'An outcome describes the change a person would notice once a goal is reached: a faster checkout, fewer errors, a new market served. It is stated from outside the work, so the team can check that the goal mattered.'
  ru: 'Результат описывает перемену, которую заметит человек, когда цель достигнута: быстрее оформление, меньше ошибок, новый рынок. Он сформулирован снаружи работы, чтобы команда могла проверить, что цель была важна.'
