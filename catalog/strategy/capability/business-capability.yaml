id: archimate.capability
purpose: understand
audience: [product, product-lead, analyst]
definition: A business capability is an ability the organisation needs in order to do its work, named independently of the people, systems or processes that provide it.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  - realises
  in:
  - realises
template-policy: none
labels:
  en:
    one: Business capability
    many: Business capabilities
  ru:
    one: Бизнес-способность
    many: Бизнес-способности
description:
  en: A business capability names something the organisation is able to do, such as billing a customer or settling a claim. It is described by its outcome rather than by the structure that delivers it, so it stays stable when teams, systems or processes change.
  ru: 'Бизнес-способность называет то, что организация умеет делать: например, выставлять счёт клиенту или урегулировать страховой случай. Её описывают через результат, а не через подразделения и системы, которые её обеспечивают, поэтому она не меняется вместе с ними.'
derives-from:
- domain
