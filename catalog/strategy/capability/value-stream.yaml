id: archimate.value-stream
purpose: understand
audience: [product, product-lead, analyst]
definition: A value stream is a sequence of stages that together deliver a result of value to a customer.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - realises
template-policy: none
labels:
  en:
    one: Value stream
    many: Value streams
  ru:
    one: Поток создания ценности
    many: Потоки создания ценности
description:
  en: 'A value stream follows the work from a customer''s need to the value they receive, through the stages it passes: request, decision, delivery, support. It shows the whole path rather than the departments that own pieces of it.'
  ru: 'Поток создания ценности проходит работу от потребности клиента до ценности, которую он получает, через все этапы: обращение, решение, доставку, поддержку. Он показывает весь путь, а не подразделения, которым принадлежат его части.'
derives-from:
- goal
