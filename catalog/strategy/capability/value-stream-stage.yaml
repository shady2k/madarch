template-policy: none
labels:
  en:
    one: Value-stream stage
    many: Value-stream stages
  ru:
    one: Этап потока ценности
    many: Этапы потока ценности
description:
  en: A value stream stage is one link in the chain that turns a need into something a customer values, such as take the order, assemble it and deliver it. Capabilities enable the stage, and each stage passes its result to the next.
  ru: 'Этап потока ценности — одно звено в цепочке, которая превращает потребность в то, что ценно для клиента: принять заказ, собрать и доставить. Способности делают этап возможным, и каждый этап передаёт результат следующему.'
