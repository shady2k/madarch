id: archimate.value-stream-stage
purpose: understand
audience: [product, product-lead, analyst]
definition: A value stream stage is one step of a value stream, with the capabilities that make it possible.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
