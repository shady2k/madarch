id: archimate.course-of-action
purpose: understand
audience: [product, product-lead, analyst]
definition: A course of action is a chosen way of working towards a goal over time, such as entering a market or replacing a platform.
sources:
- https://pubs.opengroup.org/architecture/archimate32-doc/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - realises
  in:
  - realises
template-policy: none
labels:
  en:
    one: Course of action
    many: Courses of action
  ru:
    one: Курс действий
    many: Курсы действий
description:
  en: 'A course of action is the approach the organisation chooses to move towards its goals: a programme, a strategy, a sequence of projects. It says what will be done over time, rather than what state is wanted.'
  ru: 'Курс действий — подход, который организация выбирает, чтобы двигаться к целям: программа, стратегия, череда проектов. Он говорит, что будет делаться со временем, а не какое состояние нужно.'
derives-from:
- goal
