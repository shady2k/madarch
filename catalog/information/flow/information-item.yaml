id: practice.information-item
purpose: structure
audience: [analyst, architect, security-engineer]
definition: An information item is one piece of information carried by an information flow, named by a glossary term.
sources:
- https://cyclonedx.org/docs/1.6/json/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - partOf
  in:
  - hasPart
template-policy: none
labels:
  en:
    one: Information item
    many: Information items
  ru:
    one: Элемент информации
    many: Элементы информации
description:
  en: An information item is one piece of data a flow carries, such as a customer's name, an order number or a payment amount. A glossary term names it, so the same item is called the same way wherever it appears.
  ru: 'Элемент информации — отдельная единица сведений, которую несёт поток: имя клиента, номер заказа или сумма платежа. Его называет термин глоссария, поэтому один и тот же элемент всюду называется одинаково.'
derives-from:
- doc.term
- information-flow
