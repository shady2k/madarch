id: gdpr.personal-data
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: Personal data is information about an identified or identifiable person, as the GDPR defines it.
sources:
- https://gdpr-info.eu/art-4-gdpr/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Personal data
    many: Personal data
  ru:
    one: Персональные данные
    many: Персональные данные
description:
  en: Personal data is any information that relates to a person who is identified or can be identified, such as a name, an address, a phone number or an online identifier. The GDPR sets the rules for handling it.
  ru: 'Персональные данные — любые сведения, которые относятся к определённому или определимому человеку: имя, адрес, номер телефона, сетевой идентификатор. Правила обращения с ними задаёт GDPR.'
