id: practice.trade-secret
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: A trade secret is information a business keeps secret because its disclosure would harm it.
sources:
- https://www.wipo.int/en/web/trade-secrets
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - refines
  in:
  - refines
template-policy: none
labels:
  en:
    one: Trade secret
    many: Trade secrets
  ru:
    one: Коммерческая тайна
    many: Коммерческие тайны
description:
  en: A trade secret is knowledge a business does not share, such as a formula, a method or a customer list, because sharing it would weaken its position. It stays secret only while the business takes reasonable steps to protect it.
  ru: Коммерческая тайна — сведения, которые бизнес не раскрывает, например формула, метод или список клиентов, потому что раскрытие ослабит его положение. Тайна сохраняется, пока бизнес разумно её защищает.
