id: practice.information-classification
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: An information classification is the level assigned to a piece of information, which decides who may see it.
sources:
- https://cyclonedx.org/docs/1.6/json/
acquisition:
- document
- conversation
- not-implemented
relation-constraints:
  out:
  - constrains
  in:
  - constrains
template-policy: none
labels:
  en:
    one: Classification level
    many: Classification levels
  ru:
    one: Уровень секретности
    many: Уровни секретности
description:
  en: An information classification puts a piece of information at one level of sensitivity, such as public, internal, confidential or secret. The level decides who is allowed to read it and how it must be protected while stored and sent.
  ru: 'Уровень секретности относит сведения к одной ступени чувствительности: открытые, внутренние, конфиденциальные или секретные. От уровня зависит, кому разрешено их читать и как их защищать при хранении и передаче.'
derives-from:
- information-category
- information-item
