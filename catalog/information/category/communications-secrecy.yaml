description:
  en: Communications secrecy is the legal protection of who communicated with whom, when, and what they said. It covers the fact of a message and its content, so even metadata such as call times is protected.
  ru: Тайна связи — правовая защита сведений о том, кто, когда и с кем общался и что было сказано. Она охватывает и сам факт сообщения, и его содержание, поэтому защищены даже сведения о времени звонка.
