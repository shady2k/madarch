id: practice.information-category
purpose: quality
audience: [security-engineer, analyst, product-lead]
definition: An information category is a class of information the product handles, which decides how it may be stored, shown and shared.
sources:
- https://cyclonedx.org/docs/1.6/json/
acquisition:
- document
- conversation
- not-implemented
status: not-implemented
relation-constraints:
  out:
  - hasPart
  in:
  - partOf
template-policy: none
labels:
  en:
    one: Information category
    many: Information categories
  ru:
    one: Категория информации
    many: Категории информации
description:
  en: An information category groups information of one kind — personal data, trade secrets, public material — and sets the rules for handling it. The category decides who may see the information, where it may be kept and to whom it may be sent.
  ru: Категория информации объединяет сведения одного рода — персональные данные, коммерческую тайну, открытые материалы — и задаёт правила обращения с ними. От категории зависит, кому сведения можно показывать, где их можно хранить и кому передавать.
